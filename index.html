  guidelines:["ACG 2021 (XHTH trên không do giãn TM)","Baveno VII 2022 (XHTH do giãn TM)","ACG 2016 (XHTH dưới)"],
  sections:{
    dinh_nghia:`
      <p>Xuất huyết tiêu hóa (XHTH) phân loại theo vị trí giải phẫu tương đối với góc Treitz:</p>
      ${rt(["Đặc điểm","Nguyên nhân thường gặp"],[
        ["XHTH trên","Nguồn chảy máu ở thực quản-dạ dày-tá tràng (trên góc Treitz)","Loét dạ dày-tá tràng, giãn tĩnh mạch thực quản-dạ dày, viêm trợt dạ dày, hội chứng Mallory-Weiss, ung thư"],
        ["XHTH dưới","Nguồn chảy máu từ đại-trực tràng","Túi thừa đại tràng, bệnh trĩ, viêm ruột, loạn sản mạch máu, ung thư đại-trực tràng"]
      ])}
      <p>Biểu hiện: nôn máu/nôn dịch nâu đen (thường XHTH trên), đi tiêu phân đen (melena — thường XHTH trên hoặc ruột non/đại tràng phải), đi tiêu máu đỏ tươi (hematochezia — thường XHTH dưới, nhưng có thể gặp trong XHTH trên lượng nhiều/tốc độ nhanh).</p>`,
    chan_doan:`
      <div class="subhead">🧮 Thang điểm Glasgow-Blatchford (GBS) — phân tầng nguy cơ TRƯỚC nội soi</div>
      <p>Dùng ngay tại thời điểm tiếp nhận (không cần nội soi) để xác định bệnh nhân nguy cơ rất thấp có thể quản lý ngoại trú an toàn, không cần nhập viện/nội soi cấp cứu.</p>
      ${scr("gbs","Thang điểm Glasgow-Blatchford",[
        {label:"Ure máu (mmol/L)", options:[{text:"&lt;6.5 (0đ)",pts:0},{text:"6.5–&lt;8.0 (2đ)",pts:2},{text:"8.0–&lt;10.0 (3đ)",pts:3},{text:"10.0–&lt;25.0 (4đ)",pts:4},{text:"≥25.0 (6đ)",pts:6}]},
        {label:"Hemoglobin — Nam (g/dL)", options:[{text:"≥13 (0đ)",pts:0},{text:"12–&lt;13 (1đ)",pts:1},{text:"10–&lt;12 (3đ)",pts:3},{text:"&lt;10 (6đ)",pts:6}]},
        {label:"Hemoglobin — Nữ (g/dL, bỏ qua nếu đã chọn ở dòng Nam)", options:[{text:"Không áp dụng/đã tính ở dòng Nam (0đ)",pts:0},{text:"≥12 (0đ)",pts:0},{text:"10–&lt;12 (1đ)",pts:1},{text:"&lt;10 (6đ)",pts:6}]},
        {label:"Huyết áp tâm thu (mmHg)", options:[{text:"≥110 (0đ)",pts:0},{text:"100–109 (1đ)",pts:1},{text:"90–99 (2đ)",pts:2},{text:"&lt;90 (3đ)",pts:3}]},
        {label:"Mạch ≥100 lần/phút", options:[{text:"Không (0đ)",pts:0},{text:"Có (1đ)",pts:1}]},
        {label:"Đi tiêu phân đen (melena)", options:[{text:"Không (0đ)",pts:0},{text:"Có (1đ)",pts:1}]},
        {label:"Ngất/tiền ngất", options:[{text:"Không (0đ)",pts:0},{text:"Có (2đ)",pts:2}]},
        {label:"Bệnh gan mạn (tiền sử/lâm sàng)", options:[{text:"Không (0đ)",pts:0},{text:"Có (2đ)",pts:2}]},
        {label:"Suy tim", options:[{text:"Không (0đ)",pts:0},{text:"Có (2đ)",pts:2}]}
      ])}
      <div class="alert-box alert-info"><b>GBS = 0</b>: nguy cơ cực thấp cần can thiệp (truyền máu, nội soi, phẫu thuật) hoặc tử vong — nhóm này có thể an toàn điều trị ngoại trú, không cần nhập viện, theo khuyến cáo ACG 2021/NICE.</div>
      <div class="subhead">🧮 Thang điểm Rockall — TRƯỚC nội soi (đánh giá ban đầu)</div>
      ${scr("rockallpre","Rockall trước nội soi (tối đa 7 điểm)",[
        {label:"Tuổi", options:[{text:"&lt;60 (0đ)",pts:0},{text:"60–79 (1đ)",pts:1},{text:"≥80 (2đ)",pts:2}]},
        {label:"Tình trạng huyết động (sốc)", options:[{text:"Không sốc: SBP≥100, mạch&lt;100 (0đ)",pts:0},{text:"Mạch nhanh: SBP≥100, mạch≥100 (1đ)",pts:1},{text:"Hạ huyết áp: SBP&lt;100 (2đ)",pts:2}]},
        {label:"Bệnh đồng mắc", options:[{text:"Không có bệnh nặng kèm theo (0đ)",pts:0},{text:"Suy tim/thiếu máu cơ tim/bệnh đồng mắc nặng khác (2đ)",pts:2},{text:"Suy thận/suy gan/ung thư di căn (3đ)",pts:3}]}
      ])}
      <div class="subhead">🧮 Thang điểm Rockall — ĐẦY ĐỦ (sau nội soi)</div>
      ${scr("rockallfull","Rockall đầy đủ (tối đa 11 điểm — bao gồm 3 mục trên + 2 mục dưới)",[
        {label:"Tuổi", options:[{text:"&lt;60 (0đ)",pts:0},{text:"60–79 (1đ)",pts:1},{text:"≥80 (2đ)",pts:2}]},
        {label:"Tình trạng huyết động (sốc)", options:[{text:"Không sốc (0đ)",pts:0},{text:"Mạch nhanh, còn HA (1đ)",pts:1},{text:"Hạ huyết áp (2đ)",pts:2}]},
        {label:"Bệnh đồng mắc", options:[{text:"Không (0đ)",pts:0},{text:"Suy tim/TMCB tim/bệnh nặng khác (2đ)",pts:2},{text:"Suy thận/suy gan/ung thư di căn (3đ)",pts:3}]},
        {label:"Chẩn đoán qua nội soi", options:[{text:"Mallory-Weiss/không thấy tổn thương/không dấu hiệu chảy máu (0đ)",pts:0},{text:"Chẩn đoán khác (loét, viêm trợt...) (1đ)",pts:1},{text:"Ung thư đường tiêu hóa trên (2đ)",pts:2}]},
        {label:"Dấu hiệu chảy máu gần đây trên nội soi", options:[{text:"Không có/chỉ có chấm đen đáy ổ loét (0đ)",pts:0},{text:"Máu trong lòng ống tiêu hóa/cục máu đông bám/mạch máu lộ hoặc đang chảy (2đ)",pts:2}]}
      ])}
      <p>Nội soi tiêu hóa trên trong vòng <b>24 giờ</b> ở hầu hết trường hợp XHTH trên; <b>trong 12 giờ</b> nếu huyết động không ổn/nghi xuất huyết do giãn tĩnh mạch. XHTH dưới ổn định: nội soi đại tràng có chuẩn bị trong vòng 24–48h.</p>`,
    dieu_tri:`
      <div class="subhead">Hồi sức ban đầu (mọi trường hợp XHTH cấp)</div>
      <ul>
        <li>Hai đường truyền tĩnh mạch lớn, bù dịch tinh thể; <b>truyền máu khi Hb&lt;7g/dL</b> (chiến lược truyền máu hạn chế — restrictive strategy) ở hầu hết bệnh nhân, ngưỡng cao hơn (Hb&lt;8-9g/dL) nếu bệnh mạch vành nặng/huyết động không ổn</li>
        <li>Đảo ngược/ngưng kháng đông nếu có (cân nhắc lợi ích/nguy cơ huyết khối nền)</li>
        <li>Đặt nội khí quản bảo vệ đường thở nếu nôn máu ồ ạt/rối loạn tri giác trước khi nội soi</li>
      </ul>
      <div class="subhead">XHTH trên không do giãn tĩnh mạch (loét dạ dày-tá tràng...)</div>
      <ul>
        <li><b>PPI liều cao TM</b> trước nội soi (giảm mức độ tổn thương thấy được, giảm nhu cầu can thiệp nội soi) — tiếp tục PPI liều cao sau nội soi nếu tổn thương nguy cơ cao (mạch máu lộ/đang chảy/cục máu đông bám)</li>
        <li><b>Nội soi can thiệp cầm máu</b> (kẹp clip, tiêm cầm máu, đốt điện) cho tổn thương nguy cơ cao; không can thiệp nếu đáy ổ loét sạch/chấm đen (nguy cơ tái xuất huyết rất thấp)</li>
        <li>Sau cầm máu nội soi thành công: PPI TM liều cao truyền liên tục hoặc ngắt quãng 72 giờ đầu, sau đó chuyển PPI uống</li>
        <li>Xét nghiệm và điều trị <b>H. pylori</b> nếu loét dạ dày-tá tràng (xem bài "Loét dạ dày-tá tràng & H. pylori")</li>
      </ul>
      <div class="subhead">XHTH do giãn tĩnh mạch thực quản-dạ dày (xơ gan)</div>
      <p>Xem chi tiết đầy đủ tại bài <b>"Xơ gan & Biến chứng"</b> — tóm tắt: kháng sinh dự phòng (ceftriaxone) + thuốc vận mạch tạng (terlipressin/octreotide) ngay khi nhập viện + nội soi cấp cứu trong 12h để thắt vòng cao su/chích xơ.</p>
      <div class="subhead">XHTH dưới</div>
      <p>Đa số tự cầm; ổn định huyết động → nội soi đại tràng có chuẩn bị ruột trong 24–48h; can thiệp cầm máu qua nội soi (kẹp clip, tiêm, đốt) nếu xác định được nguồn chảy máu đang hoạt động; chụp mạch số hóa xóa nền (DSA) can thiệp tắc mạch hoặc phẫu thuật nếu nội soi thất bại/không xác định được nguồn chảy máu và huyết động không ổn.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Pantoprazole/Esomeprazole (PPI TM trước nội soi)","80mg TM bolus → truyền 8mg/giờ × 72 giờ (hoặc 40mg TM×2 lần/ngày nếu không có bơm tiêm truyền liên tục)","chuyển uống sau khi ổn định lâm sàng và ngưng truyền TM"],
        ["Terlipressin (nghi giãn TM)","2mg TM mỗi 4 giờ → giảm còn 1mg mỗi 4 giờ khi kiểm soát chảy máu","chống chỉ định bệnh mạch vành/mạch máu ngoại biên nặng"],
        ["Octreotide (thay thế terlipressin)","50mcg TM bolus → truyền 50mcg/giờ × 2-5 ngày","ít chống chỉ định tim mạch hơn terlipressin"],
        ["Ceftriaxone (dự phòng nhiễm trùng ở xơ gan)","1g × 1 lần/ngày TM × tối đa 7 ngày","giảm nguy cơ nhiễm trùng và tái xuất huyết ở bệnh nhân xơ gan"],
        ["Truyền hồng cầu khối","ngưỡng Hb&lt;7g/dL (ngưỡng&lt;8-9g/dL nếu bệnh mạch vành nặng)","tránh truyền quá mức (Hb đích không vượt quá 9g/dL — nguy cơ tăng áp lực tĩnh mạch cửa gây tái xuất huyết ở xơ gan)"]
      ])}
      <div class="age-tag">Người cao tuổi</div>
      <p>Ngưỡng truyền máu có thể cần cá thể hóa cao hơn nếu bệnh mạch vành/thiếu máu cơ tim nền; thận trọng bù dịch quá mức ở người suy tim; cân nhắc kỹ nguy cơ/lợi ích khi phải ngưng kháng đông/kháng kết tập tiểu cầu đang dùng cho bệnh lý tim mạch nền.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Glasgow-Blatchford=0: có thể điều trị ngoại trú, không cần nhập viện/nội soi cấp cứu",'<span class="badge badge-I">I</span>'],
        ["PPI liều cao TM trước nội soi ở XHTH trên nghi do loét",'<span class="badge badge-I">I</span>'],
        ["Nội soi trong 24h (12h nếu nghi giãn TM/huyết động không ổn)",'<span class="badge badge-I">I</span>'],
        ["Chiến lược truyền máu hạn chế (ngưỡng Hb&lt;7g/dL) ở đa số bệnh nhân",'<span class="badge badge-I">I</span>'],
        ["Truyền máu tự do đến Hb&gt;9-10g/dL thường quy",'<span class="badge badge-III">III</span>'],
        ["Nội soi cấp cứu ngay lập tức (&lt;6h) thường quy cho mọi XHTH trên ổn định huyết động",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"ACG Clinical Guideline: Upper GI and Ulcer Bleeding 2021; Baveno VII Consensus on Portal Hypertension 2022; ACG Clinical Guideline: Acute Lower GI Bleeding 2016"
},
{
  spec:"tieu_hoa", id:"pud", emoji:"🩹", short:"Loét DD-TT", title:"Loét dạ dày-tá tràng & H. pylori",
  guidelines:["ACG 2024 (H. pylori)","ACG 2021 (Loét do NSAID)"],
  sections:{
    dinh_nghia:`
      <p>Loét dạ dày-tá tràng là tổn thương mất niêm mạc sâu qua lớp cơ niêm, hai nguyên nhân chính: nhiễm <b>Helicobacter pylori</b> và dùng <b>NSAID/aspirin</b>.</p>`,
    chan_doan:`
      <div class="subhead">Xét nghiệm tìm H. pylori</div>
      ${rt(["Đặc điểm"],[
        ["Test hơi thở Urea (UBT)","Không xâm lấn, độ chính xác cao — xét nghiệm ưu tiên chẩn đoán và xác nhận tiệt trừ"],
        ["Kháng nguyên phân (SAT)","Không xâm lấn, tương đương UBT, chi phí thấp hơn"],
        ["Test nhanh urease/mô bệnh học qua nội soi","Khi đã có chỉ định nội soi vì lý do khác"],
        ["Huyết thanh học (IgG)","Không dùng để xác nhận tiệt trừ (kháng thể tồn tại kéo dài); độ chính xác thấp hơn"]
      ])}
      <div class="alert-box alert-warn">Ngưng PPI ≥2 tuần và kháng sinh/bismuth ≥4 tuần trước khi làm UBT/SAT để tránh âm tính giả.</div>
      <p>Nội soi dạ dày-tá tràng cho ổ loét, sinh thiết loét dạ dày để loại trừ ác tính (loét tá tràng hiếm ác tính, không bắt buộc sinh thiết thường quy) và xác nhận lành sau điều trị ở loét dạ dày lớn/nguy cơ cao.</p>`,
    dieu_tri:`
      <div class="subhead">Tiệt trừ H. pylori — chọn phác đồ theo tỷ lệ kháng clarithromycin tại chỗ</div>
      <p>ACG 2024 khuyến cáo <b>phác đồ 4 thuốc chứa bismuth</b> hoặc <b>phác đồ 4 thuốc đồng thời (concomitant, không bismuth)</b> là lựa chọn đầu tay ở hầu hết khu vực do tỷ lệ kháng clarithromycin ngày càng tăng — <b>phác đồ 3 thuốc chuẩn chứa clarithromycin chỉ dùng khi biết chắc chắn tỷ lệ kháng tại chỗ &lt;15%</b>.</p>
      <div class="subhead">Loét do NSAID</div>
      <ul>
        <li>Ngưng NSAID nếu có thể; nếu bắt buộc tiếp tục, phối hợp PPI dự phòng dài hạn hoặc chuyển COX-2 chọn lọc + PPI</li>
        <li>Đánh giá và điều trị H. pylori đồng thời nếu dương tính (hai yếu tố nguy cơ độc lập cộng gộp)</li>
        <li>Aspirin liều thấp dự phòng tim mạch: cân nhắc tiếp tục kèm PPI ở đa số trường hợp thay vì ngưng hẳn, trừ xuất huyết đang hoạt động</li>
      </ul>
      <p><b>Luôn xác nhận tiệt trừ H. pylori</b> bằng UBT/SAT ≥4 tuần sau kết thúc kháng sinh (và ≥2 tuần sau ngưng PPI).</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">Dị ứng penicillin: dùng phác đồ 4 thuốc bismuth (không chứa amoxicillin) thay vì phác đồ đồng thời.</div>
      ${rt(["Thành phần & liều","Thời gian"],[
        ["4 thuốc Bismuth","PPI chuẩn×2/ngày + bismuth subcitrate 120-300mg×4 + tetracycline 500mg×4 + metronidazole 500mg×3-4","10–14 ngày"],
        ["4 thuốc đồng thời (Concomitant)","PPI×2/ngày + amoxicillin 1g×2 + clarithromycin 500mg×2 + metronidazole 500mg×2","10–14 ngày"],
        ["3 thuốc chuẩn (chỉ khi kháng clarithromycin&lt;15%)","PPI×2/ngày + amoxicillin 1g×2 + clarithromycin 500mg×2","14 ngày"],
        ["PPI dự phòng loét do NSAID dài hạn","PPI liều chuẩn × 1 lần/ngày, dùng cùng NSAID","suốt thời gian dùng NSAID"]
      ])}
      <div class="age-tag">Người cao tuổi</div>
      <p>Kiểm tra tương tác thuốc (clarithromycin ức chế CYP3A4 — thận trọng statin/thuốc chống loạn nhịp); ưu tiên phác đồ bismuth nếu đa bệnh lý/đa thuốc để giảm tương tác.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Phác đồ 4 thuốc (bismuth hoặc đồng thời) ưu tiên hơn 3 thuốc chuẩn ở vùng kháng clarithromycin cao",'<span class="badge badge-I">I</span>'],
        ["Xác nhận tiệt trừ bằng UBT/SAT sau điều trị ở mọi bệnh nhân",'<span class="badge badge-I">I</span>'],
        ["PPI dự phòng dài hạn khi bắt buộc tiếp tục NSAID",'<span class="badge badge-I">I</span>'],
        ["Dùng huyết thanh học IgG để xác nhận tiệt trừ",'<span class="badge badge-III">III</span>'],
        ["Phác đồ 3 thuốc chuẩn khi chưa rõ tỷ lệ kháng clarithromycin tại chỗ",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"ACG Clinical Guideline: Treatment of Helicobacter pylori Infection 2024 update; ACG Guideline for Prevention of NSAID-Related GI Injury 2021"
},
{
  spec:"tieu_hoa", id:"ibs", emoji:"🌀", short:"IBS", title:"Hội chứng ruột kích thích",
  guidelines:["ACG 2021","Rome IV Criteria 2016"],
  sections:{
    dinh_nghia:`
      <p>Hội chứng ruột kích thích (IBS) là rối loạn chức năng ruột-não mạn tính, đặc trưng bởi đau bụng tái phát liên quan đến đại tiện và thay đổi thói quen đại tiện, không có bất thường cấu trúc/sinh hóa giải thích được.</p>
      <div class="subhead">Tiêu chuẩn Rome IV</div>
      <p>Đau bụng tái phát <b>≥1 ngày/tuần trong 3 tháng gần nhất</b>, khởi phát triệu chứng ≥6 tháng trước chẩn đoán, kèm <b>≥2 trong 3</b> tiêu chí: (1) liên quan đến đại tiện, (2) kèm thay đổi tần suất đại tiện, (3) kèm thay đổi hình dạng/độ đặc phân.</p>
      <div class="subhead">Phân nhóm theo thang điểm Bristol</div>
      ${rt(["Đặc điểm"],[
        ["IBS-C (táo bón chiếm ưu thế)","&gt;25% số lần đại tiện phân cứng (Bristol 1-2), &lt;25% phân lỏng"],
        ["IBS-D (tiêu chảy chiếm ưu thế)","&gt;25% số lần đại tiện phân lỏng (Bristol 6-7), &lt;25% phân cứng"],
        ["IBS-M (hỗn hợp)","≥25% cả phân cứng và phân lỏng"],
        ["IBS-U (không phân loại được)","không đủ tiêu chí phân nhóm trên"]
      ])}`,
    chan_doan:`
      <p>Chẩn đoán chủ yếu <b>dựa lâm sàng theo tiêu chuẩn Rome IV</b>, hạn chế xét nghiệm ở người không có dấu hiệu báo động.</p>
      <div class="alert-box alert-danger">Dấu hiệu báo động cần tầm soát thêm: khởi phát &gt;50 tuổi, sụt cân không chủ ý, xuất huyết tiêu hóa/thiếu máu, tiêu chảy về đêm, sốt, tiền sử gia đình ung thư đại-trực tràng/IBD/bệnh celiac, khối bụng sờ thấy.</div>
      <p>Xét nghiệm tối thiểu khuyến cáo: CBC, CRP hoặc <b>calprotectin phân</b> (giúp phân biệt IBS với IBD — độ nhạy cao để loại trừ viêm ruột), huyết thanh học celiac (đặc biệt IBS-D/IBS-M). Nội soi đại tràng chỉ định khi có dấu hiệu báo động hoặc ≥45 tuổi chưa tầm soát ung thư đại-trực tràng theo lịch thường quy.</p>`,
    dieu_tri:`
      <div class="subhead">Nền tảng chung (mọi kiểu hình)</div>
      <ul>
        <li>Giáo dục bệnh nhân về bản chất lành tính, mối liên hệ ruột-não; giảm stress, tập thể dục đều đặn</li>
        <li><b>Chế độ ăn low-FODMAP</b> có bằng chứng tốt nhất trong 4–6 tuần, sau đó tái đưa từng nhóm thực phẩm để cá thể hóa dài hạn (nên có chuyên gia dinh dưỡng hỗ trợ)</li>
        <li>Chất xơ hòa tan (psyllium) giúp cải thiện triệu chứng chung, đặc biệt IBS-C; tránh chất xơ không hòa tan (cám) có thể làm nặng thêm chướng bụng</li>
      </ul>
      <div class="subhead">IBS-C — bậc thang điều trị</div>
      <ul>
        <li><b>Bước 1:</b> chất xơ hòa tan + nhuận tràng thẩm thấu (polyethylene glycol)</li>
        <li><b>Bước 2</b> (không đáp ứng): thuốc chủ vận guanylate cyclase-C (<b>linaclotide, plecanatide</b>) — hiệu quả cả táo bón lẫn đau bụng, bằng chứng mạnh nhất nhóm IBS-C</li>
        <li><b>Bước 3:</b> lubiprostone (kích hoạt kênh clorua) nếu vẫn không đáp ứng</li>
      </ul>
      <div class="subhead">IBS-D — bậc thang điều trị</div>
      <ul>
        <li><b>Bước 1:</b> loperamide kiểm soát triệu chứng theo nhu cầu (không cải thiện đau bụng nền)</li>
        <li><b>Bước 2:</b> <b>rifaximin</b> (kháng sinh không hấp thu, đợt 2 tuần) — có thể lặp lại nếu tái phát sau đáp ứng ban đầu; hoặc eluxadoline (đồng vận µ-opioid/đối kháng δ-opioid, tránh nếu đã cắt túi mật/nghiện rượu)</li>
        <li><b>Bước 3:</b> thuốc gắn acid mật (cholestyramine) nếu nghi kèm kém hấp thu acid mật</li>
      </ul>
      <div class="subhead">Đau bụng chiếm ưu thế/kháng trị (mọi kiểu hình)</div>
      <p><b>Thuốc chống trầm cảm 3 vòng liều thấp</b> (amitriptyline) là lựa chọn hàng đầu cho đau bụng dai dẳng qua cơ chế điều hòa đau ruột-não (không phải để điều trị trầm cảm); SSRI là lựa chọn thay thế. Liệu pháp tâm lý hướng ruột (gut-directed CBT, thôi miên trị liệu ruột) cho trường hợp kháng trị với thuốc.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Linaclotide (IBS-C)","290mcg × 1 lần/ngày lúc đói","tác dụng phụ tiêu chảy liều-phụ thuộc; chống chỉ định tắc ruột cơ học"],
        ["Lubiprostone (IBS-C)","8mcg × 2 lần/ngày (liều IBS, thấp hơn liều táo bón mạn)","uống cùng thức ăn giảm buồn nôn; tránh thai kỳ"],
        ["Loperamide (IBS-D)","2mg sau mỗi lần tiêu chảy, tối đa 16mg/ngày","không vượt liều tối đa (nguy cơ loạn nhịp ở liều rất cao)"],
        ["Rifaximin (IBS-D)","550mg × 3 lần/ngày × 14 ngày","hấp thu toàn thân tối thiểu, an toàn ở suy gan nhẹ-trung bình"],
        ["Eluxadoline (IBS-D)","100mg × 2 lần/ngày (75mg nếu không dung nạp/không còn túi mật)","chống chỉ định tuyệt đối nếu đã cắt túi mật (nguy cơ viêm tụy cấp nặng)"],
        ["Amitriptyline (đau bụng)","10–25mg trước ngủ, tăng dần nếu cần","thận trọng người cao tuổi (kháng cholinergic, té ngã); bắt đầu liều rất thấp"]
      ])}
      <div class="age-tag">Người cao tuổi</div>
      <p>Khởi phát triệu chứng IBS lần đầu ở người &gt;50 tuổi cần tầm soát kỹ hơn trước khi kết luận IBS (loại trừ ung thư đại-trực tràng, thiếu máu mạc treo); thận trọng thuốc kháng cholinergic/3 vòng do tác dụng phụ té ngã, bí tiểu, lú lẫn.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Chẩn đoán dựa tiêu chuẩn Rome IV, hạn chế xét nghiệm nếu không có dấu hiệu báo động",'<span class="badge badge-I">I</span>'],
        ["Calprotectin phân giúp phân biệt IBS với IBD ở người không có dấu hiệu báo động",'<span class="badge badge-I">I</span>'],
        ["Chế độ ăn low-FODMAP có giám sát dinh dưỡng",'<span class="badge badge-I">I</span>'],
        ["Linaclotide/plecanatide cho IBS-C không đáp ứng nhuận tràng đơn thuần",'<span class="badge badge-I">I</span>'],
        ["Rifaximin cho IBS-D không đáp ứng loperamide",'<span class="badge badge-I">I</span>'],
        ["Nội soi đại tràng thường quy cho mọi bệnh nhân IBS không dấu hiệu báo động",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"ACG Clinical Guideline: Management of Irritable Bowel Syndrome 2021; Rome IV Diagnostic Criteria for Functional GI Disorders"
},
{
  spec:"tieu_hoa", id:"ibd", emoji:"🔥", short:"IBD", title:"Viêm ruột mạn (Crohn/Viêm loét ĐT)",
  guidelines:["ACG 2019 (UC)","ACG 2018 (Crohn)","AGA 2021 (điều trị bằng thuốc)"],
  sections:{
    dinh_nghia:`
      <p>Bệnh viêm ruột mạn (IBD) gồm 2 thể chính, tiến triển từng đợt-thuyên giảm mạn tính do rối loạn đáp ứng miễn dịch niêm mạc ruột:</p>
      ${rt(["Vị trí tổn thương","Đặc điểm mô bệnh học"],[
        ["Viêm loét đại tràng (UC)","Chỉ đại-trực tràng, liên tục từ trực tràng lan lên","Viêm niêm mạc-dưới niêm mạc, áp xe hốc tuyến (crypt abscess)"],
        ["Bệnh Crohn","Bất kỳ đoạn nào từ miệng đến hậu môn, thường hồi tràng cuối","Viêm xuyên thành, tổn thương dạng vệt (skip lesions), có thể có u hạt"]
      ])}`,
    chan_doan:`
      <p>Nội soi đại-trực tràng kèm sinh thiết là tiêu chuẩn chẩn đoán: UC cho hình ảnh viêm liên tục từ trực tràng; Crohn cho tổn thương dạng vệt, loét sâu, hình ảnh "đá lát" (cobblestoning). <b>Calprotectin phân</b> tăng cao hỗ trợ chẩn đoán và theo dõi đáp ứng điều trị không xâm lấn. Cộng hưởng từ ruột non (MR enterography) đánh giá tổn thương ruột non/xuyên thành/biến chứng (hẹp, rò) trong Crohn. Luôn loại trừ viêm đại tràng nhiễm trùng (cấy phân, độc tố C. difficile) trước khi bắt đầu ức chế miễn dịch.</p>`,
    dieu_tri:`
      <div class="subhead">Viêm loét đại tràng (UC) — nhẹ đến trung bình</div>
      <ul>
        <li><b>Bước 1:</b> 5-ASA (mesalamine) uống ± dạng đặt trực tràng/thụt — điều trị đầu tay cho cảm ứng lẫn duy trì lui bệnh</li>
        <li><b>Bước 2</b> (không đáp ứng 5-ASA): corticosteroid đường uống để cảm ứng lui bệnh (<b>không dùng duy trì dài hạn</b>) + bắt đầu cân nhắc bước 3 song song nếu phụ thuộc/kháng steroid</li>
      </ul>
      <div class="subhead">UC trung bình-nặng hoặc phụ thuộc/kháng corticosteroid</div>
      <p>Sinh học/thuốc nhắm đích: <b>anti-TNF</b> (infliximab, adalimumab), <b>vedolizumab</b> (chọn lọc ruột), <b>ustekinumab</b>, hoặc <b>tofacitinib/upadacitinib</b> (JAK inhibitor) — lựa chọn theo đặc điểm bệnh nhân, bệnh đồng mắc, nguy cơ nhiễm trùng/huyết khối.</p>
      <div class="subhead">UC nặng/bùng phát cấp cần nhập viện</div>
      <p>Corticosteroid tiêm tĩnh mạch liều cao → nếu không đáp ứng sau 3 ngày: "cứu vãn" bằng <b>infliximab</b> hoặc <b>cyclosporine</b> TM → phẫu thuật cắt đại tràng nếu vẫn kháng trị hoặc biến chứng nặng (phình đại tràng nhiễm độc, thủng).</p>
      <div class="subhead">Bệnh Crohn</div>
      <ul>
        <li>5-ASA hiệu quả hạn chế trong Crohn (khác UC) — không phải lựa chọn đầu tay chính</li>
        <li>Corticosteroid cảm ứng lui bệnh cho đợt cấp nhẹ-trung bình, không dùng duy trì</li>
        <li><b>Chiến lược "top-down" sớm bằng sinh học (anti-TNF)</b> được khuyến cáo ở bệnh nhân nguy cơ cao (tổn thương xuyên thành sâu, bệnh quanh hậu môn, khởi phát trẻ, cần corticosteroid sớm) thay vì chờ thất bại điều trị bước thang truyền thống — cải thiện kết cục dài hạn, giảm biến chứng/phẫu thuật</li>
        <li>Thuốc điều hòa miễn dịch (azathioprine, 6-mercaptopurine, methotrexate) dùng phối hợp với sinh học (tăng hiệu quả, giảm kháng thể kháng thuốc) hoặc đơn trị duy trì sau cảm ứng bằng corticosteroid</li>
      </ul>
      <div class="subhead">Vai trò phẫu thuật</div>
      <p>Cắt đại tràng có thể <b>chữa khỏi UC</b> (chỉ định: kháng trị nội khoa, loạn sản/ung thư, biến chứng cấp). Phẫu thuật trong Crohn <b>không chữa khỏi</b> (bệnh tái phát sau mổ gần như chắc chắn) — chỉ giải quyết biến chứng khu trú (hẹp, rò, áp xe), bảo tồn ruột tối đa.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">Trước khởi động sinh học/JAK inhibitor: sàng lọc lao tiềm ẩn, viêm gan B/C, cập nhật vắc-xin không sống; JAK inhibitor có cảnh báo hộp đen tương tự RA (biến cố tim mạch/huyết khối/ung thư) ở người ≥50 tuổi có yếu tố nguy cơ tim mạch.</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Mesalamine (UC)","2.4–4.8g/ngày uống ± 1g thụt/đặt tối","liều cao hơn cho bệnh lan rộng; kết hợp uống+tại chỗ hiệu quả hơn đơn trị"],
        ["Prednisone (cảm ứng)","40–60mg/ngày → giảm dần trong 8–12 tuần","không duy trì dài hạn; bổ sung canxi-vitamin D, tầm soát loãng xương nếu dùng lặp lại"],
        ["Infliximab (anti-TNF)","5mg/kg TM tuần 0,2,6 → mỗi 8 tuần duy trì","phối hợp azathioprine giảm kháng thể kháng thuốc; theo dõi phản ứng truyền"],
        ["Adalimumab (anti-TNF)","160mg→80mg→40mg TDD mỗi 2 tuần","có thể tự tiêm tại nhà"],
        ["Azathioprine (điều hòa miễn dịch)","2–2.5mg/kg/ngày","kiểm tra hoạt độ TPMT/NUDT15 trước dùng nếu có thể; theo dõi công thức máu định kỳ"],
        ["Vedolizumab (chọn lọc ruột)","300mg TM tuần 0,2,6 → mỗi 8 tuần","hồ sơ an toàn nhiễm trùng toàn thân thấp hơn anti-TNF do tác dụng chọn lọc ruột"]
      ])}
      <div class="age-tag">Người cao tuổi/thai kỳ</div>
      <p>Người cao tuổi khởi phát IBD: ưu tiên vedolizumab/thuốc chọn lọc ruột nếu có thể do ít ảnh hưởng miễn dịch toàn thân hơn; anti-TNF và hầu hết sinh học tương đối an toàn trong thai kỳ (tiếp tục điều trị duy trì bệnh ổn định thường an toàn hơn để bệnh bùng phát) — cần hội chẩn chuyên khoa để cá thể hóa thời điểm liều cuối trước sinh.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["5-ASA là điều trị đầu tay cảm ứng và duy trì UC nhẹ-trung bình",'<span class="badge badge-I">I</span>'],
        ["Sinh học sớm (top-down) cho Crohn nguy cơ cao thay vì chờ thất bại điều trị bước thang",'<span class="badge badge-IIa">IIa</span>'],
        ["Corticosteroid TM + cứu vãn infliximab/cyclosporine cho UC nặng không đáp ứng sau 3 ngày",'<span class="badge badge-I">I</span>'],
        ["Phối hợp thuốc điều hòa miễn dịch với anti-TNF để giảm kháng thể kháng thuốc",'<span class="badge badge-IIa">IIa</span>'],
        ["Corticosteroid duy trì dài hạn để kiểm soát bệnh",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"ACG Clinical Guideline: Ulcerative Colitis in Adults 2019; ACG Clinical Guideline: Crohn's Disease in Adults 2018; AGA Clinical Practice Guidelines on Pharmacologic Management 2021"
},
{
  spec:"tieu_hoa", id:"cirrhosis", emoji:"🫘", short:"Xơ gan", title:"Xơ gan & Biến chứng",
  guidelines:["AASLD 2021 (Cổ trướng)","Baveno VII 2022 (Tăng áp cửa)"],
  sections:{
    dinh_nghia:`
      <p>Xơ gan là giai đoạn cuối của xơ hóa gan tiến triển, đặc trưng bởi tái cấu trúc nốt tái tạo lan tỏa. Nguyên nhân thường gặp: viêm gan virus B/C, bệnh gan do rượu, và <b>MASLD</b> (gan nhiễm mỡ liên quan rối loạn chuyển hóa — tên gọi mới thay cho NAFLD theo đồng thuận đa hiệp hội 2023).</p>
      <div class="subhead">Phân độ Child-Pugh</div>
      ${scr("childpugh","Thang điểm Child-Pugh",[
        {label:"Bilirubin (mg/dL)", options:[{text:"&lt;2 (1đ)",pts:1},{text:"2–3 (2đ)",pts:2},{text:"&gt;3 (3đ)",pts:3}]},
        {label:"Albumin (g/dL)", options:[{text:"&gt;3.5 (1đ)",pts:1},{text:"2.8–3.5 (2đ)",pts:2},{text:"&lt;2.8 (3đ)",pts:3}]},
        {label:"INR", options:[{text:"&lt;1.7 (1đ)",pts:1},{text:"1.7–2.3 (2đ)",pts:2},{text:"&gt;2.3 (3đ)",pts:3}]},
        {label:"Cổ trướng", options:[{text:"Không (1đ)",pts:1},{text:"Nhẹ, đáp ứng thuốc (2đ)",pts:2},{text:"Nhiều, kháng trị (3đ)",pts:3}]},
        {label:"Bệnh não gan", options:[{text:"Không (1đ)",pts:1},{text:"Độ I–II (2đ)",pts:2},{text:"Độ III–IV (3đ)",pts:3}]}
      ])}
      <p>Child A: 5–6 điểm · Child B: 7–9 điểm · Child C: 10–15 điểm. MELD-Na dùng để ưu tiên danh sách ghép gan.</p>`,
    chan_doan:`
      <p>Chẩn đoán không xâm lấn ưu tiên: <b>đo độ đàn hồi gan (FibroScan/VCTE)</b> hoặc chỉ số huyết thanh (FIB-4) kết hợp hình ảnh học gợi ý xơ gan (bờ gan không đều, lách to, tuần hoàn bàng hệ).</p>
      <div class="subhead">Tầm soát định kỳ bắt buộc khi đã xơ gan</div>
      <ul>
        <li><b>Nội soi tiêu hóa trên</b> tầm soát giãn tĩnh mạch thực quản tại thời điểm chẩn đoán xơ gan (có thể hoãn nếu độ đàn hồi gan &lt;20kPa và tiểu cầu &gt;150.000 — tiêu chuẩn Baveno VI/VII)</li>
        <li><b>Siêu âm bụng ± AFP mỗi 6 tháng</b> tầm soát ung thư biểu mô tế bào gan (HCC) ở mọi bệnh nhân xơ gan</li>
      </ul>`,
    dieu_tri:`
      <div class="subhead">Cổ trướng</div>
      <p>Hạn chế muối (&lt;2g Na/ngày) + lợi tiểu phối hợp spironolactone-furosemide tỷ lệ 100:40mg, tăng dần mỗi 3–5 ngày. Cổ trướng kháng trị: chọc tháo dịch cổ trướng thể tích lớn (LVP) + truyền albumin bù (6–8g/lít dịch tháo nếu &gt;5L); cân nhắc TIPS nếu tái phát thường xuyên.</p>
      <div class="subhead">Dự phòng xuất huyết do vỡ giãn tĩnh mạch thực quản</div>
      <p>Giãn tĩnh mạch trung bình-lớn: <b>chẹn beta không chọn lọc</b> (propranolol/carvedilol) hoặc thắt vòng cao su qua nội soi — chọn theo đặc điểm bệnh nhân/nguồn lực. Carvedilol có thể ưu tiên vì vừa hạ áp lực tĩnh mạch cửa vừa dễ dùng.</p>
      <div class="subhead">Xuất huyết tiêu hóa cấp do giãn tĩnh mạch</div>
      <p>Hồi sức + kháng sinh dự phòng (ceftriaxone) ngay khi nhập viện + thuốc vận mạch tạng (terlipressin/octreotide) + nội soi cấp cứu trong 12h thắt/chích xơ.</p>
      <div class="subhead">Bệnh não gan</div>
      <p>Lactulose là điều trị nền tảng (điều chỉnh liều để đạt 2–3 lần đi tiêu mềm/ngày); thêm rifaximin nếu tái phát dù lactulose tối ưu hoặc bệnh não gan tái diễn.</p>
      <div class="alert-box alert-danger">Viêm phúc mạc nhiễm khuẩn nguyên phát (SBP): mọi cổ trướng nhập viện cần chọc dò chẩn đoán; bạch cầu đa nhân trung tính dịch cổ trướng ≥250/mm³ → kháng sinh ngay (cephalosporin thế hệ 3) + albumin TM ngày 1 và ngày 3 để giảm nguy cơ hội chứng gan-thận.</div>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">Tránh NSAID (tăng nguy cơ suy thận/xuất huyết), thận trọng aminoglycoside, chỉnh liều thuốc chuyển hóa qua gan; theo dõi kali máu sát khi phối hợp lợi tiểu.</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Spironolactone","100mg/ngày → tối đa 400mg/ngày","theo dõi kali máu, tăng nữ hóa tuyến vú nam giới"],
        ["Furosemide","40mg/ngày → tối đa 160mg/ngày (giữ tỷ lệ 100:40 với spironolactone)","theo dõi natri/kali, chức năng thận"],
        ["Propranolol (dự phòng xuất huyết)","20mg×2/ngày, tăng dần đến nhịp tim đích 55–60/phút","ngưng nếu HA tâm thu&lt;90 hoặc cổ trướng kháng trị nặng"],
        ["Carvedilol","6.25mg/ngày → tối đa 12.5mg/ngày","hạ áp lực cửa tốt hơn propranolol liều tương đương"],
        ["Lactulose","15–30mL × 2–3 lần/ngày, chỉnh theo số lần đi tiêu","quá liều gây tiêu chảy/rối loạn điện giải"],
        ["Rifaximin","550mg × 2 lần/ngày","phối hợp lactulose, không đơn trị thay thế"],
        ["Terlipressin (xuất huyết cấp)","2mg TM mỗi 4h → giảm 1mg mỗi 4h khi kiểm soát","chống chỉ định bệnh mạch vành/mạch máu ngoại biên nặng"]
      ])}`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Tầm soát HCC bằng siêu âm ± AFP mỗi 6 tháng ở mọi bệnh nhân xơ gan",'<span class="badge badge-I">I</span>'],
        ["Chẹn beta không chọn lọc hoặc thắt vòng cao su dự phòng xuất huyết giãn TM trung bình-lớn",'<span class="badge badge-I">I</span>'],
        ["Albumin TM ngày 1&3 kèm kháng sinh trong SBP",'<span class="badge badge-I">I</span>'],
        ["Kháng sinh dự phòng khi xuất huyết tiêu hóa cấp ở xơ gan",'<span class="badge badge-I">I</span>'],
        ["NSAID thường quy để giảm đau ở người xơ gan mất bù",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"AASLD 2021 Practice Guidance on Ascites, SBP and Hepatorenal Syndrome; Baveno VII 2022 Consensus on Portal Hypertension"
},
{
  spec:"tieu_hoa", id:"masld", emoji:"🧈", short:"MASLD", title:"Gan nhiễm mỡ liên quan rối loạn chuyển hóa (MASLD)",
  guidelines:["AASLD 2023","EASL-EASD-EASO 2024"],
  sections:{
    dinh_nghia:`
      <p><b>MASLD</b> (Metabolic dysfunction-Associated Steatotic Liver Disease) là thuật ngữ mới thay thế NAFLD (2023). Định nghĩa: steatosis gan ≥5% kèm ≥1 yếu tố nguy cơ chuyển hóa (béo phì, ĐTĐ típ 2, tăng huyết áp, rối loạn lipid…) và không có nguyên nhân khác (rượu nặng, virus, thuốc…).</p>
      <div class="subhead">Phổ bệnh</div>
      ${rt(["Đặc điểm"],[
        ["MASL","Steatosis đơn thuần (trước đây NAFL)"],
        ["MASH","Steatohepatitis (trước đây NASH) – viêm + tổn thương tế bào gan"],
        ["MASH xơ hóa / xơ gan","Tiến triển đến xơ hóa nặng hoặc xơ gan"],
        ["MetALD","Steatosis + yếu tố chuyển hóa + uống rượu mức trung bình"]
      ])}`,
    chan_doan:`
      <p>Phát hiện tình cờ trên siêu âm hoặc men gan tăng. <b>Không tầm soát đại trà</b> dân số chung. Tầm soát xơ hóa ở người có ĐTĐ típ 2, béo phì kèm yếu tố nguy cơ khác.</p>
      <div class="subhead">Chiến lược đánh giá xơ hóa (AASLD / EASL 2024)</div>
      <ul>
        <li><b>Bước 1:</b> FIB-4. Nếu &lt;1.3 (hoặc &lt;2.0 nếu &gt;65 tuổi) → nguy cơ thấp, theo dõi tại tuyến cơ sở.</li>
        <li><b>Bước 2:</b> Nếu FIB-4 ≥1.3 → đo độ đàn hồi gan (VCTE/FibroScan) hoặc ELF.</li>
        <li>Sinh thiết gan khi kết quả không rõ hoặc nghi chẩn đoán khác.</li>
      </ul>
      <div class="alert-box alert-info">FIB-4 kém chính xác ở người &lt;35 tuổi. Mục tiêu chính là phát hiện xơ hóa ≥F2 để can thiệp sớm.</div>`,
    dieu_tri:`
      <div class="subhead">Nền tảng – thay đổi lối sống</div>
      <ul>
        <li>Giảm cân bền vững: ≥5% giảm mỡ gan, 7–10% cải thiện viêm, ≥10% cải thiện xơ hóa.</li>
        <li>Chế độ ăn deficit calorie, tăng vận động.</li>
        <li>Kiểm soát ĐTĐ, THA, lipid (statin an toàn ở xơ gan còn bù).</li>
      </ul>
      <div class="subhead">Thuốc</div>
      <ul>
        <li><b>Semaglutide / GLP-1 RA</b>: cải thiện MASH và lợi ích tim mạch – cân nhắc mạnh ở người béo phì/ĐTĐ.</li>
        <li>Pioglitazone: cải thiện MASH ở người ĐTĐ.</li>
        <li>Vitamin E: cân nhắc ở MASH không ĐTĐ (không xơ gan).</li>
        <li>Resmetirom (mới): được phê duyệt cho MASH có xơ hóa vừa ở một số quốc gia.</li>
      </ul>
      <p>Phẫu thuật bariatric nên được cân nhắc ở người đủ tiêu chuẩn, không xơ gan mất bù.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Tầm soát xơ hóa (FIB-4) ở người ĐTĐ típ 2 hoặc béo phì kèm yếu tố nguy cơ",'<span class="badge badge-I">I</span>'],
        ["Giảm cân ≥7–10% là điều trị nền tảng cải thiện viêm và xơ hóa",'<span class="badge badge-I">I</span>'],
        ["Cân nhắc GLP-1 RA (semaglutide) ở MASLD kèm béo phì/ĐTĐ",'<span class="badge badge-IIa">IIa</span>'],
        ["Statin an toàn và khuyến cáo khi có chỉ định tim mạch ở xơ gan còn bù",'<span class="badge badge-I">I</span>'],
        ["Tầm soát MASLD đại trà dân số chung",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"AASLD 2023 Practice Guidance on NAFLD; EASL–EASD–EASO 2024 Clinical Practice Guidelines on MASLD"
},
{
  spec:"tieu_hoa", id:"constipation", emoji:"🚽", short:"Táo bón", title:"Táo bón chức năng",
  guidelines:["AGA/ACG 2023","Rome IV"],
  sections:{
    dinh_nghia:`
      <p>Táo bón chức năng (Functional Constipation) theo Rome IV: ≥2 tiêu chí trong ≥3 tháng (khởi phát ≥6 tháng): rặn nhiều, phân cứng/vón, cảm giác đại tiện không hết, tắc nghẽn, cần hỗ trợ thủ công, &lt;3 lần đại tiện/tuần — và không đủ tiêu chuẩn IBS.</p>
      <div class="subhead">Phân loại thực hành</div>
      ${rt(["Đặc điểm"],[
        ["Táo bón chức năng thông thường","Phổ biến nhất, không nguyên nhân thực thể"],
        ["Rối loạn đại tiện (Dyssynergic)","Phối hợp cơ sàn chậu kém"],
        ["Táo bón do thuốc / bệnh thực thể","Opioid, kháng cholinergic, Parkinson, suy giáp…"]
      ])}`,
    chan_doan:`
      <p>Chủ yếu lâm sàng. Cần loại trừ "red flags": máu phân, sụt cân, thiếu máu, khởi phát sau 50 tuổi, tiền sử gia đình ung thư đại trực tràng → nội soi.</p>
      <ul>
        <li>Xét nghiệm cơ bản: công thức máu, TSH, canxi, glucose nếu nghi.</li>
        <li>Đánh giá sàn chậu / manometry khi nghi dyssynergic defecation và thất bại điều trị ban đầu.</li>
      </ul>`,
    dieu_tri:`
      <div class="subhead">Bậc thang</div>
      <ul>
        <li><b>Bước 1:</b> Giáo dục, tăng chất xơ (25–30 g/ngày), uống đủ nước, vận động.</li>
        <li><b>Bước 2:</b> Thuốc nhuận tràng thẩm thấu (PEG 3350 là lựa chọn hàng đầu), hoặc stimulant (bisacodyl, senna) ngắn ngày.</li>
        <li><b>Bước 3:</b> Secretagogues (linaclotide, lubiprostone) hoặc prokinetic (prucalopride) khi thất bại.</li>
        <li>Biofeedback nếu dyssynergic defecation.</li>
      </ul>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["PEG 3350 (Forlax…)","17 g/ngày, pha nước","An toàn dài hạn, lựa chọn đầu tay"],
        ["Bisacodyl","5–10 mg uống hoặc đặt trực tràng","Dùng ngắn ngày"],
        ["Linaclotide","145–290 mcg/ngày","Uống trước ăn 30 phút"],
        ["Prucalopride","1–2 mg/ngày","Thận trọng ở người cao tuổi"]
      ])}`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["PEG là nhuận tràng thẩm thấu đầu tay cho táo bón chức năng",'<span class="badge badge-I">I</span>'],
        ["Tăng chất xơ và thay đổi lối sống là nền tảng",'<span class="badge badge-I">I</span>'],
        ["Nội soi khi có red flags hoặc tuổi ≥50 chưa tầm soát",'<span class="badge badge-I">I</span>'],
        ["Dùng stimulant nhuận tràng dài hạn thường quy",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"ACG/AGA Guideline on Chronic Constipation 2023; Rome IV Criteria"
},
{
  spec:"co_xuong_khop", id:"axspa", emoji:"🦴", short:"AxSpA", title:"Viêm cột sống dính khớp / Axial Spondyloarthritis",
  guidelines:["ASAS-EULAR 2022","ACR/SAA/SPARTAN"],
  sections:{
    dinh_nghia:`
      <p>Axial Spondyloarthritis (axSpA) là nhóm bệnh viêm cột sống và khớp cùng chậu, bao gồm:</p>
      <ul>
        <li><b>Radiographic axSpA</b> (Ankylosing Spondylitis – AS): có tổn thương X-quang khớp cùng chậu rõ.</li>
        <li><b>Non-radiographic axSpA</b> (nr-axSpA): viêm trên MRI nhưng chưa tổn thương X-quang.</li>
      </ul>
      <p>Thường khởi phát trước 45 tuổi, liên quan mạnh HLA-B27, có thể kèm viêm màng bồ đào, viêm ruột, vẩy nến.</p>`,
    chan_doan:`
      <p>Tiêu chuẩn phân loại ASAS: đau lưng viêm ≥3 tháng khởi phát &lt;45 tuổi + sacroiliitis trên hình ảnh (X-quang hoặc MRI) + ≥1 đặc điểm SpA, hoặc HLA-B27 + ≥2 đặc điểm SpA.</p>
      <div class="alert-box alert-info"><b>Cập nhật gần đây:</b> MRI khớp cùng chậu (không cản quang) được ưu tiên hơn X-quang là hình ảnh đầu tay để chẩn đoán sớm axSpA.</div>
      <p>Đánh giá hoạt động bệnh bằng <b>ASDAS</b> (ưu tiên hơn BASDAI). CRP tăng hỗ trợ quyết định điều trị sinh học.</p>`,
    dieu_tri:`
      <div class="subhead">Bậc thang điều trị (ASAS-EULAR 2022)</div>
      <ul>
        <li><b>Bước 1:</b> NSAID liều tối đa dung nạp (thử ≥2 loại khác nhau) + vật lý trị liệu, tập luyện.</li>
        <li><b>Bước 2:</b> Nếu ASDAS ≥2.1 và thất bại ≥2 NSAID → bDMARD hoặc tsDMARD.</li>
        <li>Điều kiện thêm: CRP tăng hoặc viêm trên MRI khớp cùng chậu hoặc sacroiliitis X-quang.</li>
      </ul>
      <div class="subhead">Lựa chọn sinh học</div>
      <ul>
        <li><b>TNFi</b> và <b>IL-17i</b> là lựa chọn hàng đầu ngang nhau.</li>
        <li>JAKi (upadacitinib…) là lựa chọn tiếp theo hoặc thay thế.</li>
        <li>Không khuyến cáo csDMARD (methotrexate, sulfasalazine) đơn thuần cho axSpA trục trừ khi có biểu hiện ngoại vi hoặc ngoài khớp.</li>
      </ul>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Naproxen / NSAID khác","Liều chống viêm tối đa","Thử ít nhất 2–4 tuần mỗi loại"],
        ["Adalimumab / Etanercept (TNFi)","Theo chuẩn (40mg/2 tuần hoặc 50mg/tuần)","Sàng lọc lao/viêm gan B trước"],
        ["Secukinumab / Ixekizumab (IL-17i)","Theo chuẩn","Hiệu quả tốt với viêm màng bồ đào/vẩy nến"],
        ["Upadacitinib (JAKi)","15 mg/ngày","Thận trọng yếu tố nguy cơ tim mạch/huyết khối"]
      ])}`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["NSAID là điều trị đầu tay cho axSpA",'<span class="badge badge-I">I</span>'],
        ["TNFi hoặc IL-17i khi thất bại NSAID và ASDAS ≥2.1 kèm CRP/MRI dương tính",'<span class="badge badge-I">I</span>'],
        ["Vật lý trị liệu và tập luyện là nền tảng không dùng thuốc",'<span class="badge badge-I">I</span>'],
        ["csDMARD đơn thuần cho axSpA trục không biểu hiện ngoại vi",'<span class="badge badge-III">III</span>'],
        ["Glucocorticoid đường toàn thân dài hạn",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"ASAS-EULAR 2022 recommendations for the management of axial spondyloarthritis; ACR/SAA/SPARTAN recommendations"
},
{
  spec:"co_xuong_khop", id:"pmr", emoji:"🧓", short:"PMR", title:"Viêm đa cơ thấp (Polymyalgia Rheumatica)",
  guidelines:["EULAR/ACR 2015 + cập nhật thực hành"],
  sections:{
    dinh_nghia:`
      <p>Polymyalgia Rheumatica (PMR) là bệnh viêm ở người ≥50 tuổi, đặc trưng bởi đau và cứng vùng vai, cổ, hông hai bên vào buổi sáng, kèm phản ứng viêm hệ thống (CRP/ESR tăng cao). Có liên quan chặt với viêm động mạch tế bào khổng lồ (GCA).</p>
      <div class="subhead">Đặc điểm lâm sàng điển hình</div>
      <ul>
        <li>Tuổi ≥50, khởi phát cấp/bán cấp.</li>
        <li>Đau + cứng buổi sáng ≥45 phút vùng vai và/hoặc hông hai bên.</li>
        <li>CRP hoặc ESR tăng rõ.</li>
        <li>Đáp ứng nhanh với corticosteroid liều thấp–trung bình.</li>
      </ul>`,
    chan_doan:`
      <p>Chẩn đoán lâm sàng + loại trừ bệnh khác (VKDT, viêm cơ, suy giáp, ung thư, nhiễm trùng…). Không có xét nghiệm đặc hiệu.</p>
      <div class="alert-box alert-info">Luôn tầm soát triệu chứng GCA (đau đầu mới, đau hàm khi nhai, rối loạn thị giác) vì 15–20% PMR kèm GCA và cần điều trị corticosteroid liều cao hơn.</div>
      <p>Siêu âm vai/hông hỗ trợ chẩn đoán. PET-CT hoặc MRI khi nghi GCA hoặc không điển hình.</p>`,
    dieu_tri:`
      <div class="subhead">Corticosteroid – nền tảng</div>
      <ul>
        <li>Prednisone 12.5–25 mg/ngày khởi đầu (thường 15–20 mg).</li>
        <li>Giảm liều dần khi triệu chứng kiểm soát và CRP/ESR bình thường hóa.</li>
        <li>Thời gian điều trị thường 1–2 năm; tái phát phổ biến khi giảm liều.</li>
      </ul>
      <div class="subhead">Thuốc tiết kiệm steroid</div>
      <ul>
        <li>Methotrexate 7.5–15 mg/tuần khi tái phát nhiều hoặc cần giảm corticosteroid nhanh.</li>
        <li>Tocilizumab trong một số trường hợp kháng trị hoặc GCA.</li>
      </ul>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Prednisone khởi đầu","15–20 mg/ngày (phạm vi 12.5–25 mg)","Đáp ứng lâm sàng thường trong 3–7 ngày"],
        ["Giảm liều","1–2.5 mg mỗi 2–4 tuần","Theo triệu chứng + CRP/ESR"],
        ["Methotrexate","7.5–15 mg/tuần","Bổ sung acid folic; theo dõi công thức máu, men gan"]
      ])}`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Corticosteroid liều thấp–trung bình là điều trị đầu tay PMR",'<span class="badge badge-I">I</span>'],
        ["Tầm soát triệu chứng GCA ở mọi bệnh nhân PMR",'<span class="badge badge-I">I</span>'],
        ["Methotrexate khi tái phát nhiều hoặc khó giảm corticosteroid",'<span class="badge badge-IIa">IIa</span>'],
        ["Corticosteroid liều cao thường quy cho PMR không nghi GCA",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"EULAR/ACR recommendations for the management of polymyalgia rheumatica; practical updates"
},
{
  spec:"co_xuong_khop", id:"gout", emoji:"🦶", short:"Gout", title:"Bệnh Gout (Gút)",
  guidelines:["ACR 2020"],
  sections:{
    dinh_nghia:`
      <p>Gout là bệnh viêm khớp do lắng đọng tinh thể monosodium urate trong khớp/mô mềm, hậu quả của tăng acid uric máu kéo dài.</p>
      <div class="subhead">Các giai đoạn</div>
      <p>Tăng acid uric máu không triệu chứng → cơn gout cấp → giai đoạn giữa các cơn → gout mạn tính có hạt tophi.</p>`,
    chan_doan:`
      <p><b>Tiêu chuẩn vàng:</b> soi dịch khớp/tophi dưới kính hiển vi phân cực thấy tinh thể urate hình kim, lưỡng chiết âm mạnh. Khi không chọc dịch được, chẩn đoán lâm sàng dựa tiêu chuẩn ACR/EULAR 2015 (khởi phát đột ngột, khớp bàn ngón chân cái, ban đỏ, đáp ứng nhanh colchicine).</p>
      ${rt(["Ngưỡng"],[
        ["Tăng acid uric máu","&gt;6.8 mg/dL (~404 µmol/L) — ngưỡng bão hòa hình thành tinh thể"],
        ["Đích điều trị hạ urat","&lt;6.0 mg/dL (~360 µmol/L)"],
        ["Đích ở gout có tophi/nặng","&lt;5.0 mg/dL (~300 µmol/L)"]
      ])}
      <p>Siêu âm khớp (dấu hiệu "double contour") hoặc CT năng lượng kép hỗ trợ chẩn đoán khi lâm sàng không điển hình.</p>`,
    dieu_tri:`
      <div class="subhead">Cơn gout cấp</div>
      <p>Khởi trị càng sớm càng tốt (trong 24h đầu): NSAID, colchicine liều thấp, hoặc corticosteroid (uống/tiêm khớp) — hiệu quả tương đương, chọn theo bệnh đồng mắc/chống chỉ định. Điều trị đến khi cơn hết hoàn toàn (thường 5–7 ngày).</p>
      <div class="subhead">Chỉ định điều trị hạ urat máu dài hạn (ULT)</div>
      <p>ACR 2020 khuyến cáo <b>bắt đầu ULT ngay sau cơn gout đầu tiên</b> nếu có: ≥1 hạt tophi, tổn thương khớp trên hình ảnh do gout, ≥2 cơn/năm, hoặc bệnh thận mạn giai đoạn ≥3 kèm tăng acid uric máu — thay vì chỉ chờ gout tái phát nhiều lần như trước đây.</p>
      <div class="subhead">Điều trị hạ urat</div>
      <ul>
        <li><b>Allopurinol</b> là thuốc hàng đầu cho mọi bệnh nhân kể cả có bệnh thận mạn, khởi liều thấp, <b>tăng liều từ từ (treat-to-target)</b> đến khi đạt đích acid uric</li>
        <li>Febuxostat khi không dung nạp/chống chỉ định allopurinol — thận trọng ở người có bệnh tim mạch (cảnh báo tăng tử vong tim mạch trong nghiên cứu CARES)</li>
        <li><b>Dự phòng cơn gout bùng phát</b> khi khởi động ULT: colchicine liều thấp hoặc NSAID liều thấp trong ≥3–6 tháng đầu (do huy động urat từ mô gây khởi phát cơn cấp nghịch lý)</li>
      </ul>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-danger">Sàng lọc HLA-B*5801 trước dùng allopurinol ở quần thể nguy cơ cao (người gốc Á, đặc biệt Hán, Thái, Hàn) do nguy cơ hội chứng quá mẫn nặng (DRESS/SJS-TEN).</div>
      ${rt(["Liều khởi đầu → duy trì","Lưu ý theo tuổi/thận"],[
        ["Allopurinol","khởi đầu ≤100mg/ngày (≤50mg nếu eGFR&lt;30) → tăng dần mỗi 2–5 tuần đến đích","có thể dùng liều &gt;300mg/ngày kể cả suy thận nếu tăng liều từ từ và theo dõi sát"],
        ["Febuxostat","40mg/ngày → tối đa 80mg/ngày","tránh nếu có bệnh tim mạch đã biết, ưu tiên allopurinol trước"],
        ["Colchicine (cơn cấp)","1.2mg ngay → 0.6mg sau 1h (tổng ngày 1: 1.8mg)","giảm liều/tránh nếu eGFR&lt;30 hoặc dùng cùng clarithromycin/thuốc ức chế CYP3A4-P-gp mạnh"],
        ["Colchicine (dự phòng bùng phát)","0.3–0.6mg × 1–2 lần/ngày","giảm liều ở người cao tuổi/suy thận"],
        ["NSAID (cơn cấp, vd. naproxen)","500mg × 2 lần/ngày × 5–7 ngày","tránh nếu bệnh thận mạn/loét tiêu hóa/suy tim"],
        ["Prednisolone (cơn cấp)","30–35mg/ngày × 5 ngày","lựa chọn ưu tiên khi chống chỉ định NSAID và colchicine"]
      ])}`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Điều trị hạ urat ngay sau cơn đầu tiên nếu có tophi/tổn thương khớp/≥2 cơn/năm/bệnh thận mạn",'<span class="badge badge-I">I</span>'],
        ["Allopurinol là ULT hàng đầu cho mọi bệnh nhân kể cả bệnh thận mạn",'<span class="badge badge-I">I</span>'],
        ["Chiến lược treat-to-target theo nồng độ acid uric máu",'<span class="badge badge-I">I</span>'],
        ["Dự phòng bùng phát bằng colchicine/NSAID liều thấp khi khởi động ULT",'<span class="badge badge-I">I</span>'],
        ["Ngưng ULT khi hết triệu chứng lâm sàng mà chưa đạt đích acid uric",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"2020 American College of Rheumatology Guideline for the Management of Gout"
},
{
  spec:"co_xuong_khop", id:"sle", emoji:"🦋", short:"Lupus", title:"Lupus ban đỏ hệ thống (SLE)",
  guidelines:["EULAR/ACR 2019 (phân loại)","EULAR 2023 (điều trị)"],
  sections:{
    dinh_nghia:`
      <p>Lupus ban đỏ hệ thống (SLE) là bệnh tự miễn hệ thống mạn tính đặc trưng bởi tổn thương đa cơ quan (da, khớp, thận, huyết học, thần kinh, tim-phổi, huyết thanh học) do lắng đọng phức hợp miễn dịch, gặp chủ yếu ở phụ nữ trẻ trong độ tuổi sinh sản.</p>`,
    chan_doan:`
      <div class="subhead">Tiêu chuẩn phân loại EULAR/ACR 2019 (điều kiện tiên quyết)</div>
      <p><b>ANA dương tính hiệu giá ≥1:80</b> là điều kiện bắt buộc để bắt đầu tính điểm phân loại; sau đó cộng điểm theo 10 nhóm tiêu chí lâm sàng-miễn dịch (mỗi nhóm chỉ tính điểm cao nhất) — <b>tổng ≥10 điểm</b> đủ tiêu chuẩn phân loại SLE.</p>
      <p>Các nhóm tiêu chí chính (điểm minh họa, không đầy đủ toàn bộ chi tiết): sốt (2đ), giảm bạch cầu/tiểu cầu (3-4đ), tổn thương da cấp/mạn tính (2-6đ), rụng tóc không sẹo (2đ), loét niêm mạc miệng/mũi (2đ), viêm khớp (6đ), viêm thanh dịch (5-6đ), tổn thương thận (viêm cầu thận lupus, 8-10đ theo type mô bệnh học), tổn thương thần kinh (co giật/loạn thần, 5-8đ), kháng thể kháng phospholipid, giảm bổ thể C3/C4, kháng thể đặc hiệu (anti-dsDNA, anti-Sm).</p>
      <div class="subhead">Xét nghiệm theo dõi hoạt động bệnh</div>
      <p><b>Anti-dsDNA</b> và <b>bổ thể C3/C4</b> là 2 dấu ấn theo dõi hoạt động bệnh hữu ích nhất — anti-dsDNA tăng + bổ thể giảm thường tương quan đợt bùng phát, đặc biệt viêm thận lupus. <b>Sinh thiết thận</b> bắt buộc khi có protein niệu ≥0.5g/24h hoặc cặn lắng nước tiểu hoạt động (trụ hồng cầu/bạch cầu) để phân loại type viêm thận lupus (I-VI theo ISN/RPS) và định hướng điều trị.</p>`,
    dieu_tri:`
      <div class="subhead">Nền tảng — mọi bệnh nhân SLE (bất kể mức độ nặng)</div>
      <p><b>Hydroxychloroquine</b> được khuyến cáo cho <b>tất cả</b> bệnh nhân SLE trừ chống chỉ định — giảm đợt bùng phát, cải thiện sống còn dài hạn, giảm tổn thương tích lũy cơ quan; khám mắt định kỳ tầm soát bệnh võng mạc (nguy cơ tăng theo thời gian dùng/liều tích lũy).</p>
      <div class="subhead">Bậc thang theo mức độ nặng/cơ quan tổn thương</div>
      <ul>
        <li><b>SLE nhẹ</b> (da, khớp, không tổn thương tạng lớn): hydroxychloroquine ± NSAID/corticosteroid liều thấp ± thêm methotrexate/azathioprine nếu cần kiểm soát thêm</li>
        <li><b>SLE trung bình-nặng</b> (viêm thận, thần kinh, huyết học nặng): corticosteroid liều cao cảm ứng (uống hoặc liều xung TM) + thuốc ức chế miễn dịch (mycophenolate mofetil hoặc cyclophosphamide cho viêm thận lupus tăng sinh) ± <b>belimumab</b> hoặc <b>anifrolumab</b> (sinh học nhắm đích, bổ sung nền hydroxychloroquine+corticosteroid) để giảm liều corticosteroid và giảm đợt bùng phát</li>
        <li><b>Viêm thận lupus tăng sinh (class III/IV):</b> cảm ứng bằng mycophenolate mofetil hoặc cyclophosphamide liều thấp (phác đồ Euro-Lupus) + corticosteroid, sau đó duy trì bằng mycophenolate hoặc azathioprine liều thấp hơn</li>
      </ul>
      <div class="alert-box alert-warn">EULAR 2023 nhấn mạnh mục tiêu <b>giảm liều corticosteroid xuống ≤5mg/ngày prednisone hoặc ngưng hẳn</b> khi có thể — corticosteroid liều duy trì cao kéo dài là yếu tố nguy cơ độc lập gây tổn thương tích lũy cơ quan không do bệnh lupus (loãng xương, đái tháo đường, nhiễm trùng, hoại tử vô mạch).</div>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Hydroxychloroquine","200-400mg/ngày (≤5mg/kg/ngày cân nặng thực)","khám mắt (OCT/thị trường) khi bắt đầu và định kỳ hàng năm sau 5 năm dùng"],
        ["Prednisone (cảm ứng đợt nặng)","0.5-1mg/kg/ngày → giảm dần nhanh nhất có thể xuống ≤5mg/ngày duy trì","bổ sung canxi-vitamin D, dự phòng loãng xương nếu dùng kéo dài"],
        ["Mycophenolate mofetil (viêm thận lupus)","cảm ứng 2-3g/ngày chia 2 lần → duy trì 1-2g/ngày","tránh thai kỳ (gây quái thai); theo dõi công thức máu"],
        ["Cyclophosphamide (phác đồ Euro-Lupus, viêm thận nặng)","500mg TM mỗi 2 tuần × 6 liều","bảo tồn khả năng sinh sản nếu còn trẻ; theo dõi công thức máu sát"],
        ["Belimumab (sinh học bổ sung)","10mg/kg TM mỗi 4 tuần (sau liều nạp) hoặc 200mg TDD/tuần","bổ sung nền HCQ+corticosteroid, không đơn trị thay thế"],
        ["Azathioprine (duy trì, thay thế thai kỳ)","1-2.5mg/kg/ngày","an toàn hơn mycophenolate trong thai kỳ nếu cần ức chế miễn dịch"]
      ])}
      <div class="age-tag">Phụ nữ trong độ tuổi sinh sản</div>
      <p>Tư vấn kế hoạch hóa gia đình bắt buộc — mycophenolate và cyclophosphamide gây quái thai, cần chuyển sang azathioprine/hydroxychloroquine (an toàn thai kỳ) trước khi có thai theo kế hoạch; kháng thể kháng phospholipid dương tính cần đánh giá nguy cơ huyết khối/biến chứng thai kỳ.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Hydroxychloroquine cho mọi bệnh nhân SLE trừ chống chỉ định",'<span class="badge badge-I">I</span>'],
        ["Sinh thiết thận khi có protein niệu≥0.5g/24h hoặc cặn lắng hoạt động",'<span class="badge badge-I">I</span>'],
        ["Mục tiêu giảm corticosteroid duy trì ≤5mg/ngày hoặc ngưng hẳn khi có thể",'<span class="badge badge-I">I</span>'],
        ["Mycophenolate/cyclophosphamide + corticosteroid cho viêm thận lupus tăng sinh",'<span class="badge badge-I">I</span>'],
        ["Duy trì corticosteroid liều cao dài hạn để kiểm soát bệnh ổn định",'<span class="badge badge-III">III</span>'],
        ["Mycophenolate trong thai kỳ",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"2019 EULAR/ACR Classification Criteria for SLE; EULAR 2023 Recommendations for the Management of SLE"
},
{
  spec:"co_xuong_khop", id:"ssc", emoji:"🧊", short:"Xơ cứng bì", title:"Xơ cứng bì hệ thống",
  guidelines:["ACR/EULAR 2013 (phân loại)","EULAR/EUSTAR 2017 (điều trị)"],
  sections:{
    dinh_nghia:`
      <p>Xơ cứng bì hệ thống (Systemic Sclerosis — SSc) là bệnh tự miễn hiếm gặp đặc trưng bởi xơ hóa da và nội tạng lan tỏa, bệnh lý vi mạch máu, và bất thường miễn dịch tự thân.</p>
      <div class="subhead">Phân thể lâm sàng</div>
      ${rt(["Đặc điểm"],[
        ["Thể da giới hạn (Limited cutaneous SSc)","Tổn thương da giới hạn ở đầu chi/mặt (xa gốc chi), thường có hội chứng CREST, nguy cơ tăng áp phổi độc lập cao hơn"],
        ["Thể da lan tỏa (Diffuse cutaneous SSc)","Tổn thương da lan rộng đến thân mình/gốc chi, tiến triển nhanh hơn, nguy cơ tổn thương nội tạng sớm (phổi, tim, thận) cao hơn"]
      ])}
      <p>Hội chứng <b>CREST</b>: Calcinosis (vôi hóa mô mềm), Raynaud phenomenon (hiện tượng Raynaud), Esophageal dysmotility (rối loạn vận động thực quản), Sclerodactyly (xơ cứng ngón tay), Telangiectasia (giãn mao mạch).</p>`,
    chan_doan:`
      <p>Tiêu chuẩn phân loại ACR/EULAR 2013 dựa điểm số: xơ da hai bàn tay lan đến khớp bàn-ngón (tiêu chí đủ, tự động phân loại) hoặc tổng hợp điểm từ nhiều tiêu chí (xơ ngón tay, tổn thương đầu ngón, giãn mao mạch, bất thường mao mạch nền móng, tăng áp phổi/bệnh phổi mô kẽ, hiện tượng Raynaud, tự kháng thể đặc hiệu SSc).</p>
      <div class="subhead">Tự kháng thể đặc hiệu — giá trị tiên lượng</div>
      ${rt(["Liên quan lâm sàng"],[
        ["Anti-centromere","Thường gặp thể da giới hạn, nguy cơ tăng áp phổi cao, tiến triển da chậm"],
        ["Anti-Scl-70 (anti-topoisomerase I)","Thường gặp thể da lan tỏa, nguy cơ bệnh phổi mô kẽ cao"],
        ["Anti-RNA polymerase III","Nguy cơ cơn xơ cứng bì-thận cấp cao, thường kèm thể da lan tỏa tiến triển nhanh"]
      ])}
      <div class="subhead">Tầm soát bắt buộc định kỳ (mọi bệnh nhân SSc)</div>
      <p>Đo chức năng hô hấp (hô hấp ký + DLCO) và siêu âm tim mỗi năm để tầm soát bệnh phổi mô kẽ và tăng áp động mạch phổi — hai biến chứng gây tử vong hàng đầu, thường tiến triển âm thầm không triệu chứng giai đoạn sớm.</p>`,
    dieu_tri:`
      <div class="subhead">Hiện tượng Raynaud & loét đầu ngón</div>
      <p><b>Chẹn kênh canxi dihydropyridine</b> (nifedipine) là điều trị đầu tay; thêm ức chế PDE-5 (sildenafil) hoặc thuốc đối kháng thụ thể endothelin (bosentan) nếu loét đầu ngón tái phát/kháng trị.</p>
      <div class="subhead">Bệnh phổi mô kẽ liên quan SSc (SSc-ILD)</div>
      <p><b>Mycophenolate mofetil</b> là điều trị đầu tay (hiệu quả tương đương cyclophosphamide nhưng dung nạp tốt hơn dài hạn); <b>nintedanib</b> (thuốc kháng xơ) được phê duyệt bổ sung làm chậm tiến triển giảm chức năng phổi; tocilizumab là lựa chọn khác ở bệnh có yếu tố viêm nổi trội.</p>
      <div class="subhead">Tăng áp động mạch phổi liên quan SSc (SSc-PAH)</div>
      <p>Điều trị theo phác đồ tăng áp phổi chuyên biệt (ức chế thụ thể endothelin, ức chế PDE-5, chủ vận thụ thể prostacyclin) — cần hội chẩn chuyên khoa tim mạch/hô hấp, thường phối hợp đa thuốc ngay từ đầu ở thể trung bình-nặng.</p>
      <div class="subhead">Cơn xơ cứng bì-thận cấp (Scleroderma Renal Crisis) — cấp cứu nội khoa</div>
      <div class="alert-box alert-danger">Biểu hiện: tăng huyết áp cấp tính mới xuất hiện + suy thận cấp tiến triển nhanh ở bệnh nhân SSc (đặc biệt thể da lan tỏa, anti-RNA polymerase III dương tính, dùng corticosteroid liều cao gần đây — <b>là yếu tố khởi phát cần tránh</b>). <b>ACEi (captopril)</b> là điều trị đặc hiệu cứu mạng, khởi động ngay khi nghi ngờ, chỉnh liều tăng nhanh theo đáp ứng huyết áp — KHÔNG trì hoãn chờ xác định chẩn đoán hoàn toàn.</div>
      <div class="subhead">Xơ cứng da</div>
      <p>Methotrexate có thể cải thiện nhẹ độ xơ da giai đoạn sớm-viêm; mycophenolate hoặc thuốc ức chế miễn dịch khác cân nhắc ở thể lan tỏa tiến triển nhanh.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Nifedipine (Raynaud)","30mg/ngày phóng thích chậm → tối đa 90mg/ngày","tác dụng phụ phù ngoại biên, đau đầu, hạ HA"],
        ["Mycophenolate mofetil (SSc-ILD)","2-3g/ngày chia 2 lần","tránh thai kỳ; theo dõi công thức máu"],
        ["Nintedanib (SSc-ILD, kháng xơ)","150mg × 2 lần/ngày","tác dụng phụ tiêu chảy thường gặp; theo dõi men gan"],
        ["Captopril (cơn thận cấp — KHÔNG TRÌ HOÃN)","6.25-12.5mg khởi đầu, tăng nhanh mỗi 4-8h đến khi kiểm soát HA","ACEi tác dụng ngắn ưu tiên trong cấp cứu để chỉnh liều linh hoạt nhanh"],
        ["Methotrexate (xơ da giai đoạn sớm)","15-25mg/tuần","bổ sung acid folic; tránh thai kỳ"]
      ])}
      <div class="age-tag">Mọi bệnh nhân SSc</div>
      <p>Tránh corticosteroid liều cao (&gt;15mg/ngày prednisone) không cần thiết, đặc biệt thể da lan tỏa — liên quan tăng nguy cơ khởi phát cơn xơ cứng bì-thận cấp; theo dõi huyết áp tại nhà định kỳ ở người nguy cơ cao (thể lan tỏa, anti-RNA pol III+).</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Tầm soát ILD/PAH hàng năm bằng hô hấp ký-DLCO và siêu âm tim ở mọi bệnh nhân SSc",'<span class="badge badge-I">I</span>'],
        ["ACEi khởi động ngay khi nghi cơn xơ cứng bì-thận cấp",'<span class="badge badge-I">I</span>'],
        ["Mycophenolate mofetil là điều trị đầu tay cho SSc-ILD",'<span class="badge badge-I">I</span>'],
        ["Nifedipine là điều trị đầu tay cho hiện tượng Raynaud",'<span class="badge badge-I">I</span>'],
        ["Corticosteroid liều cao (&gt;15mg/ngày) kéo dài không cần thiết, đặc biệt thể lan tỏa",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"2013 ACR/EULAR Classification Criteria for Systemic Sclerosis; EULAR/EUSTAR 2017 Recommendations for Treatment of Systemic Sclerosis"
},
{
  spec:"co_xuong_khop", id:"septic_arthritis", emoji:"🦠", short:"VK nhiễm trùng", title:"Viêm khớp nhiễm trùng",
  guidelines:["IDSA (tiếp cận chung)","BSR 2006 (còn tham chiếu)"],
  sections:{
    dinh_nghia:`
      <p>Viêm khớp nhiễm trùng là nhiễm trùng trong khoang khớp do vi khuẩn (thường gặp nhất), hiếm hơn do nấm/mycobacteria — là <b>cấp cứu cơ xương khớp thật sự</b> vì có thể phá hủy sụn khớp không hồi phục trong vòng 24-48 giờ nếu không được dẫn lưu và điều trị kháng sinh kịp thời.</p>
      <p>Đường lây: theo đường máu (thường gặp nhất ở người lớn), lan từ ổ nhiễm trùng lân cận (viêm xương tủy, nhiễm trùng mô mềm), hoặc trực tiếp sau chấn thương/thủ thuật khớp (tiêm nội khớp, phẫu thuật, thay khớp nhân tạo).</p>`,
    chan_doan:`
      <p><b>Chọc dò dịch khớp là bắt buộc và khẩn cấp</b> ở bất kỳ khớp sưng-nóng-đỏ-đau cấp tính nào nghi nhiễm trùng — không trì hoãn để chờ hình ảnh học. Gửi dịch khớp: đếm tế bào + công thức, nhuộm Gram, cấy vi khuẩn (kèm cấy máu), soi tinh thể (loại trừ gout/giả gout đồng mắc — có thể cùng tồn tại với nhiễm trùng).</p>
      ${rt(["Gợi ý"],[
        ["Bạch cầu dịch khớp &lt;25.000/mm³, có thể viêm không nhiễm trùng","Ít nghi nhiễm trùng nhưng không loại trừ hoàn toàn"],
        ["Bạch cầu dịch khớp 25.000–50.000/mm³","Nghi ngờ, cần đánh giá thêm theo bệnh cảnh lâm sàng"],
        ["Bạch cầu dịch khớp &gt;50.000/mm³, đa số đa nhân trung tính (&gt;90%)","Rất nghi ngờ viêm khớp nhiễm trùng — điều trị kinh nghiệm ngay trong khi chờ kết quả cấy"]
      ])}
      <div class="subhead">🧮 Tiêu chuẩn Kocher — hỗ trợ phân biệt viêm khớp nhiễm trùng háng với viêm khớp thoáng qua (chủ yếu áp dụng trẻ em, tham khảo thêm ở người lớn)</div>
      ${sc("kocher","Tiêu chuẩn Kocher (khớp háng)",[
        {label:"Không chịu được sức nặng (không đi lại được trên chân đó)",pts:1},
        {label:"Sốt &gt;38.5°C",pts:1},
        {label:"Bạch cầu máu &gt;12.000/mm³",pts:1},
        {label:"Tốc độ máu lắng (ESR) &gt;40mm/giờ",pts:1}
      ])}
      <p>0 yếu tố: nguy cơ nhiễm trùng thấp (&lt;2%). 4 yếu tố: nguy cơ rất cao (&gt;99% trong nghiên cứu gốc) — tuy vậy tiêu chuẩn này được xây dựng chủ yếu ở trẻ em, cần kết hợp CRP và đánh giá lâm sàng toàn diện, không thay thế chọc dò dịch khớp khi nghi ngờ lâm sàng cao.</p>`,
    dieu_tri:`
      <div class="subhead">Dẫn lưu khớp — can thiệp bắt buộc, song song kháng sinh</div>
      <p>Dẫn lưu mủ khớp là bắt buộc để giảm áp lực nội khớp và loại bỏ enzym phá hủy sụn — bằng chọc hút lặp lại, nội soi khớp rửa, hoặc phẫu thuật mở khớp dẫn lưu tùy vị trí khớp/mức độ đáp ứng (khớp háng thường cần can thiệp phẫu thuật sớm hơn do khó theo dõi/chọc hút lặp lại).</p>
      <div class="subhead">Kháng sinh kinh nghiệm ban đầu (trước kết quả cấy, điều chỉnh theo Gram/kháng sinh đồ)</div>
      ${rt(["Kháng sinh kinh nghiệm"],[
        ["Người lớn khỏe mạnh, không yếu tố nguy cơ đặc biệt","Vancomycin (phủ MRSA) — Staphylococcus aureus là nguyên nhân thường gặp nhất"],
        ["Nghi lậu cầu (người trẻ, hoạt động tình dục, tổn thương da kèm theo/viêm khớp di chuyển)","Ceftriaxone TM"],
        ["Nguy cơ trực khuẩn Gram âm (người cao tuổi, suy giảm miễn dịch, tiêm chích ma túy)","Vancomycin + cephalosporin thế hệ 3/4 hoặc kháng sinh phổ rộng phủ Gram âm"],
        ["Khớp nhân tạo nhiễm trùng","Hội chẩn ngoại khoa chỉnh hình sớm — thường cần tháo khớp nhân tạo/thay khớp thì 2, phác đồ kháng sinh kéo dài chuyên biệt"]
      ])}
      <p><b>Xuống thang</b> theo kết quả nhuộm Gram/cấy khi có, tổng thời gian điều trị thường <b>3–4 tuần</b> (2 tuần TM chuyển uống nếu đáp ứng tốt, tùy vi khuẩn và đáp ứng lâm sàng).</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Vancomycin","15-20mg/kg × 2 lần/ngày TM, chỉnh theo nồng độ đáy","theo dõi chức năng thận sát, đặc biệt người cao tuổi"],
        ["Ceftriaxone (nghi lậu cầu)","1-2g × 1 lần/ngày TM","kèm điều trị đồng nhiễm Chlamydia theo kinh nghiệm nếu nghi lậu cầu lan tỏa"],
        ["Cefepime (nghi Gram âm/Pseudomonas)","2g × 2-3 lần/ngày TM","chỉnh liều theo eGFR"],
        ["Chuyển kháng sinh uống (sau đáp ứng TM ban đầu)","theo kháng sinh đồ và độ nhạy, đủ sinh khả dụng đường uống","chỉ chuyển khi lâm sàng cải thiện rõ và đã xác định vi khuẩn/độ nhạy"]
      ])}
      <div class="age-tag">Người cao tuổi</div>
      <p>Triệu chứng viêm có thể kín đáo hơn (sốt nhẹ/không sốt), ngưỡng chọc dò khớp nên thấp; nguy cơ trực khuẩn Gram âm và đa vi khuẩn cao hơn — cân nhắc phổ kháng sinh rộng hơn kinh nghiệm ban đầu.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Chọc dò dịch khớp khẩn cấp ở mọi khớp sưng-nóng-đỏ cấp nghi nhiễm trùng",'<span class="badge badge-I">I</span>'],
        ["Dẫn lưu khớp (chọc hút lặp lại/nội soi/phẫu thuật) song song kháng sinh",'<span class="badge badge-I">I</span>'],
        ["Kháng sinh kinh nghiệm phủ MRSA (vancomycin) khi chưa có kết quả cấy",'<span class="badge badge-I">I</span>'],
        ["Trì hoãn chọc dò khớp để chờ chụp X-quang/MRI trước",'<span class="badge badge-III">III</span>'],
        ["Chỉ dùng kháng sinh đơn thuần không dẫn lưu ổ mủ khớp rõ",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"IDSA General Approach to Septic Arthritis; Kocher et al. J Bone Joint Surg 1999/2004 (Kocher Criteria)"
},
{
  spec:"co_xuong_khop", id:"ra", emoji:"🖐️", short:"VKDT", title:"Viêm khớp dạng thấp",
  guidelines:["ACR 2021","EULAR 2023"],
  sections:{
    dinh_nghia:`
      <p>Viêm khớp dạng thấp (RA) là bệnh tự miễn hệ thống mạn tính, gây viêm màng hoạt dịch đối xứng nhiều khớp nhỏ, có thể dẫn đến phá hủy khớp và biến chứng ngoài khớp nếu không kiểm soát sớm.</p>`,
    chan_doan:`
      <p>Tiêu chuẩn phân loại ACR/EULAR 2010 dựa điểm số: số khớp tổn thương, huyết thanh học (RF, anti-CCP), chỉ số viêm (CRP/ESR), thời gian triệu chứng ≥6 tuần. <b>Anti-CCP</b> đặc hiệu hơn RF cho chẩn đoán và tiên lượng nặng.</p>
      <div class="alert-box alert-info">Nguyên tắc cốt lõi: chẩn đoán và điều trị <b>càng sớm càng tốt</b> ("window of opportunity") để ngăn tổn thương khớp không hồi phục — trì hoãn &gt;3–6 tháng làm giảm đáng kể khả năng đạt lui bệnh.</div>`,
    dieu_tri:`
      <div class="subhead">Chiến lược Treat-to-Target</div>
      <p>Mục tiêu <b>lui bệnh</b> (hoặc hoạt động bệnh thấp nếu bệnh lâu năm khó lui hoàn toàn), đánh giá hoạt động bệnh định kỳ (DAS28, CDAI) mỗi 1–3 tháng và điều chỉnh thuốc tích cực cho đến đạt mục tiêu.</p>
      <div class="subhead">Bậc thang điều trị (ACR 2021)</div>
      <ul>
        <li><b>Bước 1:</b> <b>Methotrexate</b> đơn trị là DMARD khởi đầu ưu tiên hàng đầu (trừ chống chỉ định), khởi liều 15mg/tuần, tăng đến 25mg/tuần nếu dung nạp</li>
        <li><b>Bước 2</b> (không đạt mục tiêu sau 3 tháng dù đã tối ưu methotrexate): thêm DMARD sinh học (bDMARD — anti-TNF, abatacept, tocilizumab, rituximab) hoặc DMARD nhắm đích tổng hợp (tsDMARD — thuốc ức chế JAK)</li>
        <li>Corticosteroid liều thấp/ngắn hạn có thể dùng như cầu nối trong lúc chờ DMARD nền có tác dụng, <b>không dùng thay thế DMARD dài hạn</b></li>
      </ul>
      <div class="alert-box alert-warn">Thuốc ức chế JAK (tofacitinib, baricitinib, upadacitinib): cảnh báo hộp đen (boxed warning) tăng nguy cơ biến cố tim mạch nặng, huyết khối, ung thư và tử vong ở người ≥50 tuổi có ≥1 yếu tố nguy cơ tim mạch (nghiên cứu ORAL Surveillance) — cân nhắc kỹ trước khi chọn, ưu tiên bDMARD nếu có yếu tố nguy cơ này.</div>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">Sàng lọc lao tiềm ẩn và viêm gan B/C trước khởi động sinh học/JAK inhibitor; tiêm đủ vắc-xin (không sống) trước khi bắt đầu ức chế miễn dịch.</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Methotrexate","khởi đầu 15mg/tuần (uống/TDD) → tối đa 25mg/tuần","bổ sung acid folic 1mg/ngày (trừ ngày dùng MTX) giảm độc tính"],

      ])}`,
    khuyen_cao:`
      ${rt(["Mức"],[

{
  spec:"co_xuong_khop", id:"oa", emoji:"🦴", short:"THK", title:"Thoái hóa khớp",
  guidelines:["ACR/AF 2019 + cập nhật 2024","OARSI 2019"],
  sections:{
    dinh_nghia:`
      <p>Thoái hóa khớp (OA) là bệnh khớp thoái hóa mạn tính phổ biến nhất, đặc trưng bởi mất sụn khớp, xơ xương dưới sụn, tạo gai xương, thường gặp ở khớp gối, háng, bàn tay, cột sống.</p>`,
    chan_doan:`
      <p>Chẩn đoán chủ yếu <b>dựa lâm sàng</b>: đau khớp cơ học (tăng khi vận động/chịu lực, giảm khi nghỉ), cứng khớp buổi sáng &lt;30 phút, tuổi thường &gt;45. X-quang hỗ trợ xác nhận (hẹp khe khớp, gai xương, xơ xương dưới sụn) nhưng <b>mức độ tổn thương X-quang không nhất thiết tương xứng mức độ đau</b> — không cần chụp X-quang thường quy nếu lâm sàng đã điển hình.</p>`,
    dieu_tri:`
      <div class="subhead">Nền tảng — không dùng thuốc (khuyến cáo mạnh nhất, ưu tiên hàng đầu)</div>
      <ul>
        <li><b>Tập thể dục</b> (aerobic, tăng cường cơ, thể dục dưới nước) — bằng chứng mạnh nhất trong mọi can thiệp OA gối/háng</li>
        <li>Giảm cân nếu thừa cân/béo phì (giảm ≥5–10% cân nặng cải thiện rõ triệu chứng)</li>
        <li>Chương trình tự quản lý, vật lý trị liệu, dụng cụ hỗ trợ (gậy, nẹp gối) khi cần</li>
      </ul>
      <div class="subhead">Điều trị thuốc</div>
      <ul>
        <li><b>NSAID bôi tại chỗ</b> là lựa chọn hàng đầu cho OA gối/tay (hiệu quả tương đương uống, ít tác dụng phụ toàn thân) — ưu tiên đặc biệt ở người cao tuổi</li>
        <li><b>NSAID uống</b> khi bôi tại chỗ không đủ hiệu quả, dùng liều thấp nhất-thời gian ngắn nhất có hiệu quả</li>
        <li>Tiêm corticosteroid nội khớp: giảm đau ngắn hạn (vài tuần), có thể lặp lại nhưng hạn chế tần suất</li>
      </ul>
      <div class="alert-box alert-danger">ACR 2019/2024 khuyến cáo <b>mạnh phản đối</b>: glucosamine/chondroitin, tiêm huyết tương giàu tiểu cầu (PRP), và opioid thường quy cho OA — bằng chứng hiệu quả không nhất quán/không vượt trội so nguy cơ.</div>
      <p>Thay khớp toàn phần (gối/háng) khi đau/hạn chế chức năng nặng dai dẳng dù đã điều trị nội khoa tối ưu.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">NSAID uống ở người cao tuổi: nguy cơ xuất huyết tiêu hóa, suy thận, biến cố tim mạch tăng theo tuổi — ưu tiên tại chỗ, nếu dùng uống cần phối hợp PPI và dùng thời gian ngắn nhất.</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Diclofenac gel 1%","bôi tại chỗ × 4 lần/ngày (khớp nhỏ) hoặc 2 lần/ngày (gel 2%)","tác dụng phụ tại chỗ (kích ứng da) thay vì toàn thân"],
        ["Naproxen (uống)","250–500mg × 2 lần/ngày","thận trọng bệnh tim mạch/thận/tiêu hóa ở người cao tuổi"],
        ["Celecoxib (COX-2 chọn lọc)","100–200mg × 1–2 lần/ngày","ít biến cố tiêu hóa hơn NSAID cổ điển, vẫn thận trọng tim mạch"],
        ["Acetaminophen/Paracetamol","tối đa 3g/ngày (giảm liều ở gan yếu)","hiệu quả khiêm tốn hơn NSAID nhưng an toàn hơn nếu chống chỉ định NSAID"],
        ["Triamcinolone tiêm khớp gối","40mg/lần, hạn chế ≤3–4 lần/năm/khớp","tránh tiêm quá thường xuyên (nguy cơ tổn thương sụn)"]
      ])}`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Tập thể dục và giảm cân là điều trị nền tảng, ưu tiên hàng đầu",'<span class="badge badge-I">I</span>'],
        ["NSAID bôi tại chỗ ưu tiên hơn uống, đặc biệt người cao tuổi",'<span class="badge badge-I">I</span>'],
        ["Tiêm corticosteroid nội khớp giảm đau ngắn hạn",'<span class="badge badge-IIa">IIa</span>'],
        ["Glucosamine/chondroitin",'<span class="badge badge-III">III</span>'],
        ["Tiêm huyết tương giàu tiểu cầu (PRP) thường quy",'<span class="badge badge-III">III</span>'],
        ["Opioid thường quy cho OA mạn tính",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"2019 ACR/Arthritis Foundation Guideline for OA Management (Hand, Hip, Knee) + 2024 focused update; OARSI 2019 Guidelines"

{
  spec:"co_xuong_khop", id:"osteoporosis", emoji:"🦴", short:"Loãng xương", title:"Loãng xương",
  guidelines:["AACE/ACE 2020","ES 2019 (Sau mãn kinh)"],
  sections:{
    dinh_nghia:`
      <p>Loãng xương là bệnh xương chuyển hóa đặc trưng bởi giảm mật độ khoáng xương và suy giảm vi cấu trúc xương, làm tăng nguy cơ gãy xương.</p>
      <div class="subhead">Phân loại theo T-score (DXA, cổ xương đùi/cột sống thắt lưng)</div>
      ${rt(["T-score"],[
        ["Bình thường","≥ −1.0"],
        ["Thiếu xương (Osteopenia)","−1.0 đến −2.5"],
        ["Loãng xương","≤ −2.5"],
        ["Loãng xương nặng","≤ −2.5 kèm ≥1 gãy xương do loãng xương"]
      ])}`,
    chan_doan:`
      <p>Đo mật độ xương (DXA) cho: phụ nữ ≥65 tuổi, nam ≥70 tuổi, hoặc trẻ hơn kèm yếu tố nguy cơ (gãy xương sau chấn thương nhẹ, dùng corticosteroid kéo dài, mãn kinh sớm, tiền sử gia đình gãy xương háng).</p>
      <p>Công cụ <b>FRAX</b> ước tính nguy cơ gãy xương 10 năm (gãy xương lớn do loãng xương và gãy xương háng), kết hợp T-score với tuổi, BMI, yếu tố nguy cơ lâm sàng — hỗ trợ quyết định điều trị ở nhóm thiếu xương ranh giới.</p>`,
    dieu_tri:`
      <div class="subhead">Nền tảng cho mọi bệnh nhân</div>
      <p>Đủ canxi (1000–1200mg/ngày qua ăn uống ưu tiên hơn bổ sung), vitamin D (đích 25(OH)D ≥30 ng/mL), tập thể dục chịu trọng lực và tăng cường cơ, ngừng hút thuốc/hạn chế rượu, phòng ngừa té ngã.</p>
      <div class="subhead">Chỉ định điều trị thuốc</div>
      <p>T-score ≤ −2.5, hoặc đã có gãy xương do loãng xương (cột sống/háng), hoặc thiếu xương kèm nguy cơ FRAX cao (gãy xương lớn ≥20% hoặc gãy háng ≥3% trong 10 năm).</p>
      <div class="subhead">Lựa chọn thuốc theo mức độ nguy cơ</div>
      <ul>
        <li><b>Nguy cơ cao thông thường:</b> Bisphosphonate uống (alendronate, risedronate) là hàng đầu — hiệu quả, chi phí thấp, bằng chứng lâu dài</li>
        <li><b>Nguy cơ rất cao</b> (gãy xương gần đây, nhiều yếu tố nguy cơ, T-score rất thấp ≤ −3.0): ưu tiên khởi đầu bằng thuốc <b>đồng hóa xương</b> (teriparatide, abaloparatide, hoặc romosozumab) trước, sau đó chuyển sang bisphosphonate/denosumab để duy trì — chiến lược "anabolic-first" cho hiệu quả chống gãy xương tốt hơn thứ tự ngược lại</li>
        <li><b>Denosumab</b>: lựa chọn khi chống chỉ định/không dung nạp bisphosphonate (đặc biệt suy thận nặng) — <b>không được ngưng đột ngột</b> vì gây tăng nguy cơ gãy xương cột sống dội ngược, cần chuyển tiếp bằng bisphosphonate khi ngưng</li>
      </ul>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-danger">Biến chứng hiếm nhưng cần cảnh giác khi dùng bisphosphonate/denosumab dài hạn (thường &gt;5 năm): hoại tử xương hàm, gãy xương đùi không điển hình — đánh giá lại lợi ích/nguy cơ định kỳ, cân nhắc "kỳ nghỉ thuốc" (drug holiday) sau 3–5 năm ở nguy cơ không quá cao.</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Alendronate","70mg uống × 1 lần/tuần","uống lúc đói, ngồi/đứng thẳng ≥30 phút sau uống; tránh nếu eGFR&lt;35"],
        ["Risedronate","35mg uống × 1 lần/tuần","tương tự alendronate"],
        ["Zoledronic acid (TM)","5mg truyền TM × 1 lần/năm","bù đủ canxi/vitamin D trước truyền; tránh nếu eGFR&lt;35"],
        ["Denosumab (TDD)","60mg TDD mỗi 6 tháng","không ngưng đột ngột; theo dõi canxi máu, đặc biệt suy thận"],
        ["Teriparatide (đồng hóa xương)","20mcg TDD/ngày, tối đa 2 năm dùng trọn đời","chống chỉ định tiền sử ung thư xương/Paget/tia xạ xương"],
        ["Romosozumab","210mg TDD/tháng × 12 tháng","chống chỉ định nếu tiền sử nhồi máu cơ tim/đột quỵ trong 1 năm qua"],
        ["Canxi + Vitamin D3","canxi 1000-1200mg + vitamin D 800-2000 IU/ngày","chỉnh liều vitamin D theo nồng độ 25(OH)D đo được"]
      ])}`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Bisphosphonate uống là điều trị hàng đầu cho loãng xương nguy cơ thông thường",'<span class="badge badge-I">I</span>'],
        ["Ưu tiên thuốc đồng hóa xương trước ở nhóm nguy cơ gãy xương rất cao",'<span class="badge badge-IIa">IIa</span>'],
        ["Chuyển tiếp bằng bisphosphonate khi ngưng denosumab",'<span class="badge badge-I">I</span>'],
        ["Đo FRAX hỗ trợ quyết định điều trị ở nhóm thiếu xương ranh giới",'<span class="badge badge-I">I</span>'],
        ["Ngưng denosumab đột ngột không chuyển tiếp thuốc khác",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"AACE/ACE 2020 Clinical Practice Guidelines for Postmenopausal Osteoporosis; Endocrine Society 2019 Guideline"

{
  spec:"than", id:"ckd", emoji:"🫘", short:"BTM", title:"Bệnh thận mạn (CKD)",
  guidelines:["KDIGO 2024"],
  sections:{
    dinh_nghia:`
      <p>Bệnh thận mạn (CKD) là bất thường cấu trúc/chức năng thận kéo dài <b>&gt;3 tháng</b>, ảnh hưởng sức khỏe, được xác định bằng eGFR &lt;60 mL/phút/1.73m² và/hoặc dấu ấn tổn thương thận (albumin niệu, bất thường cặn lắng nước tiểu, bất thường hình ảnh học/mô bệnh học).</p>
      <div class="subhead">Phân độ theo eGFR (G) — KDIGO</div>
      ${rt(["eGFR (mL/phút/1.73m²)"],[
        ["G1","≥90 (kèm dấu ấn tổn thương thận)"],
        ["G2","60–89 (kèm dấu ấn tổn thương thận)"],
        ["G3a","45–59"],
        ["G3b","30–44"],
        ["G4","15–29"],
        ["G5","&lt;15 (bệnh thận giai đoạn cuối)"]
      ])}
      <div class="subhead">Phân độ theo albumin niệu (A)</div>
      ${rt(["ACR (mg/g hoặc mg/mmol)"],[
        ["A1 – Bình thường/nhẹ","&lt;30 mg/g (&lt;3 mg/mmol)"],
        ["A2 – Tăng trung bình","30–300 mg/g (3–30 mg/mmol)"],
        ["A3 – Tăng nặng","&gt;300 mg/g (&gt;30 mg/mmol)"]
      ])}
      <p>Nguy cơ tiến triển/biến chứng tăng dần theo tổ hợp G×A (bản đồ nhiệt KDIGO "heat map") — G3a-A1 nguy cơ thấp-trung bình, trong khi G1-A3 hoặc G4-A2 trở lên đã ở mức nguy cơ cao-rất cao dù eGFR còn khá.</p>`,
    chan_doan:`
      <p>Chẩn đoán cần <b>lặp lại xét nghiệm cách nhau ≥3 tháng</b> để xác nhận tính mạn tính (loại trừ tổn thương thận cấp). Đánh giá gồm: creatinine máu → tính eGFR (công thức CKD-EPI 2021, không dùng hệ số hiệu chỉnh chủng tộc), tỷ lệ albumin/creatinine niệu (uACR) mẫu nước tiểu buổi sáng, siêu âm thận khi nghi bất thường cấu trúc/tắc nghẽn.</p>
      <div class="alert-box alert-info"><b>KDIGO 2024:</b> khuyến cáo tầm soát CKD định kỳ hàng năm (eGFR + uACR) ở người có yếu tố nguy cơ: đái tháo đường, tăng huyết áp, bệnh tim mạch, tiền sử gia đình suy thận, tuổi cao, từng tổn thương thận cấp.</p>
      <p>Xác định nguyên nhân nền (đái tháo đường, tăng huyết áp, viêm cầu thận, bệnh thận đa nang...) để định hướng điều trị đặc hiệu; sinh thiết thận khi nguyên nhân không rõ ràng hoặc nghi bệnh cầu thận nguyên phát.</p>`,
    dieu_tri:`
      <div class="subhead">Bước 1 — Kiểm soát huyết áp & ức chế hệ RAAS (nền tảng, mọi bệnh nhân có albumin niệu)</div>
      <p><b>ACEi hoặc ARB</b> (không phối hợp cả hai) là điều trị nền tảng khi có albumin niệu ≥A2, chỉnh liều tối đa dung nạp được. Đích HA tâm thu &lt;120mmHg (đo chuẩn hóa) theo KDIGO 2024 ở hầu hết bệnh nhân CKD không đái tháo đường có nguy cơ tim mạch cao, trừ khi không dung nạp.</p>
      <div class="subhead">Bước 2 — Ức chế SGLT2 (khuyến cáo mới, mở rộng chỉ định)</div>
      <p><b>SGLT2i</b> (dapagliflozin, empagliflozin) được khuyến cáo cho mọi bệnh nhân CKD có eGFR ≥20 mL/phút/1.73m² kèm albumin niệu ≥A2, <b>bất kể có đái tháo đường hay không</b> — giảm tiến triển CKD, biến cố tim mạch và tử vong (DAPA-CKD, EMPA-KIDNEY).</p>
      <div class="subhead">Bước 3 — Finerenone (đối kháng thụ thể mineralocorticoid không steroid)</div>
      <p>Thêm <b>finerenone</b> ở bệnh nhân CKD kèm đái tháo đường típ 2, albumin niệu dai dẳng dù đã tối ưu ACEi/ARB + SGLT2i, eGFR ≥25 và kali máu bình thường — giảm thêm biến cố thận và tim mạch (FIDELIO-DKD, FIGARO-DKD).</p>
      <div class="subhead">Các biện pháp bổ trợ</div>
      <ul>
        <li>Statin cường độ trung bình-cao cho hầu hết người lớn CKD (nguy cơ tim mạch cao)</li>
        <li>Hạn chế protein khẩu phần vừa phải (0.8g/kg/ngày) ở CKD tiến triển không lọc máu, tránh hạn chế quá mức gây suy dinh dưỡng</li>
        <li>Tránh thuốc độc thận (NSAID, cản quang liều cao không cần thiết, aminoglycoside) và điều chỉnh liều thuốc theo eGFR</li>
        <li>Chuyển chuyên khoa thận khi eGFR &lt;30, tiến triển nhanh (giảm eGFR &gt;5/năm), albumin niệu nặng A3, hoặc bất thường điện giải khó kiểm soát</li>
      </ul>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">Theo dõi kali máu và creatinine 1–2 tuần sau khởi động/tăng liều ACEi-ARB, SGLT2i, hoặc finerenone — tăng creatinine &lt;30% so nền là chấp nhận được (phản ánh hiệu ứng huyết động có lợi), không phải lý do ngưng thuốc.</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Losartan/Enalapril (ACEi/ARB)","khởi đầu thấp, tăng dần mỗi 2–4 tuần đến liều tối đa dung nạp","ngưng nếu kali&gt;5.5 dai dẳng hoặc creatinine tăng&gt;30%"],
        ["Dapagliflozin","10mg × 1 lần/ngày","hiệu quả bảo vệ thận vẫn còn đến eGFR thấp; ngưng tạm thời khi bệnh cấp tính/nhịn ăn kéo dài (nguy cơ nhiễm toan ceton)"],
        ["Empagliflozin","10mg × 1 lần/ngày","tương tự dapagliflozin"],
        ["Finerenone","10mg/ngày nếu eGFR 25–&lt;60, 20mg/ngày nếu eGFR≥60 → tăng đến 20mg/ngày","kiểm tra kali máu trước và sau khởi động; chống chỉ định kali&gt;5.0"],
        ["Atorvastatin","20–40mg/ngày","không cần chỉnh liều nhiều theo eGFR (chuyển hóa gan)"]
      ])}
      <div class="age-tag">Người cao tuổi</div>
      <p>Cân nhắc lợi ích/nguy cơ điều trị tích cực ở người rất cao tuổi/nhiều bệnh đồng mắc — mục tiêu có thể cá thể hóa (ít nghiêm ngặt hơn) nếu kỳ vọng sống hạn chế hoặc nguy cơ tác dụng phụ (hạ HA, tổn thương thận cấp) vượt lợi ích.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["ACEi/ARB liều tối đa dung nạp khi có albumin niệu ≥A2",'<span class="badge badge-I">I</span>'],
        ["SGLT2i cho CKD có albumin niệu, bất kể có ĐTĐ hay không, eGFR≥20",'<span class="badge badge-I">I</span>'],
