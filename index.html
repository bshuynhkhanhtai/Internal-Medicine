{
  spec:"ho_hap", id:"bronchitis", emoji:"🤧", short:"VPQ cấp", title:"Viêm phế quản cấp",
  guidelines:["ACP/CDC/ATS 2016","BTS"],
  sections:{
    dinh_nghia:`
      <p>Viêm phế quản cấp là tình trạng viêm cấp tính đường thở lớn, biểu hiện chủ yếu bằng <b>ho cấp tính kéo dài (thường 1–3 tuần, có thể đến 3 tuần ở người khỏe mạnh)</b>, thường do <b>virus</b> (&gt;90% trường hợp ở người lớn khỏe mạnh không có bệnh phổi nền), ho có thể kèm khạc đờm nhưng không nhất thiết.</p>
      <div class="alert-box alert-info">Phân biệt với viêm phổi: viêm phế quản cấp <b>không có</b> tổn thương thâm nhiễm mới trên X-quang ngực, không sốt cao kéo dài, không có ran nổ khu trú/hội chứng đông đặc rõ trên khám.</div>`,
    chan_doan:`
      <p>Chẩn đoán chủ yếu lâm sàng — ho cấp tính ± khạc đờm, có thể kèm khò khè nhẹ do co thắt phế quản phản ứng, không sốt cao kéo dài, khám phổi không có ran nổ khu trú.</p>
      <div class="alert-box alert-danger">Chỉ định chụp X-quang ngực để loại trừ viêm phổi khi có: sốt &gt;38°C kéo dài, mạch &gt;100/phút, nhịp thở &gt;24/phút, ran nổ/giảm rì rào phế nang khu trú khi khám, hoặc SpO2 giảm — các dấu hiệu này gợi ý viêm phổi thay vì viêm phế quản đơn thuần.</div>
      <p>Không cần xét nghiệm vi sinh thường quy trừ nghi cúm mùa (test nhanh cúm trong mùa dịch, đặc biệt nếu cân nhắc thuốc kháng virus) hoặc nghi ho gà (PCR) khi có tiếp xúc dịch tễ/ho kịch phát điển hình.</p>`,
    dieu_tri:`
      <div class="alert-box alert-danger"><b>KHÔNG kê kháng sinh thường quy</b> cho viêm phế quản cấp ở người lớn khỏe mạnh không có bệnh phổi nền — đây là khuyến cáo mạnh của ACP/CDC/ATS 2016, vì &gt;90% do virus, kháng sinh không rút ngắn thời gian bệnh nhưng góp phần đề kháng kháng sinh và tác dụng phụ không cần thiết. Đây là một trong những nguyên nhân kê đơn kháng sinh không phù hợp phổ biến nhất.</div>
      <div class="subhead">Điều trị triệu chứng (nền tảng)</div>
      <ul>
        <li>Thuốc giảm ho khi ho nhiều ảnh hưởng sinh hoạt/giấc ngủ (dextromethorphan); mật ong có bằng chứng giảm ho nhẹ-trung bình ở người lớn</li>
        <li>Thuốc giãn phế quản hít (SABA) nếu có khò khè rõ do co thắt phế quản phản ứng đi kèm</li>
        <li>Giảm đau-hạ sốt (paracetamol/NSAID) nếu cần; bù đủ nước</li>
      </ul>
      <div class="subhead">Trường hợp cân nhắc kháng sinh</div>
      <ul>
        <li>Nghi ho gà (Bordetella pertussis) — macrolide (azithromycin) giúp giảm lây truyền dù ít thay đổi diễn tiến triệu chứng nếu đã trễ &gt;1-2 tuần</li>
        <li>Đợt cấp trên nền COPD/giãn phế quản có đủ tiêu chuẩn Anthonisen — xem bài "COPD"</li>
        <li>Nghi cúm trong 48h đầu ở người nguy cơ cao biến chứng: oseltamivir</li>
      </ul>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Dextromethorphan","10-20mg mỗi 4h hoặc 30mg mỗi 6-8h, tối đa 120mg/ngày","tránh phối hợp MAOI"],
        ["Salbutamol (nếu khò khè)","100-200mcg xịt khi cần, tối đa 4 lần/ngày","chỉ dùng khi có bằng chứng co thắt phế quản rõ"],
        ["Azithromycin (nghi ho gà)","500mg ngày 1 → 250mg ngày 2-5","hiệu quả giảm lây truyền tốt nhất nếu dùng trong 1-2 tuần đầu triệu chứng"],
        ["Oseltamivir (nghi cúm, trong 48h đầu, nguy cơ cao)","75mg × 2 lần/ngày × 5 ngày","chỉnh liều theo eGFR nếu suy thận"]
      ])}
      <div class="age-tag">Người cao tuổi/bệnh phổi nền</div>
      <p>Ngưỡng chỉ định chụp X-quang ngực và cân nhắc kháng sinh nên thấp hơn ở người cao tuổi, COPD, suy tim, suy giảm miễn dịch — nhóm này dễ diễn tiến viêm phổi thật sự hoặc đợt cấp COPD cần kháng sinh.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Không kê kháng sinh thường quy cho viêm phế quản cấp ở người lớn khỏe mạnh",'<span class="badge badge-III">III</span>'],
        ["Chụp X-quang ngực khi có dấu hiệu sinh tồn bất thường/nghe phổi bất thường khu trú",'<span class="badge badge-I">I</span>'],
        ["Điều trị triệu chứng là nền tảng chính",'<span class="badge badge-I">I</span>'],
        ["Macrolide khi nghi ho gà trong giai đoạn sớm",'<span class="badge badge-I">I</span>']
      ])}`
  },
  source:"ACP/CDC/ATS 2016 Advice on Antibiotic Use for Acute Respiratory Tract Infection in Adults, Ann Intern Med"
},
{
  spec:"ho_hap", id:"pcp", emoji:"🫧", short:"PCP", title:"Viêm phổi do Pneumocystis (PCP)",
  guidelines:["IDSA/HIVMA 2024 (Cơ hội nhiễm trùng ở HIV)"],
  sections:{
    dinh_nghia:`
      <p>Viêm phổi do <i>Pneumocystis jirovecii</i> (PCP, trước đây gọi PCP = Pneumocystis carinii pneumonia) là nhiễm trùng cơ hội nặng gặp ở người <b>suy giảm miễn dịch tế bào</b> — kinh điển nhất ở người nhiễm HIV có CD4&lt;200 tế bào/µL chưa điều trị/dự phòng, nhưng ngày càng gặp nhiều ở người không nhiễm HIV dùng corticosteroid kéo dài liều cao, hóa trị, ghép tạng, thuốc sinh học ức chế miễn dịch mạnh.</p>`,
    chan_doan:`
      <p>Bệnh cảnh kinh điển: khởi phát <b>bán cấp</b> (vài ngày-vài tuần, khác CAP điển hình khởi phát cấp) với sốt, ho khan, khó thở tăng dần khi gắng sức, <b>giảm oxy máu không tương xứng</b> với mức độ tổn thương thấy trên X-quang thường quy.</p>
      <div class="subhead">Cận lâm sàng</div>
      ${rt(["Đặc điểm"],[
        ["X-quang ngực","Thâm nhiễm mô kẽ lan tỏa 2 bên, có thể bình thường giai đoạn sớm"],
        ["CT ngực độ phân giải cao","Kính mờ lan tỏa 2 bên — nhạy hơn X-quang thường quy, hữu ích khi X-quang chưa rõ"],
        ["LDH máu","Thường tăng cao — không đặc hiệu nhưng gợi ý và có giá trị tiên lượng"],
        ["Beta-D-glucan huyết thanh","Độ nhạy cao, hỗ trợ chẩn đoán không xâm lấn khi dương tính (không đặc hiệu tuyệt đối cho PCP)"],
        ["Nhuộm/PCR đờm khạc hoặc dịch rửa phế quản-phế nang (BAL)","Xác định P. jirovecii — BAL có độ nhạy cao hơn đờm khạc đáng kể, cần thiết nếu đờm âm tính mà lâm sàng vẫn nghi ngờ cao"]
      ])}`,
    dieu_tri:`
      <div class="subhead">Điều trị đặc hiệu — hàng đầu cho mọi mức độ nặng</div>
      <p><b>TMP-SMX (Trimethoprim-Sulfamethoxazole) liều cao</b> là điều trị đầu tay cho cả thể nhẹ-trung bình lẫn nặng, đường uống nếu nhẹ-trung bình dung nạp được, đường tĩnh mạch nếu nặng/không hấp thu tốt qua đường tiêu hóa. Tổng thời gian điều trị <b>21 ngày</b>.</p>
      <div class="subhead">Lựa chọn thay thế khi không dung nạp/dị ứng TMP-SMX</div>
      <ul>
        <li><b>Thể nhẹ-trung bình:</b> dapsone + trimethoprim, hoặc clindamycin + primaquine, hoặc atovaquone</li>
        <li><b>Thể nặng:</b> pentamidine tĩnh mạch, hoặc clindamycin + primaquine</li>
      </ul>
      <div class="subhead">Corticosteroid bổ trợ — chỉ định quan trọng khi thiếu oxy máu nặng</div>
      <p><b>Corticosteroid phụ trợ sớm (trong vòng 72h)</b> khi PaO2&lt;70mmHg khí phòng hoặc chênh áp oxy phế nang-động mạch (A-a gradient) &gt;35mmHg — giảm nguy cơ suy hô hấp cấp/tử vong đáng kể, cần bắt đầu <b>đồng thời hoặc trước</b> kháng sinh đặc hiệu, không chờ.</p>
      <div class="subhead">Dự phòng — quan trọng không kém điều trị</div>
      <p>Dự phòng tiên phát/thứ phát bằng TMP-SMX liều thấp ở người HIV có CD4&lt;200, hoặc người dùng corticosteroid kéo dài (prednisone≥20mg/ngày &gt;1 tháng) kèm yếu tố nguy cơ suy giảm miễn dịch khác, hoặc sau ghép tạng — duy trì đến khi CD4 phục hồi bền vững &gt;200 (ở HIV) hoặc hết giai đoạn ức chế miễn dịch mạnh.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">TMP-SMX liều cao thường gây tác dụng phụ: phát ban, sốt do thuốc, giảm bạch cầu/tiểu cầu, tăng kali máu, tăng creatinine giả (ức chế bài tiết ống thận, không phản ánh giảm GFR thật) — theo dõi công thức máu và điện giải trong quá trình điều trị.</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["TMP-SMX (điều trị)","15-20mg/kg/ngày thành phần trimethoprim, chia 3-4 lần × 21 ngày","chỉnh liều theo CrCl nếu suy thận; bù đủ nước tránh tinh thể niệu"],
        ["Prednisone (bổ trợ, PaO2&lt;70mmHg)","40mg×2/ngày (ngày 1-5) → 40mg/ngày (ngày 6-10) → 20mg/ngày (ngày 11-21)","bắt đầu cùng lúc/trước kháng sinh đặc hiệu, không trì hoãn"],
        ["Pentamidine TM (thể nặng, không dung nạp TMP-SMX)","4mg/kg/ngày TM truyền chậm","theo dõi hạ đường huyết, rối loạn nhịp tim, viêm tụy, độc thận"],
        ["Clindamycin + Primaquine (thay thế)","Clindamycin 600mg×3/ngày + Primaquine 30mg/ngày","kiểm tra G6PD trước dùng primaquine (nguy cơ tán huyết)"],
        ["TMP-SMX (dự phòng tiên phát/thứ phát)","1 viên đơn (single-strength) hoặc 1 viên kép (double-strength) × 1 lần/ngày, hoặc 3 lần/tuần","liều thấp hơn nhiều so liều điều trị, dung nạp tốt hơn"]
      ])}
      <div class="age-tag">Suy giảm miễn dịch không do HIV</div>
      <p>Ngưỡng nghi ngờ PCP nên thấp ở người dùng corticosteroid kéo dài/hóa trị/sinh học ức chế miễn dịch có triệu chứng hô hấp bán cấp không giải thích được — tỷ lệ tử vong PCP ở nhóm không HIV thường <b>cao hơn</b> nhóm HIV do chẩn đoán trễ và đáp ứng viêm mạnh hơn.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["TMP-SMX liều cao là điều trị đầu tay cho mọi mức độ nặng",'<span class="badge badge-I">I</span>'],
        ["Corticosteroid bổ trợ sớm khi PaO2&lt;70mmHg hoặc A-a gradient&gt;35mmHg",'<span class="badge badge-I">I</span>'],
        ["Dự phòng TMP-SMX ở người HIV CD4&lt;200 hoặc dùng corticosteroid kéo dài liều cao",'<span class="badge badge-I">I</span>'],
        ["Trì hoãn corticosteroid đến khi bắt đầu kháng sinh vài ngày",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"IDSA/HIVMA 2024 Guidelines for the Prevention and Treatment of Opportunistic Infections in Adults and Adolescents with HIV"
},
{
  spec:"ho_hap", id:"ild", emoji:"🌫️", short:"BPK / IPF", title:"Bệnh phổi kẽ & Xơ phổi tự phát (IPF)",
  guidelines:["ATS/ERS/JRS/ALAT 2022 (IPF & PPF)"],
  sections:{
    dinh_nghia:`
      <p>Bệnh phổi kẽ (Interstitial Lung Disease – ILD) là nhóm bệnh tổn thương khoảng kẽ phổi. <b>Xơ phổi tự phát (IPF)</b> là thể phổ biến nhất ở người cao tuổi, đặc trưng bởi kiểu hình UIP (Usual Interstitial Pneumonia), tiến triển không hồi phục.</p>
      <div class="subhead">Progressive Pulmonary Fibrosis (PPF)</div>
      <p>ATS/ERS 2022 định nghĩa PPF khi bệnh nhân ILD không phải IPF có ≥2/3 tiêu chí trong 1 năm: (1) triệu chứng nặng hơn, (2) suy giảm chức năng phổi, (3) tiến triển trên HRCT — không có nguyên nhân khác.</p>`,
    chan_doan:`
      <p><b>HRCT ngực</b> là công cụ then chốt. Phân loại kiểu hình: UIP, probable UIP, indeterminate, alternate diagnosis. Sinh thiết phổi (phẫu thuật hoặc cryobiopsy) khi HRCT không điển hình UIP và cần loại trừ nguyên nhân khác.</p>
      <div class="alert-box alert-info">Chẩn đoán IPF là chẩn đoán loại trừ: không có nguyên nhân biết được (thuốc, mô liên kết, tiếp xúc nghề nghiệp, quá mẫn…), kết hợp HRCT ± mô bệnh học kiểu UIP.</div>
      <p>Đánh giá chức năng: hô hấp ký (FVC, DLCO), test đi bộ 6 phút. Tầm soát bệnh mô liên kết (ANA, RF, anti-CCP, myositis panel) ở mọi bệnh nhân ILD mới.</p>`,
    dieu_tri:`
      <div class="subhead">IPF</div>
      <ul>
        <li><b>Nintedanib</b> hoặc <b>Pirfenidone</b> là 2 thuốc kháng xơ được phê duyệt, làm chậm suy giảm FVC.</li>
        <li>Oxy liệu pháp nếu PaO₂ ≤55 mmHg hoặc SpO₂ ≤88%.</li>
        <li>Phục hồi chức năng hô hấp.</li>
        <li>Chuyển đánh giá ghép phổi sớm ở bệnh nhân phù hợp.</li>
      </ul>
      <div class="subhead">PPF (ILD khác ngoài IPF)</div>
      <p>Nintedanib được khuyến cáo (conditional) khi đã thất bại điều trị chuẩn của bệnh nền. Cân nhắc pirfenidone theo từng trường hợp.</p>
      <div class="alert-box alert-warn">Không khuyến cáo thuốc kháng acid thường quy hoặc phẫu thuật chống trào ngược chỉ để điều trị IPF (ATS 2022).</div>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Nintedanib","150 mg × 2 lần/ngày","Giảm còn 100 mg×2 nếu không dung nạp; theo dõi men gan"],
        ["Pirfenidone","267 mg × 3 lần/ngày → tăng dần đến 801 mg × 3 lần/ngày","Uống cùng thức ăn; nhạy cảm ánh sáng, buồn nôn"],
        ["Oxy liệu pháp dài hạn","Đích SpO₂ ≥90%","Khi PaO₂ ≤55 mmHg hoặc SpO₂ ≤88% nghỉ"]
      ])}`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["HRCT là xét nghiệm hình ảnh đầu tay khi nghi ILD/IPF",'<span class="badge badge-I">I</span>'],
        ["Nintedanib hoặc Pirfenidone cho IPF để làm chậm tiến triển",'<span class="badge badge-I">I</span>'],
        ["Nintedanib cho Progressive Pulmonary Fibrosis",'<span class="badge badge-IIa">IIa</span>'],
        ["Chuyển đánh giá ghép phổi sớm ở IPF phù hợp",'<span class="badge badge-I">I</span>'],
        ["Thuốc kháng acid thường quy chỉ để điều trị IPF",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"2022 ATS/ERS/JRS/ALAT Clinical Practice Guideline: Idiopathic Pulmonary Fibrosis and Progressive Pulmonary Fibrosis in Adults"
},
{
  spec:"ho_hap", id:"pah", emoji:"🫀", short:"Tăng áp ĐMP", title:"Tăng áp động mạch phổi (PAH)",
  guidelines:["ESC/ERS 2022 (Pulmonary Hypertension)"],
  sections:{
    dinh_nghia:`
      <p>Tăng áp động mạch phổi (Pulmonary Hypertension – PH) được định nghĩa huyết động: <b>mPAP >20 mmHg</b> lúc nghỉ (ESC/ERS 2022). PAH (nhóm 1) thêm PVR >2 WU và PAWP ≤15 mmHg.</p>
      <div class="subhead">Phân nhóm lâm sàng</div>
      ${rt(["Nhóm"],[
        ["Nhóm 1 – PAH","Vô căn, di truyền, liên quan bệnh mô liên kết, bẩm sinh, thuốc…"],
        ["Nhóm 2","Do bệnh tim trái"],
        ["Nhóm 3","Do bệnh phổi/thiếu oxy"],
        ["Nhóm 4 – CTEPH","Thuyên tắc phổi mạn tính"],
        ["Nhóm 5","Cơ chế chưa rõ/đa yếu tố"]
      ])}`,
    chan_doan:`
      <p>Siêu âm tim là bước sàng lọc chính (ước tính PASP, đánh giá thất phải). Chẩn đoán xác định bằng <b>thông tim phải (RHC)</b> tại trung tâm chuyên sâu.</p>
      <div class="alert-box alert-info">Thuật toán 3 bước: (1) Nghi ngờ lâm sàng → (2) Siêu âm tim phát hiện → (3) RHC xác nhận tại trung tâm PH. Dấu hiệu nguy cơ cao (suy thất phải, ngất, dấu hiệu nặng) cần chuyển ngay.</div>
      <p>Phân tầng nguy cơ (thấp/trung bình/cao) dựa trên triệu chứng, 6MWT, NT-proBNP, hình ảnh, huyết động — hướng dẫn điều trị ban đầu và theo dõi.</p>`,
    dieu_tri:`
      <div class="subhead">PAH (nhóm 1) – chiến lược hiện đại</div>
      <ul>
        <li><b>Nguy cơ thấp–trung bình:</b> Khởi đầu phối hợp kép (ERA + PDE5i) ngay từ đầu.</li>
        <li><b>Nguy cơ cao / huyết động nặng:</b> Phối hợp ba thuốc (thêm prostacyclin đường tiêm) hoặc chuyển trung tâm chuyên sâu.</li>
        <li>Theo dõi lại 3–6 tháng, leo thang nếu chưa đạt nguy cơ thấp.</li>
      </ul>
      <div class="subhead">Nhóm thuốc chính</div>
      ${rt(["Nhóm","Ví dụ"],[
        ["ERA (đối kháng endothelin)","Bosentan, Ambrisentan, Macitentan"],
        ["PDE5i / sGC stimulator","Sildenafil, Tadalafil, Riociguat"],
        ["Prostacyclin pathway","Epoprostenol (TM), Treprostinil, Selexipag (uống)"],
        ["Activin signaling inhibitor","Sotatercept (mới, leo thang)"]
      ])}
      <p>CTEPH (nhóm 4): ưu tiên phẫu thuật endarterectomy nếu giải phẫu phù hợp; balloon pulmonary angioplasty hoặc thuốc nếu không mổ được.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["RHC để xác nhận chẩn đoán PAH trước điều trị đặc hiệu",'<span class="badge badge-I">I</span>'],
        ["Khởi đầu phối hợp ERA + PDE5i ở PAH nguy cơ thấp–trung bình",'<span class="badge badge-I">I</span>'],
        ["Chuyển trung tâm PH chuyên sâu khi nghi PAH/CTEPH",'<span class="badge badge-I">I</span>'],
        ["Đánh giá nguy cơ định kỳ để quyết định leo thang điều trị",'<span class="badge badge-I">I</span>'],
        ["Điều trị PAH đặc hiệu ở PH nhóm 2 hoặc 3 không chọn lọc",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"2022 ESC/ERS Guidelines for the diagnosis and treatment of pulmonary hypertension, Eur Heart J 2022"
},
{
  spec:"ho_hap", id:"pleural", emoji:"💧", short:"TDMP", title:"Tràn dịch màng phổi",
  guidelines:["BTS 2023 Pleural Disease"],
  sections:{
    dinh_nghia:`
      <p>Tràn dịch màng phổi là sự tích tụ dịch bất thường trong khoang màng phổi. Phân loại chính:</p>
      ${rt(["Đặc điểm"],[
        ["Dịch thấm (Transudate)","Suy tim, xơ gan, hội chứng thận hư…"],
        ["Dịch tiết (Exudate)","Nhiễm trùng (parapneumonic, empyema), ác tính, lao, viêm…"],
        ["Máu / dưỡng chấp","Chấn thương, ung thư, phẫu thuật"]
      ])}`,
    chan_doan:`
      <p>Siêu âm ngực hướng dẫn chọc dò là tiêu chuẩn. Phân tích dịch: protein, LDH (Light’s criteria), pH, glucose, tế bào, nuôi cấy, cytology.</p>
      <div class="alert-box alert-info"><b>BTS 2023:</b> Luôn dùng siêu âm hướng dẫn khi chọc hút để giảm biến chứng. pH ≤7.2 gợi ý parapneumonic phức tạp / empyema → đặt dẫn lưu.</div>
      <ul>
        <li>Light’s criteria: dịch tiết nếu protein dịch/huyết thanh &gt;0.5 hoặc LDH dịch/huyết thanh &gt;0.6 hoặc LDH dịch &gt;2/3 giới hạn trên bình thường huyết thanh.</li>
        <li>CT ngực khi nghi ác tính hoặc biến chứng.</li>
      </ul>`,
    dieu_tri:`
      <div class="subhead">Theo nguyên nhân</div>
      <ul>
        <li><b>Dịch thấm do suy tim:</b> điều trị suy tim, lợi tiểu; chọc hút nếu khó thở nhiều.</li>
        <li><b>Parapneumonic / empyema:</b> kháng sinh + dẫn lưu (pH ≤7.2 hoặc mủ). Cân nhắc fibrinolytic hoặc VATS nếu không dẫn lưu được.</li>
        <li><b>Tràn dịch ác tính:</b> chọc hút triệu chứng, catheter màng phổi kéo dài (IPC), hoặc pleurodesis.</li>
      </ul>
      <div class="subhead">Nguyên tắc chọc hút / dẫn lưu</div>
      <p>Không rút quá 1.5 L một lần (nguy cơ phù phổi tái nở). Theo dõi lâm sàng và siêu âm.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Siêu âm hướng dẫn cho mọi thủ thuật màng phổi",'<span class="badge badge-I">I</span>'],
        ["Đặt dẫn lưu khi pH dịch ≤7.2 hoặc mủ (parapneumonic phức tạp)",'<span class="badge badge-I">I</span>'],
        ["IPC hoặc pleurodesis cho tràn dịch ác tính tái phát",'<span class="badge badge-I">I</span>'],
        ["Chọc hút mù không siêu âm hướng dẫn",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"BTS Guideline for pleural disease 2023; BTS Clinical Statement on Pleural Procedures"
},
{
  spec:"noi_tiet", id:"hypoglycemia", emoji:"📉", short:"Hạ ĐH", title:"Hạ đường huyết",
  guidelines:["Endocrine Society 2009 (+ ADA 2024)"],
  sections:{
    dinh_nghia:`
      <p>Hạ đường huyết được xác định bằng <b>tam chứng Whipple</b>: (1) triệu chứng phù hợp hạ đường huyết, (2) glucose máu thấp đo được đồng thời, (3) triệu chứng cải thiện sau khi glucose máu được nâng lên — cả 3 tiêu chí cần có để xác nhận chẩn đoán, tránh chẩn đoán quá mức dựa chỉ vào triệu chứng đơn thuần.</p>
      <div class="subhead">Phân độ theo ADA (dùng trong ĐTĐ đang điều trị)</div>
      ${rt(["Ngưỡng glucose máu"],[
        ["Mức 1 — Cảnh báo (glucose thấp)","&lt;70 mg/dL (3.9 mmol/L) và ≥54 mg/dL"],
        ["Mức 2 — Có ý nghĩa lâm sàng","&lt;54 mg/dL (3.0 mmol/L)"],
        ["Mức 3 — Nặng","Bất kỳ mức glucose nào kèm rối loạn tri giác/thể chất cần người khác hỗ trợ xử trí"]
      ])}`,
    chan_doan:`
      <p><b>Ở người đái tháo đường đang điều trị bằng insulin/sulfonylurea:</b> chẩn đoán thường rõ ràng qua bệnh sử dùng thuốc + glucose máu thấp — không cần xét nghiệm mở rộng trừ trường hợp không giải thích được bằng liều thuốc/chế độ ăn.</p>
      <p><b>Ở người không có ĐTĐ (hạ đường huyết ngoài ĐTĐ):</b> cần tìm nguyên nhân — u tiết insulin (insulinoma), suy thượng thận, suy gan nặng, u ngoài tụy tiết IGF-2, hạ đường huyết phản ứng sau ăn, hạ đường huyết giả tạo do lạm dụng insulin/sulfonylurea ngoại sinh. Xét nghiệm khi đang hạ đường huyết tự nhiên hoặc qua nghiệm pháp nhịn đói 72h có giám sát: glucose, insulin, C-peptide, proinsulin, beta-hydroxybutyrate, sàng lọc sulfonylurea trong máu/nước tiểu.</p>`,
    dieu_tri:`
      <div class="subhead">Xử trí cấp — "Quy tắc 15-15" cho hạ đường huyết nhẹ-trung bình (còn tỉnh, nuốt được)</div>
      <p>Uống <b>15g carbohydrate hấp thu nhanh</b> (viên/gel glucose, nước ngọt có đường, nước trái cây) → chờ <b>15 phút</b> → đo lại glucose → lặp lại nếu vẫn &lt;70mg/dL. Sau khi glucose ổn định, ăn bữa ăn/snack có carbohydrate phức hợp để tránh tái hạ đường huyết, đặc biệt nếu nguyên nhân do insulin/sulfonylurea tác dụng kéo dài.</p>
      <div class="subhead">Hạ đường huyết nặng (không tỉnh táo/không nuốt được) — cấp cứu</div>
      <ul>
        <li><b>Tại cơ sở y tế/có đường truyền TM:</b> Glucose 20-50% TM (D50W 25-50mL) tiêm chậm, lặp lại nếu cần, sau đó truyền duy trì glucose 10% nếu nguy cơ tái hạ (do sulfonylurea/insulin tác dụng kéo dài)</li>
        <li><b>Không có đường truyền TM (tại nhà/cộng đồng):</b> <b>Glucagon</b> tiêm bắp/dưới da (dạng bơm tiêm truyền thống) hoặc <b>glucagon dạng xịt mũi</b> (thế hệ mới, không cần pha chế, dễ dùng cho người không chuyên) — đây là bước tiến quan trọng giúp người nhà/giáo viên xử trí hạ đường huyết nặng ngoài bệnh viện dễ dàng hơn</li>
      </ul>
      <div class="alert-box alert-warn">Glucagon kém hiệu quả hơn ở người nghiện rượu/suy dinh dưỡng/dự trữ glycogen gan thấp (glucagon cần glycogen gan để phát huy tác dụng) — ưu tiên glucose TM trực tiếp nếu có đường truyền.</div>
      <div class="subhead">Hạ đường huyết do sulfonylurea</div>
      <p>Nguy cơ tái hạ đường huyết kéo dài nhiều giờ-ngày do thời gian bán hủy dài — cần <b>nhập viện theo dõi glucose liên tục ≥24 giờ</b>, khác với hạ đường huyết do insulin tác dụng nhanh thường hồi phục nhanh hơn.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Glucose uống (viên/gel)","15g, lặp lại sau 15 phút nếu cần","cách xử trí đầu tay nếu bệnh nhân còn tỉnh táo, nuốt được"],
        ["Dextrose 50% TM (D50W)","25-50mL (12.5-25g) tiêm TM chậm","qua đường truyền tĩnh mạch lớn, tránh thoát mạch (gây hoại tử mô)"],
        ["Glucagon tiêm bắp/dưới da","1mg (người lớn)","có thể gây buồn nôn/nôn sau tỉnh; kém hiệu quả nếu dự trữ glycogen gan thấp"],
        ["Glucagon xịt mũi (thế hệ mới)","3mg xịt 1 liều duy nhất vào 1 bên mũi","không cần pha chế, dễ sử dụng cho người không chuyên môn y tế"],
        ["Octreotide (hạ đường huyết do sulfonylurea nặng/tái phát)","50-100mcg TDD mỗi 6-8h","ức chế tiết insulin thêm do sulfonylurea kích thích, hữu ích trong ngộ độc sulfonylurea"]
      ])}
      <div class="age-tag">Người cao tuổi</div>
      <p>Nới lỏng mục tiêu đường huyết (HbA1c đích cao hơn) ở người cao tuổi nhiều bệnh đồng mắc/kỳ vọng sống hạn chế để giảm nguy cơ hạ đường huyết — hạ đường huyết ở người cao tuổi liên quan tăng nguy cơ té ngã, rối loạn nhịp tim, sa sút trí tuệ.</p>`,

{
  spec:"noi_tiet", id:"cushing", emoji:"🌙", short:"Cushing", title:"Hội chứng Cushing",
  guidelines:["Endocrine Society 2015 (chẩn đoán)","Endocrine Society 2021 (điều trị)"],
  sections:{
    dinh_nghia:`
      <p>Hội chứng Cushing là tình trạng dư thừa glucocorticoid mạn tính, biểu hiện bằng béo trung tâm, mặt tròn đỏ, rạn da tím, teo cơ-yếu cơ gốc chi, tăng huyết áp, rối loạn dung nạp glucose, loãng xương, dễ bầm tím.</p>
      <div class="subhead">Phân loại nguyên nhân</div>
      ${rt(["Đặc điểm"],[
        ["Ngoại sinh (do thuốc)","Nguyên nhân thường gặp nhất tuyệt đối — dùng corticosteroid liều cao/kéo dài (uống, hít, khớp, ngoài da) — luôn khai thác kỹ tiền sử dùng thuốc trước khi tìm nguyên nhân nội sinh"],
        ["ACTH-dependent — Bệnh Cushing (u tuyến yên tiết ACTH)","Nguyên nhân nội sinh thường gặp nhất (~70%), thường u tuyến yên nhỏ (microadenoma)"],
        ["ACTH-dependent — ACTH lạc chỗ (ectopic)","U thần kinh nội tiết (carcinoid phế quản, ung thư phổi tế bào nhỏ...) tiết ACTH lạc chỗ"],
        ["ACTH-independent — U thượng thận","U tuyến hoặc ung thư biểu mô vỏ thượng thận tiết cortisol tự chủ, ACTH bị ức chế"]
      ])}`,
    chan_doan:`
      <p><b>Bước 1 — Xác định tăng cortisol thật sự (2 trong số các test sau dương tính):</b></p>
      ${rt(["Ngưỡng dương tính"],[
        ["Cortisol nước bọt đêm khuya (×2 đêm khác nhau)","Tăng so với ngưỡng phòng xét nghiệm"],
        ["Cortisol tự do niệu 24h (UFC, ×2 lần)","&gt;giới hạn trên bình thường"],
        ["Test ức chế dexamethasone liều thấp qua đêm (1mg lúc 23h, đo cortisol 8h sáng)","Cortisol sáng &gt;1.8 µg/dL (không bị ức chế)"]
      ])}
      <p><b>Bước 2 — Định vị nguyên nhân (chỉ thực hiện sau khi đã xác định chắc chắn tăng cortisol):</b> đo ACTH huyết tương lúc 8h sáng — ACTH thấp/ức chế gợi ý nguyên nhân thượng thận (chụp CT thượng thận); ACTH bình thường/cao gợi ý nguyên nhân tuyến yên/lạc chỗ (MRI tuyến yên, nếu âm tính hoặc nghi ngờ → lấy máu xoang đá dưới hai bên (IPSS) để phân biệt bệnh Cushing với ACTH lạc chỗ).</p>
      <div class="alert-box alert-info">Luôn loại trừ giả-Cushing (trầm cảm nặng, nghiện rượu, béo phì nặng, đái tháo đường kiểm soát kém) có thể gây dương tính giả nhẹ trên test sàng lọc — cần lâm sàng điển hình + ít nhất 2 test dương tính đồng thuận.</div>`,
    dieu_tri:`
      <div class="subhead">Bước 1 — Phẫu thuật (điều trị đầu tay cho mọi nguyên nhân nội sinh có thể phẫu thuật)</div>
      <ul>
        <li><b>Bệnh Cushing (u tuyến yên):</b> phẫu thuật cắt u tuyến yên qua đường xuyên bướm (transsphenoidal) — tỷ lệ khỏi bệnh 70–90% với phẫu thuật viên kinh nghiệm ở microadenoma</li>
        <li><b>U thượng thận:</b> cắt thượng thận một bên (nội soi ưu tiên nếu u nhỏ, lành tính)</li>
        <li><b>ACTH lạc chỗ:</b> cắt bỏ u nguyên phát nếu định vị được và còn khả năng phẫu thuật</li>
      </ul>
      <div class="subhead">Bước 2 — Điều trị nội khoa (khi không phẫu thuật được, chờ phẫu thuật, hoặc bắc cầu trước xạ trị)</div>
      <ul>
        <li><b>Ketoconazole hoặc metyrapone</b> (ức chế tổng hợp steroid) — lựa chọn hàng đầu để kiểm soát nhanh triệu chứng nặng trước can thiệp dứt điểm</li>
        <li><b>Osilodrostat</b> (ức chế 11β-hydroxylase, uống) — thuốc mới hơn, hiệu quả kiểm soát cortisol tốt, FDA phê duyệt cho bệnh Cushing</li>
        <li><b>Pasireotide</b> (đồng vận somatostatin, nhắm thụ thể trên u tuyến yên) — cho bệnh Cushing không đáp ứng/không phù hợp phẫu thuật, cảnh báo tăng đường huyết đáng kể</li>
        <li><b>Mifepristone</b> (đối kháng thụ thể glucocorticoid) — chỉ định riêng cho hội chứng Cushing kèm đái tháo đường/rối loạn dung nạp glucose không kiểm soát được bằng thuốc khác; lưu ý không thể theo dõi hiệu quả bằng đo cortisol (thuốc chẹn thụ thể chứ không hạ cortisol máu)</li>
      </ul>
      <div class="subhead">Bước 3 — Xạ trị/Cắt thượng thận hai bên (khi phẫu thuật thất bại/tái phát)</div>
      <p>Xạ trị tuyến yên bổ sung sau phẫu thuật thất bại ở bệnh Cushing; <b>cắt thượng thận hai bên</b> là biện pháp cuối cùng cho bệnh Cushing kháng trị nặng — cần điều trị thay thế corticoid suốt đời sau đó và theo dõi hội chứng Nelson (u tuyến yên phát triển nhanh do mất phản hồi âm).</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-danger">Ketoconazole liều cao gây độc gan đáng kể — theo dõi men gan mỗi 1–2 tuần lúc đầu điều trị; tránh phối hợp thuốc kéo dài QTc.</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Ketoconazole","200mg×2-3/ngày → tối đa 1200mg/ngày chia liều","theo dõi men gan sát; tương tác CYP3A4 nhiều thuốc"],
        ["Metyrapone","500mg×3-4/ngày → tối đa 6g/ngày","gây tích tụ tiền chất có hoạt tính androgen/mineralocorticoid — theo dõi mụn/rậm lông, kali máu"],
        ["Osilodrostat","2mg×2/ngày, tăng dần mỗi 2 tuần theo đáp ứng","theo dõi kali/magie máu, kéo dài QTc"],
        ["Pasireotide","0.3-0.9mg TDD×2/ngày","theo dõi đường huyết sát (nguy cơ tăng đường huyết cao), có thể cần thêm thuốc hạ đường huyết"],
        ["Mifepristone","300mg/ngày → tối đa 1200mg/ngày","không dùng cùng thai kỳ; theo dõi dấu hiệu suy thượng thận lâm sàng (không dựa cortisol máu)"]
      ])}
      <div class="age-tag">Người cao tuổi/nhiều bệnh đồng mắc</div>
      <p>Kiểm soát tích cực biến chứng tim mạch-chuyển hóa (HA, đường huyết, loãng xương) song song trong lúc chờ điều trị đặc hiệu; cân nhắc điều trị nội khoa bắc cầu trước khi phẫu thuật ở người nguy cơ phẫu thuật cao.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Xác định tăng cortisol bằng ≥2 test trước khi định vị nguyên nhân",'<span class="badge badge-I">I</span>'],
        ["Phẫu thuật cắt u là điều trị đầu tay cho mọi nguyên nhân có thể phẫu thuật",'<span class="badge badge-I">I</span>'],
        ["Điều trị nội khoa bắc cầu khi triệu chứng nặng chờ phẫu thuật/không phẫu thuật được",'<span class="badge badge-I">I</span>'],
        ["Theo dõi hội chứng Nelson sau cắt thượng thận hai bên",'<span class="badge badge-I">I</span>'],
        ["Chẩn đoán chỉ dựa 1 test sàng lọc dương tính đơn độc",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"Endocrine Society Clinical Practice Guideline 2015 (Diagnosis) & 2021 (Treatment) for Cushing's Syndrome"
},
{
  spec:"noi_tiet", id:"addison", emoji:"🔻", short:"Suy TT", title:"Suy thượng thận",
  guidelines:["Endocrine Society 2016"],
  sections:{
    dinh_nghia:`
      <p>Suy thượng thận là tình trạng thiếu hụt glucocorticoid (± mineralocorticoid), phân loại theo vị trí tổn thương:</p>
      ${rt(["Đặc điểm","ACTH"],[
        ["Nguyên phát (bệnh Addison)","Tổn thương trực tiếp vỏ thượng thận — tự miễn (thường gặp nhất ở nước phát triển), lao (thường gặp ở nước đang phát triển), xuất huyết thượng thận, di căn","Cao (mất phản hồi âm)"],
        ["Thứ phát","Thiếu ACTH do bệnh lý tuyến yên (u, phẫu thuật, xạ trị, viêm tuyến yên)","Thấp/không tăng phù hợp"],
        ["Tam phát (thường gặp nhất trên lâm sàng)","Ức chế trục dưới đồi-tuyến yên-thượng thận do dùng corticosteroid ngoại sinh kéo dài rồi ngưng đột ngột","Thấp/không tăng phù hợp"]
      ])}
      <p>Suy thượng thận nguyên phát còn kèm thiếu <b>aldosterone</b> (mất muối, tăng kali, hạ HA tư thế) — đặc điểm không có ở suy thượng thận thứ phát/tam phát.</p>`,
    chan_doan:`
      <p><b>Cortisol máu buổi sáng (8h):</b> &lt;3 µg/dL gần như chẩn đoán xác định; &gt;15–18 µg/dL loại trừ; giá trị trung gian cần làm thêm test kích thích.</p>
      <p><b>Test kích thích ACTH (cosyntropin 250µg TM/TB):</b> đo cortisol tại 0, 30, 60 phút — cortisol đỉnh &lt;18–20 µg/dL xác định suy thượng thận (tiêu chuẩn vàng để xác định, đặc biệt hữu ích phân biệt tam phát/thứ phát giai đoạn sớm có thể còn đáp ứng nhẹ).</p>
      <p>Đo <b>ACTH huyết tương</b> đồng thời với cortisol nền để phân biệt nguyên phát (ACTH cao) với thứ phát/tam phát (ACTH thấp/không tăng phù hợp). Đo renin-aldosterone khi nghi nguyên phát (renin cao, aldosterone thấp/không tăng phù hợp). Kháng thể kháng 21-hydroxylase dương tính xác định nguyên nhân tự miễn.</p>`,
    dieu_tri:`
      <div class="subhead">Thay thế glucocorticoid (nền tảng, mọi bệnh nhân)</div>
      <p><b>Hydrocortisone</b> chia 2–3 liều/ngày, mô phỏng nhịp tiết cortisol sinh lý (liều cao buổi sáng, giảm dần trong ngày) — thuốc hàng đầu do thời gian bán hủy ngắn, ít tích lũy. Prednisolone liều thấp 1 lần/ngày là lựa chọn thay thế thuận tiện hơn nếu tuân thủ kém với hydrocortisone chia liều.</p>
      <div class="subhead">Thay thế mineralocorticoid (chỉ suy thượng thận nguyên phát)</div>
      <p><b>Fludrocortisone</b> 1 lần/ngày, chỉnh liều theo huyết áp tư thế, kali máu, và hoạt tính renin huyết tương (đích: renin ở giới hạn trên bình thường).</p>
      <div class="subhead">Quy tắc "ngày ốm" (Sick Day Rules) — giáo dục bắt buộc mọi bệnh nhân</div>
      <ul>
        <li>Sốt/nhiễm trùng/stress vừa: <b>gấp đôi hoặc gấp ba liều hydrocortisone uống</b> cho đến khi hồi phục</li>
        <li>Nôn ói không giữ được thuốc uống, chấn thương nặng, phẫu thuật: <b>tiêm bắp hydrocortisone khẩn cấp</b> (100mg) và đến cấp cứu ngay</li>
        <li>Mọi bệnh nhân cần mang theo <b>bộ tiêm hydrocortisone khẩn cấp</b> và đeo vòng/thẻ cảnh báo y tế</li>
      </ul>
      <div class="subhead">Cơn suy thượng thận cấp (cấp cứu nội khoa)</div>
      <p><b>Hydrocortisone 100mg TM ngay</b> (không chờ kết quả xét nghiệm nếu nghi ngờ lâm sàng) → 50mg TM/TB mỗi 6 giờ hoặc truyền liên tục 200mg/24h + bù dịch tích cực (NaCl 0.9% + glucose nếu hạ đường huyết) + tìm và điều trị yếu tố khởi phát. Không cần fludrocortisone bổ sung khi dùng hydrocortisone liều cao (đã có đủ hoạt tính mineralocorticoid ở liều này).</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Hydrocortisone (duy trì)","15–25mg/ngày chia 2–3 liều (vd. 10mg sáng-5mg trưa-5mg chiều)","liều thấp nhất kiểm soát triệu chứng, tránh quá liều gây hội chứng Cushing do thuốc"],
        ["Prednisolone (thay thế, thuận tiện hơn)","3–5mg/ngày × 1 lần/ngày (buổi sáng)","thay thế khi tuân thủ kém với hydrocortisone chia liều"],
        ["Fludrocortisone (chỉ nguyên phát)","50–200 microgam/ngày × 1 lần/ngày","chỉnh theo HA tư thế, kali máu, renin; giảm liều nếu phù/tăng HA"],
        ["Hydrocortisone (cơn cấp)","100mg TM bolus → 50mg mỗi 6h hoặc truyền 200mg/24h","kèm bù dịch tích cực, tìm yếu tố khởi phát"],
        ["Hydrocortisone tiêm bắp khẩn cấp (tại nhà)","100mg TB khi không uống được thuốc","hướng dẫn bệnh nhân/người nhà tự tiêm khi cần"]
      ])}
      <div class="age-tag">Người cao tuổi</div>
      <p>Theo dõi sát tương tác thuốc chuyển hóa qua CYP3A4 (ảnh hưởng chuyển hóa hydrocortisone), nguy cơ loãng xương/đái tháo đường do liều glucocorticoid tích lũy — dùng liều thấp nhất hiệu quả và tái đánh giá định kỳ.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Hydrocortisone chia liều mô phỏng nhịp sinh lý là điều trị nền tảng",'<span class="badge badge-I">I</span>'],
        ["Fludrocortisone bổ sung ở suy thượng thận nguyên phát",'<span class="badge badge-I">I</span>'],
        ["Giáo dục quy tắc ngày ốm và cấp phát bộ tiêm khẩn cấp cho mọi bệnh nhân",'<span class="badge badge-I">I</span>'],
        ["Hydrocortisone liều cao TM ngay khi nghi cơn suy thượng thận cấp, không chờ xét nghiệm",'<span class="badge badge-I">I</span>'],
        ["Ngưng corticosteroid ngoại sinh đột ngột sau dùng kéo dài",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"Endocrine Society 2016 Clinical Practice Guideline: Diagnosis and Treatment of Primary Adrenal Insufficiency"
},
{
  spec:"noi_tiet", id:"hyperCa", emoji:"🦴", short:"Tăng Ca", title:"Tăng canxi máu",
  guidelines:["Endocrine Society","UpToDate / thực hành"],
  sections:{
    dinh_nghia:`
      <p>Tăng canxi máu khi Ca huyết thanh &gt;10.5 mg/dL (2.62 mmol/L) hoặc Ca ion hóa tăng. Phân độ:</p>
      ${rt(["Mức độ"],[
        ["Nhẹ","10.5 – 12 mg/dL"],
        ["Trung bình","12 – 14 mg/dL"],
        ["Nặng","&gt;14 mg/dL hoặc có triệu chứng nặng"]
      ])}
      <p>Nguyên nhân phổ biến: cường cận giáp nguyên phát, ác tính (tiêu xương hoặc PTHrP), vitamin D thừa, granulomatous disease, thuốc (thiazide, lithium).</p>`,
    chan_doan:`
      <p>Đo PTH ngay để phân biệt:</p>
      <ul>
        <li><b>PTH tăng hoặc không phù hợp bình thường</b> → cường cận giáp nguyên phát (hoặc FHH).</li>
        <li><b>PTH bị ức chế</b> → tìm nguyên nhân PTH-independent (ung thư, vitamin D, u hạt…).</li>
      </ul>
      <p>Xét nghiệm thêm: phosphate, Mg, creatinine, 25-OH vitamin D, PTHrP nếu nghi ác tính, điện di protein nếu nghi myeloma.</p>`,
    dieu_tri:`
      <div class="subhead">Cấp cứu (Ca &gt;14 hoặc triệu chứng nặng)</div>
      <ul>
        <li>Bù dịch NaCl 0.9% mạnh (200–300 mL/h nếu không suy tim) để tăng thải Ca.</li>
        <li>Calcitonin 4–8 IU/kg TM/SC mỗi 12h (tác dụng nhanh, ngắn).</li>
        <li>Bisphosphonate (Zoledronic acid 4 mg TM trong 15 phút) – tác dụng bền.</li>
        <li>Denosumab nếu suy thận nặng hoặc kháng bisphosphonate.</li>
        <li>Lọc máu nếu kháng trị hoặc suy thận nặng kèm quá tải dịch.</li>
      </ul>
      <div class="subhead">Cường cận giáp nguyên phát</div>
      <p>Phẫu thuật cắt tuyến cận giáp nếu đủ chỉ định (triệu chứng, Ca &gt;1 mg/dL trên bình thường, loãng xương, sỏi thận, GFR &lt;60…).</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["NaCl 0.9%","200–300 mL/h ban đầu","Theo dõi nước tiểu và tim mạch"],
        ["Zoledronic acid","4 mg TM trong ≥15 phút","Không dùng nếu CrCl &lt;30; hạ Ca có thể kéo dài"],
        ["Calcitonin","4–8 IU/kg mỗi 12h","Tác dụng nhanh nhưng tachyphylaxis sau 48h"],

      ])}`,

{
  spec:"noi_tiet", id:"aldo", emoji:"🧂", short:"Cường Aldo", title:"Cường Aldosterone nguyên phát",
  guidelines:["Endocrine Society 2016 (+ cập nhật thực hành 2022)"],
  sections:{
    dinh_nghia:`
      <p>Cường Aldosterone nguyên phát (hội chứng Conn) là nguyên nhân nội tiết thường gặp nhất của tăng huyết áp thứ phát (~5–10% người tăng huyết áp, cao hơn nhiều ở nhóm tăng huyết áp kháng trị), do tuyến thượng thận tiết aldosterone tự chủ, không phụ thuộc hệ renin-angiotensin.</p>
      <div class="subhead">Phân loại nguyên nhân</div>
      ${rt(["Đặc điểm"],[
        ["U tuyến thượng thận tiết aldosterone (APA)","Một bên, thường đáp ứng tốt với phẫu thuật cắt thượng thận"],
        ["Tăng sản thượng thận hai bên (BAH)","Nguyên nhân thường gặp nhất tổng thể — điều trị nội khoa bằng đối kháng mineralocorticoid"],
        ["Cường Aldosterone đáp ứng glucocorticoid (hiếm, di truyền)","Đột biến gen lai CYP11B1/CYP11B2 — đáp ứng với corticosteroid liều thấp"]
      ])}`,
    chan_doan:`
      <div class="alert-box alert-info"><b>Chỉ định tầm soát</b> (Endocrine Society): THA độ 2-3 (≥140/90 kháng trị hoặc cần ≥3 thuốc), THA kèm hạ kali máu tự phát/do lợi tiểu, THA kèm u thượng thận tình cờ phát hiện, THA khởi phát trẻ (&lt;40 tuổi), THA kèm ngưng thở khi ngủ, tiền sử gia đình THA khởi phát sớm/đột quỵ &lt;40 tuổi, hoặc mọi người thân thế hệ 1 của bệnh nhân cường Aldosterone.</div>
      <div class="subhead">Bước 1 — Xét nghiệm tầm soát</div>
      <p><b>Tỷ lệ Aldosterone/Renin (ARR)</b> — tỷ lệ tăng cao (thường ARR&gt;20-30 tùy đơn vị phòng xét nghiệm, kèm aldosterone huyết tương tuyệt đối tăng) gợi ý cường Aldosterone nguyên phát. Cần ngưng thuốc ảnh hưởng trục RAAS trước xét nghiệm nếu có thể (đặc biệt đối kháng mineralocorticoid ≥4 tuần); nếu không ngưng được thuốc hạ áp, dùng thuốc ít ảnh hưởng ARR hơn (chẹn kênh canxi dihydropyridine, chẹn alpha) để kiểm soát HA trong thời gian xét nghiệm.</p>
      <div class="subhead">Bước 2 — Test xác định chẩn đoán</div>
      <p>Test ức chế bằng truyền nước muối sinh lý (saline suppression test) hoặc test captopril — aldosterone không bị ức chế sau tải natri/captopril xác định chẩn đoán cường Aldosterone nguyên phát.</p>
      <div class="subhead">Bước 3 — Định vị nguyên nhân (chỉ sau khi đã xác định chẩn đoán)</div>
      <p>CT thượng thận độ phân giải cao là bước đầu; nếu có chỉ định phẫu thuật và bệnh nhân &lt;35 tuổi có u một bên rõ ràng trên CT kèm kali máu thấp có thể phẫu thuật thẳng. Ở hầu hết trường hợp khác, cần <b>lấy máu tĩnh mạch thượng thận hai bên (AVS)</b> để xác định bên tăng tiết thật sự trước khi quyết định phẫu thuật — CT đơn thuần có thể gây nhầm lẫn do u không chức năng tình cờ.</p>`,
    dieu_tri:`
      <div class="subhead">U tuyến một bên (APA) — điều trị đầu tay: Phẫu thuật</div>
      <p><b>Cắt thượng thận nội soi một bên</b> — chữa khỏi hạ kali máu ở gần như 100% và kiểm soát/khỏi hoàn toàn THA ở 30-60% trường hợp (phần còn lại cải thiện đáng kể mức độ THA dù không khỏi hẳn, đặc biệt nếu THA đã kéo dài lâu năm).</p>
      <div class="subhead">Tăng sản thượng thận hai bên (BAH) hoặc không thể phẫu thuật — điều trị đầu tay: Nội khoa</div>
      <ul>
        <li><b>Đối kháng thụ thể mineralocorticoid</b> (spironolactone hoặc eplerenone) là điều trị nền tảng — kiểm soát cả huyết áp lẫn hạ kali máu</li>
        <li><b>Spironolactone</b> hiệu quả mạnh hơn nhưng tác dụng phụ kháng androgen (nữ hóa tuyến vú nam, rối loạn kinh nguyệt) nhiều hơn; <b>eplerenone</b> chọn lọc hơn, ít tác dụng phụ nội tiết nhưng hiệu lực yếu hơn cần liều cao hơn/chia 2 lần/ngày</li>
        <li>Thêm thuốc hạ áp khác (chẹn kênh canxi, ACEi/ARB) nếu chưa đạt đích huyết áp dù đã tối ưu đối kháng mineralocorticoid</li>
      </ul>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">Theo dõi kali máu và creatinine 1 tuần sau khởi động/tăng liều đối kháng mineralocorticoid, đặc biệt nếu phối hợp ACEi/ARB — nguy cơ tăng kali máu.</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Spironolactone","12.5–25mg/ngày → tối đa 100mg/ngày (có thể đến 400mg nếu cần)","tác dụng phụ kháng androgen liều-phụ thuộc; theo dõi kali máu sát"],
        ["Eplerenone","25mg × 2 lần/ngày → tối đa 100mg/ngày chia 2 lần","lựa chọn khi không dung nạp tác dụng phụ nội tiết của spironolactone"],
        ["Amiloride (thay thế nếu không dung nạp đối kháng mineralocorticoid)","5–10mg × 2 lần/ngày","tác động lợi tiểu giữ kali qua kênh natri biểu mô, không qua thụ thể mineralocorticoid"]
      ])}
      <div class="age-tag">Người cao tuổi</div>
      <p>Cân nhắc kỹ lợi ích phẫu thuật so với điều trị nội khoa dựa kỳ vọng sống và nguy cơ phẫu thuật; theo dõi chức năng thận/kali sát hơn khi phối hợp nhiều thuốc ảnh hưởng kali máu.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Tầm soát bằng ARR ở mọi bệnh nhân THA kháng trị hoặc THA kèm hạ kali máu",'<span class="badge badge-I">I</span>'],
        ["AVS trước phẫu thuật ở hầu hết trường hợp (trừ tuổi trẻ có u rõ một bên trên CT)",'<span class="badge badge-I">I</span>'],
        ["Phẫu thuật cắt thượng thận một bên cho APA xác định qua AVS",'<span class="badge badge-I">I</span>'],
        ["Đối kháng mineralocorticoid là điều trị nền tảng cho BAH",'<span class="badge badge-I">I</span>'],
        ["Quyết định phẫu thuật chỉ dựa CT đơn thuần không làm AVS ở người &gt;35 tuổi",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"Endocrine Society Clinical Practice Guideline 2016 (Case Detection, Diagnosis, and Treatment of Primary Aldosteronism)"
},
{
  spec:"noi_tiet", id:"pheo", emoji:"💥", short:"U tủy TT", title:"U tủy thượng thận (Pheochromocytoma)",
  guidelines:["Endocrine Society 2014"],
  sections:{
    dinh_nghia:`
      <p>U tủy thượng thận (Pheochromocytoma) là u tiết catecholamine xuất phát từ tế bào ưa crôm tủy thượng thận; u cùng bản chất mô học ngoài thượng thận gọi là <b>paraganglioma</b>. Tuân theo "quy tắc 10%" kinh điển (dù nay đã biết tỷ lệ thực tế cao hơn với các thể di truyền): ~10% hai bên, ~10% ác tính, ~10-40% có nền di truyền (SDHx, VHL, RET-MEN2, NF1...).</p>
      <div class="alert-box alert-warn">Luôn tầm soát hội chứng di truyền ở người trẻ, u hai bên, đa u, hoặc tiền sử gia đình — tư vấn di truyền và xét nghiệm gen được khuyến cáo cho <b>mọi</b> bệnh nhân pheochromocytoma/paraganglioma theo Endocrine Society, không chỉ nhóm nguy cơ cao.</div>`,
    chan_doan:`
      <div class="subhead">Xét nghiệm sinh hóa — bước đầu tiên bắt buộc trước khi định vị hình ảnh</div>
      <p><b>Metanephrine/normetanephrine tự do huyết tương</b> hoặc <b>metanephrine phân đoạn niệu 24h</b> — độ nhạy rất cao (&gt;95%), là xét nghiệm sàng lọc/chẩn đoán đầu tay. Giá trị tăng &gt;4 lần giới hạn trên gần như chẩn đoán xác định; giá trị tăng nhẹ cần loại trừ dương tính giả (ngưng thuốc chống trầm cảm 3 vòng, thuốc chẹn alpha/lợi tiểu nếu có thể trước xét nghiệm, lấy máu ở tư thế nằm nghỉ ngơi ≥20 phút).</p>
      <div class="subhead">Định vị hình ảnh — chỉ sau khi xác định sinh hóa dương tính</div>
      <p>CT hoặc MRI bụng-chậu là bước đầu (MRI ưu tiên ở trẻ em/thai kỳ để tránh tia xạ). Xạ hình <b>MIBG</b> hoặc PET với đồng vị phóng xạ (⁶⁸Ga-DOTATATE nhạy hơn MIBG) khi nghi đa ổ/di căn/ngoài thượng thận hoặc trước điều trị bằng MIBG phóng xạ.</p>`,
    dieu_tri:`
      <div class="subhead">Chuẩn bị trước phẫu thuật — BẮT BUỘC, không thể bỏ qua</div>
      <div class="alert-box alert-danger">Phẫu thuật cắt u mà <b>chưa chẹn alpha đầy đủ trước</b> có thể gây cơn tăng huyết áp kịch phát đe dọa tính mạng khi thao tác vào khối u (giải phóng ồ ạt catecholamine) — đây là nguyên tắc an toàn tối quan trọng, không có ngoại lệ.</div>
      <ul>
        <li><b>Bước 1 — Chẹn alpha</b> (phenoxybenzamine hoặc doxazosin) khởi động ít nhất <b>7–14 ngày trước mổ</b>, chỉnh liều đến khi kiểm soát huyết áp và có hạ huyết áp tư thế nhẹ (dấu hiệu chẹn đủ)</li>
        <li><b>Bước 2 — Chẹn beta</b> chỉ thêm <b>SAU khi</b> đã chẹn alpha đầy đủ (thường 2–3 ngày trước mổ) nếu còn nhịp nhanh phản xạ — <b>tuyệt đối không chẹn beta trước khi chẹn alpha</b> vì mất đối kháng giãn mạch của thụ thể alpha, gây cơn tăng huyết áp kịch phát nặng hơn do catecholamine tác động không đối kháng lên thụ thể alpha</li>
        <li><b>Bước 3 — Bù đủ thể tích dịch/muối</b> trước mổ (chế độ ăn giàu muối + đủ nước) để giảm nguy cơ tụt huyết áp nặng sau khi cắt bỏ nguồn tiết catecholamine</li>
      </ul>
      <div class="subhead">Phẫu thuật</div>
      <p><b>Cắt thượng thận nội soi</b> là điều trị dứt điểm cho hầu hết trường hợp u khu trú; theo dõi huyết áp/đường huyết sát trong và sau mổ (hạ huyết áp/hạ đường huyết phản ứng thường gặp ngay sau cắt u do mất đột ngột tác động catecholamine).</p>
      <div class="subhead">Bệnh di căn/không thể phẫu thuật</div>
      <p>MIBG phóng xạ liều điều trị (nếu u bắt xạ MIBG), hóa trị phối hợp (CVD: cyclophosphamide-vincristine-dacarbazine), hoặc liệu pháp nhắm đích/ức chế điểm kiểm soát miễn dịch theo hội chẩn ung bướu chuyên khoa; luôn duy trì chẹn alpha kiểm soát triệu chứng dù không phẫu thuật được.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Phenoxybenzamine (chẹn alpha không chọn lọc)","10mg×2/ngày → tăng dần mỗi vài ngày đến 1mg/kg/ngày chia liều","tác dụng kéo dài, khó chỉnh nhanh; nghẹt mũi và hạ HA tư thế là tác dụng phụ thường gặp"],
        ["Doxazosin (chẹn alpha-1 chọn lọc, thay thế)","1–2mg/ngày → tăng dần đến 16mg/ngày chia liều","dễ chỉnh liều hơn phenoxybenzamine, ít hạ HA tư thế hơn"],
        ["Propranolol (chẹn beta, chỉ thêm sau chẹn alpha đủ)","10–40mg×3-4/ngày, bắt đầu 2-3 ngày trước mổ","không dùng đơn độc/dùng trước chẹn alpha trong bất kỳ hoàn cảnh nào"],
        ["Metyrosine (ức chế tổng hợp catecholamine, trường hợp đặc biệt)","250mg×4/ngày → tăng dần","dùng bổ sung khi kiểm soát bằng chẹn alpha/beta chưa đủ hoặc u không mổ được"]
      ])}
      <div class="age-tag">Mọi lứa tuổi</div>
      <p>Tư vấn di truyền và xét nghiệm gen nên được đề nghị cho tất cả bệnh nhân bất kể tuổi khởi phát, vì ảnh hưởng đến tầm soát người thân và theo dõi tái phát/đa u lâu dài.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Metanephrine tự do huyết tương/niệu là xét nghiệm sàng lọc đầu tay",'<span class="badge badge-I">I</span>'],
        ["Chẹn alpha đầy đủ ≥7-14 ngày trước mổ ở mọi trường hợp",'<span class="badge badge-I">I</span>'],
        ["Chẹn beta chỉ thêm sau khi đã chẹn alpha đầy đủ",'<span class="badge badge-I">I</span>'],
        ["Tư vấn/xét nghiệm di truyền cho mọi bệnh nhân pheochromocytoma/paraganglioma",'<span class="badge badge-I">I</span>'],
        ["Chẹn beta đơn độc hoặc chẹn beta trước chẹn alpha",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"Endocrine Society Clinical Practice Guideline 2014: Pheochromocytoma and Paraganglioma"
},
{
  spec:"tieu_hoa", id:"gerd", emoji:"🔥", short:"GERD", title:"Trào ngược dạ dày-thực quản",
  guidelines:["ACG 2022"],
  sections:{
    dinh_nghia:`
      <p>GERD là tình trạng trào ngược nội dung dạ dày lên thực quản gây triệu chứng phiền toái (ợ nóng, trào ngược ≥2 lần/tuần) và/hoặc biến chứng (viêm thực quản, hẹp, Barrett thực quản).</p>
      <div class="subhead">Phân loại kiểu hình</div>
      <p>GERD không viêm trợt (NERD) — nội soi bình thường; GERD viêm trợt thực quản (phân độ Los Angeles A–D); Barrett thực quản — chuyển sản ruột trên nội soi có sinh thiết xác nhận.</p>`,
    chan_doan:`
      <p>Triệu chứng điển hình (ợ nóng, trào ngược) ở người không có dấu hiệu báo động → có thể điều trị thử PPI theo kinh nghiệm <b>không cần nội soi</b>.</p>
      <div class="alert-box alert-danger">Dấu hiệu báo động cần nội soi sớm: nuốt khó/nuốt đau, sụt cân không chủ ý, xuất huyết tiêu hóa/thiếu máu, nôn dai dẳng, tuổi khởi phát &gt;60 hoặc tiền sử gia đình ung thư thực quản-dạ dày.</div>
      <p>Nội soi thực quản-dạ dày-tá tràng khi có dấu hiệu báo động, triệu chứng dai dẳng dù đã điều trị PPI chuẩn, hoặc tầm soát Barrett ở người nguy cơ cao (nam, GERD mạn ≥5 năm, béo phì, hút thuốc, tiền sử gia đình). Đo pH-trở kháng thực quản 24h khi chẩn đoán không chắc chắn hoặc trước cân nhắc phẫu thuật chống trào ngược.</p>`,
    dieu_tri:`
      <div class="subhead">Nền tảng — thay đổi lối sống</div>
      <p>Giảm cân nếu thừa cân/béo phì, tránh ăn trong vòng 2–3h trước ngủ, kê cao đầu giường, tránh thực phẩm/thức uống khởi phát triệu chứng (rượu, cà phê, socola, thức ăn nhiều dầu mỡ, thuốc lá).</p>
      <div class="subhead">Điều trị thuốc</div>
      <ul>
        <li><b>PPI</b> liều chuẩn × <b>8 tuần</b> là điều trị đầu tay cho GERD viêm trợt hoặc triệu chứng điển hình dai dẳng, uống <b>30–60 phút trước bữa ăn sáng</b> để hiệu quả tối ưu</li>
        <li>Sau đáp ứng: chỉnh xuống liều thấp nhất kiểm soát được triệu chứng hoặc dùng khi cần (on-demand) ở NERD; GERD viêm trợt độ C/D hoặc Barrett cần duy trì PPI dài hạn</li>
        <li>Không đáp ứng PPI liều chuẩn: tăng gấp đôi liều (chia 2 lần/ngày) trước khi coi là "GERD kháng trị"</li>
      </ul>
      <div class="subhead">GERD kháng trị thật sự (đã loại trừ tuân thủ kém, chẩn đoán khác)</div>
      <p>Cân nhắc phẫu thuật chống trào ngược (Nissen) hoặc thiết bị tăng cường cơ thắt thực quản dưới (LINX) ở bệnh nhân được chọn lọc kỹ dựa trên đo pH-trở kháng và áp lực thực quản.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">PPI dài hạn liều cao liên quan tăng nhẹ nguy cơ gãy xương, thiếu vitamin B12/magie, viêm thận kẽ — dùng liều thấp nhất hiệu quả, đánh giá lại chỉ định định kỳ mỗi 6–12 tháng.</div>
      ${rt(["Liều chuẩn","Cao tuổi/thận yếu"],[
        ["Omeprazole","20mg × 1 lần/ngày (trước ăn sáng)","không cần chỉnh liều theo thận; thận trọng tương tác clopidogrel"],
        ["Esomeprazole","20–40mg × 1 lần/ngày","tương tự omeprazole"],

        ["Rabeprazole","20mg × 1 lần/ngày","tương tự nhóm"],
        ["Famotidine (bổ sung ban đêm/triệu chứng nhẹ)","20–40mg trước ngủ","giảm liều nếu eGFR&lt;50"]
      ])}`,

{
  spec:"tieu_hoa", id:"pancreatitis", emoji:"🔶", short:"VT cấp", title:"Viêm tụy cấp",
  guidelines:["ACG 2024","IAP/APA 2013 (còn tham chiếu)"],
  sections:{
    dinh_nghia:`
      <p>Viêm tụy cấp được chẩn đoán khi có <b>≥2/3 tiêu chí</b>: (1) đau bụng điển hình (thượng vị, lan sau lưng), (2) lipase hoặc amylase máu ≥3 lần giới hạn trên bình thường, (3) hình ảnh học (CT/MRI/siêu âm) phù hợp viêm tụy cấp.</p>
      <p>Nguyên nhân thường gặp nhất: <b>sỏi mật</b> (~40%) và <b>rượu</b> (~30%); các nguyên nhân khác: tăng triglyceride máu nặng (&gt;1000mg/dL), thuốc, sau ERCP, tăng canxi máu, u tụy, tự miễn.</p>`,
    chan_doan:`
      <div class="alert-box alert-info">Không cần cả amylase và lipase cùng lúc — <b>lipase đặc hiệu hơn amylase</b> và tăng kéo dài hơn, là xét nghiệm ưu tiên. Mức độ tăng men tụy <b>không tương quan</b> với độ nặng bệnh — không dùng để tiên lượng hay theo dõi đáp ứng điều trị.</div>
      <div class="subhead">🧮 Thang điểm BISAP — tiên lượng độ nặng sớm (trong 24h đầu)</div>
      <p>Ưu điểm so với Ranson/APACHE II: tính được ngay khi nhập viện, không cần chờ đủ 48h.</p>
      ${sc("bisap","Thang điểm BISAP",[
        {label:"BUN &gt;25 mg/dL (8.9 mmol/L)",pts:1},
        {label:"Rối loạn tri giác (Impaired mental status)",pts:1},
        {label:"Hội chứng đáp ứng viêm hệ thống — SIRS (≥2 tiêu chí: mạch&gt;90, thở&gt;20 hoặc PaCO2&lt;32, nhiệt độ&lt;36 hoặc&gt;38, BC&lt;4.000 hoặc&gt;12.000)",pts:1},
        {label:"Tuổi &gt;60",pts:1},
        {label:"Tràn dịch màng phổi trên hình ảnh học",pts:1}
      ])}
      <p>BISAP ≥3: nguy cơ tử vong và biến chứng nặng tăng đáng kể (nguy cơ tử vong có thể lên đến ~15-20% ở điểm cao) — cân nhắc theo dõi sát/ICU sớm.</p>
      <p>Hình ảnh học: siêu âm bụng thường quy tìm sỏi mật ở mọi bệnh nhân; CT bụng có cản quang <b>không cần thiết thường quy lúc nhập viện</b> trừ khi chẩn đoán không chắc chắn — chỉ định CT khi triệu chứng không cải thiện sau 48-72h để đánh giá biến chứng (hoại tử, nang giả tụy, ổ dịch).</p>`,
    dieu_tri:`
      <div class="subhead">Nền tảng — mọi mức độ nặng</div>
      <ul>
        <li><b>Bù dịch tinh thể sớm và đầy đủ</b> trong 24h đầu — dịch Ringer lactate được ưu tiên hơn NaCl 0.9% (ít gây toan chuyển hóa tăng clo hơn); theo dõi đáp ứng qua nước tiểu, không bù dịch quá mức gây hội chứng khoang bụng/phù phổi</li>
        <li><b>Cho ăn sớm qua đường miệng</b> ngay khi dung nạp được (thường trong 24h đầu nếu không buồn nôn/nôn/đau nhiều) — ACG 2024 khuyến cáo mạnh việc cho ăn sớm thay vì nhịn ăn kéo dài như quan niệm cũ, giúp giảm biến chứng nhiễm trùng và rút ngắn thời gian nằm viện</li>
        <li>Giảm đau đầy đủ (opioid nếu cần, không còn khuyến cáo tránh morphine như quan niệm cũ về co thắt Oddi)</li>
      </ul>
      <div class="subhead">Viêm tụy cấp do sỏi mật</div>
      <p><b>Cắt túi mật nội soi trong cùng đợt nhập viện</b> (viêm tụy nhẹ) sau khi triệu chứng cải thiện — trì hoãn cắt túi mật làm tăng đáng kể nguy cơ tái phát viêm tụy/biến chứng đường mật trước lần phẫu thuật theo lịch hẹn. ERCP cấp cứu chỉ định khi kèm viêm đường mật cấp hoặc tắc mật kéo dài rõ ràng.</p>
      <div class="subhead">Kháng sinh</div>
      <div class="alert-box alert-warn"><b>Không dùng kháng sinh dự phòng thường quy</b> cho viêm tụy cấp hoại tử vô trùng — chỉ dùng khi có bằng chứng/nghi ngờ nhiễm trùng thật sự (hoại tử nhiễm trùng xác nhận qua chọc hút/cấy, hoặc nhiễm trùng ngoài tụy đi kèm như viêm đường mật).</div>
      <div class="subhead">Biến chứng tại chỗ (hoại tử, nang giả tụy, ổ dịch)</div>
      <p>Hoại tử nhiễm trùng có triệu chứng: can thiệp dẫn lưu (ưu tiên nội soi qua thành dạ dày hoặc qua da) theo chiến lược "step-up" tối thiểu xâm lấn trước khi cân nhắc phẫu thuật mở — trì hoãn can thiệp đến khi hoại tử "khu trú hóa" (thường sau 4 tuần) nếu tình trạng lâm sàng cho phép.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Ringer lactate (bù dịch 24h đầu)","5-10mL/kg/giờ ban đầu, điều chỉnh theo đáp ứng lâm sàng/nước tiểu","theo dõi sát ở người cao tuổi/suy tim tránh quá tải dịch"],
        ["Morphine/Fentanyl (giảm đau)","theo bậc thang giảm đau, chuẩn độ theo đáp ứng","không còn chống chỉ định morphine do lo ngại co thắt Oddi như quan niệm cũ"],
        ["Meropenem (chỉ khi xác định/nghi hoại tử nhiễm trùng)","1g × 3 lần/ngày TM","không dùng dự phòng thường quy khi chưa có bằng chứng nhiễm trùng"],
        ["Insulin (nếu do tăng triglyceride nặng)","truyền TM liên tục theo phác đồ hạ triglyceride cấp","kèm/thay thế plasmapheresis nếu triglyceride rất cao (&gt;1000mg/dL) kèm viêm tụy nặng"]
      ])}
      <div class="age-tag">Người cao tuổi</div>
      <p>Ngưỡng nghi ngờ biến chứng nên thấp hơn (triệu chứng có thể kín đáo); thận trọng tốc độ bù dịch ở người suy tim/bệnh thận mạn — theo dõi sát hơn dấu hiệu quá tải dịch.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Lipase là xét nghiệm men tụy ưu tiên hơn amylase",'<span class="badge badge-I">I</span>'],
        ["Bù dịch Ringer lactate sớm trong 24h đầu",'<span class="badge badge-I">I</span>'],
        ["Cho ăn sớm qua đường miệng ngay khi dung nạp được",'<span class="badge badge-I">I</span>'],
        ["Cắt túi mật cùng đợt nhập viện cho viêm tụy do sỏi mật mức độ nhẹ",'<span class="badge badge-I">I</span>'],
        ["Kháng sinh dự phòng thường quy cho hoại tử tụy vô trùng",'<span class="badge badge-III">III</span>'],
        ["Nhịn ăn kéo dài thường quy chờ men tụy về bình thường",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"ACG Clinical Guideline: Management of Acute Pancreatitis 2024; IAP/APA Evidence-Based Guidelines for Acute Pancreatitis 2013"
