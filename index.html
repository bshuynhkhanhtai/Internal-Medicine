{
  spec:"tim_mach", id:"ccs", emoji:"🫀", short:"HCVM", title:"Hội chứng vành mạn (CCS)",
  guidelines:["ESC 2024","ACC/AHA/ACP 2023"],
  sections:{
    dinh_nghia:`
      <p>Hội chứng vành mạn (Chronic Coronary Syndrome — CCS, trước đây gọi là "bệnh mạch vành ổn định") là thuật ngữ ESC 2024 dùng để mô tả các giai đoạn tiến triển khác nhau của bệnh động mạch vành, <b>ngoại trừ</b> giai đoạn cấp tính (ACS). Bao gồm: đau thắt ngực ổn định do hẹp mạch vành thượng tâm mạc, co thắt mạch vành (vasospastic angina), rối loạn chức năng vi mạch vành (INOCA/ANOCA), bệnh nhân sau ACS/tái thông mạch vành đã ổn định, và bệnh nhân được phát hiện tình cờ có bệnh mạch vành qua hình ảnh học.</p>`,
    chan_doan:`
      <p><b>Xác suất tiền nghiệm (pre-test probability)</b> dựa vào tuổi, giới, đặc điểm đau ngực (điển hình/không điển hình/không do tim) định hướng lựa chọn xét nghiệm chẩn đoán tiếp theo.</p>
      <div class="subhead">Lựa chọn xét nghiệm không xâm lấn theo xác suất tiền nghiệm (ESC 2024)</div>
      ${rt(["Xét nghiệm ưu tiên"],[
        ["Xác suất thấp (&lt;5%)","Không cần thêm xét nghiệm tim mạch đặc hiệu, tìm nguyên nhân khác"],
        ["Xác suất thấp–trung bình (5–15%)","CT mạch vành (CCTA) là lựa chọn hàng đầu — độ nhạy cao loại trừ bệnh mạch vành tắc nghẽn"],
        ["Xác suất trung bình–cao (&gt;15%)","CCTA hoặc xét nghiệm chức năng có hình ảnh (siêu âm tim gắng sức, xạ hình tưới máu cơ tim, MRI tim gắng sức) tùy đặc điểm bệnh nhân và sẵn có tại chỗ"],
        ["Nghi ngờ rối loạn chức năng vi mạch/co thắt mạch vành (INOCA)","Chụp mạch vành có đo dự trữ lưu lượng vành (FFR/iFR) và test kích thích co thắt (acetylcholine) nếu mạch vành thượng tâm mạc không tắc nghẽn đáng kể trên hình ảnh"]
      ])}
      <div class="alert-box alert-info"><b>Điểm mới ESC 2024:</b> CCTA được nâng lên vị trí ưu tiên hàng đầu ở nhóm xác suất thấp-trung bình nhờ giá trị tiên đoán âm rất cao, giúp loại trừ an toàn bệnh mạch vành tắc nghẽn mà không cần xét nghiệm xâm lấn.</div>`,
    dieu_tri:`
      <div class="subhead">Điều trị nội khoa tối ưu (OMT) — nền tảng cho mọi bệnh nhân CCS</div>
      <div class="subhead">1. Thuốc cải thiện tiên lượng (bắt buộc, không phụ thuộc triệu chứng)</div>
      <ul>
        <li><b>Aspirin liều thấp</b> (75–100mg/ngày) suốt đời trừ chống chỉ định</li>
        <li><b>Statin cường độ cao</b>, đích LDL-C &lt;55mg/dL (&lt;1.4mmol/L) và giảm ≥50% so nền — thêm ezetimibe/ức chế PCSK9 nếu không đạt đích</li>
        <li><b>ACEi/ARB</b> nếu kèm đái tháo đường, suy tim EF giảm, tăng huyết áp, hoặc bệnh thận mạn</li>
      </ul>
      <div class="subhead">2. Thuốc kiểm soát triệu chứng đau thắt ngực (bậc thang)</div>
      <ul>
        <li><b>Bước 1:</b> <b>Chẹn beta</b> hoặc <b>chẹn kênh canxi</b> (chọn theo tần số tim, huyết áp, chức năng thất trái, bệnh đồng mắc) — cả hai đều là lựa chọn hàng đầu ngang nhau theo ESC 2024, không còn ưu tiên tuyệt đối chẹn beta như trước</li>
        <li><b>Bước 2</b> (không đáp ứng đơn trị): phối hợp chẹn beta + chẹn kênh canxi (loại dihydropyridine)</li>
        <li><b>Bước 3</b> (còn triệu chứng dù đã phối hợp bước 2): thêm thuốc hàng hai — nitrat tác dụng dài, ivabradine (nếu nhịp xoang nhanh, EF giảm), nicorandil, ranolazine, hoặc trimetazidine tùy đặc điểm bệnh nhân</li>
      </ul>
      <div class="subhead">3. Tái thông mạch vành (PCI/CABG)</div>
      <p>Chỉ định khi: <b>còn triệu chứng dù đã điều trị nội khoa tối ưu</b>, hoặc vùng thiếu máu cơ tim rộng trên xét nghiệm chức năng, hoặc giải phẫu nguy cơ cao (hẹp thân chung, bệnh 3 nhánh kèm rối loạn chức năng thất trái). <b>CABG ưu tiên hơn PCI</b> ở bệnh nhân đái tháo đường có bệnh nhiều nhánh mạch vành phức tạp (theo thang điểm SYNTAX cao).</p>
      <div class="alert-box alert-warn">Nghiên cứu ISCHEMIA khẳng định: ở CCS ổn định, tái thông mạch vành <b>không</b> giảm tử vong/NMCT so với điều trị nội khoa tối ưu đơn thuần (trừ hẹp thân chung) — vai trò chính của can thiệp là <b>cải thiện triệu chứng</b>, không phải cải thiện tiên lượng sống còn ở đa số trường hợp không nguy cơ cao.</div>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Bisoprolol (chẹn beta)","2.5mg/ngày → tối đa 10mg/ngày","giảm liều khởi đầu ở người cao tuổi/COPD (dùng chọn lọc β1)"],
        ["Amlodipine (chẹn kênh canxi)","5mg/ngày → tối đa 10mg/ngày","phù ngoại biên phụ thuộc liều, không do giữ dịch"],
        ["Diltiazem (nếu không dùng cùng chẹn beta)","60–120mg × 2-3 lần/ngày dạng phóng thích thường, hoặc phóng thích chậm 1 lần/ngày","tránh phối hợp cùng chẹn beta (nguy cơ block nhĩ-thất nặng)"],
        ["Isosorbide mononitrate (nitrat tác dụng dài)","30–60mg/ngày × 1 lần","cần khoảng trống không nitrat 10–12h/ngày tránh dung nạp thuốc"],
        ["Ivabradine (nếu nhịp xoang≥70/phút)","5mg×2/ngày → tối đa 7.5mg×2/ngày","chỉ hiệu quả nếu còn nhịp xoang; theo dõi nhìn mờ/rối loạn thị giác"],
        ["Trimetazidine","35mg × 2 lần/ngày","tránh ở bệnh Parkinson/rối loạn vận động; chống chỉ định suy thận nặng"]
      ])}
      <div class="age-tag">Người cao tuổi</div>
      <p>Khởi liều thấp hơn cho chẹn beta/chẹn kênh canxi, theo dõi hạ huyết áp tư thế/nhịp chậm quá mức; cân nhắc kỹ lợi ích tái thông mạch vành ở người rất cao tuổi/nhiều bệnh đồng mắc dựa trên kỳ vọng sống và mục tiêu điều trị cá thể hóa.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["CCTA là xét nghiệm hàng đầu ở nhóm xác suất tiền nghiệm thấp-trung bình",'<span class="badge badge-I">I</span>'],
        ["Statin cường độ cao + đích LDL-C&lt;55mg/dL cho mọi bệnh nhân CCS",'<span class="badge badge-I">I</span>'],
        ["Chẹn beta và chẹn kênh canxi là lựa chọn hàng đầu ngang nhau cho kiểm soát triệu chứng",'<span class="badge badge-I">I</span>'],
        ["Tái thông mạch vành khi còn triệu chứng dù đã điều trị nội khoa tối ưu",'<span class="badge badge-I">I</span>'],
        ["Tái thông mạch vành thường quy để cải thiện tiên lượng sống còn ở CCS nguy cơ thấp-trung bình (trừ hẹp thân chung)",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"2024 ESC Guidelines for the management of chronic coronary syndromes, Eur Heart J 2024; 2023 AHA/ACC/ACCP/ASPC/NLA/PCNA Guideline for Chronic Coronary Disease"
},
{
  spec:"tim_mach", id:"lipid", emoji:"🧈", short:"Lipid", title:"Rối loạn lipid máu",
  guidelines:["ESC/EAS 2019 + Focused Update 2025","ACC/AHA 2026 Dyslipidemia"],
  sections:{
    dinh_nghia:`
      <p>Rối loạn lipid máu là bất thường nồng độ lipoprotein huyết tương (LDL-C, HDL-C, triglyceride, Lp(a)) làm tăng nguy cơ xơ vữa động mạch. <b>LDL-C</b> là mục tiêu điều trị chính.</p>
      <div class="subhead">Phân tầng nguy cơ tim mạch (SCORE2/SCORE2-OP)</div>
      <p>Rất cao: đã có bệnh tim mạch do xơ vữa, ĐTĐ có tổn thương cơ quan đích, bệnh thận mạn nặng, tăng cholesterol máu gia đình kèm yếu tố nguy cơ khác. Cao/trung bình/thấp: theo thang điểm nguy cơ 10 năm.</p>`,
    chan_doan:`
      <div class="subhead">🧮 Ước tính nhanh nguy cơ tim mạch 10 năm — SCORE2 / SCORE2-OP</div>
      <div class="alert-box alert-info">Công cụ dưới đây cho ước tính <b>gần đúng, mang tính sàng lọc nhanh</b> dựa theo xu hướng phân tầng nguy cơ SCORE2/SCORE2-OP của ESC — <b>không thay thế</b> công cụ tính chính thức khi ra quyết định điều trị statin. Đối với quyết định lâm sàng chính xác, dùng máy tính SCORE2 chính thức (u-prevent.com hoặc ứng dụng ESC CVD-Risk-Calculation).</div>
      ${sc2()}
      <div class="subhead">Ngưỡng phân loại nguy cơ theo tuổi (ESC 2021)</div>
      ${rt(["Nguy cơ thấp-TB","Nguy cơ cao","Nguy cơ rất cao"],[
        ["Tuổi &lt;50","&lt;2.5%","2.5–&lt;7.5%","≥7.5%"],
        ["Tuổi 50–69","&lt;5%","5–&lt;10%","≥10%"],
        ["Tuổi ≥70 (SCORE2-OP)","&lt;7.5%","7.5–&lt;15%","≥15%"]
      ])}
      <div class="subhead">Phân tầng nguy cơ theo bệnh cảnh lâm sàng (áp dụng trực tiếp — không cần tính SCORE2)</div>
      <p>Rất cao: đã có bệnh tim mạch do xơ vữa, ĐTĐ có tổn thương cơ quan đích, bệnh thận mạn nặng, tăng cholesterol máu gia đình kèm yếu tố nguy cơ khác — nhóm này xếp thẳng vào nguy cơ rất cao, không cần tính SCORE2.</p>
      <p>Bilan lipid máu (không nhất thiết nhịn đói): cholesterol toàn phần, LDL-C, HDL-C, triglyceride, non-HDL-C; đo <b>Lp(a) ít nhất một lần trong đời</b>.</p>
      ${rt(["Ngưỡng cần lưu ý"],[
        ["LDL-C gợi ý tăng cholesterol máu gia đình","&gt;4.9 mmol/L (~190 mg/dL) không điều trị"],
        ["Triglyceride cao","≥1.7 mmol/L (~150 mg/dL)"],
        ["Lp(a) tăng nguy cơ","&gt;50 mg/dL (~125 nmol/L)"]
      ])}`,
    dieu_tri:`
      <div class="subhead">Đích LDL-C theo phân tầng nguy cơ</div>
      ${rt(["Đích LDL-C"],[
        ["Rất cao","&lt;1.4 mmol/L (&lt;55 mg/dL) và giảm ≥50% so nền"],
        ["Cao","&lt;1.8 mmol/L (&lt;70 mg/dL) và giảm ≥50%"],
        ["Trung bình","&lt;2.6 mmol/L (&lt;100 mg/dL)"],
        ["Thấp","&lt;3.0 mmol/L (&lt;116 mg/dL)"]
      ])}
      <div class="subhead">Chiến lược bậc thang</div>
      <ul>
        <li><b>Bước 1:</b> statin cường độ cao nhất dung nạp được</li>
        <li><b>Bước 2:</b> thêm ezetimibe nếu chưa đạt đích</li>
        <li><b>Bước 3:</b> thêm ức chế PCSK9 nếu vẫn chưa đạt đích ở nguy cơ rất cao</li>
      </ul>
      <div class="alert-box alert-info">Nguy cơ rất cao có biến cố tim mạch tái phát trong 2 năm dù đã statin liều tối đa: có thể xem xét đích LDL-C &lt;1.0 mmol/L (&lt;40 mg/dL).</div>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">Người châu Á, cao tuổi, cân nặng thấp: nguy cơ tăng men gan/đau cơ cao hơn — nhiều hướng dẫn giới hạn rosuvastatin ≤20mg/ngày cho người châu Á trừ khi giám sát chặt.</div>
      ${rt(["Liều tiêu chuẩn","Cao tuổi / thận yếu"],[
        ["Atorvastatin","10–80 mg/ngày (cường độ cao 40–80mg)","khởi đầu 10–20 mg/ngày"],
        ["Rosuvastatin","5–40 mg/ngày (cường độ cao 20–40mg)","khởi đầu 5–10mg; thận trọng &gt;20mg ở người châu Á/eGFR&lt;30"],
        ["Ezetimibe","10 mg/ngày","không cần chỉnh theo tuổi"],
        ["Evolocumab (PCSK9i)","140mg TDD/2 tuần hoặc 420mg/tháng","không cần chỉnh theo tuổi/thận"],
        ["Alirocumab (PCSK9i)","75mg TDD/2 tuần (có thể tăng 150mg)","không cần chỉnh theo tuổi/thận"],

{
  spec:"tim_mach", id:"pad", emoji:"🦵", short:"BĐMNB", title:"Bệnh động mạch ngoại biên (PAD)",
  guidelines:["ESC 2024 (PAD)","AHA/ACC 2016 (còn tham chiếu)"],
  sections:{
    dinh_nghia:`
      <p>Bệnh động mạch ngoại biên (PAD) là hẹp/tắc động mạch chi dưới do xơ vữa, biểu hiện từ không triệu chứng, đau cách hồi (claudication) khi gắng sức, đến thiếu máu chi trầm trọng mạn tính (CLTI) đe dọa mất chi.</p>`,
    chan_doan:`
      <div class="subhead">Chỉ số cổ chân-cánh tay (ABI — Ankle-Brachial Index)</div>
      ${rt(["Diễn giải"],[
        ["&gt;1.40","Mạch máu cứng/vôi hóa không nén được — cần xét nghiệm bổ sung (chỉ số ngón chân-cánh tay, sóng Doppler)"],
        ["1.00–1.40","Bình thường"],
        ["0.91–0.99","Ranh giới (borderline)"],
        ["0.41–0.90","PAD nhẹ-trung bình"],
        ["≤0.40","PAD nặng — nguy cơ thiếu máu chi trầm trọng"]
      ])}
      <p>ABI đo lúc nghỉ; nếu bình thường nhưng lâm sàng vẫn nghi ngờ cao (đau cách hồi điển hình) → đo ABI sau gắng sức (giảm ≥20% gợi ý PAD). Chụp mạch (CTA/MRA/DSA) khi cần lập kế hoạch tái thông mạch.</p>
      <div class="alert-box alert-danger"><b>Thiếu máu chi trầm trọng cấp tính (Acute Limb Ischemia)</b> — cấp cứu mạch máu thật sự, nhận biết qua "6P": Pain (đau đột ngột), Pallor (nhợt), Pulselessness (mất mạch), Paresthesia (dị cảm), Paralysis (liệt), Poikilothermia (lạnh chi) — cần hội chẩn mạch máu/can thiệp tái thông khẩn cấp trong vài giờ để cứu chi.</div>`,
    dieu_tri:`
      <div class="subhead">Điều trị nội khoa nền tảng — mọi bệnh nhân PAD (tương đương bệnh nhân bệnh mạch vành)</div>
      <ul>
        <li><b>Ngưng thuốc lá</b> — can thiệp đơn lẻ quan trọng nhất, cải thiện rõ rệt tiên lượng cả về chi lẫn tim mạch toàn thân</li>
        <li><b>Statin cường độ cao</b> cho mọi bệnh nhân PAD bất kể LDL-C nền, đích LDL-C&lt;55mg/dL tương tự bệnh mạch vành</li>
        <li><b>Kháng kết tập tiểu cầu đơn</b> (aspirin hoặc clopidogrel) cho PAD có triệu chứng; cân nhắc phối hợp aspirin liều thấp + rivaroxaban liều rất thấp (2.5mg×2/ngày) ở nhóm nguy cơ cao theo nghiên cứu COMPASS/VOYAGER-PAD</li>
        <li>Kiểm soát tối ưu các yếu tố nguy cơ khác: HA, đường huyết nếu ĐTĐ</li>
      </ul>
      <div class="subhead">Điều trị đau cách hồi (claudication)</div>
      <ul>
        <li><b>Chương trình tập luyện có giám sát</b> (supervised exercise therapy) là điều trị đầu tay, bằng chứng mạnh ngang hoặc vượt trội can thiệp mạch máu về cải thiện khoảng cách đi bộ</li>
        <li><b>Cilostazol</b> cải thiện triệu chứng đau cách hồi nếu tập luyện không đủ hiệu quả (chống chỉ định nếu có suy tim)</li>
        <li>Tái thông mạch (nong bóng/đặt stent hoặc phẫu thuật bắc cầu) khi triệu chứng ảnh hưởng đáng kể chất lượng sống dù đã tối ưu điều trị nội khoa + tập luyện</li>
      </ul>
      <div class="subhead">Thiếu máu chi trầm trọng mạn tính (CLTI)</div>
      <p>Cần tái thông mạch (nội mạch hoặc phẫu thuật bắc cầu) sớm để cứu chi — trì hoãn làm tăng nguy cơ cắt cụt chi; chăm sóc vết thương đa chuyên khoa song song.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Aspirin","75-100mg/ngày","suốt đời trừ chống chỉ định"],
        ["Clopidogrel (thay thế/phối hợp)","75mg/ngày","có thể ưu tiên hơn aspirin đơn độc theo một số bằng chứng ở PAD triệu chứng"],
        ["Rivaroxaban liều thấp (phối hợp, nguy cơ cao)","2.5mg × 2 lần/ngày kèm aspirin 100mg/ngày","chống chỉ định nếu nguy cơ chảy máu cao"],
        ["Cilostazol","100mg × 2 lần/ngày","chống chỉ định tuyệt đối nếu có suy tim (mọi mức độ)"],
        ["Atorvastatin (cường độ cao)","40-80mg/ngày","đích LDL-C&lt;55mg/dL"]
      ])}
      <div class="age-tag">Người cao tuổi</div>
      <p>Đánh giá nguy cơ té ngã/chảy máu trước khi phối hợp kháng kết tập tiểu cầu kép hoặc thêm kháng đông liều thấp; cân nhắc kỹ nguy cơ phẫu thuật khi quyết định tái thông mạch ở người có nhiều bệnh đồng mắc.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["ABI là xét nghiệm chẩn đoán đầu tay không xâm lấn",'<span class="badge badge-I">I</span>'],
        ["Statin cường độ cao và kháng kết tập tiểu cầu cho mọi PAD có triệu chứng",'<span class="badge badge-I">I</span>'],
        ["Chương trình tập luyện có giám sát là điều trị đầu tay cho đau cách hồi",'<span class="badge badge-I">I</span>'],
        ["Tái thông mạch khẩn cấp khi nghi thiếu máu chi cấp tính (6P)",'<span class="badge badge-I">I</span>'],
        ["Cilostazol ở bệnh nhân có suy tim",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"2024 ESC Guidelines for the management of peripheral arterial and aortic diseases, Eur Heart J 2024"
},
{
  spec:"tim_mach", id:"pe", emoji:"🫁", short:"TTP", title:"Thuyên tắc phổi (PE)",
  guidelines:["AHA/ACC/Multisociety 2026","CHEST 2021"],
  sections:{
    dinh_nghia:`
      <p>Thuyên tắc phổi (PE) là tắc nghẽn động mạch phổi do huyết khối, thường xuất phát từ huyết khối tĩnh mạch sâu (DVT) chi dưới di chuyển lên — PE và DVT được xem là hai biểu hiện của cùng một bệnh lý: thuyên tắc huyết khối tĩnh mạch (VTE).</p>
      <div class="alert-box alert-info"><b>Cập nhật lớn nhất trong nhiều thập kỷ:</b> Guideline <i>"2026 AHA/ACC/ACCP/ACEP/CHEST/SCAI/SHM/SIR/SVM/SVN"</i> (Circulation 2026) — guideline liên hiệp đa hiệp hội đầu tiên của Bắc Mỹ về PE cấp, thay thế hoàn toàn cách phân loại "massive/submassive/low-risk" kinh điển và cả hệ 4 nhóm ESC 2019 bằng hệ thống <b>5 nhóm lâm sàng A-E</b> mới, đồng thời đưa Đội đáp ứng thuyên tắc phổi (PERT) và DOAC/LMWH lên vị trí ưu tiên rõ ràng hơn.</div>
      <div class="subhead">🆕 Phân loại AHA/ACC PE Clinical Categories (2026) — thay cho massive/submassive/ESC 4-nhóm</div>
      ${rt(["Đặc điểm","Xử trí ban đầu"],[
        ["Nhóm A","PE không triệu chứng (phát hiện tình cờ)","Có thể xuất viện an toàn ngay từ cấp cứu, không cần nhập viện"],
        ["Nhóm B","Có triệu chứng, điểm độ nặng lâm sàng thấp (PESI≤85, hoặc sPESI=0, hoặc Bova≤4)","Thường xuất viện sớm sau đánh giá ban đầu"],
        ["Nhóm C","Có triệu chứng, điểm độ nặng lâm sàng cao (PESI&gt;85, hoặc sPESI≥1, hoặc Bova&gt;4), kèm tăng men tim và/hoặc rối loạn chức năng thất phải","Nhập viện tối ưu điều trị"],
        ["Nhóm D (D1–D2)","Suy tim phổi giai đoạn khởi phát (chưa tụt HA rõ nhưng có dấu hiệu giảm tưới máu cơ quan đích)","Nhập viện; liệu pháp tiến bộ CÓ THỂ được cân nhắc"],
        ["Nhóm E (E1–E2)","Suy tim phổi thật sự — tụt huyết áp dai dẳng (SBP&lt;90mmHg, hoặc giảm&gt;40mmHg kéo dài&lt;15 phút, hoặc cần bù dịch/vận mạch)","Nhập viện; liệu pháp tiến bộ HỢP LÝ (E1), ngừng tim (E2)"]
      ])}
      <p>Phân nhóm dựa trên chỉ số lâm sàng/xét nghiệm/hình ảnh học nặng nhất tại thời điểm đánh giá — bệnh nhân có thể chuyển nhóm theo thời gian, cần đánh giá lại liên tục. Ký hiệu "R" thêm vào nhóm (vd. C3R) khi có suy hô hấp kèm theo (giảm oxy máu/tăng công thở).</p>`,
    chan_doan:`
      <div class="subhead">🧮 Thang điểm Wells (PE) — xác suất lâm sàng trước xét nghiệm</div>
      ${sc("wellspe","Thang điểm Wells cho Thuyên tắc phổi",[
        {label:"Dấu hiệu lâm sàng của huyết khối tĩnh mạch sâu (sưng/đau khi ấn dọc tĩnh mạch chi dưới)",pts:3},
        {label:"Chẩn đoán khác ít khả năng hơn PE",pts:3},
        {label:"Nhịp tim &gt;100 lần/phút",pts:1.5},
        {label:"Bất động ≥3 ngày hoặc phẫu thuật trong 4 tuần qua",pts:1.5},
        {label:"Tiền sử DVT/PE trước đây",pts:1.5},
        {label:"Ho ra máu",pts:1},
        {label:"Ung thư đang hoạt động (điều trị trong 6 tháng qua hoặc giảm nhẹ)",pts:1}
      ])}
      <p><b>Phân loại 3 mức:</b> &lt;2đ = xác suất thấp; 2–6đ = xác suất trung bình; &gt;6đ = xác suất cao. <b>Phân loại 2 mức (thường dùng lâm sàng):</b> ≤4đ = "PE ít khả năng" (làm D-dimer trước); &gt;4đ = "PE nhiều khả năng" (chụp CTPA trực tiếp, không cần D-dimer).</p>
      <div class="subhead">🧮 Thuật toán YEARS — đơn giản hóa, giảm số ca cần chụp CTPA</div>
      <p>Đánh giá 3 tiêu chí lâm sàng, kết hợp ngưỡng D-dimer <b>thay đổi tùy số tiêu chí dương tính</b> (khác với Wells dùng ngưỡng D-dimer cố định 500ng/mL cho mọi mức xác suất):</p>
      ${sc("years","Tiêu chí YEARS",[
        {label:"Dấu hiệu lâm sàng của huyết khối tĩnh mạch sâu (DVT)",pts:1},
        {label:"Ho ra máu",pts:1},
        {label:"PE là chẩn đoán khả năng nhất",pts:1}
      ])}
      <div class="alert-box alert-info"><b>Áp dụng ngưỡng D-dimer theo số tiêu chí YEARS dương tính:</b> Nếu <b>0 tiêu chí</b> dương tính VÀ D-dimer &lt;1000 ng/mL → loại trừ PE an toàn, không cần CTPA. Nếu <b>≥1 tiêu chí</b> dương tính, cần ngưỡng D-dimer thấp hơn: &lt;500 ng/mL mới loại trừ được PE — ngược lại (≥1 tiêu chí và D-dimer≥500, hoặc 0 tiêu chí và D-dimer≥1000) → chỉ định chụp CTPA. Thuật toán YEARS giúp giảm ~14% số ca cần chụp CT so với Wells + ngưỡng D-dimer cố định.</div>
      <div class="subhead">Chẩn đoán hình ảnh xác định</div>
      <p><b>CT mạch máu phổi (CTPA)</b> là tiêu chuẩn vàng. Xạ hình thông khí-tưới máu (V/Q scan) là lựa chọn thay thế ở người chống chỉ định cản quang/suy thận nặng/thai kỳ (giảm phơi nhiễm tia xạ vú). Siêu âm tim tại giường hữu ích đánh giá nhanh rối loạn chức năng thất phải ở bệnh nhân huyết động không ổn định không thể di chuyển đi chụp CT.</p>
      <div class="subhead">🧮 PESI đơn giản hóa (sPESI) — tiên lượng, hỗ trợ quyết định điều trị ngoại trú</div>
      ${sc("spesi","sPESI (Simplified PESI)",[
        {label:"Tuổi &gt;80",pts:1},
        {label:"Ung thư",pts:1},
        {label:"Suy tim mạn hoặc bệnh phổi mạn tính",pts:1},
        {label:"Nhịp tim ≥110 lần/phút",pts:1},
        {label:"Huyết áp tâm thu &lt;100mmHg",pts:1},
        {label:"SpO2 &lt;90%",pts:1}
      ])}
      <p>sPESI = 0: nguy cơ tử vong 30 ngày rất thấp — có thể cân nhắc điều trị ngoại trú ở bệnh nhân PE nguy cơ thấp phù hợp. sPESI ≥1: nguy cơ tăng, cân nhắc nhập viện theo dõi.</p>
      <div class="subhead">🧮 Thang điểm Bova — phân tầng bổ sung ở PE huyết động ổn định (dùng để xếp nhóm B/C theo AHA/ACC 2026)</div>
      ${sc("bova","Thang điểm Bova",[
        {label:"Huyết áp tâm thu 90–100mmHg",pts:2},
        {label:"Tăng troponin tim",pts:2},
        {label:"Rối loạn chức năng thất phải trên siêu âm tim/CT",pts:2},
        {label:"Nhịp tim ≥110 lần/phút",pts:1}
      ])}
      <p>Giai đoạn I (0–2đ): nguy cơ thấp. Giai đoạn II (3–4đ): nguy cơ trung bình. Giai đoạn III (&gt;4đ): nguy cơ cao biến chứng liên quan PE trong 30 ngày — theo AHA/ACC 2026, Bova&gt;4 (cùng PESI&gt;85 hoặc sPESI≥1) là tiêu chí xếp vào nhóm C (điểm độ nặng lâm sàng cao).</p>`,
    dieu_tri:`
      <div class="subhead">🚑 Đội đáp ứng thuyên tắc phổi (PERT) — khuyến cáo mới, Class I</div>
      <p>AHA/ACC 2026 khuyến cáo <b>kích hoạt PERT</b> (đội đa chuyên khoa: tim mạch, hô hấp, huyết học, can thiệp, ngoại lồng ngực, hồi sức) cho các trường hợp PE nhóm C trở lên — cải thiện tốc độ ra quyết định và phối hợp điều trị, đặc biệt khi cân nhắc liệu pháp tiến bộ.</p>
      <div class="subhead">Xử trí theo nhóm lâm sàng A-E (AHA/ACC 2026)</div>
      ${rt(["Xử trí"],[
        ["Nhóm A (không triệu chứng)","Kháng đông ngoại trú, xuất viện an toàn ngay từ cấp cứu"],
        ["Nhóm B (triệu chứng, độ nặng thấp)","Kháng đông, xuất viện sớm sau đánh giá ban đầu nếu điều kiện xã hội-y tế cho phép"],
        ["Nhóm C (triệu chứng, độ nặng cao/tăng men tim/RL thất phải)","Nhập viện, kháng đông, kích hoạt PERT, theo dõi sát nguy cơ xấu đi"],
        ["Nhóm D1–D2 (suy tim phổi khởi phát)","Nhập viện, kích hoạt PERT; liệu pháp tiến bộ (tiêu sợi huyết/can thiệp catheter/lấy huyết khối cơ học) CÓ THỂ được cân nhắc tùy đáp ứng và nguy cơ chảy máu"],
        ["Nhóm E1 (suy tim phổi, tụt HA dai dẳng)","Nhập viện ICU, kích hoạt PERT khẩn; liệu pháp tiến bộ HỢP LÝ — tiêu sợi huyết toàn thân, tiêu sợi huyết qua catheter, lấy huyết khối cơ học, hoặc phẫu thuật đều ở vị trí ngang hàng, chọn theo nguồn lực/kinh nghiệm trung tâm và đặc điểm bệnh nhân"],
        ["Nhóm E2 (ngừng tim do PE)","Hồi sức ACLS + cân nhắc tiêu sợi huyết cấp cứu/ECMO-VA bắc cầu đến can thiệp dứt điểm tùy nguồn lực"]
      ])}
      <div class="alert-box alert-info"><b>Thay đổi quan trọng nhất so với ESC 2019:</b> AHA/ACC 2026 đánh giá bằng chứng hiện có <b>không còn ủng hộ vị trí ưu tiên tuyệt đối của tiêu sợi huyết toàn thân</b> so với các liệu pháp qua catheter ở nhóm E1 — cả hai được xếp cùng mức khuyến cáo, lựa chọn dựa trên đặc điểm cụ thể từng bệnh nhân (nguy cơ chảy máu, bệnh đồng mắc) và năng lực/kinh nghiệm của trung tâm điều trị.</div>
      <div class="subhead">💉 Kháng đông ban đầu — thay đổi quan trọng AHA/ACC 2026</div>
      <p><b>LMWH (enoxaparin) được khuyến cáo ưu tiên hơn UFH</b> cho kháng đông đường tiêm ban đầu ở đa số bệnh nhân — khác với thực hành trước đây thường dùng UFH rộng rãi hơn do thời gian bán hủy ngắn/dễ đảo ngược. UFH vẫn là lựa chọn hợp lý khi: cần khả năng đảo ngược nhanh (chuẩn bị can thiệp/phẫu thuật), suy thận nặng, huyết động không ổn định cần chỉnh liều linh hoạt theo giờ.</p>
      <p><b>DOAC tiếp tục được ưu tiên hơn warfarin</b> ở đa số bệnh nhân PE huyết động ổn định (nhóm A-C) — không cần theo dõi INR, ít tương tác thuốc-thức ăn hơn.</p>
      <div class="subhead">Thời gian kháng đông</div>
      ${rt(["Thời gian khuyến cáo"],[
        ["PE có yếu tố khởi phát thoáng qua rõ ràng (phẫu thuật, bất động, chấn thương)","3 tháng"],
        ["PE không rõ yếu tố khởi phát (unprovoked)","Kháng đông kéo dài (xem xét vô thời hạn nếu nguy cơ chảy máu thấp-trung bình, đánh giá lại định kỳ hàng năm)"],
        ["PE kèm ung thư đang hoạt động","Kháng đông kéo dài trong suốt thời gian ung thư còn hoạt động"],
        ["PE tái phát (đợt thứ 2 trở lên không rõ yếu tố khởi phát)","Kháng đông kéo dài vô thời hạn"]
      ])}
      <div class="subhead">Lưới lọc tĩnh mạch chủ dưới (IVC filter)</div>
      <p>Chỉ định khi có <b>chống chỉ định tuyệt đối với kháng đông</b> hoặc PE tái phát dù đã kháng đông đầy đủ — không dùng thường quy như biện pháp bổ sung ở bệnh nhân dung nạp kháng đông bình thường.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Enoxaparin (LMWH, ưu tiên khởi đầu)","1mg/kg × 2 lần/ngày TDD","giảm liều nếu eGFR&lt;30 (1mg/kg×1 lần/ngày); không cần theo dõi xét nghiệm đông máu thường quy"],
        ["UFH (khi cần đảo ngược nhanh/huyết động không ổn)","80 UI/kg TM bolus → truyền 18 UI/kg/giờ, chỉnh theo aPTT","ưu tiên trước can thiệp/phẫu thuật hoặc suy thận nặng"],
        ["Alteplase (tiêu sợi huyết, nhóm E1)","100mg truyền TM trong 2 giờ (hoặc phác đồ nhanh 0.6mg/kg tối đa 50mg trong 15 phút nếu ngừng tim)","chống chỉ định tuyệt đối: xuất huyết nội sọ, đột quỵ thiếu máu &lt;3 tháng, xuất huyết tiêu hóa gần đây, phẫu thuật lớn gần đây"],
        ["Rivaroxaban","15mg×2/ngày × 21 ngày → 20mg×1/ngày duy trì","không cần bắc cầu heparin, uống cùng thức ăn"],
        ["Apixaban","10mg×2/ngày × 7 ngày → 5mg×2/ngày duy trì","không cần bắc cầu heparin"],
        ["Dabigatran/Edoxaban","cần bắc cầu heparin/enoxaparin 5-10 ngày trước khi chuyển","khác với rivaroxaban/apixaban có thể dùng ngay từ đầu"],
        ["Warfarin (khi DOAC không phù hợp, vd. hội chứng kháng phospholipid)","bắc cầu heparin/enoxaparin đến khi INR 2-3 trong ≥24h","đích INR 2.0-3.0"]
      ])}
      <div class="age-tag">Người cao tuổi/suy thận</div>
      <p>Ưu tiên apixaban ở người cao tuổi/suy thận nhẹ-trung bình (dữ liệu an toàn chảy máu tốt hơn trong nhóm này); tránh DOAC nếu eGFR rất thấp (&lt;15-30 tùy thuốc) — chuyển sang warfarin có bắc cầu heparin.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Dùng Wells hoặc YEARS để đánh giá xác suất lâm sàng trước xét nghiệm",'<span class="badge badge-I">I</span>'],
        ["Phân nhóm lâm sàng A-E để định hướng nơi điều trị và mức độ can thiệp",'<span class="badge badge-I">I</span>'],
        ["Kích hoạt PERT cho PE nhóm C trở lên",'<span class="badge badge-I">I</span>'],
        ["LMWH ưu tiên hơn UFH cho kháng đông tiêm ban đầu",'<span class="badge badge-I">I</span>'],
        ["DOAC ưu tiên hơn warfarin ở PE huyết động ổn định",'<span class="badge badge-I">I</span>'],
        ["Liệu pháp tiến bộ (tiêu sợi huyết/catheter/lấy huyết khối cơ học) hợp lý ở nhóm E1, chọn theo đặc điểm bệnh nhân/trung tâm",'<span class="badge badge-IIa">IIa</span>'],
        ["Xuất viện sớm/ngoại trú cho nhóm A-B phù hợp",'<span class="badge badge-IIa">IIa</span>'],
        ["IVC filter thường quy ở bệnh nhân dung nạp kháng đông bình thường",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"2026 AHA/ACC/ACCP/ACEP/CHEST/SCAI/SHM/SIR/SVM/SVN Guideline for the Evaluation and Management of Acute Pulmonary Embolism in Adults, Circulation 2026; CHEST 2021 Antithrombotic Therapy for VTE Disease"
},
{
  spec:"tim_mach", id:"aortic", emoji:"🩸", short:"Phình ĐMC", title:"Phình động mạch chủ & Hội chứng động mạch chủ cấp",
  guidelines:["ACC/AHA 2022 (Aortic Disease)","ESC 2024 (Peripheral Arterial & Aortic Diseases)","ESVS 2026"],
  sections:{
    dinh_nghia:`
      <p>Phình động mạch chủ (Aortic Aneurysm) là sự giãn khu trú của động mạch chủ ≥1.5 lần đường kính bình thường (thường ≥30 mm với AAA; TAA phụ thuộc vị trí, tuổi, giới, BSA).</p>
      <div class="subhead">Phân loại theo vị trí</div>
      ${rt(["Đặc điểm"],[
        ["Phình gốc/ĐMC lên (Root/Ascending TAA)","≈60% TAA, liên quan van ĐMC, hội chứng di truyền (Marfan, Loeys-Dietz…)"],
        ["Phình cung ĐMC","≈10%"],
        ["Phình ĐMC xuống (Descending TAA)","≈30%"],
        ["Phình ĐMC bụng (AAA)","Phổ biến nhất, ≥30 mm, chủ yếu xơ vữa"],
        ["Phình ĐMC ngực-bụng (TAAA)","Phức tạp, nguy cơ cao"]
      ])}
      <div class="subhead">Hội chứng động mạch chủ cấp (AAS)</div>
      <p>Bao gồm: bóc tách ĐMC (AD), tụ máu trong thành (IMH), loét xuyên thành (PAU), vỡ phình. Phân loại Stanford: <b>Type A</b> (liên quan ĐMC lên) – cấp cứu phẫu thuật; <b>Type B</b> (chỉ ĐMC xuống) – nội khoa ± can thiệp.</p>`,
    chan_doan:`
      <p><b>Tầm soát AAA:</b> Siêu âm bụng cho nam ≥65 tuổi từng hút thuốc (Class I); nam/nữ ≥65 tuổi có người thân bậc 1 bị AAA (Class I).</p>
      <p>CTA là tiêu chuẩn vàng cho AAS và đánh giá trước can thiệp; MRI/MRA ưu tiên theo dõi dài hạn ở người trẻ; siêu âm Doppler theo dõi AAA.</p>
      <div class="subhead">🧮 Thang điểm ADD-RS (Aortic Dissection Detection Risk Score)</div>
      <p>Công cụ sàng lọc nguy cơ bóc tách ĐMC cấp (ACC/AHA). Điểm 0–3 (mỗi nhóm tối đa 1 điểm nếu có bất kỳ yếu tố nào trong nhóm).</p>
      ${sc("addrs","Thang điểm ADD-RS (nguy cơ bóc tách ĐMC)",[
        {label:"[Nhóm 1] Hội chứng Marfan/Loeys-Dietz/Ehlers-Danlos mạch máu hoặc bệnh mô liên kết khác",pts:1},
        {label:"[Nhóm 1] Tiền sử gia đình bệnh động mạch chủ",pts:1},
        {label:"[Nhóm 1] Bệnh van động mạch chủ đã biết",pts:1},
        {label:"[Nhóm 1] Thao tác trên động mạch chủ gần đây",pts:1},
        {label:"[Nhóm 1] Phình động mạch chủ ngực đã biết",pts:1},
        {label:"[Nhóm 2] Đau ngực/lưng/bụng khởi phát đột ngột",pts:1},
        {label:"[Nhóm 2] Đau cường độ tối đa ngay từ đầu",pts:1},
        {label:"[Nhóm 2] Đau kiểu xé/rách/cắt",pts:1},
        {label:"[Nhóm 3] Thiếu hụt mạch hoặc chênh lệch HA tâm thu ≥20 mmHg giữa 2 tay",pts:1},
        {label:"[Nhóm 3] Thiếu sót thần kinh khu trú kèm đau",pts:1},
        {label:"[Nhóm 3] Tiếng thổi hở van ĐMC mới xuất hiện kèm đau",pts:1},
        {label:"[Nhóm 3] Hạ huyết áp hoặc sốc",pts:1}
      ])}
      <p><b>Diễn giải:</b> 0 điểm = nguy cơ thấp → cân nhắc D-dimer; 1 điểm = trung bình → D-dimer, nếu ≥500 ng/mL → CTA; 2–3 điểm = nguy cơ cao → CTA khẩn cấp, không chờ D-dimer.</p>
      <div class="alert-box alert-info">ADD-RS ≤1 + D-dimer âm tính có độ nhạy ≈98–99% để loại trừ AAS.</div>`,
    dieu_tri:`
      <div class="subhead">Điều trị nội khoa nền tảng</div>
      <ul>
        <li>Kiểm soát HA chặt (SBP &lt;130 mmHg, ưu tiên chẹn beta + ACEi/ARB).</li>
        <li>Statin nếu có xơ vữa; ngừng hút thuốc hoàn toàn.</li>
        <li>Theo dõi định kỳ siêu âm/CTA/MRI theo kích thước và tốc độ tăng trưởng.</li>
      </ul>
      <div class="subhead">Ngưỡng chỉ định can thiệp</div>
      ${rt(["Ngưỡng","Ghi chú"],[
        ["AAA nam","≥5.5 cm","Class I"],
        ["AAA nữ","≥5.0 cm","Class I (nguy cơ vỡ cao hơn)"],
        ["Ascending TAA (van 3 lá)","≥5.5 cm","Class I; ≥5.0 cm nếu trung tâm chuyên sâu hoặc yếu tố nguy cơ cao"],
        ["Ascending TAA (Marfan/Loeys-Dietz)","≥5.0 cm hoặc thấp hơn tùy gene","Class I"],
        ["Descending TAA / TAAA","≥6.0 cm","Ưu tiên TEVAR nếu giải phẫu phù hợp"]
      ])}
      <p>Tăng trưởng nhanh (≥5 mm/năm hoặc ≥3 mm/năm × 2 năm) cũng là chỉ định can thiệp. Type A: phẫu thuật cấp cứu (Class I). Type B không biến chứng: nội khoa tối ưu; Type B biến chứng: TEVAR.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Esmolol (cấp)","Bolus 0.5 mg/kg → truyền 50–200 µg/kg/phút","Ưu tiên chẹn beta trước giãn mạch"],
        ["Labetalol","Bolus 20 mg → truyền 1–4 mg/phút","Vừa chẹn beta vừa alpha"],
        ["Nicardipine / Nitroprusside","Theo HA đích","Chỉ dùng sau khi đã chẹn beta"],
        ["Metoprolol / Bisoprolol (duy trì)","Liều chuẩn theo HA và nhịp","Đích nhịp 60–70 lần/phút"]
      ])}`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Tầm soát AAA bằng siêu âm ở nam ≥65 tuổi từng hút thuốc",'<span class="badge badge-I">I</span>'],
        ["CTA khẩn cấp khi ADD-RS ≥2",'<span class="badge badge-I">I</span>'],
        ["Phẫu thuật cấp cứu bóc tách Type A",'<span class="badge badge-I">I</span>'],
        ["Sửa chữa AAA ≥5.5 cm (nam) / ≥5.0 cm (nữ)",'<span class="badge badge-I">I</span>'],
        ["TEVAR ưu tiên cho Descending TAA/TAAA phù hợp giải phẫu",'<span class="badge badge-I">I</span>'],
        ["Dùng thuốc giãn mạch trước khi chẹn beta trong AAS",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease; 2024 ESC Guidelines for peripheral arterial and aortic diseases; ESVS 2026 Guidelines"
},
{
  spec:"tim_mach", id:"cardiomyopathy", emoji:"🫀", short:"Bệnh cơ tim", title:"Bệnh cơ tim (Cardiomyopathies)",
  guidelines:["ESC 2023 (Cardiomyopathies)","AHA/ACC 2024 (Hypertrophic Cardiomyopathy)"],
  sections:{
    dinh_nghia:`
      <p>Bệnh cơ tim là nhóm bệnh lý cơ tim không giải thích được chỉ bởi bệnh mạch vành, THA, bệnh van tim hoặc bệnh tim bẩm sinh. ESC 2023 phân loại theo kiểu hình:</p>
      ${rt(["Đặc điểm chính"],[
        ["Hypertrophic cardiomyopathy (HCM)","Dày thất trái ≥15 mm (hoặc ≥13 mm nếu có đột biến/gene gia đình) không giải thích được bởi điều kiện tải"],
        ["Dilated cardiomyopathy (DCM)","Giãn thất trái + giảm EF không giải thích được bởi tải hoặc thiếu máu"],
        ["Non-dilated LV cardiomyopathy (NDLVC)","Giảm EF hoặc sẹo/xơ hóa mà không giãn thất trái"],
        ["Arrhythmogenic cardiomyopathy (ACM/ARVC)","Thay thế mô mỡ-xơ thất phải/trái, rối loạn nhịp thất"],
        ["Restrictive cardiomyopathy (RCM)","Hạn chế đổ đầy thất, thể tích thất bình thường/giảm"]
      ])}
      <p>HCM là bệnh cơ tim di truyền phổ biến nhất, nguyên nhân hàng đầu đột tử ở người trẻ và vận động viên.</p>`,
    chan_doan:`
      <p>Siêu âm tim là công cụ đầu tay. MRI tim (CMR) đánh giá chính xác độ dày thành, sẹo LGE, phình mỏm thất trái. Xét nghiệm gene khuyến cáo ở HCM/DCM có tính gia đình.</p>
      <div class="subhead">🧮 Thang điểm HCM Risk-SCD (ESC) — ước tính nguy cơ đột tử 5 năm</div>
      <p>Công cụ chính thức ESC để quyết định ICD phòng ngừa tiên phát ở HCM ≥16 tuổi. Các yếu tố nguy cơ chính (AHA/ACC 2024 + ESC):</p>
      ${sc("hcmriskscd","Yếu tố nguy cơ HCM Risk-SCD / AHA-ACC 2024",[
        {label:"Độ dày thành thất trái tối đa ≥30 mm",pts:1},
        {label:"Tiền sử gia đình đột tử do HCM (người thân bậc 1)",pts:1},
        {label:"Ngất không giải thích được (nghi do rối loạn nhịp)",pts:1},
        {label:"NSVT trên Holter (≥3 nhịp liên tiếp, tần số >120–130/phút)",pts:1},
        {label:"Phình mỏm thất trái (apical aneurysm)",pts:1},
        {label:"EF <50% (giai đoạn cuối HCM)",pts:1},
        {label:"Sẹo LGE lan rộng ≥15% khối lượng thất trái trên CMR",pts:1}
      ])}
      <p><b>Phân tầng ESC HCM Risk-SCD:</b> &lt;4%/5 năm = thấp; 4–6% = trung bình (cân nhắc ICD); &gt;6% = cao → khuyến cáo ICD. AHA/ACC 2024 dùng cách tiếp cận dựa trên số lượng yếu tố nguy cơ chính + CMR để hỗ trợ quyết định shared decision-making.</p>
      <div class="alert-box alert-info">Nên dùng máy tính chính thức ESC HCM Risk-SCD (gồm cả tuổi, đường kính nhĩ trái, gradient LVOT) để ước tính % chính xác.</div>`,
    dieu_tri:`
      <div class="subhead">HCM có tắc nghẽn đường ra thất trái (obstructive HCM)</div>
      <ul>
        <li>Chẹn beta (không giãn mạch) là hàng đầu.</li>
        <li>Verapamil/Diltiazem nếu không dung nạp chẹn beta.</li>
        <li>Thêm Disopyramide hoặc <b>Mavacamten</b> (ức chế myosin) nếu còn triệu chứng.</li>
        <li>Giảm vách (myectomy hoặc đốt cồn) tại trung tâm chuyên sâu khi kháng thuốc.</li>
      </ul>
      <div class="subhead">Phòng ngừa đột tử</div>
      <p>ICD phòng ngừa thứ phát (sau ngừng tim/VT bền bỉ): Class I. ICD phòng ngừa tiên phát: theo HCM Risk-SCD &gt;6% hoặc ≥1–2 yếu tố nguy cơ chính (AHA/ACC) + shared decision-making.</p>
      <div class="subhead">DCM / NDLVC</div>
      <p>Điều trị suy tim theo 4 trụ cột (ARNI/ACEi, chẹn beta, MRA, SGLT2i). Cân nhắc ICD/CRT theo EF và QRS. Xét nghiệm gene và sàng lọc gia đình.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Bisoprolol / Metoprolol succinate","Khởi liều thấp → tối đa dung nạp","Ưu tiên không giãn mạch"],
        ["Verapamil","120–480 mg/ngày","Tránh nếu EF thấp hoặc block"],
        ["Disopyramide","100–200 mg × 2–3 lần/ngày","Theo dõi QT, kháng cholinergic"],
        ["Mavacamten","2.5–15 mg/ngày (chỉnh theo EF)","Theo dõi EF sát, tránh CYP2C19/3A4 mạnh"],
        ["Sacubitril/Valsartan (DCM)","24/26 → 97/103 mg × 2 lần/ngày","Như suy tim HFrEF"]
      ])}`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Đánh giá nguy cơ SCD toàn diện (lâm sàng + Holter + siêu âm ± CMR) mỗi 1–2 năm ở HCM",'<span class="badge badge-I">I</span>'],
        ["Dùng HCM Risk-SCD để ước tính nguy cơ 5 năm ở người ≥16 tuổi",'<span class="badge badge-I">I</span>'],
        ["ICD phòng ngừa tiên phát khi nguy cơ SCD 5 năm >6%",'<span class="badge badge-I">I</span>'],
        ["Mavacamten cho HCM tắc nghẽn còn triệu chứng dù đã tối ưu thuốc nền",'<span class="badge badge-I">I</span>'],
        ["Xét nghiệm gene và tư vấn di truyền ở HCM/DCM có tính gia đình",'<span class="badge badge-I">I</span>'],
        ["Vận động cường độ cao cạnh tranh ở HCM có nguy cơ cao",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"2023 ESC Guidelines for the management of cardiomyopathies; 2024 AHA/ACC/AMSSM/HRS/PACES/SCMR Guideline for the Management of Hypertrophic Cardiomyopathy"
},
{
  spec:"tim_mach", id:"vhd", emoji:"🫀", short:"Bệnh van", title:"Bệnh van tim (Valvular Heart Disease)",
  guidelines:["ESC/EACTS 2025","ACC/AHA 2020"],
  sections:{
    dinh_nghia:`
      <p>Bệnh van tim bao gồm hẹp và/hoặc hở các van tim (ĐMC, 2 lá, 3 lá, phổi), nguyên nhân chính ở nước phát triển là thoái hóa (hẹp van ĐMC vôi hóa, hở van 2 lá thoái hóa), trong khi thấp khớp vẫn phổ biến ở nhiều khu vực. ESC/EACTS 2025 là bản cập nhật mới nhất, nhấn mạnh can thiệp sớm hơn và vai trò mở rộng của liệu pháp qua catheter.</p>
      <div class="subhead">Phân loại chính</div>
      ${rt(["Đặc điểm"],[
        ["Hẹp van động mạch chủ (AS)","Hẹp van ĐMC nặng: Vmax ≥4 m/s, mean gradient ≥40 mmHg, AVA ≤1.0 cm²"],
        ["Hở van động mạch chủ (AR)","Hở nặng: vena contracta ≥6 mm, regurgitant volume ≥60 mL, PHT ≤200 ms"],
        ["Hở van 2 lá nguyên phát (Primary MR)","Do tổn thương van/dây chằng (thoái hóa, sa van, viêm nội tâm mạc)"],
        ["Hở van 2 lá thứ phát (Secondary MR)","Do giãn thất trái hoặc nhĩ trái (suy tim, rung nhĩ)"],
        ["Hẹp van 2 lá (MS)","Chủ yếu do thấp khớp; nặng khi diện tích ≤1.5 cm²"],
        ["Hở van 3 lá (TR)","Nguyên phát hoặc thứ phát (thường gặp hơn)"]
      ])}`,
    chan_doan:`
      <p>Siêu âm tim qua thành ngực (TTE) là công cụ chính. TEE khi cần đánh giá giải phẫu chi tiết trước can thiệp. CT/MRI hỗ trợ đo kích thước động mạch chủ, lượng hóa vôi hóa van, đánh giá chức năng thất phải. Nghiệm pháp gắng sức quan trọng ở bệnh nhân không triệu chứng.</p>
      <div class="subhead">Giai đoạn bệnh van tim (ACC/AHA)</div>
      ${rt(["Đặc điểm"],[
        ["Giai đoạn A","Có nguy cơ (vd. van ĐMC 2 lá, sa van 2 lá nhẹ)"],
        ["Giai đoạn B","Tiến triển (hẹp/hở nhẹ–trung bình)"],
        ["Giai đoạn C","Nặng không triệu chứng (C1: thất còn bù; C2: thất bắt đầu mất bù)"],
        ["Giai đoạn D","Nặng có triệu chứng"]
      ])}
      <div class="alert-box alert-info"><b>ESC 2025:</b> Khuyến cáo đánh giá tổn thương tim theo giai đoạn (cardiac damage staging) để hỗ trợ quyết định can thiệp sớm hơn ở AS và primary MR không triệu chứng.</div>`,
    dieu_tri:`
      <div class="subhead">Hẹp van động mạch chủ nặng</div>
      <ul>
        <li><b>Có triệu chứng</b> hoặc LVEF &lt;50%: can thiệp (Class I).</li>
        <li><b>Không triệu chứng</b>: can thiệp nếu Vmax ≥5 m/s, tăng nhanh ≥0.3 m/s/năm, BNP tăng rõ, hoặc nghiệm pháp gắng sức dương tính (ESC 2025 mở rộng chỉ định sớm hơn).</li>
        <li><b>Lựa chọn TAVI vs SAVR</b> (Heart Team): ≥75–80 tuổi hoặc nguy cơ cao → TAVI ưu tiên; &lt;75 tuổi nguy cơ thấp → SAVR ưu tiên; cân nhắc tuổi thọ, giải phẫu, và chiến lược suốt đời.</li>
      </ul>
      <div class="subhead">Hở van 2 lá</div>
      <ul>
        <li><b>Primary MR nặng</b>: sửa van phẫu thuật là vàng (Class I) khi có triệu chứng hoặc LVEF ≤60%/LVESD ≥40–45 mm. TEER (MitraClip) Class IIa ở bệnh nhân nguy cơ cao.</li>
        <li><b>Secondary (ventricular) MR</b>: TEER Class I (ESC 2025) khi còn triệu chứng dù GDMT tối ưu, giải phẫu phù hợp (LVEF 20–50%, LVESD ≤70 mm).</li>
      </ul>
      <div class="subhead">Hở van 3 lá</div>
      <p>Sửa/thay van khi TR nặng có triệu chứng hoặc khi phẫu thuật van trái kèm theo. Transcatheter tricuspid edge-to-edge repair (T-TEER) Class IIa ở bệnh nhân nguy cơ cao (ESC 2025).</p>
      <div class="subhead">Kháng đông sau van nhân tạo</div>
      ${rt(["Chỉ định","Thuốc"],[
        ["Van cơ học","Warfarin suốt đời (INR đích theo vị trí van)"],
        ["Van sinh học + AF","DOAC ưu tiên hơn warfarin sau 3 tháng"],
        ["Van sinh học không AF","Aspirin 75–100 mg/ngày hoặc không kháng đông dài hạn"]
      ])}
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Warfarin (van cơ học ĐMC)","Đích INR 2.0–3.0","Theo dõi INR sát"],
        ["Warfarin (van cơ học 2 lá)","Đích INR 2.5–3.5","Nguy cơ huyết khối cao hơn"],
        ["Aspirin (van sinh học)","75–100 mg/ngày","Sau giai đoạn sớm"],
        ["GDMT suy tim (secondary MR)","ARNI/ACEi + BB + MRA + SGLT2i","Tối ưu trước khi cân nhắc TEER"]
      ])}`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Can thiệp AS nặng có triệu chứng hoặc LVEF <50%",'<span class="badge badge-I">I</span>'],
        ["TAVI ưu tiên ở bệnh nhân ≥75–80 tuổi hoặc nguy cơ cao khi giải phẫu phù hợp",'<span class="badge badge-I">I</span>'],
        ["Sửa van phẫu thuật cho primary MR nặng có triệu chứng hoặc mất bù thất",'<span class="badge badge-I">I</span>'],
        ["TEER cho secondary ventricular MR còn triệu chứng dù GDMT tối ưu (ESC 2025)",'<span class="badge badge-I">I</span>'],
        ["T-TEER cho TR nặng triệu chứng nguy cơ cao phẫu thuật",'<span class="badge badge-IIa">IIa</span>'],
        ["DOAC ở bệnh nhân AF + van cơ học",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"2025 ESC/EACTS Guidelines for the management of valvular heart disease; 2020 ACC/AHA Guideline for the Management of Patients With Valvular Heart Disease"
},
{
  spec:"tim_mach", id:"ie", emoji:"🦠", short:"VNTM", title:"Viêm nội tâm mạc nhiễm khuẩn",
  guidelines:["ESC 2023 (Infective Endocarditis)"],
  sections:{
    dinh_nghia:`
      <p>Viêm nội tâm mạc nhiễm khuẩn (Infective Endocarditis – IE) là nhiễm trùng nội mạc tim (van, dây chằng, nội mạc buồng tim hoặc vật liệu nhân tạo), thường do vi khuẩn, có thể gây phá hủy van, thuyên tắc, suy tim và tử vong cao nếu không điều trị kịp thời.</p>
      <div class="subhead">Phân loại</div>
      ${rt(["Đặc điểm"],[
        ["Native Valve Endocarditis (NVE)","Van tự nhiên"],
        ["Prosthetic Valve Endocarditis (PVE)","Van nhân tạo (sớm ≤12 tháng, muộn >12 tháng)"],
        ["CIED-IE","Liên quan máy tạo nhịp/ICD"],
        ["Right-sided IE","Thường gặp ở người tiêm chích ma túy"]
      ])}`,
    chan_doan:`
      <p>Tiêu chuẩn ESC 2023 (cải tiến Duke): chẩn đoán <b>chắc chắn</b> khi 2 tiêu chí chính, hoặc 1 chính + ≥3 phụ, hoặc 5 phụ. Cấy máu trước kháng sinh là then chốt (ít nhất 3 mẫu).</p>
      <div class="subhead">Tiêu chí chính</div>
      <ul>
        <li>Cấy máu dương tính với vi khuẩn điển hình (S. aureus, streptococci miệng, S. gallolyticus, HACEK, E. faecalis) từ ≥2 mẫu riêng biệt.</li>
        <li>Bằng chứng hình ảnh tổn thương IE (sùi, áp xe, thủng van, hở mới) trên TTE/TOE, CTA, PET-CT hoặc MRI.</li>
      </ul>
      <div class="alert-box alert-info"><b>ESC 2023:</b> Nhấn mạnh đa phương thức hình ảnh (TOE bắt buộc khi nghi PVE/CIED hoặc TTE âm tính nhưng nghi cao). PET-CT hữu ích với PVE và CIED-IE. Mọi trường hợp nghi IE nên hội chẩn <b>Endocarditis Team</b>.</div>`,
    dieu_tri:`
      <div class="subhead">Nguyên tắc kháng sinh</div>
      <ul>
        <li>Kháng sinh diệt khuẩn liều cao, đường tĩnh mạch, kéo dài (NVE 2–6 tuần, PVE ≥6 tuần).</li>
        <li>Có thể chuyển điều trị ngoại trú (OPAT hoặc uống) sau ≥10 ngày TM (hoặc ≥7 ngày sau mổ) nếu ổn định, không biến chứng (Class IIa).</li>
        <li>Không khuyến cáo aminoglycoside thường quy trong NVE do tụ cầu.</li>
      </ul>
      <div class="subhead">Chỉ định phẫu thuật sớm</div>
      <p>Suy tim cấp do hở/tắc van nặng, nhiễm trùng không kiểm soát (áp xe, fistule), nguy cơ thuyên tắc cao (sùi lớn, thuyên tắc tái phát) — phẫu thuật không trì hoãn kể cả sau đột quỵ thiếu máu.</p>
      <div class="subhead">💊 Kháng sinh kinh nghiệm ban đầu</div>
      ${rt(["Tình huống","Kháng sinh"],[
        ["NVE cộng đồng, không sốc","Ampicillin + (Flu)cloxacillin + Gentamicin hoặc Vancomycin + Gentamicin"],
        ["PVE / bệnh viện / sốc","Vancomycin + Gentamicin + Rifampin"],
        ["Nghi MRSA cao","Vancomycin hoặc Daptomycin"]
      ])}
      <p><b>Dự phòng:</b> Chỉ cho nhóm nguy cơ cao (tiền sử IE, van nhân tạo, bệnh tim bẩm sinh chưa sửa) trước thủ thuật răng miệng nguy cơ cao (Class I).</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Hội chẩn Endocarditis Team cho mọi trường hợp nghi/chẩn đoán IE",'<span class="badge badge-I">I</span>'],
        ["TOE khi nghi PVE, CIED-IE hoặc TTE không đủ",'<span class="badge badge-I">I</span>'],
        ["Phẫu thuật sớm khi suy tim, nhiễm trùng không kiểm soát hoặc nguy cơ thuyên tắc cao",'<span class="badge badge-I">I</span>'],
        ["Dự phòng kháng sinh cho nhóm nguy cơ cao trước thủ thuật răng miệng",'<span class="badge badge-I">I</span>'],
        ["Aminoglycoside thường quy trong NVE do tụ cầu",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"2023 ESC Guidelines for the management of endocarditis, Eur Heart J 2023"
},
{
  spec:"tim_mach", id:"myocarditis", emoji:"❤️‍🔥", short:"Viêm cơ tim", title:"Viêm cơ tim & Viêm màng ngoài tim",
  guidelines:["ESC 2025 (Myocarditis & Pericarditis)","ACC 2024 ECDP Myocarditis"],
  sections:{
    dinh_nghia:`
      <p>Viêm cơ tim (Myocarditis) là viêm cơ tim, có thể do virus, miễn dịch, độc tố hoặc tự miễn. ESC 2025 lần đầu gộp chung với viêm màng ngoài tim dưới khái niệm <b>Inflammatory Myopericardial Syndrome (IMPS)</b>.</p>
      <div class="subhead">Phân giai đoạn (ACC 2024)</div>
      ${rt(["Đặc điểm"],[
        ["Giai đoạn A","Có yếu tố nguy cơ, chưa có bằng chứng bệnh"],
        ["Giai đoạn B","Có bằng chứng viêm (CMR/men tim) nhưng chưa triệu chứng"],
        ["Giai đoạn C","Có triệu chứng (đau ngực, suy tim, rối loạn nhịp)"],
        ["Giai đoạn D","Không ổn định huyết động hoặc điện học"]
      ])}`,
    chan_doan:`
      <p><b>CMR</b> là công cụ chính để chẩn đoán không xâm lấn. Sinh thiết nội mạc cơ tim (EMB) chỉ định khi nghi type đặc hiệu cần điều trị (giant cell, eosinophilic, sarcoid, ICI-myocarditis) hoặc không đáp ứng.</p>
      <div class="alert-box alert-info"><b>ESC 2025:</b> Có thể chẩn đoán chắc chắn bằng CMR mà không bắt buộc sinh thiết ở nhiều trường hợp. LGE trên CMR là yếu tố tiên lượng xấu độc lập.</div>
      <p>Xét nghiệm: Troponin, NT-proBNP, CRP, ECG, siêu âm tim.</p>`,
    dieu_tri:`
      <div class="subhead">Điều trị hỗ trợ</div>
      <ul>
        <li>Nghỉ ngơi, tránh vận động gắng sức 3–6 tháng (hoặc đến khi CMR bình thường hóa).</li>
        <li>Điều trị suy tim theo guideline nếu EF giảm.</li>
        <li>Rối loạn nhịp: theo dõi, ICD nếu chỉ định (sau giai đoạn cấp).</li>
      </ul>
      <div class="subhead">Điều trị đặc hiệu</div>
      <ul>
        <li>Viêm màng ngoài tim cấp / myopericarditis: NSAID + <b>Colchicine</b>.</li>
        <li>Ức chế miễn dịch chỉ khi type đặc hiệu (giant cell, eosinophilic, sarcoid, ICI).</li>
        <li>Không dùng corticosteroid thường quy cho viêm cơ tim virus cấp không biến chứng.</li>
      </ul>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Colchicine","0.5 mg × 1–2 lần/ngày × 3 tháng","Giảm liều nếu suy thận/cao tuổi"],
        ["Ibuprofen / Aspirin liều cao","Theo đáp ứng đau","Kết hợp PPI"],
        ["GDMT suy tim","Theo HFrEF nếu EF giảm","Khởi liều thấp"]
      ])}`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["CMR là công cụ chẩn đoán chính không xâm lấn",'<span class="badge badge-I">I</span>'],
        ["Tránh vận động gắng sức 3–6 tháng sau viêm cơ tim cấp",'<span class="badge badge-I">I</span>'],
        ["Colchicine + NSAID cho viêm màng ngoài tim cấp",'<span class="badge badge-I">I</span>'],
        ["EMB khi nghi type đặc hiệu cần điều trị",'<span class="badge badge-IIa">IIa</span>'],
        ["Corticosteroid thường quy cho viêm cơ tim virus không biến chứng",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"2025 ESC Guidelines for the management of myocarditis and pericarditis; 2024 ACC Expert Consensus Decision Pathway on Myocarditis"
},
{
  spec:"tim_mach", id:"syncope", emoji:"💫", short:"Ngất", title:"Ngất (Syncope)",
  guidelines:["ESC 2018 Syncope","EUSEM 2024"],
  sections:{
    dinh_nghia:`
      <p>Ngất là mất ý thức tạm thời do giảm tưới máu não, đặc trưng bởi khởi phát nhanh, thời gian ngắn và hồi phục hoàn toàn tự nhiên. Cần phân biệt với các nguyên nhân mất ý thức khác (động kinh, chấn thương, psychogenic…).</p>
      <div class="subhead">Phân loại chính</div>
      ${rt(["Đặc điểm"],[
        ["Ngất phản xạ (Reflex)","Vasovagal, tình huống, quá cảm xoang cảnh"],
        ["Ngất do hạ huyết áp tư thế","Suy giảm thần kinh tự chủ, giảm thể tích, thuốc"],
        ["Ngất tim","Rối loạn nhịp, bệnh cấu trúc tim, tắc nghẽn đường ra"]
      ])}`,
    chan_doan:`
      <p>Đánh giá ban đầu: bệnh sử chi tiết + khám (đo HA nằm/đứng) + ECG 12 chuyển đạo. Đây là 3 yếu tố then chốt.</p>
      <div class="alert-box alert-warn"><b>Dấu hiệu nguy cơ cao</b> (cần nhập viện/theo dõi): bệnh tim cấu trúc đã biết, ECG bất thường, ngất khi gắng sức/nằm, tiền sử đột tử gia đình, tuổi cao + bệnh kèm, thiếu máu nặng…</div>
      <ul>
        <li>Siêu âm tim khi nghi bệnh cấu trúc.</li>
        <li>Masage xoang cảnh ở người &gt;40 tuổi.</li>
        <li>Holter / ILR khi nghi loạn nhịp và nguy cơ trung bình–cao.</li>
      </ul>`,
    dieu_tri:`
      <div class="subhead">Ngất phản xạ / hạ HA tư thế</div>
      <ul>
        <li>Giáo dục, tránh yếu tố khởi phát, counter-pressure maneuvers.</li>
        <li>Tăng muối/nước, tất áp lực nếu phù hợp.</li>
        <li>Midodrine hoặc Fludrocortisone ở một số trường hợp chọn lọc.</li>
      </ul>
      <div class="subhead">Ngất tim</div>
      <ul>
        <li>Điều trị nguyên nhân (pacemaker nếu block, ICD nếu chỉ định, can thiệp cấu trúc…).</li>
        <li>Nhập viện và theo dõi nếu nguy cơ cao.</li>
      </ul>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Midodrine","2.5–10 mg × 2–3 lần/ngày","Tránh dùng buổi tối (tăng HA nằm)"],
        ["Fludrocortisone","0.1–0.2 mg/ngày","Theo dõi phù, hạ kali"]
      ])}`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Bệnh sử + khám + ECG là đánh giá ban đầu bắt buộc cho mọi ngất",'<span class="badge badge-I">I</span>'],
        ["Nhập viện/theo dõi khi có dấu hiệu nguy cơ cao",'<span class="badge badge-I">I</span>'],
        ["Masage xoang cảnh ở bệnh nhân &gt;40 tuổi nghi ngất phản xạ",'<span class="badge badge-IIa">IIa</span>'],
        ["Xét nghiệm hàng loạt không định hướng (CT sọ, EEG thường quy) khi không nghi nguyên nhân thần kinh",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"2018 ESC Guidelines for the diagnosis and management of syncope; EUSEM 2024 Consensus"
},
{
  spec:"noi_tiet", id:"dm", emoji:"🍬", short:"ĐTĐ", title:"Đái tháo đường & Tim mạch",
  guidelines:["ESC 2023 (Diabetes & CVD)","ADA Standards of Care 2026","AHA/ACC/ADA/ASN 2026 CKM"],
  sections:{
    dinh_nghia:`
      <p>ĐTĐ típ 2 là bệnh chuyển hóa mạn tính do đề kháng insulin và/hoặc suy giảm tiết insulin, làm tăng mạnh nguy cơ bệnh tim mạch do xơ vữa và suy tim.</p>
      <div class="subhead">Phân tầng nguy cơ tim mạch ở người ĐTĐ (ESC 2023)</div>
      <p>Rất cao: đã có bệnh tim mạch do xơ vữa hoặc tổn thương cơ quan đích nặng (bệnh thận mạn giai đoạn 3–5, phì đại thất trái, bệnh võng mạc). Cao: ĐTĐ ≥10 năm không tổn thương cơ quan đích kèm ≥1 yếu tố nguy cơ khác. Trung bình: ĐTĐ trẻ tuổi (&lt;10 năm) không yếu tố nguy cơ khác.</p>`,
    chan_doan:`
      <div class="subhead">🧮 Tầm soát nguy cơ ĐTĐ type 2 trước xét nghiệm — Thang điểm FINDRISC</div>
      <p>Công cụ sàng lọc không xâm lấn giúp xác định người cần làm xét nghiệm glucose/HbA1c chẩn đoán, dựa hoàn toàn vào đặc điểm lâm sàng dễ thu thập.</p>
      ${scr("findrisc","Thang điểm FINDRISC (nguy cơ ĐTĐ type 2 trong 10 năm)",[
        {label:"Tuổi", options:[{text:"&lt;45 tuổi (0đ)",pts:0},{text:"45–54 tuổi (2đ)",pts:2},{text:"55–64 tuổi (3đ)",pts:3},{text:"&gt;64 tuổi (4đ)",pts:4}]},
        {label:"BMI (chỉ số khối cơ thể)", options:[{text:"&lt;25 kg/m² (0đ)",pts:0},{text:"25–30 kg/m² (1đ)",pts:1},{text:"&gt;30 kg/m² (3đ)",pts:3}]},
        {label:"Vòng eo (Nam: &lt;94/94-102/&gt;102cm — Nữ: &lt;80/80-88/&gt;88cm)", options:[{text:"Bình thường (0đ)",pts:0},{text:"Tăng nhẹ (3đ)",pts:3},{text:"Tăng nhiều (4đ)",pts:4}]},
        {label:"Hoạt động thể lực ≥30 phút/ngày (công việc hoặc giải trí)", options:[{text:"Có (0đ)",pts:0},{text:"Không (2đ)",pts:2}]},
        {label:"Tần suất ăn rau củ/trái cây hàng ngày", options:[{text:"Hàng ngày (0đ)",pts:0},{text:"Không phải hàng ngày (1đ)",pts:1}]},

        {label:"Tiền sử gia đình mắc ĐTĐ", options:[{text:"Không (0đ)",pts:0},{text:"Có — họ hàng xa (cô/dì/chú/bác/anh chị em họ) (3đ)",pts:3},{text:"Có — quan hệ trực hệ (bố/mẹ/anh chị em ruột/con) (5đ)",pts:5}]}
      ])}
      <div class="subhead">Ngưỡng chẩn đoán xác định ĐTĐ (xét nghiệm)</div>
      ${rt(["Ngưỡng chẩn đoán ĐTĐ"],[
        ["Glucose huyết tương đói (FPG)","≥126 mg/dL (7.0 mmol/L)"],

        ["HbA1c","≥6.5%"],
        ["Glucose bất kỳ kèm triệu chứng kinh điển","≥200 mg/dL (11.1 mmol/L)"]

      <p>Tiền ĐTĐ: FPG 100–125 mg/dL, HbA1c 5.7–6.4%, hoặc 2h-glucose 140–199 mg/dL. Ở người ĐTĐ cần tầm soát tim mạch bằng ECG, đánh giá nguy cơ, xét nghiệm chức năng thận/albumin niệu định kỳ.</p>`,
    dieu_tri:`
      <div class="alert-box alert-info"><b>Điểm mấu chốt ESC 2023:</b> ở người ĐTĐ nguy cơ tim mạch cao/rất cao hoặc đã có bệnh tim mạch, <b>SGLT2i hoặc GLP-1 RA có bằng chứng lợi ích tim mạch nên được chỉ định độc lập với mức HbA1c và độc lập với dùng metformin hay chưa</b>.</div>
      <ul>

        <li><b>GLP-1 RA</b> (semaglutide, liraglutide, dulaglutide) có bằng chứng lợi ích tim mạch: ưu tiên khi cần giảm cân nhiều hoặc xơ vữa động mạch chiếm ưu thế</li>
        <li><b>Metformin</b> vẫn là nền tảng kiểm soát đường huyết ở đa số bệnh nhân, có thể phối hợp SGLT2i/GLP-1RA</li>
        <li>Kiểm soát đa yếu tố: HA đích &lt;130/80, LDL-C theo phân tầng nguy cơ, statin cường độ cao gần như thường quy</li>
      </ul>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">Metformin: chống chỉ định eGFR &lt;30; giảm liều eGFR 30–45; ngưng tạm thời trước chụp cản quang/thủ thuật lớn ở người cao tuổi/suy thận.</div>

{
  spec:"noi_tiet", id:"obesity", emoji:"⚖️", short:"Béo phì", title:"Béo phì & Hội chứng chuyển hóa",
  guidelines:["AHA/ACC/TOS 2013 + cập nhật lâm sàng 2023–2024","IDF/AHA-NHLBI"],
  sections:{
    dinh_nghia:`
      <div class="subhead">Phân loại BMI</div>
      ${rt(["BMI chung","BMI người châu Á"],[
        ["Bình thường","18.5–24.9","18.5–22.9"],
        ["Thừa cân","25–29.9","23–24.9"],
        ["Béo phì","≥30","≥25"],
        ["Béo phì nặng","≥40 (độ III)","≥35 (ngưỡng điều chỉnh)"]
      ])}
      <div class="subhead">Hội chứng chuyển hóa</div>
      <p>Chẩn đoán khi có ≥3/5 tiêu chí: vòng eo tăng (theo dân tộc), triglyceride ≥150mg/dL, HDL-C thấp (&lt;40 nam/&lt;50 nữ mg/dL), HA ≥130/85 mmHg (hoặc đang điều trị THA), glucose đói ≥100mg/dL.</p>`,
    chan_doan:`
      <p>Đánh giá BMI kết hợp <b>vòng eo</b> (phản ánh mỡ nội tạng tốt hơn) và bệnh đồng mắc liên quan cân nặng (THA, ĐTĐ2, rối loạn lipid, ngưng thở khi ngủ, gan nhiễm mỡ, thoái hóa khớp).</p>
      ${rt(["Ngưỡng"],[
        ["Vòng eo tăng nguy cơ – Nam (chuẩn châu Á)","≥90 cm"],
        ["Vòng eo tăng nguy cơ – Nữ (chuẩn châu Á)","≥80 cm"]
      ])}`,
    dieu_tri:`
      <div class="subhead">Nền tảng: can thiệp lối sống toàn diện</div>
      <p>Giảm 500–750 kcal/ngày so nhu cầu, hoạt động thể lực ≥150 phút/tuần cường độ trung bình, liệu pháp hành vi. Mục tiêu giảm ≥5–10% cân nặng để cải thiện rõ rệt bệnh đồng mắc chuyển hóa.</p>
      <div class="subhead">Điều trị thuốc (BMI≥30, hoặc ≥27 kèm bệnh đồng mắc)</div>
      <p><b>Nhóm đồng vận GLP-1/GIP</b> hiện là lựa chọn dược lý hiệu quả nhất, giảm 15–20% cân nặng, cải thiện đồng thời các yếu tố nguy cơ tim mạch-chuyển hóa (semaglutide có bằng chứng giảm biến cố tim mạch ở người béo phì có bệnh tim mạch — nghiên cứu SELECT).</p>
      <div class="subhead">Phẫu thuật giảm cân (bariatric)</div>
      <p>Cân nhắc khi BMI ≥40, hoặc ≥35 kèm bệnh đồng mắc, sau khi đã thử lối sống ± thuốc không đạt hiệu quả đủ.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">Chống chỉ định GLP-1/GIP RA: tiền sử/gia đình ung thư tuyến giáp thể tủy, đa u nội tiết típ 2, viêm tụy cấp gần đây. Người cao tuổi: tăng liều chậm hơn, theo dõi sụt cân quá mức/mất khối cơ.</div>
      ${rt(["Phác đồ tăng liều"],[
        ["Semaglutide 2.4mg (Wegovy)","0.25→0.5→1→1.7→2.4mg/tuần, mỗi bậc cách 4 tuần"],
        ["Tirzepatide (Zepbound)","2.5→5→7.5→10→12.5→15mg/tuần, mỗi bậc cách 4 tuần"],
        ["Liraglutide 3mg (Saxenda)","0.6→1.2→1.8→2.4→3mg/ngày, mỗi bậc cách 1 tuần"],
        ["Orlistat","120mg × 3 lần/ngày cùng bữa ăn có chất béo"]
      ])}
      <div class="age-tag">Người cao tuổi (≥65)</div>
      <p>Ưu tiên bảo tồn khối cơ (kết hợp tập kháng lực), tránh giảm cân quá nhanh; cân nhắc kỹ lợi ích/nguy cơ phẫu thuật giảm cân theo thể trạng chung.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Can thiệp lối sống toàn diện là nền tảng cho mọi bệnh nhân béo phì",'<span class="badge badge-I">I</span>'],
        ["Thuốc GLP-1/GIP RA cho BMI≥30 (hoặc ≥27 kèm bệnh đồng mắc)",'<span class="badge badge-I">I</span>'],
        ["Semaglutide giảm biến cố tim mạch ở người béo phì có bệnh tim mạch xác định",'<span class="badge badge-IIa">IIa</span>'],
        ["Phẫu thuật giảm cân khi BMI≥40 hoặc ≥35 kèm bệnh đồng mắc",'<span class="badge badge-I">I</span>'],
        ["Dùng BMI đơn độc, không kèm vòng eo/bệnh đồng mắc, để quyết định điều trị",'<span class="badge badge-III">III</span>']
      ])}`

  source:"AHA/ACC/TOS Guideline for Obesity Management 2013 (+ cập nhật dựa trên SELECT, SURMOUNT); IDF/AHA-NHLBI Metabolic Syndrome Criteria"

{
  spec:"noi_tiet", id:"thyroid", emoji:"🦋", short:"Tuyến giáp", title:"Cường giáp & Suy giáp",
  guidelines:["ATA 2016 (Cường giáp)","ATA 2014 (Suy giáp)","ETA 2018"],
  sections:{
    dinh_nghia:`
      <p><b>Cường giáp:</b> hội chứng do dư thừa hormone tuyến giáp, nguyên nhân thường gặp nhất là <b>Basedow (Graves)</b>, tiếp theo bướu giáp đa nhân hóa độc và viêm giáp.</p>
      <p><b>Suy giáp:</b> thiếu hụt hormone tuyến giáp, nguyên nhân thường gặp nhất là <b>viêm giáp Hashimoto</b> (tự miễn) tại vùng đủ i-ốt.</p>
      <div class="subhead">Phân loại theo xét nghiệm</div>
      ${rt(["TSH","FT4"],[
        ["Cường giáp rõ (overt)","Giảm/ức chế","Tăng"],
        ["Cường giáp dưới lâm sàng","Giảm","Bình thường"],
        ["Suy giáp rõ (overt)","Tăng","Giảm"],
        ["Suy giáp dưới lâm sàng","Tăng nhẹ (thường &lt;10)","Bình thường"]
      ])}`,
    chan_doan:`
      <p><b>TSH</b> là xét nghiệm sàng lọc đầu tay. Khi TSH bất thường → đo thêm <b>FT4</b> (± FT3 khi nghi cường giáp có TSH thấp nhưng FT4 bình thường).</p>
      <div class="subhead">Xác định nguyên nhân cường giáp</div>
      <p>TRAb (kháng thể thụ thể TSH) dương tính gợi ý Basedow; xạ hình tuyến giáp bắt xạ lan tỏa (Basedow), bắt xạ ổ (nhân độc/bướu đa nhân), hoặc bắt xạ thấp (viêm giáp phá hủy, cường giáp do thuốc/i-ốt).</p>
      <div class="subhead">Xác định nguyên nhân suy giáp</div>
      <p>Anti-TPO dương tính gợi ý Hashimoto. Siêu âm tuyến giáp khi có bướu/nhân giáp kèm theo.</p>
      <div class="alert-box alert-info">Ở phụ nữ có thai: ngưỡng TSH bình thường theo tam cá nguyệt thấp hơn người không mang thai — cần dùng ngưỡng riêng theo phòng xét nghiệm/quý thai kỳ, không áp ngưỡng chung.</div>`,
    dieu_tri:`
      <div class="subhead">Basedow (Graves)</div>
      <ul>
        <li><b>Thuốc kháng giáp (ATD)</b> methimazole là lựa chọn hàng đầu ngoài thai kỳ 3 tháng đầu — điều trị 12–18 tháng rồi thử ngưng, tỷ lệ tái phát ~50%</li>
        <li><b>I-131 (i-ốt phóng xạ)</b> hoặc <b>phẫu thuật cắt giáp</b> khi tái phát, bướu lớn, nghi ác tính, hoặc bệnh nhân ưu tiên điều trị dứt điểm</li>
        <li>Chẹn beta (propranolol) kiểm soát triệu chứng giao cảm (hồi hộp, run) trong lúc chờ ATD có tác dụng</li>
      </ul>
      <div class="subhead">Cơn bão giáp (thyroid storm)</div>
      <p>Cấp cứu nội khoa: PTU liều cao (ưu tiên hơn methimazole giai đoạn cấp) → iodine (dung dịch Lugol, cho sau PTU ≥1h) → chẹn beta → hydrocortisone → hạ sốt, bù dịch, điều trị yếu tố khởi phát.</p>
      <div class="subhead">Suy giáp</div>
      <p><b>Levothyroxine (LT4)</b> uống lúc đói, cách xa thức ăn/canxi/sắt ≥30–60 phút, là điều trị chuẩn suốt đời. Chỉnh liều dựa vào TSH, kiểm tra lại sau 6–8 tuần mỗi lần đổi liều.</p>
      <div class="subhead">Cường giáp/suy giáp dưới lâm sàng</div>
      <p>Điều trị suy giáp dưới lâm sàng khi TSH ≥10 mIU/L, hoặc TSH 4.5–10 kèm triệu chứng/có thai/nguy cơ tim mạch cao. Điều trị cường giáp dưới lâm sàng khi TSH &lt;0.1 dai dẳng, đặc biệt ở người ≥65 tuổi hoặc có bệnh tim/loãng xương.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-danger">Methimazole chống chỉ định 3 tháng đầu thai kỳ (nguy cơ dị tật) — dùng PTU thay thế trong tam cá nguyệt 1, sau đó có thể chuyển lại methimazole.</div>
      ${rt(["Liều khởi đầu → duy trì","Lưu ý"],[
        ["Methimazole","10–30mg/ngày (theo mức độ nặng) → 5–10mg/ngày","theo dõi công thức máu/men gan; ngưng ngay nếu sốt/đau họng (nghi mất bạch cầu hạt)"],
        ["PTU","300–600mg/ngày chia 3 lần → 50–150mg/ngày","ưu tiên thai kỳ 3 tháng đầu và cơn bão giáp; nguy cơ độc gan hiếm gặp nhưng nặng"],
        ["Propranolol","10–40mg × 3–4 lần/ngày","giảm liều/thận trọng ở người cao tuổi có suy tim/hen"],
        ["Levothyroxine (người lớn tiêu chuẩn)","1.6 microgam/kg/ngày (khởi đầu đủ liều nếu trẻ, khỏe)","tái khám TSH sau 6–8 tuần, chỉnh liều 12.5–25mcg mỗi lần"],
        ["Levothyroxine (cao tuổi/bệnh mạch vành)","khởi đầu 25–50 microgam/ngày, tăng chậm mỗi 4–6 tuần","tránh gây thiếu máu cơ tim/loạn nhịp do tăng chuyển hóa đột ngột"]
      ])}
      <div class="age-tag">Người cao tuổi</div>
      <p>Đích TSH suy giáp ở người ≥70 tuổi có thể nới lên 4–6 mIU/L thay vì mục tiêu chuẩn, tránh quá liều LT4 gây rung nhĩ/loãng xương.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["TSH là xét nghiệm sàng lọc đầu tay bệnh lý tuyến giáp",'<span class="badge badge-I">I</span>'],
        ["Methimazole là ATD hàng đầu ngoài 3 tháng đầu thai kỳ",'<span class="badge badge-I">I</span>'],
        ["PTU ưu tiên trong tam cá nguyệt 1 và cơn bão giáp",'<span class="badge badge-I">I</span>'],
        ["Levothyroxine uống cùng lúc với canxi/sắt/thức ăn",'<span class="badge badge-III">III</span>'],
        ["Điều trị suy giáp dưới lâm sàng khi TSH≥10 dai dẳng",'<span class="badge badge-I">I</span>'],
        ["Điều trị thường quy suy giáp dưới lâm sàng khi TSH&lt;7 ở người không triệu chứng, không thai kỳ",'<span class="badge badge-IIb">IIb</span>']
      ])}`
  },
  source:"2016 ATA Guidelines for Hyperthyroidism (Graves); 2014 ATA Guidelines for Hypothyroidism; 2018 ETA Guideline on Subclinical Hypothyroidism"
},
{
  spec:"ho_hap", id:"asthma", emoji:"🌬️", short:"Hen PQ", title:"Hen phế quản",
  guidelines:["GINA 2026"],
  sections:{
    dinh_nghia:`
      <p>Hen phế quản là bệnh lý viêm mạn tính đường thở, đặc trưng bởi triệu chứng hô hấp thay đổi theo thời gian/cường độ (khò khè, khó thở, nặng ngực, ho) kèm giới hạn luồng khí thở ra thay đổi.</p>
      <div class="alert-box alert-info"><b>GINA 2026 cập nhật chính:</b> (1) Không còn khuyến cáo SABA đơn thuần ở mọi bậc; ưu tiên <b>ICS-formoterol</b> (Track 1 – AIR/MART) vì giảm đợt cấp nặng. (2) Thêm biologic mới: <b>depemokimab</b> (siêu dài, tiêm 2 lần/năm) cho hen eosinophil nặng ≥12 tuổi. (3) Ngưỡng oxy: chỉ bổ sung khi SpO₂ &lt;92%, đích 92–95% (người lớn/trẻ ≥6 tuổi). (4) Nếu nghi sốc phản vệ + hen → epinephrine trước, sau đó mới giãn phế quản.</div>`,
    chan_doan:`
      <p>Chẩn đoán dựa vào bệnh sử triệu chứng thay đổi điển hình <b>và</b> bằng chứng giới hạn luồng khí thở ra thay đổi trên hô hấp ký.</p>
      ${rt(["Tiêu chí"],[
        ["Test hồi phục phế quản dương tính","FEV1 tăng &gt;12% và &gt;200mL sau salbutamol"],
        ["Dao động PEF ngày (trung bình 2 tuần)","&gt;10% (người lớn)"],
        ["FEV1 tăng sau 4 tuần điều trị kháng viêm","&gt;12% và &gt;200mL"]
      ])}
      <p>Đánh giá kiểm soát triệu chứng (4 câu hỏi GINA: triệu chứng ngày &gt;2 lần/tuần, thức giấc đêm, dùng SABA cắt cơn &gt;2 lần/tuần, giới hạn hoạt động) và đánh giá nguy cơ đợt cấp (tiền sử đợt cấp, FEV1 thấp, hút thuốc, kỹ thuật hít sai).</p>
      <div class="subhead">🚨 Phân độ nặng đợt cấp hen (GINA)</div>

    dieu_tri:`

      ${rt(["Xử trí"],[
        ["Nhẹ–Trung bình (ngoại trú/cấp cứu)","SABA khí dung/MDI qua buồng đệm lặp lại mỗi 20 phút ×3 liều đầu + corticosteroid uống sớm (prednisolone) + đánh giá lại sau 1h"],

        ["Bậc 5","ICS-LABA liều cao + LAMA; xét sinh học nếu hen type-2 nặng","ICS-formoterol liều thấp"]
      ])}
      <div class="subhead">Chiến lược MART (Maintenance And Reliever Therapy)</div>
      <p>Dùng <b>một</b> bình hít ICS-formoterol (budesonide/formoterol hoặc beclomethasone/formoterol) vừa duy trì hàng ngày vừa cắt cơn khi có triệu chứng — được GINA ưu tiên vì giảm đợt cấp nặng so với phác đồ SABA cắt cơn riêng.</p>
      <div class="subhead">Hen nặng (bậc 5 không kiểm soát)</div>
      <p>Đánh giá kiểu hình viêm type-2 (bạch cầu ái toan máu, FeNO, IgE) để chọn thuốc sinh học: omalizumab (anti-IgE), mepolizumab/benralizumab (anti-IL5/5R), dupilumab (anti-IL4/13), tezepelumab (anti-TSLP, không cần kiểu hình type-2).</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">Không dùng LABA đơn độc không kèm ICS trong điều trị hen (tăng nguy cơ tử vong do hen) — luôn phối hợp cố định ICS-LABA.</div>

        ["Prednisolone (đợt cấp)","40–50mg/ngày × 5–7 ngày","không cần giảm liều dần nếu đợt ngắn và không dùng corticoid trường diễn"],
        ["Tiotropium (LAMA bổ sung, bậc 4–5)","2.5mcg × 2 nhát/ngày (Respimat)","thận trọng glaucoma góc đóng, phì đại tiền liệt tuyến"]

      <div class="age-tag">Người cao tuổi</div>
      <p>Kiểm tra kỹ thuật hít và lực hít vào (ưu tiên bình định liều có buồng đệm nếu phối hợp kém với DPI); tầm soát bệnh đồng mắc tim mạch trước dùng LABA/LAMA liều cao.</p>`,

{
  spec:"ho_hap", id:"copd", emoji:"🫁", short:"COPD", title:"Bệnh phổi tắc nghẽn mạn tính",
  guidelines:["GOLD 2026"],
  sections:{
    dinh_nghia:`
      <p>COPD là bệnh hô hấp mạn tính đặc trưng bởi triệu chứng hô hấp dai dẳng và giới hạn luồng khí thở ra không hồi phục hoàn toàn, do bất thường đường thở/phế nang, thường liên quan phơi nhiễm khói thuốc, khí độc, bụi nghề nghiệp.</p>
      <div class="alert-box alert-info"><b>GOLD 2026 điểm mới quan trọng:</b> (1) Nhóm <b>E</b> nay bao gồm bệnh nhân có <b>≥1 đợt cấp trung bình hoặc nặng</b> trong năm trước (trước đây thường ≥2). (2) Mục tiêu điều trị là đạt “low disease activity” (không còn đợt cấp). (3) Thêm biologic: <b>dupilumab</b> và <b>mepolizumab</b> cho COPD có eosinophil cao + đợt cấp tái diễn dù triple therapy. (4) Cập nhật vaccine RSV + cúm.</div>
      <div class="subhead">Phân loại mức độ tắc nghẽn (GOLD, sau test giãn phế quản FEV1/FVC&lt;0.7)</div>
      ${rt(["FEV1 (%dự đoán)"],[
        ["GOLD 1 – Nhẹ","≥80%"],
        ["GOLD 2 – Trung bình","50–79%"],
        ["GOLD 3 – Nặng","30–49%"],
        ["GOLD 4 – Rất nặng","&lt;30%"]
      ])}`,
    chan_doan:`
      <p>Chẩn đoán xác định cần <b>hô hấp ký sau test giãn phế quản</b>: FEV1/FVC &lt;0.7. Đánh giá triệu chứng bằng <b>mMRC</b> (khó thở) và <b>CAT/CAAT</b> (ảnh hưởng chất lượng sống), kèm tiền sử đợt cấp trong năm qua. GOLD 2026 nhấn mạnh khái niệm <b>Disease Activity</b>.</p>
      <div class="subhead">🧮 Bộ câu hỏi CAT (COPD Assessment Test) — mỗi mục chọn mức 0 (không ảnh hưởng) đến 5 (ảnh hưởng nặng nhất)</div>

        {label:"Khó thở khi leo dốc/lên cầu thang", options:[{text:"0 – Không khó thở",pts:0},{text:"1",pts:1},{text:"2",pts:2},{text:"3",pts:3},{text:"4",pts:4},{text:"5 – Rất khó thở",pts:5}]},
        {label:"Giới hạn hoạt động tại nhà", options:[{text:"0 – Không giới hạn",pts:0},{text:"1",pts:1},{text:"2",pts:2},{text:"3",pts:3},{text:"4",pts:4},{text:"5 – Giới hạn nhiều",pts:5}]},
        {label:"Tự tin ra khỏi nhà dù có bệnh phổi", options:[{text:"0 – Rất tự tin",pts:0},{text:"1",pts:1},{text:"2",pts:2},{text:"3",pts:3},{text:"4",pts:4},{text:"5 – Không tự tin chút nào",pts:5}]},
        {label:"Giấc ngủ", options:[{text:"0 – Ngủ ngon",pts:0},{text:"1",pts:1},{text:"2",pts:2},{text:"3",pts:3},{text:"4",pts:4},{text:"5 – Ngủ không ngon do bệnh phổi",pts:5}]},
        {label:"Năng lượng/sức lực", options:[{text:"0 – Tràn đầy năng lượng",pts:0},{text:"1",pts:1},{text:"2",pts:2},{text:"3",pts:3},{text:"4",pts:4},{text:"5 – Không còn chút năng lượng nào",pts:5}]}
      ])}
      <div class="subhead">Nhóm phân loại ABE (GOLD 2023–2025, đã bỏ nhóm C cũ)</div>
      ${rt(["Đợt cấp/năm","Triệu chứng"],[
        ["Nhóm A","0–1 (không nhập viện)","mMRC 0–1, CAT&lt;10"],
        ["Nhóm B","0–1 (không nhập viện)","mMRC≥2, CAT≥10"],
        ["Nhóm E","≥2 hoặc ≥1 phải nhập viện","bất kỳ mức triệu chứng"]

      <p>Đếm bạch cầu ái toan máu (blood eosinophil count) giúp dự đoán đáp ứng ICS ở nhóm E.</p>

      <p><b>Tiêu chuẩn Anthonisen</b> (đánh giá cần kháng sinh): tăng khó thở, tăng thể tích đờm, đờm chuyển mủ — đủ cả 3 (type I) hoặc 2/3 kèm đờm mủ (type II) → có chỉ định kháng sinh.</p>
      ${rt(["Đặc điểm lâm sàng","Khí máu động mạch"],[
        ["Nhẹ","Khó thở tăng nhẹ, tự kiểm soát bằng thuốc cắt cơn tại nhà","Không cần đo khí máu thường quy"],

        ["Nặng — Suy hô hấp type II (tăng CO2, còn bù)","Ngủ gà nhẹ, đau đầu buổi sáng","PaO2&lt;60mmHg, PaCO2&gt;45mmHg, pH≥7.35 (còn bù)"],
        ["Nguy kịch — Suy hô hấp type II mất bù","Lú lẫn, kiệt sức hô hấp, thở nghịch thường bụng-ngực, có thể ngừng thở","PaO2&lt;60mmHg, PaCO2&gt;45mmHg, pH&lt;7.35 (toan hô hấp mất bù)"]
      ])}
      <div class="alert-box alert-danger">Suy hô hấp type II mất bù (pH&lt;7.35) là chỉ định thông khí không xâm lấn (NIV/BiPAP) khẩn cấp — đây là can thiệp làm giảm tỷ lệ tử vong rõ rệt nhất trong đợt cấp COPD nặng, nên khởi động sớm thay vì trì hoãn đến khi cần đặt nội khí quản.</div>`,
    dieu_tri:`
      <div class="subhead">🚑 Xử trí đợt cấp COPD theo mức độ nặng</div>
      ${rt(["Xử trí"],[
        ["Nhẹ–Trung bình (ngoại trú)","Tăng liều/tần suất SABA±SAMA, corticosteroid uống (prednisolone 40mg/ngày×5 ngày), kháng sinh nếu đủ tiêu chuẩn Anthonisen I/II"],
        ["Nặng (nhập viện, còn bù)","Khí dung SABA+SAMA liên tục, corticosteroid toàn thân, kháng sinh, oxy liệu pháp có kiểm soát đích SpO2 88–92% (tránh tăng oxy quá mức gây ức chế hô hấp ở người giữ CO2 mạn)"],

      <div class="subhead">Điều trị nền không dùng thuốc</div>

      <div class="subhead">Theo dõi & leo thang</div>

      <div class="alert-box alert-warn">Tránh dùng ICS đơn độc không phối hợp LABA/LAMA trong COPD, và thận trọng ICS liều cao kéo dài do tăng nguy cơ viêm phổi, đặc biệt khi eosinophil thấp.</div>

{
  spec:"ho_hap", id:"cap", emoji:"🦠", short:"VPCĐ", title:"Viêm phổi cộng đồng",
  guidelines:["ATS/IDSA 2019","BTS 2023"],
  sections:{
    dinh_nghia:`
      <p>Viêm phổi cộng đồng (CAP) là nhiễm trùng nhu mô phổi cấp tính mắc phải ngoài bệnh viện hoặc cơ sở chăm sóc y tế, biểu hiện bằng triệu chứng hô hấp cấp kèm tổn thương mới trên X-quang/CT ngực.</p>`,
    chan_doan:`
      <p>Chẩn đoán: triệu chứng hô hấp cấp (ho, sốt, khó thở, đau ngực kiểu màng phổi) + tổn thương thâm nhiễm mới trên hình ảnh học.</p>
      <div class="subhead">Phân tầng độ nặng — CURB-65</div>
      ${sc("curb65","Thang điểm CURB-65",[
        {label:"Lú lẫn mới xuất hiện (Confusion)",pts:1},
        {label:"Ure máu &gt;7 mmol/L (Urea)",pts:1},
        {label:"Nhịp thở ≥30 lần/phút (Respiratory rate)",pts:1},
        {label:"HA tâm thu&lt;90 hoặc tâm trương≤60 mmHg (Blood pressure)",pts:1},
        {label:"Tuổi ≥65",pts:1}
      ])}
      <p>0–1 điểm: điều trị ngoại trú. 2 điểm: cân nhắc nhập viện ngắn/theo dõi sát. ≥3 điểm: nhập viện, cân nhắc ICU nếu ≥4.</p>`,
    dieu_tri:`
      <div class="subhead">Điều trị ngoại trú (không bệnh đồng mắc, chưa dùng KS gần đây)</div>
      <p>Amoxicillin liều cao, hoặc doxycycline, hoặc macrolide (chỉ khi tỷ lệ phế cầu kháng macrolide tại chỗ &lt;25%).</p>
      <div class="subhead">Ngoại trú có bệnh đồng mắc (tim/phổi/gan/thận mạn, ĐTĐ, nghiện rượu, suy giảm miễn dịch)</div>
      <p>Phối hợp amoxicillin-clavulanate (hoặc cephalosporin) <b>+</b> macrolide/doxycycline, hoặc đơn trị fluoroquinolone hô hấp (levofloxacin/moxifloxacin).</p>
      <div class="subhead">Nhập viện – không ICU</div>
      <p>Beta-lactam (ampicillin-sulbactam/ceftriaxone/cefotaxime) <b>+</b> macrolide, hoặc đơn trị fluoroquinolone hô hấp.</p>
      <div class="subhead">Nhập viện – ICU/nặng</div>
      <p>Beta-lactam phổ rộng <b>+</b> macrolide hoặc <b>+</b> fluoroquinolone hô hấp. Thêm phủ MRSA (vancomycin/linezolid) và/hoặc Pseudomonas (piperacillin-tazobactam/cefepime) nếu có yếu tố nguy cơ/phân lập trước đó.</p>
      <div class="alert-box alert-info">ATS/IDSA 2019 khuyến cáo <b>không</b> còn dùng thường quy nhóm HCAP (viêm phổi liên quan chăm sóc y tế) để chọn kháng sinh phổ rộng — quyết định dựa trên yếu tố nguy cơ MRSA/Pseudomonas cụ thể của từng bệnh nhân, không dựa nơi cư trú.</div>
      <div class="subhead">🧑‍⚕️ Kháng sinh theo từng đối tượng bệnh nền</div>
      ${rt(["Khuyến nghị kháng sinh","Lý do/lưu ý"],[

        ["Suy gan nặng (Child B–C)","Ưu tiên beta-lactam (ceftriaxone) + azithromycin; thận trọng liều nạp azithromycin nếu vàng da nặng","Tránh/giảm liều thuốc chuyển hóa qua gan; theo dõi men gan nếu phối hợp nhiều thuốc"],
        ["Dị ứng penicillin (nhẹ, không phản vệ)","Cephalosporin thế hệ 3 (ceftriaxone) thường an toàn (chéo phản ứng thấp &lt;2%)","Nếu tiền sử phản vệ với penicillin: chuyển fluoroquinolone hô hấp đơn trị hoặc aztreonam thay beta-lactam"],
        ["Dị ứng penicillin nặng (phản vệ/SJS)","Fluoroquinolone hô hấp đơn trị (levofloxacin/moxifloxacin)","Tránh mọi beta-lactam kể cả cephalosporin thế hệ sau"],
        ["Phụ nữ có thai","Beta-lactam (amoxicillin/ceftriaxone) + azithromycin","Tránh doxycycline (ảnh hưởng răng-xương thai) và fluoroquinolone (ảnh hưởng sụn khớp) trừ khi không còn lựa chọn khác"],
        ["Người cao tuổi tại viện dưỡng lão/sống phụ thuộc","Đánh giá nguy cơ MRSA/Pseudomonas cụ thể thay vì mặc định phổ rộng; ceftriaxone+azithromycin là lựa chọn hợp lý nếu không có yếu tố nguy cơ đặc biệt","Không dùng nhãn 'viêm phổi liên quan chăm sóc y tế' để tự động mở rộng phổ kháng sinh"],
        ["Nguy cơ MRSA (lọc máu, từng phân lập MRSA hô hấp, dùng KS TM gần đây, cúm nặng gần đây)","Thêm vancomycin hoặc linezolid vào phác đồ nền","Ngưng nếu cấy/PCR mũi âm tính MRSA và lâm sàng cải thiện (chiến lược xuống thang)"],
        ["Nguy cơ Pseudomonas (COPD nặng/giãn phế quản cấu trúc, dùng corticosteroid kéo dài, từng phân lập Pseudomonas)","Thêm piperacillin-tazobactam hoặc cefepime hoặc meropenem thay ceftriaxone","Xuống thang theo kháng sinh đồ khi có kết quả cấy"],
        ["Nghi hít sặc/áp xe phổi (nghiện rượu, rối loạn nuốt, động kinh)","Ampicillin-sulbactam hoặc phối hợp phủ kỵ khí (metronidazole/clindamycin)","Cân nhắc kéo dài thời gian điều trị nếu có áp xe/mủ màng phổi"],
        ["Suy giảm miễn dịch (ghép tạng, hóa trị, giảm bạch cầu hạt, HIV CD4 thấp)","Phối hợp phổ rộng theo hội chẩn chuyên khoa nhiễm; cân nhắc phủ nấm/PJP/virus theo bệnh cảnh","Ngưỡng nhập viện thấp hơn; xét nghiệm vi sinh mở rộng (galactomannan, PCR virus hô hấp, nhuộm PJP nếu nghi ngờ)"]
      ])}
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">Người cao tuổi/suy thận: chỉnh liều theo CrCl cho hầu hết kháng sinh nhóm beta-lactam và fluoroquinolone; thận trọng kéo dài QTc khi phối hợp macrolide/fluoroquinolone ở người có bệnh tim.</div>
      ${rt(["Liều người lớn","Lưu ý"],[
        ["Amoxicillin (ngoại trú)","1g × 3 lần/ngày","chỉnh liều theo CrCl&lt;30"],
        ["Doxycycline","100mg × 2 lần/ngày","tránh nắng gắt do nhạy cảm ánh sáng"],
        ["Azithromycin","500mg ngày 1 → 250mg ngày 2–5","theo dõi QTc nếu bệnh tim nền"],
        ["Levofloxacin","750mg × 1 lần/ngày","chỉnh liều theo CrCl; thận trọng phình/bóc tách ĐMC, đứt gân ở người cao tuổi"],
        ["Ceftriaxone (nhập viện)","1–2g × 1 lần/ngày TM","không cần chỉnh liều theo thận (thải chủ yếu qua mật)"],

      <p><b>Thời gian điều trị:</b> tối thiểu 5 ngày, ngưng khi ổn định lâm sàng ≥48–72h (hết sốt, sinh hiệu ổn) — không cần kéo dài thường quy trừ biến chứng (áp xe, mủ màng phổi, vi khuẩn không điển hình nặng).</p>`,
