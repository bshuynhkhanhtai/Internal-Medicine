<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phác Đồ Bỏ Túi">
<link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/180/00a896/heart-with-pulse.png">
<title>Công Cụ Y Khoa — Phác Đồ &amp; Thang Điểm (2025–2026)</title>
<style>
  :root{
    --tiffany-main:#00a896; --tiffany-dark:#028090; --tiffany-light:#e6f7f5;
    --bg-primary:#f2f9f9; --bg-card:#ffffff; --text-primary:#0f172a; --text-secondary:#4a6fa5;
    --border-color:#b8e0d2; --card-shadow:0 2px 10px rgba(0,168,150,.08);
    --danger:#ef4444; --warning:#f59e0b; --success:#10b981; --info:#3b82f6;
  }
  [data-theme="dark"]{
    --tiffany-main:#2dd4bf; --tiffany-dark:#14b8a6; --tiffany-light:#112d2b;
    --bg-primary:#081313; --bg-card:#102222; --text-primary:#f0fdfa; --text-secondary:#94a3b8;
    --border-color:#1e3e3c; --card-shadow:0 4px 14px rgba(0,0,0,.4);
    --danger:#f87171; --warning:#fbbf24; --success:#34d399; --info:#60a5fa;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
  html{height:-webkit-fill-available;scroll-behavior:smooth;}
  body{background:var(--bg-primary);color:var(--text-primary);padding-top:0;padding-bottom:env(safe-area-inset-bottom);min-height:100dvh;display:flex;flex-direction:column;transition:background-color .3s,color .3s;overscroll-behavior-y:none;overflow-x:hidden;-webkit-text-size-adjust:100%;}
  /* Header gọn + safe-area iPhone (notch / Dynamic Island) */
  header{background:linear-gradient(135deg,var(--tiffany-main),var(--tiffany-dark));color:#fff;padding-top:max(8px, env(safe-area-inset-top));padding-left:14px;padding-right:14px;padding-bottom:8px;position:sticky;top:0;z-index:45;box-shadow:0 2px 8px rgba(0,0,0,.12);}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;}
  h1{font-size:15px;font-weight:800;letter-spacing:-.3px;line-height:1.2;}
  .sub{font-size:10px;opacity:.85;font-weight:500;margin-top:1px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
  .theme-toggle-btn{background:rgba(255,255,255,.2);border:none;font-size:13px;padding:6px 10px;border-radius:16px;cursor:pointer;color:#fff;display:flex;align-items:center;gap:3px;backdrop-filter:blur(10px);flex-shrink:0;min-height:32px;}
  .theme-toggle-btn:active{background:rgba(255,255,255,.32);}

  .specialty-tabs-wrapper{background:var(--tiffany-dark);position:sticky;top:calc(env(safe-area-inset-top) + 78px);z-index:44;}
  .specialty-tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .specialty-tabs::-webkit-scrollbar{display:none;}
  .sp-tab{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:16px;background:rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;border:1px solid rgba(255,255,255,.2);}
  .sp-tab .emoji{font-size:14px;}
  .sp-tab.active{background:#fff;color:var(--tiffany-dark);border-color:#fff;}

  .disease-tabs-wrapper{background:var(--bg-card);border-bottom:1px solid var(--border-color);position:sticky;top:calc(env(safe-area-inset-top) + 118px);z-index:40;}
  .disease-tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .disease-tabs::-webkit-scrollbar{display:none;}
  .d-tab{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px;border-radius:14px;background:var(--bg-primary);color:var(--text-secondary);font-size:11.5px;font-weight:700;white-space:nowrap;cursor:pointer;min-width:60px;border:1px solid var(--border-color);}
  .d-tab .emoji{font-size:17px;line-height:1;margin-bottom:2px;}
  .d-tab.active{background:var(--tiffany-main);color:#fff;border-color:var(--tiffany-main);}

  .section-nav{display:flex;gap:6px;overflow-x:auto;padding:6px 12px;background:var(--tiffany-light);scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top) + 158px);z-index:35;border-bottom:1px solid var(--border-color);}
  .section-nav::-webkit-scrollbar{display:none;}
  .s-pill{flex-shrink:0;font-size:11.5px;font-weight:700;color:var(--tiffany-dark);background:var(--bg-card);padding:6px 11px;border-radius:12px;cursor:pointer;border:1px solid var(--border-color);}
  .s-pill.active{background:var(--tiffany-dark);color:#fff;border-color:var(--tiffany-dark);}

  .container{flex:1;padding:14px 14px 50px;display:flex;flex-direction:column;gap:14px;max-width:720px;margin:0 auto;width:100%;overflow-x:hidden;}

  .disease-header{background:linear-gradient(135deg,var(--tiffany-light),var(--bg-card));border:1px solid var(--border-color);border-radius:16px;padding:16px;}
  .disease-header h2{font-size:18px;font-weight:800;color:var(--tiffany-dark);margin-bottom:4px;}
  .disease-header .guideline-tag{display:inline-block;font-size:10.5px;font-weight:700;background:var(--tiffany-main);color:#fff;padding:3px 9px;border-radius:8px;margin-top:6px;margin-right:6px;}

  .card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;box-shadow:var(--card-shadow);overflow:hidden;scroll-margin-top:calc(env(safe-area-inset-top) + 210px);}
  .card-head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer;}
  .card-head-title{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:800;color:var(--text-primary);}
  .card-head-title .ic{font-size:16px;}
  .chevron{font-size:13px;color:var(--tiffany-main);transition:transform .25s;flex-shrink:0;}
  .card.open .chevron{transform:rotate(180deg);}
  .card-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .card.open .card-body{max-height:none;}
  .card-body-inner{padding:0 14px 16px;font-size:13.3px;line-height:1.62;color:var(--text-primary);word-break:break-word;}
  .card-body-inner p{margin-bottom:8px;}
  .card-body-inner ul{padding-left:18px;margin-bottom:8px;}
  .card-body-inner li{margin-bottom:5px;}
  .card-body-inner b{color:var(--tiffany-dark);}

  .subhead{font-size:12px;font-weight:800;color:var(--tiffany-dark);text-transform:uppercase;letter-spacing:.3px;margin:12px 0 6px;}
  .subhead:first-child{margin-top:0;}

  /* Bảng dạng thẻ xếp dọc — không kéo ngang, luôn gọn trong 1 màn hình */
  .rtable{display:flex;flex-direction:column;gap:7px;margin-bottom:10px;width:100%;}
  .rtable-row{background:var(--bg-primary);border:1px solid var(--border-color);border-radius:10px;padding:9px 11px;width:100%;}
  .rtable-title{font-weight:800;font-size:12.8px;color:var(--tiffany-dark);margin-bottom:4px;line-height:1.4;}
  .rtable-cell{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:12.3px;padding:4px 0;border-top:1px dashed var(--border-color);}
  .rtable-row .rtable-cell:first-of-type{border-top:none;padding-top:0;}
  .rtable-label{color:var(--text-secondary);font-weight:700;flex-shrink:0;white-space:nowrap;}
  .rtable-value{color:var(--text-primary);text-align:right;font-weight:600;}

  .badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;color:#fff;white-space:nowrap;}
  .badge-I{background:var(--success);}
  .badge-IIa{background:var(--info);}
  .badge-IIb{background:var(--warning);}
  .badge-III{background:var(--danger);}

  .alert-box{border-radius:10px;padding:10px 12px;font-size:12.3px;line-height:1.5;margin-bottom:10px;border-left:4px solid;}
  .alert-warn{background:rgba(245,158,11,.1);border-color:var(--warning);}
  .alert-danger{background:rgba(239,68,68,.1);border-color:var(--danger);}
  .alert-info{background:rgba(59,130,246,.1);border-color:var(--info);}

  .age-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--tiffany-light);color:var(--tiffany-dark);margin-bottom:3px;}

  .source-note{font-size:10.5px;color:var(--text-secondary);font-style:italic;padding:2px 4px 0;}

  /* Ô tính điểm tương tác (thang điểm lâm sàng) */
  .score-box{background:var(--tiffany-light);border:1.5px solid var(--tiffany-main);border-radius:12px;padding:12px;margin-bottom:12px;}
  .score-title{font-weight:800;font-size:13px;color:var(--tiffany-dark);margin-bottom:8px;display:flex;align-items:center;gap:5px;}
  .score-title .tag-auto{font-size:9.5px;font-weight:700;background:var(--tiffany-main);color:#fff;padding:1px 6px;border-radius:6px;}
  .score-item{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dashed var(--border-color);cursor:pointer;font-size:12.5px;}
  .score-item:last-of-type{border-bottom:none;}
  .score-item input[type=checkbox]{width:17px;height:17px;flex-shrink:0;accent-color:var(--tiffany-main);}
  .score-item span.it-label{flex:1;color:var(--text-primary);line-height:1.4;}
  .score-item span.it-pts{flex-shrink:0;font-weight:800;color:var(--tiffany-dark);font-size:11.5px;background:var(--bg-card);padding:1px 7px;border-radius:8px;}
  .score-result{margin-top:10px;padding:9px 11px;background:var(--bg-card);border-radius:10px;font-size:13px;display:flex;flex-direction:column;gap:3px;border:1px solid var(--border-color);}
  .score-result .sr-total{font-weight:800;color:var(--text-primary);}
  .score-result .sr-total b{font-size:17px;color:var(--tiffany-dark);}
  .score-result .sr-interp{font-weight:700;font-size:12.3px;}
  .score-reset{margin-top:8px;font-size:11px;font-weight:700;color:var(--tiffany-dark);background:none;border:1px solid var(--tiffany-main);border-radius:8px;padding:4px 10px;cursor:pointer;}
  .score-group{padding:7px 4px;border-bottom:1px dashed var(--border-color);}
  .score-group:last-of-type{border-bottom:none;}
  .sg-label{font-weight:700;font-size:12.3px;color:var(--text-primary);margin-bottom:5px;}
  .sg-opts{display:flex;flex-direction:column;gap:5px;}
  .score-radio-opt{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-secondary);cursor:pointer;}
  .score-radio-opt input[type=radio]{width:15px;height:15px;flex-shrink:0;accent-color:var(--tiffany-main);}
  .score-select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-primary);font-size:12.5px;font-weight:600;-webkit-appearance:none;appearance:none;}

  footer{text-align:center;font-size:10.5px;color:var(--text-secondary);padding:10px 16px 20px;}

  .score-chip{padding:8px 14px;border-radius:16px;border:none;background:var(--bg-primary);color:var(--text-secondary);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;}
  .score-chip.active{background:var(--tiffany-main);color:#fff;}
  .scale-card{background:var(--bg-card);border-radius:14px;padding:14px 16px;box-shadow:var(--card-shadow,0 2px 10px rgba(0,168,150,.08));border:1px solid var(--border-color);cursor:pointer;}
  .scale-card:active{transform:scale(0.98);}
  .scale-title{font-size:15px;font-weight:700;color:var(--tiffany-dark);margin-bottom:4px;}
  [data-theme="dark"] .scale-title{color:var(--tiffany-main);}
  .scale-desc{font-size:12.5px;color:var(--text-secondary);margin-bottom:8px;line-height:1.35;}
  .scale-badge{display:inline-block;padding:3px 8px;border-radius:6px;background:var(--tiffany-light);font-size:11px;font-weight:600;color:var(--tiffany-dark);}
  .criterion-group{background:var(--bg-card);border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--border-color);}
  .criterion-title{font-size:14px;font-weight:700;margin-bottom:4px;}
  .criterion-detail{font-size:12px;color:var(--text-secondary);margin-bottom:8px;}
  .option-select{width:100%;padding:12px;min-height:44px;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-primary);color:var(--text-primary);font-size:14px;}
  #mainTabBar button.active-main{background:#fff!important;color:var(--tiffany-dark)!important;}
  #mainTabBar button:not(.active-main){background:rgba(255,255,255,.25)!important;color:#fff!important;}

  .smart-search-drop{position:absolute;left:14px;right:14px;top:100%;max-height:55vh;overflow-y:auto;background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:80;display:none;}
  .smart-search-drop.open{display:block;}
  .ss-item{padding:11px 14px;border-bottom:1px solid var(--border-color);cursor:pointer;display:flex;gap:10px;align-items:flex-start;}
  .ss-item:last-child{border-bottom:none;}
  .ss-item:active{background:var(--tiffany-light);}
  .ss-emoji{font-size:18px;flex-shrink:0;line-height:1.2;}
  .ss-body{flex:1;min-width:0;}
  .ss-title{font-size:13.5px;font-weight:700;color:var(--text-primary);line-height:1.3;}
  .ss-meta{font-size:11.5px;color:var(--text-secondary);margin-top:2px;}
  .ss-tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--tiffany-light);color:var(--tiffany-dark);margin-left:6px;}
  .ss-group{font-size:11px;font-weight:800;color:var(--tiffany-dark);padding:8px 14px 4px;background:var(--bg-primary);position:sticky;top:0;}
  .search-wrap{position:relative;padding:8px 14px 6px;}


  /* Sticky toolbar trong tab Thang điểm */
  #scoreStickyBar{position:sticky;top:calc(env(safe-area-inset-top) + 78px);z-index:42;background:var(--bg-primary);padding-bottom:2px;border-bottom:1px solid var(--border-color);}
  #scoreAbcBar{display:flex;gap:2px;overflow-x:auto;padding:4px 10px 6px;background:var(--tiffany-light);scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  #scoreAbcBar::-webkit-scrollbar{display:none;}
  .abc-letter{flex-shrink:0;min-width:26px;padding:5px 6px;text-align:center;font-size:12px;font-weight:800;color:var(--tiffany-dark);border-radius:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .abc-letter:active,.abc-letter.active{background:var(--tiffany-main);color:#fff;}
  .abc-group-header{font-size:15px;font-weight:800;color:var(--tiffany-dark);margin:12px 0 6px;padding-bottom:3px;border-bottom:2px solid var(--tiffany-main);scroll-margin-top:calc(env(safe-area-inset-top) + 170px);}
  [data-theme="dark"] .abc-group-header{color:var(--tiffany-main);}


  #mainTabBar{display:flex;gap:6px;}
  #mainTabBar button{flex:1;padding:8px 6px!important;border-radius:9px!important;border:none;font-weight:700;font-size:12.5px!important;cursor:pointer;min-height:36px;}
  /* Sticky tabs dưới header không bị che */
  /* sticky tops handled above with safe-area calc */
  /* Modal full-screen iPhone */
  #calcModal{padding-top:env(safe-area-inset-top);}
  @media (max-width:428px){
    h1{font-size:14px!important;}
    .sub{font-size:9.5px!important;}
    header{padding-left:12px;padding-right:12px;padding-bottom:6px;}
  }


</style>
</head>
<body>

<header>
  <div class="top-bar">
    <div>
      <h1>📖 Công Cụ Y Khoa Lâm Sàng</h1>
      <div class="sub">Phác đồ điều trị · Thang điểm — ESC/AHA/ADA/GINA/GOLD 2025–2026</div>
    </div>
    <button class="theme-toggle-btn" onclick="toggleTheme()">
      <span id="themeIcon">☀️</span><span id="themeText">Sáng</span>
    </button>
  </div>
  <div id="mainTabBar" style="display:flex;gap:6px;padding:0;margin:0;">
    <button id="tabPhacDo" class="active-main" onclick="switchMainTab('phacdo')" style="flex:1;padding:10px;border-radius:10px;border:none;font-weight:700;font-size:13px;cursor:pointer;">📋 Phác đồ điều trị</button>
    <button id="tabThangDiem" onclick="switchMainTab('thangdiem')" style="flex:1;padding:10px;border-radius:10px;border:none;font-weight:700;font-size:13px;cursor:pointer;">🧮 Tra cứu thang điểm</button>
  </div>
</header>

<!-- VIEW PHÁC ĐỒ -->
<div id="viewPhacDo">
  <div class="search-wrap">
    <input id="quickSearch" type="search" placeholder="Tìm thông minh: THA, COPD, GCS, HAS-BLED, suy tim…"
      style="width:100%;padding:9px 12px;border-radius:10px;border:1.5px solid var(--border-color);background:var(--bg-card);color:var(--text-primary);font-size:13px;outline:none;box-sizing:border-box;"
      oninput="smartSearch(this.value)" onfocus="smartSearch(this.value)"
      onkeydown="handleSmartSearchKey(event)">
    <div id="smartSearchDrop" class="smart-search-drop"></div>
  </div>
  <div class="specialty-tabs-wrapper">
    <div class="specialty-tabs" id="specialtyTabs"></div>
  </div>
  <div class="disease-tabs-wrapper">
    <div class="disease-tabs" id="diseaseTabs"></div>
  </div>
  <div class="section-nav" id="sectionNav"></div>
  <div class="container" id="mainContainer"></div>
  <footer style="text-align:center;font-size:10.5px;color:var(--text-secondary);padding:10px 16px 24px;">
    ⚠️ Tài liệu tham khảo lâm sàng nhanh — không thay thế phán đoán bác sĩ điều trị.
  </footer>
</div>

<!-- VIEW THANG ĐIỂM -->
<div id="viewThangDiem" style="display:none;">
  <div id="scoreStickyBar">
    <div class="search-wrap" style="padding:8px 14px 6px;">
      <input id="scoreSearch" type="search" placeholder="Tìm thông minh: GCS, CURB, Wells, CHA2, SOFA…"
        style="width:100%;padding:9px 12px;border-radius:10px;border:1.5px solid var(--border-color);background:var(--bg-card);color:var(--text-primary);font-size:13px;outline:none;box-sizing:border-box;"
        oninput="smartSearchScores(this.value)" onfocus="smartSearchScores(this.value)"
        onkeydown="if(event.key==='Escape'){this.value='';smartSearchScores('');}">
    </div>
    <div style="display:flex;gap:6px;overflow-x:auto;padding:2px 14px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;">
      <button class="score-chip active" data-cat="all" onclick="filterScoreCat('all',this)">Tất cả</button>
      <button class="score-chip" data-cat="tim_mach" onclick="filterScoreCat('tim_mach',this)">Tim mạch</button>
      <button class="score-chip" data-cat="cap_cuu" onclick="filterScoreCat('cap_cuu',this)">Cấp cứu</button>
      <button class="score-chip" data-cat="than_kinh" onclick="filterScoreCat('than_kinh',this)">Thần kinh</button>
      <button class="score-chip" data-cat="ho_hap" onclick="filterScoreCat('ho_hap',this)">Hô hấp</button>
      <button class="score-chip" data-cat="tieu_hoa" onclick="filterScoreCat('tieu_hoa',this)">Tiêu hóa</button>
    </div>
    <div id="scoreAbcBar"></div>
  </div>
  <div id="scalesList" style="padding:8px 14px 40px;display:flex;flex-direction:column;gap:8px;"></div>
</div>

<!-- Modal tính điểm -->
<div id="calcModal" style="display:none;position:fixed;inset:0;z-index:200;background:var(--bg-primary);flex-direction:column;">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--bg-card);border-bottom:1px solid var(--border-color);gap:8px;">
    <button onclick="closeScoreModal()" style="background:var(--tiffany-light);border:none;color:var(--tiffany-dark);font-weight:700;padding:8px 12px;border-radius:10px;cursor:pointer;flex-shrink:0;font-size:13px;">← Quay lại</button>
    <div id="modalScaleTitle" style="font-weight:700;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;"></div>
    <button onclick="closeScoreModal()" style="background:transparent;border:1px solid var(--border-color);color:var(--text-secondary);font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer;flex-shrink:0;font-size:13px;">Đóng</button>
  </div>
  <div style="position:sticky;top:0;z-index:50;background:var(--bg-card);border-bottom:2px solid var(--tiffany-main);padding:10px 16px;display:flex;align-items:center;gap:14px;">
    <div style="min-width:70px;text-align:center;padding:6px 10px;background:var(--tiffany-light);border-radius:10px;border:1px solid var(--tiffany-main);">
      <div id="stickyScoreNum" style="font-size:22px;font-weight:800;color:var(--tiffany-dark);">0</div>
      <div style="font-size:9px;font-weight:700;color:var(--tiffany-dark);">ĐIỂM</div>
    </div>
    <div id="stickyScoreEval" style="font-size:13px;font-weight:600;line-height:1.35;flex:1;"></div>
  </div>
  <div id="modalScaleBody" style="flex:1;overflow-y:auto;padding:14px 16px 40px;-webkit-overflow-scrolling:touch;"></div>
</div>

<script>
/* =========================================================
   HELPER: render bảng dạng thẻ xếp dọc — không kéo ngang
   headers: [ "Cột phụ 1", "Cột phụ 2", ... ] (KHÔNG bao gồm cột đầu)
   rows: [ [tieu_de_dong, giatri1, giatri2, ...], ... ]
   ========================================================= */
function rt(headers, rows){
  const body = rows.map(r => {
    const title = r[0];
    const cells = headers.map((h,i) => `
      <div class="rtable-cell"><span class="rtable-label">${h}</span><span class="rtable-value">${r[i+1]}</span></div>
    `).join('');
    return `<div class="rtable-row"><div class="rtable-title">${title}</div>${cells}</div>`;
  }).join('');
  return `<div class="rtable">${body}</div>`;
}

/* =========================================================
   HELPER: bảng tính điểm lâm sàng tương tác (tick chọn → tự cộng điểm)
   calcId: mã định danh duy nhất
   title: tiêu đề thang điểm
   items: [{label, pts}, ...]
   ========================================================= */
function sc(calcId, title, items){
  const rows = items.map((it,i) => `
    <label class="score-item">
      <input type="checkbox" data-pts="${it.pts}" onchange="updateScore('${calcId}')">
      <span class="it-label">${it.label}</span>
      <span class="it-pts">+${it.pts}</span>
    </label>`).join('');
  return `
    <div class="score-box" data-calc="${calcId}">
      <div class="score-title">🧮 ${title} <span class="tag-auto">Tự động tính</span></div>
      ${rows}
      <div class="score-result">
        <div class="sr-total">Tổng điểm: <b id="${calcId}_total">0</b></div>
        <div class="sr-interp" id="${calcId}_interp">${scoreInterp[calcId] ? scoreInterp[calcId](0) : ''}</div>
      </div>
      <button type="button" class="score-reset" onclick="resetScore('${calcId}')">↺ Đặt lại</button>
    </div>`;
}

/* =========================================================
   HELPER: bảng tính điểm dạng chọn 1 mức/tiêu chí (radio group)
   dùng cho thang điểm có nhiều mức điểm mỗi tiêu chí (vd. Child-Pugh)
   groups: [{label, options:[{text, pts}, ...]}, ...]
   ========================================================= */
function scr(calcId, title, groups){
  const rows = groups.map((g,gi) => {
    const opts = g.options.map((o,oi) => `
      <label class="score-radio-opt">
        <input type="radio" name="${calcId}_g${gi}" data-pts="${o.pts}" ${oi===0?'checked':''} onchange="updateScoreR('${calcId}')">
        <span>${o.text}</span>
      </label>`).join('');
    return `<div class="score-group"><div class="sg-label">${g.label}</div><div class="sg-opts">${opts}</div></div>`;
  }).join('');
  return `
    <div class="score-box" data-calcr="${calcId}" data-groups="${groups.length}">
      <div class="score-title">🧮 ${title} <span class="tag-auto">Tự động tính</span></div>
      ${rows}
      <div class="score-result">
        <div class="sr-total">Tổng điểm: <b id="${calcId}_total">${groups.reduce((s,g)=>s+g.options[0].pts,0)}</b></div>
        <div class="sr-interp" id="${calcId}_interp">${scoreInterp[calcId] ? scoreInterp[calcId](groups.reduce((s,g)=>s+g.options[0].pts,0)) : ''}</div>
      </div>
    </div>`;
}

function updateScoreR(calcId){
  const box = document.querySelector(`.score-box[data-calcr="${calcId}"]`);
  if(!box) return;
  const nGroups = parseInt(box.dataset.groups,10);
  let total = 0;
  for(let gi=0; gi<nGroups; gi++){
    const checked = box.querySelector(`input[name="${calcId}_g${gi}"]:checked`);
    if(checked) total += parseFloat(checked.dataset.pts);
  }
  const totalEl = document.getElementById(calcId+'_total');
  const interpEl = document.getElementById(calcId+'_interp');
  if(totalEl) totalEl.textContent = total;
  if(interpEl && scoreInterp[calcId]) interpEl.innerHTML = scoreInterp[calcId](total);
}

/* =========================================================
   HELPER: ước tính nhanh SCORE2/SCORE2-OP bằng dropdown chọn
   (mô hình xấp xỉ theo xu hướng gradient nguy cơ ESC — chỉ mang tính sàng lọc)
   ========================================================= */
function sc2(){
  return `
    <div class="score-box" data-calc2="score2">
      <div class="score-title">🧮 Ước tính SCORE2 <span class="tag-auto">Ước tính gần đúng</span></div>
      <div class="score-group">
        <div class="sg-label">Tuổi</div>
        <select class="score-select" id="score2_age" onchange="calcSCORE2()">
          <option value="45">40–49</option>
          <option value="55" selected>50–59</option>
          <option value="65">60–69</option>
          <option value="75">70–79 (SCORE2-OP)</option>
          <option value="85">≥80 (SCORE2-OP)</option>
        </select>
      </div>
      <div class="score-group">
        <div class="sg-label">Giới tính</div>
        <select class="score-select" id="score2_sex" onchange="calcSCORE2()">
          <option value="male">Nam</option>
          <option value="female">Nữ</option>
        </select>
      </div>
      <div class="score-group">
        <div class="sg-label">Hút thuốc lá hiện tại</div>
        <select class="score-select" id="score2_smoke" onchange="calcSCORE2()">
          <option value="no">Không hút</option>
          <option value="yes">Đang hút</option>
        </select>
      </div>
      <div class="score-group">
        <div class="sg-label">Huyết áp tâm thu (mmHg)</div>
        <select class="score-select" id="score2_sbp" onchange="calcSCORE2()">
          <option value="110">&lt;120</option>
          <option value="130" selected>120–139</option>
          <option value="150">140–159</option>
          <option value="170">160–179</option>
          <option value="185">≥180</option>
        </select>
      </div>
      <div class="score-group">
        <div class="sg-label">Non-HDL Cholesterol</div>
        <select class="score-select" id="score2_chol" onchange="calcSCORE2()">
          <option value="3.0">&lt;3.0 mmol/L (~116 mg/dL)</option>
          <option value="3.8" selected>3.0–3.9 mmol/L (~116-150)</option>
          <option value="4.5">4.0–4.9 mmol/L (~150-190)</option>
          <option value="5.5">5.0–5.9 mmol/L (~190-230)</option>
          <option value="6.5">≥6.0 mmol/L (~230+)</option>
        </select>
      </div>
      <div class="score-group">
        <div class="sg-label">Vùng nguy cơ quốc gia (theo phân vùng ESC)</div>
        <select class="score-select" id="score2_region" onchange="calcSCORE2()">
          <option value="0.65">Nguy cơ thấp</option>
          <option value="1.0" selected>Nguy cơ trung bình</option>
          <option value="1.5">Nguy cơ cao</option>
          <option value="2.2">Nguy cơ rất cao</option>
        </select>
      </div>
      <div class="score-result">
        <div class="sr-total">Ước tính nguy cơ 10 năm: <b id="score2_pct">—</b></div>
        <div class="sr-interp" id="score2_interp">Chọn đủ các mục ở trên để xem ước tính</div>
      </div>
    </div>`;
}

function calcSCORE2(){
  const age = parseFloat(document.getElementById('score2_age').value);
  const sex = document.getElementById('score2_sex').value;
  const smoke = document.getElementById('score2_smoke').value;
  const sbp = parseFloat(document.getElementById('score2_sbp').value);
  const chol = parseFloat(document.getElementById('score2_chol').value);
  const region = parseFloat(document.getElementById('score2_region').value);

  // Base rate xấp xỉ theo tuổi/giới (tham chiếu: không hút thuốc, SBP~120, non-HDL~3.5, vùng nguy cơ trung bình)
  const baseRates = { male:{45:1.5,55:4,65:9,75:17,85:28}, female:{45:0.7,55:2,65:5,75:11,85:20} };
  let base = baseRates[sex][age];

  // Hệ số nhân xấp xỉ theo mỗi yếu tố (mô phỏng gradient tương đối của SCORE2)
  const smokeMult = smoke === 'yes' ? 1.6 : 1.0;
  const sbpMult = 1 + Math.max(0, (sbp - 120) / 20) * 0.18;
  const cholMult = 1 + Math.max(0, (chol - 3.5) / 1.5) * 0.18;

  let risk = base * smokeMult * sbpMult * cholMult * region;
  risk = Math.min(risk, 90); // trần hợp lý

  const pctEl = document.getElementById('score2_pct');
  const interpEl = document.getElementById('score2_interp');
  const pctText = risk < 1 ? '<1%' : risk.toFixed(1) + '%';
  pctEl.textContent = pctText + ' (ước tính)';

  // Diễn giải theo ngưỡng tuổi ESC 2021
  let category, colorNote;
  const ageNum = age;
  if(ageNum < 50){
    category = risk < 2.5 ? 'Thấp-Trung bình' : risk < 7.5 ? 'Cao' : 'Rất cao';
  } else if(ageNum < 70){
    category = risk < 5 ? 'Thấp-Trung bình' : risk < 10 ? 'Cao' : 'Rất cao';
  } else {
    category = risk < 7.5 ? 'Thấp-Trung bình' : risk < 15 ? 'Cao' : 'Rất cao';
  }
  interpEl.innerHTML = `Phân loại tham khảo: <b>Nguy cơ ${category}</b> — đây là ước tính gần đúng, xác nhận lại bằng công cụ SCORE2 chính thức trước khi quyết định điều trị statin.`;
}

const scoreInterp = {
  cha2ds2va: (t) => t>=2 ? `⚠️ Nguy cơ đột quỵ cao — <b>khuyến cáo kháng đông</b> (Class I)` : t===1 ? `Nguy cơ trung bình — cân nhắc kháng đông theo đặc điểm bệnh nhân (Class IIa)` : `Nguy cơ thấp — có thể không cần kháng đông thường quy`,
  hasbled: (t) => t>=3 ? `⚠️ Nguy cơ chảy máu cao — không loại trừ kháng đông, nhưng cần theo dõi sát/hiệu chỉnh yếu tố nguy cơ có thể sửa được` : `Nguy cơ chảy máu không cao — theo dõi định kỳ như thường quy`,
  curb65: (t) => t<=1 ? `Nhẹ — có thể điều trị ngoại trú` : t===2 ? `Trung bình — cân nhắc nhập viện ngắn ngày/theo dõi sát` : `Nặng — khuyến cáo nhập viện, cân nhắc ICU nếu ≥4 điểm`,
  childpugh: (t) => t<=6 ? `Child-Pugh A — xơ gan còn bù, tiên lượng tốt` : t<=9 ? `Child-Pugh B — mất bù trung bình` : `Child-Pugh C — mất bù nặng, cân nhắc đánh giá ghép gan`,
  das28ra: (t) => t<3 ? `Kiểm soát tốt — hoạt động bệnh thấp/lui bệnh` : t<5 ? `Hoạt động bệnh trung bình — cân nhắc tối ưu/leo thang điều trị` : `Hoạt động bệnh cao — cần leo thang điều trị theo treat-to-target`,
  findrisc: (t) => t<7 ? `Nguy cơ thấp — ước tính ~1% sẽ mắc ĐTĐ type 2 trong 10 năm` : t<=11 ? `Nguy cơ hơi tăng — ước tính ~4% trong 10 năm` : t<=14 ? `Nguy cơ trung bình — ước tính ~17% trong 10 năm, nên xét nghiệm glucose/HbA1c` : t<=20 ? `⚠️ Nguy cơ cao — ước tính ~33% trong 10 năm, khuyến cáo xét nghiệm glucose/HbA1c và tư vấn thay đổi lối sống` : `⚠️ Nguy cơ rất cao — ước tính ~50% trong 10 năm, cần xét nghiệm glucose/HbA1c ngay`,
  gbs: (t) => t===0 ? `Nguy cơ rất thấp — có thể cân nhắc điều trị ngoại trú, không cần nội soi cấp cứu` : t<=5 ? `Nguy cơ thấp-trung bình — cân nhắc nhập viện theo dõi, nội soi trong vòng 24h` : `⚠️ Nguy cơ cao — cần nhập viện, hồi sức tích cực, nội soi sớm trong vòng 24h (càng sớm càng tốt nếu huyết động không ổn)`,
  rockallpre: (t) => t===0 ? `Nguy cơ tử vong/tái xuất huyết rất thấp (điểm trước nội soi)` : t<=2 ? `Nguy cơ thấp (điểm trước nội soi)` : `Nguy cơ cao (điểm trước nội soi) — cần đánh giá khẩn, tính lại điểm đầy đủ sau nội soi`,
  rockallfull: (t) => t<=2 ? `Nguy cơ thấp — tử vong &lt;5%, có thể cân nhắc xuất viện sớm nếu ổn định` : t<=5 ? `Nguy cơ trung bình — tử vong ~5-15%, cần theo dõi sát tại bệnh viện` : `⚠️ Nguy cơ cao — tử vong &gt;15-40% tùy điểm, cần hồi sức tích cực/ICU và theo dõi sát nguy cơ tái xuất huyết`,
  kocher: (t) => t===0 ? `Nguy cơ nhiễm trùng khớp rất thấp (&lt;3%)` : t===1 ? `Nguy cơ thấp (~3%) — theo dõi sát, cân nhắc chọc dò nếu nghi ngờ lâm sàng cao` : t===2 ? `Nguy cơ trung bình (~40%) — cân nhắc chọc dò dịch khớp` : t===3 ? `⚠️ Nguy cơ cao (~93%) — khuyến cáo chọc dò dịch khớp khẩn cấp` : `⚠️ Nguy cơ rất cao (&gt;99%) — xử trí như viêm khớp nhiễm trùng cho đến khi loại trừ`,
  bisap: (t) => t<3 ? `Nguy cơ thấp — tiên lượng thuận lợi` : `⚠️ Nguy cơ cao (BISAP≥3) — tăng đáng kể nguy cơ tử vong/biến chứng nặng, cân nhắc theo dõi sát/ICU sớm`,
  timi: (t) => t<=1 ? `Nguy cơ thấp (~5% biến cố trong 14 ngày)` : t<=3 ? `Nguy cơ trung bình — cân nhắc chiến lược can thiệp xâm lấn sớm` : t<=5 ? `⚠️ Nguy cơ cao — ủng hộ can thiệp xâm lấn sớm` : `⚠️ Nguy cơ rất cao — ưu tiên can thiệp xâm lấn sớm`,
  act: (t) => t>=20 ? `Hen được kiểm soát tốt` : t>=16 ? `Hen chưa được kiểm soát tốt — cân nhắc leo thang điều trị` : `⚠️ Hen kiểm soát kém — cần leo thang điều trị và đánh giá lại kỹ thuật hít/tuân thủ`,
  cat: (t) => t<10 ? `Ảnh hưởng thấp lên chất lượng cuộc sống` : t<=20 ? `Ảnh hưởng trung bình` : t<=30 ? `⚠️ Ảnh hưởng cao` : `⚠️ Ảnh hưởng rất cao lên chất lượng cuộc sống`,
  wellspe: (t) => t<2 ? `Xác suất thấp — (2 mức: ≤4 = "PE ít khả năng", làm D-dimer trước khi quyết định chụp CT)` : t<=6 ? `Xác suất trung bình — cân nhắc D-dimer hoặc CTPA tùy ngưỡng 2-mức (≤4 vs &gt;4)` : `⚠️ Xác suất cao (&gt;6đ, hoặc &gt;4đ theo thang 2-mức) — cân nhắc CTPA trực tiếp, không cần chờ D-dimer`,
  years: (t) => t===0 ? `0 tiêu chí dương tính — loại trừ PE nếu D-dimer &lt;1000 ng/mL` : `⚠️ ${t} tiêu chí dương tính — cần ngưỡng D-dimer thấp hơn (&lt;500 ng/mL) mới loại trừ được PE`,
  spesi: (t) => t===0 ? `Nguy cơ tử vong 30 ngày rất thấp — có thể cân nhắc điều trị ngoại trú nếu phù hợp` : `⚠️ sPESI≥1 — nguy cơ tăng, cân nhắc nhập viện theo dõi`,
  grace: (t) => t<=108 ? `Nguy cơ thấp (&lt;1% tử vong nội viện) — chiến lược xâm lấn có thể trong 72h/chọn lọc` : t<=140 ? `Nguy cơ trung bình (1-3% tử vong nội viện) — can thiệp xâm lấn sớm trong &lt;24h` : `⚠️ Nguy cơ cao (&gt;3% tử vong nội viện) — can thiệp xâm lấn ngay trong &lt;2h`,
  framingham: (t) => t>=4 ? `✅ Đủ tiêu chuẩn chẩn đoán suy tim theo Framingham (tương đương ≥2 chính, hoặc 1 chính+2 phụ)` : `Chưa đủ tiêu chuẩn Framingham — cần thêm NT-proBNP/siêu âm tim để đánh giá`,
  bova: (t) => t<=2 ? `Giai đoạn I — nguy cơ thấp biến chứng liên quan PE trong 30 ngày` : t<=4 ? `Giai đoạn II — nguy cơ trung bình` : `⚠️ Giai đoạn III — nguy cơ cao biến chứng liên quan PE trong 30 ngày`,
  addrs: (t) => t===0 ? `Nguy cơ thấp — cân nhắc D-dimer để loại trừ AAS` : t===1 ? `Nguy cơ trung bình — làm D-dimer; nếu ≥500 ng/mL → CTA` : `⚠️ Nguy cơ cao — CTA khẩn cấp, không chờ D-dimer`,
  hcmriskscd: (t) => t===0 ? `Chưa có yếu tố nguy cơ chính liệt kê — tính công thức đầy đủ HCM Risk-SCD để ước tính %` : `Có ${t} yếu tố nguy cơ chính — cân nhắc ICD theo shared decision-making + tính HCM Risk-SCD chính thức`
};


function updateScore(calcId){
  const box = document.querySelector(`.score-box[data-calc="${calcId}"]`);
  if(!box) return;
  const checks = box.querySelectorAll('input[type=checkbox]');
  let total = 0;
  checks.forEach(c => { if(c.checked) total += parseFloat(c.dataset.pts); });
  const totalEl = document.getElementById(calcId+'_total');
  const interpEl = document.getElementById(calcId+'_interp');
  if(totalEl) totalEl.textContent = total;
  if(interpEl && scoreInterp[calcId]) interpEl.innerHTML = scoreInterp[calcId](total);
}

function resetScore(calcId){
  const box = document.querySelector(`.score-box[data-calc="${calcId}"]`);
  if(!box) return;
  box.querySelectorAll('input[type=checkbox]').forEach(c => c.checked = false);
  updateScore(calcId);
}

      <p>Đánh giá nguy cơ tim mạch tổng thể (thang SCORE2/SCORE2-OP), tầm soát tổn thương cơ quan đích (đáy mắt, ECG, creatinine/eGFR, albumin niệu) và <b>sàng lọc THA thứ phát</b> khi có dấu hiệu gợi ý (khởi phát &lt;30 tuổi, THA kháng trị, hạ kali máu). ESC 2024 khuyến cáo cân nhắc đo renin/aldosterone tầm soát cường aldosteron nguyên phát ở tất cả người lớn THA đã xác định (IIa).</p>
      <div class="subhead">🧮 Ước tính nhanh nguy cơ tim mạch 10 năm — SCORE2 / SCORE2-OP</div>
      <div class="alert-box alert-info">Công cụ dưới đây cho ước tính <b>gần đúng, mang tính sàng lọc nhanh</b> — không thay thế công cụ tính chính thức khi ra quyết định điều trị. Với người THA đã có bệnh tim mạch/ĐTĐ có tổn thương cơ quan đích/bệnh thận mạn nặng, xếp thẳng vào nguy cơ rất cao, không cần tính SCORE2.</div>
      ${sc2()}`,
    dieu_tri:`
      <div class="subhead">Mục tiêu điều trị</div>
      <p><b>ESC 2024:</b> mục tiêu HA tâm thu <b>120–129 mmHg</b> cho hầu hết người lớn đang điều trị (kể cả người cao tuổi không suy yếu, &lt;85 tuổi). Nếu không dung nạp, tuổi ≥85, suy yếu trung bình–nặng, hạ HA tư thế có triệu chứng, hoặc tiên lượng sống hạn chế → mục tiêu "thấp nhất có thể dung nạp hợp lý" (ALARA).</p>
      <p><b>AHA/ACC 2025:</b> mục tiêu chung &lt;130/80 mmHg (đặc biệt ĐTĐ, CKD, HF). ESC 2024 ưu tiên SBP 120–129 nếu dung nạp.</p>
      <div class="subhead">Chiến lược khởi trị</div>
      <ul>
        <li>Nguy cơ tim mạch 10 năm thấp–trung bình (&lt;10%): thay đổi lối sống 3 tháng; dùng thuốc nếu HA vẫn ≥140/90.</li>
        <li>Nguy cơ cao/rất cao, đã có bệnh tim mạch, ĐTĐ, bệnh thận mạn: khởi trị thuốc khi HA &gt;130/80 mmHg.</li>
        <li><b>Ưu tiên khởi đầu bằng viên phối hợp liều thấp 2 thuốc</b> thay vì đơn trị, giúp đạt mục tiêu nhanh và tăng tuân thủ.</li>
      </ul>
      <div class="subhead">Nhóm thuốc nền tảng (ưu tiên phối hợp)</div>
      <ul>
        <li>Ức chế men chuyển (ACEi) hoặc chẹn thụ thể angiotensin (ARB)</li>
        <li>Chẹn kênh canxi (CCB) nhóm dihydropyridine</li>
        <li>Lợi tiểu giống thiazide (indapamide, chlorthalidone) — ưu tiên hơn thiazide kinh điển (HCTZ)</li>
      </ul>
      <div class="alert-box alert-info">Chẹn beta <b>không còn là lựa chọn hàng đầu</b> thường quy (trừ khi có chỉ định riêng: bệnh mạch vành, suy tim, rung nhĩ cần kiểm soát tần số, phụ nữ có thai/dự định có thai).</div>
      <div class="subhead">THA kháng trị (không đạt đích dù 3 thuốc tối ưu gồm lợi tiểu)</div>
      <p>Thêm <b>spironolactone</b> liều thấp (eplerenone nếu không dung nạp) → chẹn beta → thuốc khác (chẹn alpha, chẹn giao cảm trung ương). Có thể cân nhắc <b>đốt thần kinh giao cảm thận</b> — khuyến cáo mới lần đầu trong ESC 2024 (Class IIb).</p>

      <div class="subhead">🔍 THA thứ phát — khi nào sàng lọc</div>
      <p>Sàng lọc toàn diện nguyên nhân thứ phát <b>khuyến cáo</b> khi: khởi phát &lt;40 tuổi (trừ béo phì đơn thuần), THA kháng trị, hạ kali máu tự phát/do lợi tiểu, khối u thượng thận tình cờ, tiền sử gia đình đột quỵ/THA sớm, hoặc có dấu hiệu gợi ý (ngáy/ngưng thở khi ngủ, tiếng thổi bụng, chênh HA 2 tay lớn…).</p>
      <ul>
        <li><b>Cường aldosterone nguyên phát:</b> ESC 2024 cân nhắc đo renin + aldosterone ở <b>mọi</b> người lớn THA đã xác định (Class IIa). Tỷ lệ aldosterone/renin tăng → chuyển chuyên khoa nội tiết.</li>
        <li><b>Hẹp động mạch thận:</b> Doppler/CTA/MRA khi nghi (tiếng thổi, suy thận cấp sau ACEi/ARB, THA kháng trị + xơ vữa).</li>
        <li><b>Pheochromocytoma, Cushing, co hẹp eo động mạch chủ, bệnh tuyến giáp…:</b> theo dấu hiệu lâm sàng và xét nghiệm định hướng.</li>
      </ul>

      <div class="subhead">🤰 THA trong thai kỳ (ESC 2024)</div>
      <ul>
        <li>Khởi trị thuốc khi HA phòng khám xác nhận ≥140/90 mmHg (cả THA mạn và THA thai kỳ).</li>
        <li>Mục tiêu: hạ xuống &lt;140/90 mmHg, <b>không</b> để DBP &lt;80 mmHg.</li>
        <li>Thuốc hàng đầu: <b>Nifedipine giải phóng kéo dài</b>, <b>Labetalol</b>, <b>Methyldopa</b>.</li>
        <li>Tránh: ACEi/ARB, ức chế renin trực tiếp, hầu hết lợi tiểu (trừ chỉ định đặc biệt).</li>
        <li>HBPM/ABPM nên cân nhắc để loại trừ áo choàng trắng/THA ẩn (phổ biến hơn khi mang thai).</li>
        <li>Vận động cường độ thấp–trung bình (nếu không chống chỉ định) giúp giảm nguy cơ THA thai kỳ và tiền sản giật.</li>
        <li>Aspirin liều thấp dự phòng tiền sản giật theo chỉ định sản khoa (nguy cơ cao).</li>
      </ul>

      <div class="subhead">🧓 THA người cao tuổi &amp; suy yếu</div>
      <ul>
        <li>Tuổi &lt;85, không suy yếu trung bình–nặng: áp dụng cùng mục tiêu SBP 120–129 mmHg nếu dung nạp tốt.</li>
        <li>Tuổi ≥85 hoặc suy yếu rõ / hạ HA tư thế có triệu chứng / tiên lượng sống hạn chế: khởi trị khi ≥140/90, mục tiêu “thấp nhất dung nạp được” (ALARA), ưu tiên đơn trị hoặc phối hợp liều rất thấp, theo dõi sát té ngã và hạ HA tư thế.</li>
        <li>Duy trì thuốc hạ áp suốt đời nếu dung nạp tốt, kể cả sau 85 tuổi.</li>
        <li>Sàng lọc suy yếu bằng thang Clinical Frailty Scale khi quyết định mục tiêu điều trị.</li>
      </ul>

      <div class="subhead">🍬 THA kèm đái tháo đường</div>
      <ul>
        <li>Xếp nguy cơ cao/rất cao → khởi trị thuốc sớm hơn (khi HA &gt;130/80).</li>
        <li>Mục tiêu: SBP 120–129 mmHg nếu dung nạp (ESC 2024); AHA vẫn &lt;130/80.</li>
        <li>Ưu tiên ACEi hoặc ARB (bảo vệ thận + tim mạch), đặc biệt khi có albumin niệu.</li>
        <li>Phối hợp CCB hoặc lợi tiểu giống thiazide khi cần. Tránh phối hợp ACEi + ARB.</li>
        <li>Cân nhắc SCORE2-Diabetes để ước lượng nguy cơ ở ĐTĐ típ 2 &lt;60 tuổi.</li>
        <li>Kiểm soát đồng thời đường huyết, lipid, cân nặng; SGLT2i/GLP-1 RA mang lại lợi ích tim–thận độc lập với HA.</li>
      </ul>

      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">Người cao tuổi (≥65–75), suy thận, suy gan: khởi liều thấp nhất, tăng liều chậm, theo dõi HA tư thế đứng để tránh hạ HA/té ngã.</div>
      ${rt(["Người lớn tiêu chuẩn","Cao tuổi / thận yếu"],[
        ["Amlodipine","5–10 mg × 1 lần/ngày","khởi đầu 2.5 mg/ngày"],
        ["Perindopril","5–10 mg × 1 lần/ngày","khởi đầu 2.5 mg/ngày; giảm nếu eGFR &lt;60"],
        ["Losartan","50–100 mg × 1 lần/ngày","khởi đầu 25 mg/ngày"],
        ["Indapamide SR","1.5 mg × 1 lần/ngày (sáng)","thận trọng eGFR &lt;30; theo dõi Na⁺/K⁺"],
        ["Chlorthalidone","12.5–25 mg × 1 lần/ngày","khởi đầu 12.5 mg, theo dõi điện giải sát"],
        ["Bisoprolol (khi có chỉ định)","2.5–10 mg × 1 lần/ngày","khởi đầu 1.25 mg/ngày"],

        ["Labetalol (thai kỳ)","100–400 mg × 2–3 lần/ngày","theo dõi nhịp tim mẹ/thai"]
      ])}
      <p><b>Viên phối hợp thường dùng:</b> Perindopril/Amlodipine, Perindopril/Indapamide, Losartan/HCTZ, Amlodipine/Valsartan — chỉnh liều theo đáp ứng, tái khám sau 2–4 tuần.</p>`,

{
  spec:"tim_mach", id:"hf", emoji:"💔", short:"Suy tim", title:"Suy tim (Heart Failure)",
  guidelines:["ESC 2021 + cập nhật 2023","AHA/ACC/HFSA 2022","AHA/ACC/ESC/WHF 2026 (Định nghĩa)"],
  sections:{
    dinh_nghia:`
      <p>Suy tim là hội chứng lâm sàng do bất thường cấu trúc và/hoặc chức năng tim, gây tăng áp lực đổ đầy trong tim và/hoặc cung lượng tim không đủ khi nghỉ hoặc gắng sức.</p>
      <div class="alert-box alert-info"><b>Cập nhật mới nhất (6/2026):</b> Đồng thuận chuyên gia AHA/ACC/ESC/WHF <i>"Second Universal Definition of Heart Failure"</i> — tài liệu định nghĩa suy tim mới nhất, thay thế bản đầu tiên (2021). Điểm mới cốt lõi: (1) phân loại theo EF chuyển từ các ngưỡng số cứng nhắc sang 3 nhóm mang tính lâm sàng-điều trị (EF giảm/bảo tồn/cải thiện); (2) thêm <b>Giai đoạn 0</b> vào hệ thống phân giai đoạn A-D; (3) nhấn mạnh Giai đoạn B ("Pre-Heart Failure") là cửa sổ chiến lược quan trọng nhất để phát hiện sớm và can thiệp chủ động, vì phần lớn dân số đang ở giai đoạn 0/A/B.</div>
      <div class="subhead">Phân loại theo phân suất tống máu (EF)</div>
      <p>Đồng thuận 2026 nhóm EF thành 3 phạm trù mang tính điều trị thay vì ngưỡng số cứng nhắc — tuy nhiên các dải số cụ thể dưới đây vẫn là mốc tham chiếu thực hành phổ biến nhất hiện nay (dựa trên tiêu chí thu nhận của các thử nghiệm RCT nền tảng cho khuyến cáo điều trị):</p>
      ${rt(["EF"],[
        ["HFrEF – EF giảm","≤40%"],
        ["HFmrEF – EF giảm nhẹ (nay thường xếp lâm sàng cùng nhóm điều trị với giảm hoặc bảo tồn tùy bệnh cảnh)","41–49%"],
        ["HFpEF – EF bảo tồn","≥50%"],
        ["HFimpEF – EF cải thiện","nền ≤40%, tăng ≥10 điểm và hiện &gt;40%"]
      ])}
      <div class="subhead">Giai đoạn suy tim (AHA/ACC/HFSA 2022, tái khẳng định trong đồng thuận 2026)</div>
      ${rt(["Đặc điểm"],[
        ["Giai đoạn 0 — mới bổ sung 2026","Không có yếu tố nguy cơ, không bệnh cấu trúc, không triệu chứng"],
        ["Giai đoạn A — Nguy cơ cao","Có yếu tố nguy cơ (THA, ĐTĐ, béo phì, bệnh mạch vành, tiếp xúc thuốc độc tim...) nhưng chưa có bệnh cấu trúc/triệu chứng"],
        ["Giai đoạn B — Pre-Heart Failure","Có bệnh cấu trúc tim (phì đại thất trái, giảm EF không triệu chứng, bệnh van tim...) nhưng chưa từng có triệu chứng — <b>cửa sổ can thiệp chiến lược quan trọng nhất</b> theo đồng thuận 2026"],
        ["Giai đoạn C — Suy tim có triệu chứng","Bệnh cấu trúc tim + triệu chứng hiện tại hoặc trước đây"],
        ["Giai đoạn D — Suy tim kháng trị giai đoạn cuối","Triệu chứng nặng dai dẳng dù đã điều trị nội khoa tối ưu, cần can thiệp chuyên sâu (ghép tim, hỗ trợ thất...)"]
      ])}
      <p>Một khi đã chẩn đoán suy tim có triệu chứng (giai đoạn C), người bệnh được xem là mắc suy tim vĩnh viễn dù triệu chứng có cải thiện tốt với điều trị — không "hạ giai đoạn" trở lại B/A.</p>`,
    chan_doan:`
      <p>Chẩn đoán dựa trên: (1) triệu chứng cơ năng (khó thở, mệt, phù chân) và thực thể (ran ẩm, tĩnh mạch cổ nổi, phù), (2) bằng chứng khách quan bất thường cấu trúc/chức năng tim trên siêu âm tim, và (3) NT-proBNP/BNP tăng.</p>
      ${rt(["Ngưỡng gợi ý suy tim"],[
        ["NT-proBNP (ngoại trú, không cấp)","&gt;125 pg/mL"],
        ["NT-proBNP (cấp cứu)","&gt;300 pg/mL"],
        ["BNP (cấp cứu)","&gt;100 pg/mL"]
      ])}
      <p>Siêu âm tim là công cụ chính để xác định EF, bất thường cấu trúc, van tim, đổ đầy thất trái. Cân nhắc thêm ECG, X-quang ngực, và tìm nguyên nhân nền (thiếu máu cơ tim, bệnh van, bệnh cơ tim).</p>
      <div class="subhead">🧮 Tiêu chuẩn Framingham — hỗ trợ chẩn đoán lâm sàng</div>
      <p>Tiêu chuẩn kinh điển dựa hoàn toàn vào lâm sàng, hữu ích khi chưa có ngay NT-proBNP/siêu âm tim. Chẩn đoán suy tim khi có <b>≥2 tiêu chí chính</b>, hoặc <b>1 tiêu chí chính + 2 tiêu chí phụ</b> (tiêu chí phụ chỉ tính khi không giải thích được bởi bệnh lý khác).</p>
      ${sc("framingham","Tiêu chuẩn Framingham (chẩn đoán suy tim)",[

        {label:"[Chính] Tiếng T3 (ngựa phi)",pts:2},
        {label:"[Chính] Áp lực tĩnh mạch trung tâm &gt;16cmH2O",pts:2},
        {label:"[Chính] Phản hồi gan-tĩnh mạch cổ dương tính",pts:2},
        {label:"[Chính/Phụ] Sụt cân ≥4.5kg trong 5 ngày sau điều trị lợi tiểu",pts:2},
        {label:"[Phụ] Phù mắt cá chân hai bên",pts:1},
        {label:"[Phụ] Ho về đêm",pts:1},
        {label:"[Phụ] Khó thở khi gắng sức thông thường",pts:1},
        {label:"[Phụ] Gan to",pts:1},
        {label:"[Phụ] Tràn dịch màng phổi",pts:1},
        {label:"[Phụ] Nhịp tim nhanh &gt;120 lần/phút",pts:1}
      ])}
      <p style="margin-top:-4px;font-size:11.5px;color:var(--text-secondary);">💡 Cách tính: mỗi tiêu chí <b>Chính</b> = 2đ, mỗi tiêu chí <b>Phụ</b> = 1đ. Tổng ≥4đ tương đương đủ tiêu chuẩn (≥2 chính, hoặc 1 chính+2 phụ).</p>`,
    dieu_tri:`
      <div class="subhead">HFrEF (EF ≤40%) – "4 trụ cột" điều trị</div>
      <p>Khởi động <b>đồng thời và nhanh</b> (không cần tuần tự) 4 nhóm thuốc nền tảng, mỗi nhóm giảm tử vong/nhập viện độc lập:</p>
      <ul>
        <li><b>ARNI</b> (sacubitril/valsartan) — ưu tiên hơn ACEi/ARB đơn thuần</li>
        <li><b>Chẹn beta</b> đã chứng minh lợi ích (bisoprolol, carvedilol, metoprolol succinate, nebivolol)</li>
        <li><b>Kháng thụ thể mineralocorticoid (MRA)</b>: spironolactone hoặc eplerenone</li>
        <li><b>Ức chế SGLT2</b>: dapagliflozin hoặc empagliflozin — dùng cho mọi HFrEF bất kể có ĐTĐ hay không</li>
      </ul>
      <div class="alert-box alert-info">Chiến lược 2021–2023: khởi trị và chuẩn liều cả 4 nhóm trong vài tuần đầu, rút ngắn thời gian đạt lợi ích sống còn.</div>
      <div class="subhead">HFmrEF và HFpEF</div>
      <ul>
        <li><b>SGLT2i</b> là nền tảng, khuyến cáo mạnh nhất hiện có cho cả hai thể này</li>
        <li>Lợi tiểu kiểm soát sung huyết; cân nhắc MRA, ARNI ở một số bệnh nhân HFmrEF</li>
        <li>Điều trị bệnh đồng mắc: THA, rung nhĩ, béo phì</li>
      </ul>
      <div class="subhead">Suy tim cấp mất bù</div>
      <p>Lợi tiểu quai TM (furosemide) chỉnh liều theo đáp ứng; oxy nếu SpO2&lt;90%; xử trí nguyên nhân khởi phát; tránh ngưng đột ngột 4 trụ cột nếu huyết động ổn.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">Người cao tuổi/suy thận: khởi liều thấp, tăng liều mỗi 2–4 tuần, theo dõi HA, K⁺, creatinine sau mỗi lần tăng liều.</div>
      ${rt(["Khởi đầu","Liều đích"],[
        ["Sacubitril/Valsartan","24/26 mg × 2 lần/ngày","97/103 mg × 2 lần/ngày"],
        ["Bisoprolol","1.25 mg × 1 lần/ngày","10 mg × 1 lần/ngày"],
        ["Carvedilol","3.125 mg × 2 lần/ngày","25–50 mg × 2 lần/ngày"],
        ["Metoprolol succinate","12.5–25 mg × 1 lần/ngày","200 mg × 1 lần/ngày"],
        ["Spironolactone","12.5–25 mg × 1 lần/ngày","25–50 mg × 1 lần/ngày"],
        ["Eplerenone","25 mg × 1 lần/ngày","50 mg × 1 lần/ngày"],
        ["Dapagliflozin","10 mg × 1 lần/ngày","liều cố định"],
        ["Empagliflozin","10 mg × 1 lần/ngày","liều cố định"],
        ["Furosemide (sung huyết)","20–40 mg, chỉnh theo đáp ứng","theo lâm sàng, TM khi cấp"]

      <div class="age-tag">Người cao tuổi</div>
      <p style="margin-bottom:10px;">Bắt đầu ARNI/ACEi và MRA ở liều thấp nhất; chuẩn liều chẹn beta chậm hơn theo dung nạp; SGLT2i không chỉnh theo tuổi nhưng thận trọng mất nước, nhiễm nấm sinh dục.</p>
      <div class="age-tag">Suy thận (eGFR 30–60)</div>
      <p>Không chống chỉ định 4 trụ cột nhưng theo dõi sát K⁺/creatinine; SGLT2i dùng đến eGFR ≥20; MRA thận trọng nếu eGFR &lt;30.</p>`,

{
  spec:"tim_mach", id:"af", emoji:"〰️", short:"RN", title:"Rung nhĩ (Atrial Fibrillation)",
  guidelines:["ESC 2024 (AF-CARE)"],
  sections:{
    dinh_nghia:`
      <p>Rung nhĩ là rối loạn nhịp nhĩ nhanh, không đều, mất co bóp nhĩ hiệu quả, làm tăng nguy cơ đột quỵ, suy tim và tử vong.</p>
      <div class="subhead">Khung tiếp cận mới ESC 2024: AF-CARE</div>
      <ul>
        <li><b>C</b> – Comorbidity: kiểm soát bệnh đồng mắc & yếu tố nguy cơ (THA, béo phì, ngưng thở khi ngủ, rượu)</li>
        <li><b>A</b> – Avoid stroke: phòng ngừa đột quỵ bằng kháng đông</li>
        <li><b>R</b> – Reduce symptoms: kiểm soát nhịp/tần số để giảm triệu chứng</li>
        <li><b>E</b> – Evaluation: đánh giá lại động học định kỳ</li>
      </ul>
      <div class="subhead">Phân loại</div>
      <p>Kịch phát (tự hết ≤7 ngày) · Dai dẳng (&gt;7 ngày) · Dai dẳng kéo dài (&gt;12 tháng) · Vĩnh viễn.</p>`,
    chan_doan:`
      <p>Chẩn đoán xác định cần <b>ECG 12 chuyển đạo hoặc bản ghi nhịp ≥30 giây</b> thể hiện rung nhĩ (RR không đều, không có sóng P rõ).</p>
      <div class="subhead">CHA₂DS₂-VA — nguy cơ đột quỵ (ESC 2024, bỏ tiêu chí giới tính)</div>
      ${sc("cha2ds2va","Thang điểm CHA₂DS₂-VA",[
        {label:"Suy tim/rối loạn chức năng thất trái",pts:1},
        {label:"Tăng huyết áp",pts:1},
        {label:"Tuổi ≥75",pts:2},
        {label:"Đái tháo đường",pts:1},
        {label:"Tiền sử đột quỵ/TIA/thuyên tắc",pts:2},
        {label:"Bệnh mạch máu (mạch vành, ĐM ngoại biên, mảng xơ vữa ĐMC)",pts:1},
        {label:"Tuổi 65–74",pts:1}
      ])}
      <p>Điểm ≥2: khuyến cáo kháng đông. Đánh giá song song nguy cơ chảy máu bằng thang <b>HAS-BLED</b> bên dưới để xác định yếu tố có thể điều chỉnh — <b>không dùng HAS-BLED để loại trừ kháng đông</b>.</p>
      <div class="subhead">HAS-BLED — nguy cơ chảy máu</div>
      ${sc("hasbled","Thang điểm HAS-BLED",[
        {label:"Tăng huyết áp (HA tâm thu &gt;160mmHg)",pts:1},
        {label:"Chức năng thận bất thường (lọc máu/ghép/creatinine &gt;2.26mg/dL)",pts:1},
        {label:"Chức năng gan bất thường (xơ gan/bilirubin&gt;2 lần hoặc AST/ALT/ALP&gt;3 lần)",pts:1},
        {label:"Tiền sử đột quỵ",pts:1},
        {label:"Tiền sử chảy máu/khuynh hướng chảy máu",pts:1},
        {label:"INR dao động không ổn định (nếu dùng warfarin)",pts:1},
        {label:"Tuổi &gt;65",pts:1},
        {label:"Dùng thuốc làm tăng nguy cơ chảy máu (kháng kết tập tiểu cầu/NSAID)",pts:1},
        {label:"Nghiện rượu (≥8 đơn vị/tuần)",pts:1}
      ])}`,
    dieu_tri:`
      <div class="subhead">Phòng ngừa đột quỵ</div>
      <p><b>Kháng đông đường uống thế hệ mới (NOAC)</b> được ưu tiên hơn kháng vitamin K ở hầu hết bệnh nhân rung nhĩ không do bệnh van tim, trừ khi có van cơ học hoặc hẹp van 2 lá trung bình–nặng.</p>
      <div class="subhead">Kiểm soát nhịp vs tần số</div>
      <ul>
        <li><b>Kiểm soát nhịp sớm</b> (thuốc chống loạn nhịp hoặc <b>đốt điện qua catheter</b>) được ưu tiên, đặc biệt trong 12 tháng đầu chẩn đoán, giảm biến cố tim mạch so với chỉ kiểm soát tần số (EAST-AFNET4).</li>
        <li>Đốt điện qua catheter là lựa chọn hàng đầu cho rung nhĩ có triệu chứng, đặc biệt khi kèm suy tim EF giảm.</li>
        <li>Kiểm soát tần số (chẹn beta, chẹn canxi non-DHP, digoxin) khi chiến lược kiểm soát nhịp không phù hợp.</li>
      </ul>
      <div class="subhead">Kiểm soát yếu tố nguy cơ (trụ C)</div>
      <p>Giảm cân, điều trị ngưng thở khi ngủ, kiểm soát HA chặt, hạn chế rượu — can thiệp bắt buộc song song, giảm gánh nặng rung nhĩ và tái phát sau đốt điện.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-danger">Luôn chỉnh liều NOAC theo tuổi, cân nặng, chức năng thận (CrCl) — quá liều tăng nguy cơ xuất huyết, dưới liều tăng nguy cơ đột quỵ.</div>
      ${rt(["Liều chuẩn","Liều giảm & tiêu chí"],[
        ["Apixaban","5 mg × 2 lần/ngày","2.5mg×2 nếu ≥2/3: tuổi≥80, CN≤60kg, creatinin≥1.5"],
        ["Rivaroxaban","20 mg × 1 lần/ngày (cùng ăn)","15mg×1 nếu CrCl 15–49 mL/phút"],
        ["Dabigatran","150 mg × 2 lần/ngày","110mg×2 nếu tuổi≥80, dùng verapamil, hoặc nguy cơ chảy máu cao"],
        ["Edoxaban","60 mg × 1 lần/ngày","30mg×1 nếu CrCl 15–50, CN≤60kg, hoặc kèm ức chế P-gp mạnh"],
        ["Warfarin (khi cần)","chỉnh theo INR đích 2.0–3.0","cao tuổi thường cần liều thấp hơn, theo dõi INR sát"]
      ])}
      <div class="subhead">Kiểm soát tần số</div>
      ${rt(["Liều thường dùng"],[
        ["Bisoprolol","2.5–10 mg/ngày"],
        ["Diltiazem phóng thích chậm","120–360 mg/ngày"],
        ["Digoxin (thêm khi cần, có suy tim)","0.125–0.25 mg/ngày, giảm liều/theo dõi nồng độ ở cao tuổi/suy thận"]
      ])}`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["NOAC ưu tiên hơn warfarin khi không có chống chỉ định",'<span class="badge badge-I">I</span>'],

        ["Kiểm soát yếu tố nguy cơ song song điều trị",'<span class="badge badge-I">I</span>'],
        ["Dùng aspirin đơn độc để phòng đột quỵ trong AF",'<span class="badge badge-III">III</span>']
      ])}`

},
{
  spec:"tim_mach", id:"tachy", emoji:"⚡", short:"Nhịp nhanh", title:"Rối loạn nhịp nhanh",
  guidelines:["AHA/ACC/HRS 2015 (SVT)","AHA/ACC/HRS 2017 (VA & SCD)","AHA 2025 (ACLS)"],
  sections:{
    dinh_nghia:`
      <p>Nhịp nhanh: tần số thất &gt;100 lần/phút phát sinh từ cơ chế bất thường (vòng vào lại, tăng tính tự động, hoạt động khởi kích).</p>
      <div class="alert-box alert-info"><b>Cập nhật thuật ngữ — AHA 2025 (ACLS):</b> thuật ngữ "nhịp nhanh phức bộ hẹp" (<b>Narrow-Complex Tachycardia — NCT</b>) nay được dùng thay cho cách gọi trước đây "SVT" khi mô tả nhóm nhịp nhanh QRS hẹp trong xử trí cấp cứu — bao gồm nhịp nhanh xoang, cuồng nhĩ, AVNRT, AVRT, nhịp nhanh nhĩ khác — nhằm phản ánh chính xác hơn nguồn gốc và cách tiếp cận xử trí thống nhất.</div>
      <div class="subhead">Phân loại theo vị trí khởi phát</div>
      ${rt(["Đặc điểm"],[
        ["Nhịp nhanh xoang không thích hợp","QRS hẹp, tần số cao liên tục không tương xứng gắng sức"],
        ["Nhịp nhanh vào lại nút nhĩ thất (AVNRT)","QRS hẹp, khởi phát/kết thúc đột ngột, thường gặp nhất ở người trẻ khỏe mạnh"],
        ["Nhịp nhanh vào lại nhĩ thất (AVRT/WPW)","QRS hẹp (hoặc rộng nếu dẫn truyền xuôi qua đường phụ), có sóng delta nền"],
        ["Cuồng nhĩ (Atrial flutter)","QRS đều, sóng răng cưa tần số nhĩ ~300/phút"],
        ["Nhịp nhanh thất đơn dạng (VT)","QRS rộng đều, thường trên nền bệnh tim cấu trúc/sẹo NMCT cũ"],
        ["Rung thất (VF) / VT đa dạng","QRS rộng không đều, đe dọa tính mạng ngay lập tức"]
      ])}`,
    chan_doan:`
      <p>ECG 12 chuyển đạo lúc có cơn là then chốt — phân biệt <b>QRS hẹp</b> (nguồn gốc trên thất) và <b>QRS rộng</b> (nguồn gốc thất hoặc SVT dẫn truyền lệch hướng, dùng tiêu chuẩn Brugada để phân biệt).</p>
      <p>Nghiệm pháp phế vị có thể cắt cơn hoặc bộc lộ hoạt động nhĩ để chẩn đoán. Holter ECG 24–48h hoặc máy ghi biến cố kéo dài khi cơn ngắt quãng, không bắt được lúc thăm khám. Thăm dò điện sinh lý (EPS) khi cần định vị ổ loạn nhịp trước đốt điện hoặc đánh giá nguy cơ đột tử.</p>
      <div class="alert-box alert-warn">Mọi nhịp nhanh QRS rộng chưa rõ nguyên nhân nên được xử trí như <b>VT</b> cho đến khi chứng minh được ngược lại — đặc biệt ở người có bệnh tim cấu trúc/tiền sử NMCT.</div>`,
    dieu_tri:`
      <div class="subhead">NCT/SVT cấp (QRS hẹp, huyết động ổn) — AHA 2025</div>
      <p>Nghiệm pháp phế vị (Class I) → adenosine TM (Class I) nếu không đáp ứng → diltiazem/verapamil TM nếu tái phát/kháng adenosine (Class IIb hữu ích) → sốc điện chuyển nhịp đồng bộ nếu huyết động không ổn hoặc kháng thuốc.</p>
      <div class="subhead">Nhịp nhanh phức bộ rộng (WCT) — nguyên tắc an toàn AHA 2025</div>
      <div class="alert-box alert-danger">
        <b>KHÔNG dùng verapamil/diltiazem cho WCT</b> (Class III: Có hại) — có thể gây sụp huyết động nặng nếu bản chất là VT.<br>
        <b>KHÔNG dùng adenosine cho WCT huyết động không ổn, đều-không đều rõ (irregularly irregular), hoặc VT đa dạng</b> (Class III: Có hại).<br>
        Adenosine chỉ cân nhắc (Class IIb) cho WCT <b>đều, đơn dạng, huyết động ổn định</b> khi chưa rõ chẩn đoán, vừa hỗ trợ chẩn đoán vừa có thể cắt cơn nếu bản chất là SVT dẫn truyền lệch hướng.
      </div>
      <p>Thuốc chống loạn nhịp cho WCT ổn định: amiodarone, procainamide, hoặc sotalol TM (Class IIb) — sốc điện đồng bộ khi thuốc thất bại hoặc có chống chỉ định.</p>
      <div class="subhead">Điều trị dài hạn SVT/NCT tái phát</div>
      <p><b>Đốt điện qua catheter</b> là điều trị hàng đầu cho AVNRT, AVRT/WPW có triệu chứng và cuồng nhĩ (đốt eo van 3 lá–TM chủ dưới) — tỷ lệ thành công cao, ưu tiên hơn dùng thuốc dài hạn.</p>
      <div class="subhead">VT/VF huyết động không ổn</div>
      <p>Sốc điện/khử rung ngay theo phác đồ ACLS. VT đơn dạng bền bỉ có bệnh tim cấu trúc: amiodarone TM, cân nhắc đốt điện VT.</p>
      <div class="subhead">Phòng ngừa đột tử do tim (SCD)</div>
      <ul>
        <li>ICD phòng ngừa <b>thứ phát</b>: sống sót sau ngừng tim do VT/VF không do nguyên nhân hồi phục</li>
        <li>ICD phòng ngừa <b>tiên phát</b>: EF≤35% sau NMCT ≥40 ngày, NYHA II–III dù điều trị nội khoa tối ưu</li>
      </ul>
      <div class="subhead">⚡ Sốc điện chuyển nhịp — Đồng bộ (Synchronized Cardioversion)</div>
      <p>Dùng cho loạn nhịp <b>có phức bộ QRS xác định được</b> (tránh sốc trúng đỉnh sóng T gây rung thất) — máy đồng bộ với sóng R. Chỉ định: SVT/rung nhĩ/cuồng nhĩ huyết động không ổn hoặc kháng thuốc; VT đơn dạng có mạch huyết động không ổn.</p>
      <div class="alert-box alert-info"><b>Cập nhật AHA 2025:</b> khuyến cáo tránh chiến lược sốc năng lượng thấp lặp lại nhiều lần rồi mới tăng dần (tránh nhiều lần sốc thất bại làm mất thời gian vàng) — với nhịp nhanh phức bộ rộng không ổn định, ưu tiên bắt đầu ở mức năng lượng đủ cao (thường 200J hai pha) để tăng khả năng cắt cơn thành công ngay từ lần sốc đầu.</div>
      ${rt(["Mức năng lượng khởi đầu (máy 2 pha/biphasic)","Ghi chú"],[
        ["Rung nhĩ","120–200 J đồng bộ","cuồng nhĩ thường đáp ứng năng lượng thấp hơn rung nhĩ"],
        ["Cuồng nhĩ / NCT đều QRS hẹp","50–100 J đồng bộ","tăng dần nếu không cắt được cơn"],
        ["Nhịp nhanh phức bộ rộng (WCT) không ổn định","200 J đồng bộ (AHA 2025: ưu tiên bắt đầu mức đủ cao, tránh sốc lặp lại năng lượng thấp)","nếu chuyển thành VT vô mạch/VF giữa chừng → chuyển ngay sang phá rung không đồng bộ"]
      ])}
      <div class="subhead">⚡ Phá rung — Không đồng bộ (Unsynchronized Defibrillation)</div>
      <p>Dùng cho <b>VT vô mạch, rung thất (VF), hoặc VT đa dạng/xoắn đỉnh (Torsades)</b> — không chờ đồng bộ sóng R vì không xác định được QRS rõ ràng hoặc bệnh nhân không có mạch, cần khử rung ngay lập tức theo phác đồ ACLS/hồi sinh tim phổi.</p>
      ${rt(["Mức năng lượng","Ghi chú"],[
        ["Sốc lần 1","120–200 J không đồng bộ (máy 2 pha) hoặc 360J (máy 1 pha)","tiếp tục CPR ngay sau sốc, không dừng để bắt mạch/kiểm tra nhịp"],
        ["Các lần sốc tiếp theo","200 J (hoặc mức tối đa máy) không đồng bộ","xen kẽ chu kỳ CPR 2 phút giữa các lần sốc; AHA 2025: ưu tiên epinephrine đơn độc hơn phối hợp vasopressin, cho ngay sau lần sốc đầu không đáp ứng"],
        ["VT đa dạng/xoắn đỉnh huyết động không ổn","xử trí như VF — phá rung không đồng bộ ngay","bổ sung magie sulfate TM nếu nghi xoắn đỉnh do QT dài"]
      ])}
      <div class="alert-box alert-danger">Ghi nhớ nguyên tắc an toàn: <b>QRS đều, xác định rõ, còn mạch → sốc ĐỒNG BỘ</b>; <b>vô mạch hoặc QRS không xác định được (VF/đa dạng) → phá rung KHÔNG ĐỒNG BỘ ngay, không trì hoãn</b>. An thần/giảm đau trước sốc điện đồng bộ có chuẩn bị (không cấp cứu tối khẩn) nếu bệnh nhân còn tỉnh.</div>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">Người cao tuổi: giảm liều amiodarone nạp/duy trì, theo dõi tuyến giáp/gan/phổi khi dùng dài hạn; tránh phối hợp verapamil/diltiazem với chẹn beta do nguy cơ block nặng.</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Adenosine (NCT/SVT đều, QRS hẹp hoặc WCT đơn dạng ổn định chưa rõ chẩn đoán)","6mg TM nhanh → 12mg → 12mg nếu chưa đáp ứng","giảm còn 3mg nếu qua catheter TM trung tâm/dùng dipyridamole; KHÔNG dùng nếu WCT không đều/đa dạng/không ổn định"],
        ["Amiodarone TM","150mg/10 phút → 1mg/phút×6h → 0.5mg/phút×18h","theo dõi HA, kéo dài QT; lựa chọn hàng đầu cho WCT ổn định chưa rõ chẩn đoán"],
        ["Amiodarone uống","200mg×3 lần/ngày×1 tuần → 200mg×1–2 lần/ngày","xét nghiệm chức năng tuyến giáp/gan định kỳ"],
        ["Procainamide TM (WCT ổn định, thay thế amiodarone)","10-17mg/kg truyền TM (tối đa 50mg/phút)","tránh nếu QT dài nền/suy tim nặng; theo dõi HA và QRS trong lúc truyền"],
        ["Flecainide (không bệnh tim cấu trúc)","50–150 mg × 2 lần/ngày","chống chỉ định nếu có bệnh mạch vành/suy tim"],
        ["Verapamil/Diltiazem TM (CHỈ dùng cho NCT/SVT QRS hẹp xác định rõ)","Verapamil 5–10mg TM chậm; Diltiazem 0.25mg/kg TM","TUYỆT ĐỐI KHÔNG dùng cho QRS rộng (WCT) — Class III: Có hại"],
        ["Chẹn beta uống dự phòng","liều chuẩn theo thuốc (vd. bisoprolol 2.5–10mg/ngày)","giảm liều khởi đầu ở người cao tuổi"]

{
  spec:"tim_mach", id:"brady", emoji:"🐢", short:"Nhịp chậm", title:"Rối loạn nhịp chậm",
  guidelines:["AHA/ACC/HRS 2018 (Nhịp chậm & rối loạn dẫn truyền)","AHA 2025 (ACLS)"],
  sections:{
    dinh_nghia:`
      <p>Nhịp chậm: tần số tim &lt;60 lần/phút, do rối loạn tạo nhịp tại nút xoang (hội chứng suy nút xoang) hoặc rối loạn dẫn truyền nhĩ–thất.</p>
      <div class="subhead">Phân loại block nhĩ thất (AV)</div>
      ${rt(["Đặc điểm"],[
        ["Block AV độ I","PR kéo dài &gt;200ms, dẫn truyền 1:1, thường lành tính"],
        ["Block AV độ II Mobitz I (Wenckebach)","PR dài dần rồi rớt nhịp, vị trí tại nút AV, thường lành tính"],
        ["Block AV độ II Mobitz II","Rớt nhịp đột ngột không báo trước, vị trí dưới nút, nguy cơ tiến triển độ III cao"],
        ["Block AV độ III (hoàn toàn)","Phân ly nhĩ thất hoàn toàn, nhịp thoát chậm và không ổn định"],
        ["Hội chứng suy nút xoang","Nhịp chậm xoang, ngưng xoang, hội chứng nhanh–chậm xen kẽ"]
      ])}`,
    chan_doan:`
      <p>ECG, Holter 24–48h hoặc máy ghi biến cố kéo dài nếu triệu chứng ngắt quãng. <b>Tương quan triệu chứng với nhịp chậm</b> (chóng mặt, ngất, mệt khi gắng sức) là yếu tố quyết định chỉ định điều trị — không chỉ dựa vào nhịp tim đơn thuần.</p>
      <div class="alert-box alert-info">Block AV độ II Mobitz II và độ III cần được xử trí như tình trạng nguy cơ cao (nguy cơ vô tâm thu) dù bệnh nhân có triệu chứng hay chưa.</div>`,
    dieu_tri:`
      <div class="subhead">Cấp cứu — nhịp chậm có triệu chứng/huyết động không ổn (AHA 2025 ACLS)</div>
      <p><b>Atropine TM trước tiên</b> → nếu không đáp ứng: <b>chuyển ngay</b> sang tạo nhịp qua da/tĩnh mạch tạm thời hoặc truyền thuốc vận mạch — AHA 2025 nhấn mạnh <b>không trì hoãn/lặp lại atropine nhiều lần khi liều bolus đầu không hiệu quả</b>, cần leo thang thuật toán nhanh chóng sang tạo nhịp hoặc truyền catecholamine trong lúc chờ đặt máy tạo nhịp.</p>
      <div class="alert-box alert-warn">AHA 2025 làm rõ hơn ngưỡng phân biệt nhịp chậm "ổn định" và "không ổn định" (dựa hạ huyết áp, rối loạn tri giác cấp, dấu hiệu sốc, đau ngực do thiếu máu cơ tim, suy tim cấp) nhằm giảm do dự lâm sàng trong "vùng xám" — nếu có bất kỳ dấu hiệu nào trên, xử trí ngay như nhịp chậm không ổn định, không chờ theo dõi thêm.</div>
      <div class="subhead">Điều trị dài hạn — cấy máy tạo nhịp vĩnh viễn</div>
      <ul>
        <li>Chỉ định khi có <b>triệu chứng tương quan rõ</b> với nhịp chậm và không có nguyên nhân hồi phục (rối loạn điện giải, thuốc, thiếu máu cơ tim cấp)</li>
        <li>Hội chứng suy nút xoang có triệu chứng: cấy máy tạo nhịp</li>
        <li>Block AV độ II Mobitz II, độ III: cấy máy tạo nhịp <b>dù có triệu chứng hay không</b> do nguy cơ vô tâm thu</li>
      </ul>
      <div class="subhead">Chọn kiểu tạo nhịp</div>
      <p>Ở bệnh nhân suy tim EF giảm cần tạo nhịp thất nhiều: cân nhắc tạo nhịp hai buồng thất (CRT) hoặc tạo nhịp bó His/nhánh trái để tránh mất đồng bộ thất do tạo nhịp thất phải đơn thuần gây ra.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">Đây chủ yếu là xử trí cấp cứu tạm thời trong lúc chờ tạo nhịp; không có thuốc điều trị nền lâu dài thay thế máy tạo nhịp khi có chỉ định.</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Atropine","0.5mg TM mỗi 3–5 phút, tối đa 3mg","kém hiệu quả với block vị trí dưới nút His (QRS rộng); AHA 2025: chuyển nhanh sang tạo nhịp/vận mạch nếu liều đầu không đáp ứng, không chờ đủ liều tối đa"],
        ["Isoproterenol truyền TM","2–10 microgam/phút, chỉnh theo đáp ứng","dùng khi chờ đặt máy tạo nhịp tạm thời"],
        ["Dopamine truyền TM","5–20 microgam/kg/phút","chỉnh theo HA và tần số tim đáp ứng"],
        ["Adrenaline truyền TM","2–10 microgam/phút","dành cho nhịp chậm nặng kháng trị với atropine; AHA 2025 xếp ngang hàng dopamine làm lựa chọn vận mạch bắc cầu"]
      ])}
      <div class="age-tag">Người cao tuổi</div>
      <p>Chỉ định máy tạo nhịp không bị giới hạn bởi tuổi cao đơn thuần — quyết định dựa trên triệu chứng, tổng trạng và kỳ vọng sống còn lại, không phải theo một mốc tuổi cụ thể.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Cấy máy tạo nhịp vĩnh viễn khi nhịp chậm có triệu chứng tương quan rõ",'<span class="badge badge-I">I</span>'],
        ["Cấy máy tạo nhịp ở block AV độ II Mobitz II hoặc độ III dù không triệu chứng",'<span class="badge badge-I">I</span>'],
        ["Tạo nhịp bó His/nhánh trái hoặc CRT thay vì tạo nhịp thất phải đơn thuần khi EF giảm",'<span class="badge badge-IIa">IIa</span>'],
        ["Leo thang nhanh sang tạo nhịp/vận mạch khi atropine liều đầu không đáp ứng (AHA 2025)",'<span class="badge badge-I">I</span>'],
        ["Atropine trong block AV độ cao vị trí dưới nút His (QRS rộng)",'<span class="badge badge-IIb">IIb</span>'],
        ["Cấy máy tạo nhịp vĩnh viễn cho block AV độ I không triệu chứng",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"2018 ACC/AHA/HRS Guideline on the Evaluation and Management of Patients with Bradycardia and Cardiac Conduction Delay; 2025 American Heart Association Guidelines for CPR and Emergency Cardiovascular Care (Adult Bradycardia), Circulation 2025"

{
  spec:"tim_mach", id:"acs", emoji:"❤️‍🔥", short:"HCVC", title:"Hội chứng vành cấp",
  guidelines:["ESC 2023 (ACS)","AHA/ACC 2025 (ACS)"],
  sections:{
    dinh_nghia:`
      <p>Hội chứng vành cấp (ACS) bao gồm phổ bệnh do thiếu máu cơ tim cấp: <b>STEMI</b>, <b>NSTEMI</b> và <b>đau thắt ngực không ổn định</b>.</p>
      <p>Theo định nghĩa toàn cầu về nhồi máu cơ tim: cần có tăng và/hoặc giảm troponin tim với ít nhất 1 giá trị &gt;bách phân vị 99, kèm bằng chứng thiếu máu cơ tim cấp (triệu chứng, biến đổi ECG, hình ảnh học, hoặc huyết khối trên chụp mạch).</p>`,
    chan_doan:`
      <p>ECG 12 chuyển đạo trong 10 phút từ khi tiếp xúc y tế đầu tiên. STEMI: ST chênh lên ≥1mm ở ≥2 chuyển đạo liên tiếp (≥2mm V2-V3 nam &lt;40 tuổi hoặc ≥1.5mm nữ) hoặc block nhánh trái mới.</p>
      <div class="subhead">Thuật toán troponin siêu nhạy (hs-cTn) 0h/1h</div>
      ${rt(["Tiêu chí"],[
        ["Loại trừ NMCT","hs-cTn rất thấp lúc 0h, hoặc thấp và không tăng đáng kể sau 1h"],
        ["Xác định NMCT","hs-cTn cao lúc 0h, hoặc tăng rõ rệt sau 1h"],
        ["Vùng quan sát","các trường hợp còn lại → theo dõi thêm, cân nhắc chẩn đoán hình ảnh"]
      ])}
      <p>Thang điểm <b>GRACE</b> giúp phân tầng nguy cơ và quyết định thời điểm can thiệp trong NSTEMI (nguy cơ rất cao: can thiệp &lt;2h; nguy cơ cao: &lt;24h).</p>
      <div class="subhead">🧮 Thang điểm GRACE (ước tính nguy cơ tử vong nội viện)</div>
      <div class="alert-box alert-info">Đây là bảng điểm GRACE cổ điển (dạng bảng điểm tổng hợp) — dùng để tham khảo nhanh tại giường. Với quyết định lâm sàng chính xác, nên dùng công cụ tính GRACE 2.0 chính thức (gracescore.org) vốn dùng mô hình hồi quy liên tục cho kết quả chính xác hơn.</div>
      ${scr("grace","Thang điểm GRACE (nguy cơ tử vong nội viện)",[
        {label:"Tuổi", options:[{text:"&lt;40 (0đ)",pts:0},{text:"40–49 (18đ)",pts:18},{text:"50–59 (41đ)",pts:41},{text:"60–69 (58đ)",pts:58},{text:"70–79 (75đ)",pts:75},{text:"80–89 (91đ)",pts:91},{text:"≥90 (100đ)",pts:100}]},
        {label:"Nhịp tim (lần/phút)", options:[{text:"&lt;50 (0đ)",pts:0},{text:"50–69 (3đ)",pts:3},{text:"70–89 (9đ)",pts:9},{text:"90–109 (15đ)",pts:15},{text:"110–149 (24đ)",pts:24},{text:"150–199 (38đ)",pts:38},{text:"≥200 (46đ)",pts:46}]},
        {label:"Huyết áp tâm thu (mmHg)", options:[{text:"≥200 (0đ)",pts:0},{text:"160–199 (10đ)",pts:10},{text:"140–159 (24đ)",pts:24},{text:"120–139 (34đ)",pts:34},{text:"100–119 (43đ)",pts:43},{text:"80–99 (53đ)",pts:53},{text:"&lt;80 (58đ)",pts:58}]},
        {label:"Creatinine (mg/dL)", options:[{text:"0–0.39 (1đ)",pts:1},{text:"0.4–0.79 (4đ)",pts:4},{text:"0.8–1.19 (7đ)",pts:7},{text:"1.2–1.59 (10đ)",pts:10},{text:"1.6–1.99 (13đ)",pts:13},{text:"2.0–3.99 (21đ)",pts:21},{text:"≥4.0 (28đ)",pts:28}]},
        {label:"Phân độ Killip", options:[{text:"I – không suy tim (0đ)",pts:0},{text:"II – ran ẩm/T3/tăng áp TM cổ (20đ)",pts:20},{text:"III – phù phổi cấp (39đ)",pts:39},{text:"IV – sốc tim (59đ)",pts:59}]},
        {label:"Ngừng tim lúc nhập viện", options:[{text:"Không (0đ)",pts:0},{text:"Có (39đ)",pts:39}]},
        {label:"Thay đổi đoạn ST trên ECG", options:[{text:"Không (0đ)",pts:0},{text:"Có (28đ)",pts:28}]},
        {label:"Tăng men tim", options:[{text:"Không (0đ)",pts:0},{text:"Có (14đ)",pts:14}]}
      ])}
      <p><b>Diễn giải (nguy cơ tử vong nội viện):</b> ≤108 điểm = nguy cơ thấp (&lt;1%) → chiến lược xâm lấn có thể trong vòng 72h/chọn lọc. 109–140 điểm = nguy cơ trung bình (1–3%) → can thiệp sớm &lt;24h. &gt;140 điểm = nguy cơ cao (&gt;3%) → can thiệp xâm lấn ngay &lt;2h.</p>
      <div class="subhead">🧮 Thang điểm TIMI (UA/NSTEMI) — dễ tính nhanh tại giường</div>
      ${sc("timi","Thang điểm TIMI Risk Score (UA/NSTEMI)",[
        {label:"Tuổi ≥65",pts:1},
        {label:"≥3 yếu tố nguy cơ bệnh mạch vành (THA, ĐTĐ, rối loạn lipid, hút thuốc, tiền sử gia đình)",pts:1},
        {label:"Đã biết hẹp mạch vành ≥50% (tiền sử)",pts:1},
        {label:"Dùng aspirin trong 7 ngày qua",pts:1},
        {label:"Đau thắt ngực nặng gần đây (≥2 cơn trong 24h)",pts:1},
        {label:"Thay đổi đoạn ST ≥0.5mm trên ECG",pts:1},
        {label:"Tăng men tim (troponin/CK-MB)",pts:1}
      ])}
      <p>0–1 điểm: nguy cơ thấp (~5% biến cố trong 14 ngày). 2–3: nguy cơ trung bình. 4–5: nguy cơ cao. 6–7: nguy cơ rất cao — điểm càng cao càng ủng hộ chiến lược can thiệp xâm lấn sớm.</p>`,
    dieu_tri:`
      <div class="subhead">🅰️ CHIẾN LƯỢC PCI (tái tưới máu can thiệp) — ưu tiên hàng đầu</div>
      <p><b>STEMI:</b> PCI thì đầu là chiến lược ưu tiên, mục tiêu từ chẩn đoán đến bóng <b>&lt;120 phút</b> (lý tưởng &lt;60–90 phút nếu đến thẳng trung tâm có PCI).</p>
      <p><b>NSTEMI/đau thắt ngực không ổn định nguy cơ cao-rất cao (GRACE&gt;140 hoặc TIMI≥4):</b> chiến lược xâm lấn sớm, chụp mạch vành trong &lt;24h (rất cao: &lt;2h).</p>
      <p><b>Thuốc quanh thủ thuật PCI:</b> DAPT (aspirin + ticagrelor/prasugrel) + kháng đông (UFH thường dùng nhất trong phòng thông tim; bivalirudin là lựa chọn thay thế ở bệnh nhân nguy cơ chảy máu cao) ± ức chế GPIIb/IIIa cứu vãn nếu biến chứng huyết khối trong lúc can thiệp.</p>
      <div class="subhead">🅱️ CHIẾN LƯỢC TIÊU SỢI HUYẾT — khi không thể PCI kịp thời</div>
      <p>Chỉ áp dụng cho <b>STEMI</b> khi thời gian dự kiến đến PCI &gt;120 phút — dùng tiêu sợi huyết trong <b>10 phút đầu</b> tiếp xúc y tế, sau đó <b>luôn chuyển đến trung tâm có PCI</b> (PCI cứu vãn nếu tiêu sợi huyết thất bại sau 60–90 phút, hoặc chụp mạch thường quy trong 2–24h nếu tiêu sợi huyết thành công — chiến lược "pharmaco-invasive").</p>
      <p><b>Thuốc phối hợp với tiêu sợi huyết:</b> aspirin + <b>clopidogrel</b> (không dùng ticagrelor/prasugrel cùng tiêu sợi huyết do thiếu dữ liệu an toàn) + kháng đông (enoxaparin hoặc UFH, liều điều chỉnh theo tuổi/thận — xem bảng liều).</p>
      <div class="alert-box alert-warn">Người ≥75 tuổi dùng tiêu sợi huyết: <b>không dùng liều nạp clopidogrel</b> (dùng thẳng 75mg/ngày) và giảm liều enoxaparin — giảm nguy cơ xuất huyết nội sọ.</div>
      <div class="subhead">🅲️ ĐIỀU TRỊ TỐI THIỂU/BẢO TỒN (không tái tưới máu)</div>
      <p>Áp dụng cho: NSTEMI nguy cơ thấp (GRACE≤108) ổn định, bệnh nhân từ chối/không phù hợp can thiệp xâm lấn, hoặc STEMI đến quá muộn (&gt;12–48h không còn triệu chứng thiếu máu tiến triển/huyết động ổn định). Điều trị nội khoa tối ưu đơn thuần: DAPT + kháng đông + statin + chẹn beta + ACEi/ARB, đánh giá lại nguy cơ-lợi ích can thiệp trì hoãn theo diễn tiến lâm sàng.</p>
      <div class="subhead">Điều trị nội khoa nền tảng — áp dụng mọi chiến lược</div>
      <ul>
        <li>Statin cường độ cao ngay khi nhập viện, không chờ xét nghiệm lipid</li>
        <li>Chẹn beta sớm nếu không chống chỉ định (đặc biệt khi EF giảm)</li>
        <li>ACEi/ARB nếu EF giảm, THA, ĐTĐ, bệnh thận mạn</li>
      </ul>
      <div class="subhead">💉 Các nhóm kháng đông trong ACS — cơ chế & lựa chọn</div>
      ${rt(["Cơ chế tác dụng","Chỉ định ưu tiên"],[
        ["Heparin không phân đoạn (UFH)","Gắn antithrombin, tăng cường ức chế thrombin (IIa) và yếu tố Xa","Chuẩn trong phòng thông tim khi PCI; cần theo dõi aPTT/ACT nếu truyền kéo dài"],
        ["Enoxaparin (LMWH)","Gắn antithrombin, ức chế chọn lọc yếu tố Xa nhiều hơn IIa","Ưu tiên trong chiến lược tiêu sợi huyết và điều trị bảo tồn; không cần theo dõi xét nghiệm đông máu thường quy"],
        ["Fondaparinux","Pentasaccharide tổng hợp, ức chế chọn lọc yếu tố Xa qua antithrombin (không ức chế IIa)","Ưu tiên trong NSTEMI điều trị bảo tồn (nguy cơ chảy máu thấp nhất) — PHẢI thêm UFH liều đủ nếu chuyển sang PCI (nguy cơ huyết khối ống thông nếu dùng đơn độc)"],
        ["Bivalirudin","Ức chế trực tiếp thrombin (không qua antithrombin), hồi phục nhanh","Thay thế UFH+GPIIb/IIIa trong PCI ở bệnh nhân nguy cơ chảy máu cao"]
      ])}
      <div class="subhead">💊 Liều dùng cụ thể</div>
      <div class="alert-box alert-warn">Người ≥75 tuổi: tránh liều nạp prasugrel; nếu dùng tiêu sợi huyết không dùng liều nạp clopidogrel; theo dõi sát nguy cơ chảy máu.</div>
      ${rt(["Liều nạp","Liều duy trì"],[
        ["Aspirin","150–300mg nhai (hoặc 75–250mg TM)","75–100 mg/ngày, suốt đời"],
        ["Ticagrelor (chiến lược PCI)","180mg","90mg × 2 lần/ngày (12 tháng)"],
        ["Prasugrel (chiến lược PCI, biết giải phẫu mạch vành)","60mg","10mg/ngày (5mg nếu &lt;60kg hoặc ≥75 tuổi)"],
        ["Clopidogrel (bắt buộc nếu tiêu sợi huyết)","300–600mg (PCI); ≤300mg nếu &lt;75 tuổi dùng tiêu sợi huyết; KHÔNG nạp nếu ≥75 tuổi","75mg/ngày"],
        ["Atorvastatin (cường độ cao)","—","80 mg/ngày"],
        ["Rosuvastatin (cường độ cao)","—","20–40 mg/ngày"],
        ["UFH (PCI)","60–70 UI/kg TM (tối đa 5000UI)","truyền 12-15 UI/kg/giờ, chỉnh theo ACT/aPTT"],
        ["Enoxaparin (PCI/bảo tồn)","—","1mg/kg×2/ngày TDD; 1mg/kg×1/ngày nếu eGFR&lt;30"],
        ["Enoxaparin (kèm tiêu sợi huyết, &lt;75 tuổi)","30mg TM bolus","1mg/kg×2/ngày TDD (tối đa 100mg/liều×2 đầu)"],
        ["Enoxaparin (kèm tiêu sợi huyết, ≥75 tuổi)","không bolus TM","0.75mg/kg×2/ngày TDD (tối đa 75mg/liều×2 đầu)"],
        ["Fondaparinux (bảo tồn)","—","2.5mg × 1 lần/ngày TDD; tránh nếu eGFR&lt;20"],
        ["Bivalirudin (PCI, thay thế UFH)","0.75mg/kg TM bolus","truyền 1.75mg/kg/giờ trong lúc PCI"]
      ])}
      <p><b>Thời gian DAPT chuẩn:</b> 12 tháng sau ACS (rút ngắn 3–6 tháng nếu nguy cơ chảy máu cao, kéo dài nếu nguy cơ thiếu máu cục bộ tái phát cao).</p>`,
