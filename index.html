        ["Chuyển chuyên khoa thận khi eGFR&lt;30 hoặc tiến triển nhanh",'<span class="badge badge-I">I</span>'],
        ["Phối hợp đồng thời ACEi và ARB",'<span class="badge badge-III">III</span>'],
        ["Hạn chế protein rất thấp (&lt;0.6g/kg) thường quy",'<span class="badge badge-III">III</span>']
      ])}`
  },

{
  spec:"than", id:"aki", emoji:"⚡", short:"TTTC", title:"Tổn thương thận cấp (AKI)",
  guidelines:["KDIGO 2012 (còn hiệu lực)"],
  sections:{
    dinh_nghia:`
      <p>Tổn thương thận cấp (AKI) là tình trạng giảm chức năng thận đột ngột (giờ-ngày), được định nghĩa theo bất kỳ tiêu chí nào sau:</p>
      ${rt(["Tiêu chí KDIGO"],[
        ["Creatinine tăng ≥0.3 mg/dL","trong 48 giờ"],
        ["Creatinine tăng ≥1.5 lần nền","trong 7 ngày qua (đã biết/nghi ngờ)"],
        ["Thể tích nước tiểu","&lt;0.5 mL/kg/giờ trong ≥6 giờ"]
      ])}
      <div class="subhead">Phân độ nặng AKI</div>
      ${rt(["Creatinine","Nước tiểu"],[
        ["Giai đoạn 1","tăng 1.5–1.9 lần nền hoặc ≥0.3mg/dL","&lt;0.5mL/kg/h × 6–12h"],
        ["Giai đoạn 2","tăng 2.0–2.9 lần nền","&lt;0.5mL/kg/h ×≥12h"],
        ["Giai đoạn 3","tăng ≥3 lần nền hoặc ≥4.0mg/dL hoặc cần lọc máu","&lt;0.3mL/kg/h×≥24h hoặc vô niệu≥12h"]
      ])}`,
    chan_doan:`
      <p>Tiếp cận theo <b>3 nhóm nguyên nhân</b> để định hướng chẩn đoán và xử trí:</p>
      <div class="subhead">Trước thận (Prerenal) — phổ biến nhất</div>
      <p>Giảm tưới máu thận do giảm thể tích (mất dịch, xuất huyết), giảm cung lượng tim (suy tim), giãn mạch (sốc nhiễm khuẩn), hoặc hẹp động mạch thận. Đáp ứng bù dịch nếu do giảm thể tích thật sự.</p>
      <div class="subhead">Tại thận (Intrinsic)</div>
      <p>Hoại tử ống thận cấp (ATN — nguyên nhân thường gặp nhất, do thiếu máu kéo dài hoặc độc thận), viêm thận kẽ cấp (do thuốc), viêm cầu thận cấp, tắc mạch thận.</p>
      <div class="subhead">Sau thận (Postrenal)</div>
      <p>Tắc nghẽn đường tiết niệu (sỏi, phì đại tiền liệt tuyến, khối u chèn ép) — siêu âm hệ tiết niệu để loại trừ ứ nước thận.</p>
      <p>Cận lâm sàng: tổng phân tích nước tiểu + cặn lắng (trụ hạt bùn "muddy brown" gợi ý ATN, trụ hồng cầu gợi ý viêm cầu thận), FeNa (phân suất thải natri &lt;1% gợi ý trước thận, &gt;2% gợi ý ATN — kém tin cậy nếu đã dùng lợi tiểu), siêu âm thận loại trừ tắc nghẽn ở mọi trường hợp AKI không rõ nguyên nhân.</p>`,
    dieu_tri:`
      <div class="subhead">Nguyên tắc chung</div>
      <ul>
        <li>Xác định và điều trị nguyên nhân nền càng sớm càng tốt</li>
        <li>Ngưng ngay các thuốc độc thận (NSAID, aminoglycoside, thuốc cản quang không cần thiết) và <b>chỉnh liều mọi thuốc theo eGFR hiện tại</b></li>
        <li>Bù dịch tinh thể cân bằng (không dùng saline 0.9% liều lớn kéo dài) nếu nguyên nhân trước thận do giảm thể tích — tránh quá tải dịch</li>
        <li>Theo dõi sát điện giải, đặc biệt <b>kali máu</b> (nguy cơ tăng kali đe dọa tính mạng)</li>
      </ul>
      <div class="subhead">Chỉ định lọc máu cấp cứu (khẩn cấp)</div>
      <p>Ghi nhớ "AEIOU": <b>A</b>cidosis nặng kháng trị · <b>E</b>lectrolyte (tăng kali máu nặng/kháng trị) · <b>I</b>ntoxication (ngộ độc thẩm tách được) · <b>O</b>verload (quá tải dịch kháng lợi tiểu) · <b>U</b>remia có triệu chứng (viêm màng ngoài tim, bệnh não do ure).</p>
      <div class="subhead">💊 Xử trí tăng kali máu cấp (biến chứng nguy hiểm nhất)</div>
      ${rt(["Liều dùng","Cơ chế/thời gian tác dụng"],[
        ["Calcium gluconate 10%","10mL TM chậm 2–3 phút, lặp lại nếu ECG còn bất thường","ổn định màng tế bào cơ tim, tác dụng trong vài phút, không hạ kali"],
        ["Insulin nhanh + Glucose","10 đơn vị insulin + 25g glucose TM","đẩy kali vào nội bào, tác dụng sau 15–30 phút, kéo dài 4–6h; theo dõi hạ đường huyết"],
        ["Salbutamol khí dung liều cao","10–20mg khí dung","đẩy kali vào nội bào, hỗ trợ thêm insulin-glucose"],
        ["Natri bicarbonate (nếu toan chuyển hóa kèm theo)","50mEq TM","hỗ trợ khi có toan máu đi kèm, không phải điều trị chuẩn đơn độc"],
        ["Furosemide (nếu còn nước tiểu)","40–80mg TM","tăng thải kali qua thận, hiệu quả phụ thuộc chức năng thận còn lại"],
        ["Lọc máu cấp cứu","—","chỉ định khi kali &gt;6.5 kèm bất thường ECG hoặc kháng trị nội khoa"]
      ])}
      <div class="age-tag">Người cao tuổi</div>
      <p>Nguy cơ AKI cao hơn do giảm dự trữ thận sinh lý, đa thuốc (đặc biệt phối hợp ACEi/ARB+NSAID+lợi tiểu — "bộ ba nguy hiểm"); cân nhắc tạm ngưng ACEi/ARB/lợi tiểu/NSAID khi có bệnh cấp tính gây mất dịch ("sick day rules").</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Siêu âm hệ tiết niệu để loại trừ tắc nghẽn ở AKI không rõ nguyên nhân",'<span class="badge badge-I">I</span>'],
        ["Ngưng thuốc độc thận và chỉnh liều thuốc theo eGFR ngay khi phát hiện AKI",'<span class="badge badge-I">I</span>'],
        ["Calcium gluconate ngay khi tăng kali máu có biến đổi ECG",'<span class="badge badge-I">I</span>'],
        ["Dùng saline 0.9% liều lớn kéo dài không cân nhắc dịch cân bằng",'<span class="badge badge-IIb">IIb</span>'],
        ["Lọc máu dự phòng thường quy khi chưa đạt tiêu chí AEIOU",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"KDIGO 2012 Clinical Practice Guideline for Acute Kidney Injury (vẫn là khung tham chiếu chính hiện hành)"

{
  spec:"than", id:"uti", emoji:"🦠", short:"NTT", title:"Nhiễm trùng tiểu",
  guidelines:["IDSA 2019 (Viêm bàng quang không biến chứng)","IDSA/ESCMID 2010 (Viêm thận-bể thận)"],
  sections:{
    dinh_nghia:`
      <p>Nhiễm trùng tiểu (UTI) phân loại theo vị trí và có biến chứng hay không:</p>
      <ul>
        <li><b>Viêm bàng quang không biến chứng:</b> phụ nữ khỏe mạnh, không mang thai, đường tiết niệu bình thường về giải phẫu-chức năng</li>
        <li><b>Viêm thận-bể thận cấp:</b> nhiễm trùng lan lên đài bể thận, có sốt/đau hông lưng</li>
        <li><b>UTI có biến chứng:</b> nam giới, phụ nữ mang thai, bất thường giải phẫu/chức năng đường niệu, đặt catheter, suy giảm miễn dịch, đái tháo đường kiểm soát kém</li>
      </ul>`,
    chan_doan:`
      <p>Viêm bàng quang không biến chứng ở phụ nữ triệu chứng điển hình (tiểu buốt, tiểu gấp, tiểu nhiều lần, không tiết dịch/kích ứng âm đạo): <b>có thể chẩn đoán lâm sàng, không bắt buộc cấy nước tiểu</b> nếu triệu chứng điển hình rõ.</p>
      <p>Cấy nước tiểu (kèm kháng sinh đồ) chỉ định khi: viêm thận-bể thận, UTI có biến chứng, UTI tái phát, triệu chứng không điển hình, hoặc thất bại điều trị kinh nghiệm ban đầu.</p>
      <div class="alert-box alert-danger"><b>Không điều trị vi khuẩn niệu không triệu chứng</b> (asymptomatic bacteriuria) trừ khi đang mang thai hoặc chuẩn bị thủ thuật tiết niệu xâm lấn niêm mạc — đây là khuyến cáo mạnh, tránh lạm dụng kháng sinh không cần thiết.</div>`,
    dieu_tri:`
      <div class="subhead">Viêm bàng quang không biến chứng — kháng sinh đầu tay (ưu tiên theo thứ tự)</div>
      <ul>
        <li><b>Nitrofurantoin</b> 100mg × 2 lần/ngày × 5 ngày — lựa chọn hàng đầu do ít gây kháng thuốc lan rộng, tránh nếu nghi viêm thận-bể thận sớm (nồng độ mô thận thấp) hoặc eGFR&lt;30</li>
        <li><b>Fosfomycin trometamol</b> liều duy nhất 3g — thuận tiện, ít ảnh hưởng hệ vi sinh đường ruột</li>
        <li><b>TMP-SMX</b> (nếu tỷ lệ kháng E. coli tại chỗ &lt;20%) × 3 ngày</li>
        <li>Fluoroquinolone (ciprofloxacin/levofloxacin): <b>không còn là lựa chọn đầu tay</b> cho viêm bàng quang đơn thuần do lo ngại tác dụng phụ nghiêm trọng (đứt gân, bệnh thần kinh ngoại biên, phình/bóc tách ĐMC) — dành riêng cho viêm thận-bể thận hoặc khi các lựa chọn khác không phù hợp</li>
      </ul>
      <div class="subhead">Viêm thận-bể thận cấp — ngoại trú (không dấu hiệu nặng)</div>
      <p>Fluoroquinolone uống (ciprofloxacin 500mg×2/ngày hoặc levofloxacin 750mg/ngày) × 5–7 ngày nếu tỷ lệ kháng tại chỗ &lt;10%, hoặc liều nạp kháng sinh tiêm tác dụng dài trước khi chuyển uống nếu nghi kháng thuốc.</p>
      <div class="subhead">Viêm thận-bể thận cấp — nhập viện/nặng</div>
      <p>Kháng sinh tiêm phổ rộng ban đầu (ceftriaxone, fluoroquinolone TM, hoặc piperacillin-tazobactam nếu nghi kháng thuốc/nhiễm trùng huyết) → xuống thang theo kháng sinh đồ, tổng thời gian 7–14 ngày tùy đáp ứng.</p>
      <div class="subhead">🧑‍⚕️ Kháng sinh theo từng đối tượng bệnh nền</div>
      ${rt(["Khuyến nghị","Lý do/lưu ý"],[
        ["Phụ nữ có thai (kể cả vi khuẩn niệu không triệu chứng)","Nitrofurantoin (tránh gần ngày sinh) hoặc amoxicillin-clavulanate hoặc cephalexin × 5–7 ngày","Tránh TMP-SMX 3 tháng đầu/cuối thai kỳ (dị tật ống thần kinh/vàng da nhân) và fluoroquinolone suốt thai kỳ"],
        ["Nam giới","Coi như UTI có biến chứng, cấy nước tiểu trước điều trị, thời gian điều trị dài hơn (7 ngày), tầm soát bất thường tiền liệt tuyến nếu tái phát","Nếu nghi viêm tiền liệt tuyến kèm theo: fluoroquinolone hoặc TMP-SMX × 2–4 tuần do thấm tốt vào mô tuyến"],
        ["Đặt catheter tiểu lâu dài","Chỉ điều trị khi có triệu chứng thật sự; đổi/rút catheter trước hoặc khi bắt đầu kháng sinh","Vi khuẩn niệu ở người đặt catheter gần như luôn có — không cấy/điều trị nếu không triệu chứng"],
        ["Suy thận (eGFR&lt;30)","Ưu tiên fosfomycin (viêm bàng quang) hoặc ceftriaxone (viêm thận-bể thận); tránh nitrofurantoin","Nitrofurantoin không đạt nồng độ hiệu quả trong nước tiểu khi eGFR thấp, tăng nguy cơ độc tính phổi/gan"],
        ["Đái tháo đường/suy giảm miễn dịch","Coi như UTI có biến chứng, ngưỡng cấy nước tiểu và theo dõi thấp hơn, thời gian điều trị dài hơn","Nguy cơ viêm thận-bể thận sinh khí (emphysematous), áp xe thận cao hơn — chụp hình ảnh nếu đáp ứng chậm"],
        ["Người cao tuổi tại viện dưỡng lão","Chỉ điều trị khi có triệu chứng tiết niệu cụ thể (không dựa nước tiểu đục/mùi hoặc lú lẫn đơn thuần)","Vi khuẩn niệu không triệu chứng rất phổ biến ở nhóm này — điều trị quá mức gây kháng thuốc không cần thiết"],
        ["Dị ứng penicillin/sulfa","Fosfomycin hoặc nitrofurantoin (viêm bàng quang); fluoroquinolone (viêm thận-bể thận) nếu không còn lựa chọn khác","Kiểm tra chức năng thận trước dùng fluoroquinolone kéo dài ở người cao tuổi"]
      ])}
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều & thời gian","Lưu ý"],[
        ["Nitrofurantoin","100mg × 2 lần/ngày × 5 ngày","tránh nếu eGFR&lt;30 hoặc nghi viêm thận-bể thận"],
        ["Fosfomycin trometamol","3g liều duy nhất (pha nước, uống lúc đói)","chỉ dùng cho viêm bàng quang, không dùng viêm thận-bể thận"],
        ["TMP-SMX","160/800mg × 2 lần/ngày × 3 ngày","tránh nếu dị ứng sulfa, thận trọng phối hợp warfarin/ACEi ở người cao tuổi (tăng kali)"],
        ["Ciprofloxacin (viêm thận-bể thận)","500mg × 2 lần/ngày × 7 ngày","thận trọng người cao tuổi (nguy cơ đứt gân, kéo dài QT, rối loạn tâm thần)"],
        ["Ceftriaxone (nhập viện)","1–2g × 1 lần/ngày TM","không cần chỉnh liều theo thận"]
      ])}
      <div class="age-tag">Người cao tuổi</div>
      <p>Tránh chẩn đoán UTI chỉ dựa vào nước tiểu đục/mùi hôi hoặc thay đổi tri giác đơn thuần ở người cao tuổi không có triệu chứng tiết niệu cụ thể — dễ dẫn đến điều trị quá mức vi khuẩn niệu không triệu chứng; ưu tiên nitrofurantoin/fosfomycin hơn fluoroquinolone do tác dụng phụ thần kinh-gân cơ.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["Nitrofurantoin hoặc fosfomycin là kháng sinh đầu tay cho viêm bàng quang không biến chứng",'<span class="badge badge-I">I</span>'],
        ["Không điều trị vi khuẩn niệu không triệu chứng (trừ thai kỳ/trước thủ thuật niệu xâm lấn)",'<span class="badge badge-III">III</span>'],
        ["Fluoroquinolone là lựa chọn đầu tay cho viêm bàng quang đơn thuần",'<span class="badge badge-III">III</span>'],
        ["Cấy nước tiểu thường quy cho viêm bàng quang triệu chứng điển hình không biến chứng",'<span class="badge badge-III">III</span>'],
        ["Cấy nước tiểu + kháng sinh đồ cho viêm thận-bể thận/UTI có biến chứng",'<span class="badge badge-I">I</span>']
      ])}`
  },
  source:"IDSA 2019 Clinical Practice Guideline: Asymptomatic Bacteriuria; IDSA/ESCMID 2010 Guideline for Acute Pyelonephritis"

{
  spec:"than", id:"nephrotic", emoji:"💧", short:"HCTH", title:"Hội chứng thận hư",
  guidelines:["KDIGO 2021"],
  sections:{
    dinh_nghia:`
      <p>Hội chứng thận hư (HCTH) là một <b>hội chứng lâm sàng</b> (không phải chẩn đoán mô bệnh học cụ thể — xem thêm bài "Bệnh cầu thận" để tra cứu điều trị đặc hiệu theo type mô bệnh học), xác định bởi tứ chứng:</p>
      ${rt(["Ngưỡng"],[
        ["Protein niệu nặng","&gt;3.5g/24h (người lớn) hoặc tỷ lệ protein/creatinine niệu &gt;3–3.5 mg/mg"],
        ["Albumin máu giảm","&lt;3.0 g/dL"],
        ["Phù","Thường phù toàn thân, ấn lõm, có thể tràn dịch đa màng"],
        ["Tăng lipid máu","Tăng LDL-C và triglyceride thứ phát do tăng tổng hợp lipoprotein ở gan"]
      ])}
      <p>Nguyên nhân: nguyên phát (bệnh cầu thận thay đổi tối thiểu, bệnh thận màng, FSGS) hoặc thứ phát (đái tháo đường, lupus, amyloidosis, thuốc — NSAID/lithium/bisphosphonate TM, nhiễm trùng — viêm gan B/C/HIV, ác tính — đặc biệt bệnh thận màng ở người &gt;50 tuổi).</p>`,
    chan_doan:`
      <p>Xác định hội chứng qua xét nghiệm nước tiểu (tỷ lệ protein/creatinine hoặc thu 24h), albumin máu, lipid máu. Tìm nguyên nhân thứ phát: đường huyết/HbA1c, ANA/anti-dsDNA, bổ thể, huyết thanh viêm gan B/C, điện di protein huyết thanh + tự do chuỗi nhẹ (loại trừ amyloidosis/đa u tủy ở người lớn tuổi), và <b>tầm soát ác tính phù hợp tuổi</b> đặc biệt khi nghi bệnh thận màng mới khởi phát ở người &gt;50 tuổi.</p>
      <p><b>Sinh thiết thận</b> gần như luôn cần thiết ở người lớn để xác định type mô bệnh học và định hướng điều trị đặc hiệu, trừ khi lâm sàng đã rất điển hình cho một nguyên nhân cụ thể (vd. bệnh thận đái tháo đường tiến triển kèm bệnh võng mạc rõ, không cần sinh thiết thường quy).</p>`,
    dieu_tri:`
      <div class="subhead">Điều trị hỗ trợ nền tảng — áp dụng cho MỌI nguyên nhân (song song điều trị đặc hiệu theo mô bệnh học)</div>
      <div class="subhead">1. Kiểm soát phù</div>
      <p>Hạn chế muối (&lt;2g Na/ngày) + <b>lợi tiểu quai</b> (furosemide) là nền tảng, có thể cần liều cao hơn bình thường do giảm gắn kết protein-thuốc và giảm hấp thu ruột do phù thành ruột; phối hợp thêm lợi tiểu thiazide nếu kháng lợi tiểu quai đơn độc.</p>
      <div class="subhead">2. Giảm protein niệu</div>
      <p><b>ACEi/ARB</b> liều tối đa dung nạp là điều trị nền tảng không đặc hiệu, giảm protein niệu qua cơ chế huyết động, độc lập với nguyên nhân nền.</p>
      <div class="subhead">3. Dự phòng huyết khối — biến chứng cần chủ động tầm soát</div>
      <div class="alert-box alert-danger">HCTH gây tình trạng tăng đông (mất antithrombin III, protein S qua nước tiểu + tăng yếu tố đông máu gan tổng hợp bù trừ) — nguy cơ huyết khối tĩnh mạch sâu/thuyên tắc phổi và <b>đặc biệt cao ở bệnh thận màng</b>. Cân nhắc <b>kháng đông dự phòng</b> khi albumin máu &lt;2.0–2.5 g/dL kèm ≥1 yếu tố nguy cơ khác (bất động, bệnh thận màng, protein niệu rất nặng &gt;10g/ngày), đặc biệt cân nhắc mạnh ở bệnh thận màng có albumin &lt;2.0-2.5.</div>
      <div class="subhead">4. Kiểm soát tăng lipid máu</div>
      <p>Statin cường độ trung bình-cao — HCTH là tình trạng nguy cơ tim mạch cao tương đương các yếu tố nguy cơ truyền thống khác.</p>
      <div class="subhead">5. Dự phòng nhiễm trùng</div>
      <p>Mất IgG và protein bổ thể qua nước tiểu làm tăng nguy cơ nhiễm trùng, đặc biệt do vi khuẩn có vỏ bọc (phế cầu) — tiêm <b>vắc-xin phế cầu</b>, cân nhắc kháng sinh dự phòng thời gian phù nặng ở trẻ em (ít áp dụng thường quy ở người lớn nhưng cần cảnh giác lâm sàng, đặc biệt viêm phúc mạc nguyên phát).</p>
      <div class="subhead">Điều trị đặc hiệu theo nguyên nhân</div>
      <p>Xem chi tiết phác đồ ức chế miễn dịch theo type mô bệnh học (bệnh cầu thận thay đổi tối thiểu, bệnh thận màng, FSGS...) tại bài <b>"Bệnh cầu thận"</b> trong cùng chuyên khoa Thận.</p>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Furosemide (kiểm soát phù)","40–120mg/ngày (có thể cần liều cao hơn bình thường), chia 2 lần","theo dõi điện giải/creatinine sát; phối hợp albumin TM chỉ khi phù kháng trị nặng có triệu chứng"],
        ["Losartan/Enalapril","liều tối đa dung nạp, tăng dần","theo dõi kali/creatinine sau mỗi lần tăng liều, đặc biệt khi phối hợp lợi tiểu"],
        ["Atorvastatin","20–40mg/ngày","điều chỉnh theo LDL-C đích và dung nạp"],
        ["Warfarin/DOAC dự phòng huyết khối (khi có chỉ định)","theo cân nặng/chức năng thận, đích INR 2–3 nếu dùng warfarin","cân nhắc kỹ lợi ích/nguy cơ chảy máu cá thể hóa; DOAC dữ liệu còn hạn chế ở albumin rất thấp"],
        ["Vắc-xin phế cầu liên hợp/polysaccharide","theo lịch tiêm chủng người lớn nguy cơ cao","tiêm trước khi bắt đầu ức chế miễn dịch liều cao nếu có thể"]
      ])}
      <div class="age-tag">Người cao tuổi</div>
      <p>Bệnh thận màng mới khởi phát ở người cao tuổi cần tầm soát ác tính tiềm ẩn kỹ hơn (có thể là hội chứng cận ung thư); thận trọng liều lợi tiểu/kháng đông do nguy cơ rối loạn điện giải và chảy máu cao hơn.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["ACEi/ARB liều tối đa dung nạp cho mọi nguyên nhân HCTH có protein niệu",'<span class="badge badge-I">I</span>'],
        ["Statin cường độ trung bình-cao do nguy cơ tim mạch cao",'<span class="badge badge-I">I</span>'],
        ["Cân nhắc kháng đông dự phòng khi albumin&lt;2.0-2.5g/dL kèm yếu tố nguy cơ khác",'<span class="badge badge-IIa">IIa</span>'],
        ["Sinh thiết thận ở người lớn để xác định type mô bệnh học trước điều trị đặc hiệu",'<span class="badge badge-I">I</span>'],
        ["Tầm soát ác tính khi bệnh thận màng mới khởi phát ở người &gt;50 tuổi",'<span class="badge badge-IIa">IIa</span>'],
        ["Kháng đông dự phòng thường quy cho mọi bệnh nhân HCTH bất kể albumin máu",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"KDIGO 2021 Clinical Practice Guideline for the Management of Glomerular Diseases (phần Hội chứng thận hư & biến chứng)"
},
{
  spec:"than", id:"kidney_stone", emoji:"🪨", short:"Sỏi thận", title:"Sỏi tiết niệu",
  guidelines:["AUA/Endourological Society 2024","EAU 2023"],
  sections:{
    dinh_nghia:`
      <p>Sỏi tiết niệu hình thành do kết tinh các chất hòa tan trong nước tiểu (chủ yếu canxi oxalat &gt;80%, còn lại acid uric, struvite/sỏi nhiễm trùng, cystine hiếm gặp), gây tắc nghẽn và đau quặn thận khi di chuyển qua niệu quản.</p>`,
    chan_doan:`
      <p>Đau quặn thận điển hình: đau dữ dội vùng hông lưng lan xuống bẹn/bộ phận sinh dục, khởi phát đột ngột, bệnh nhân vật vã không tìm được tư thế giảm đau (khác đau bụng ngoại khoa thường nằm yên), có thể kèm tiểu máu vi thể/đại thể, buồn nôn-nôn.</p>
      <div class="subhead">Hình ảnh học</div>
      ${rt(["Đặc điểm"],[
        ["CT bụng không cản quang (KUB-CT)","Tiêu chuẩn vàng — độ nhạy/đặc hiệu cao nhất, xác định kích thước-vị trí-mật độ sỏi, đánh giá mức độ ứ nước thận"],
        ["Siêu âm bụng","Không tia xạ, ưu tiên ở phụ nữ có thai/trẻ em, độ nhạy thấp hơn CT với sỏi niệu quản nhỏ nhưng phát hiện tốt ứ nước thận"],
        ["X-quang bụng không chuẩn bị (KUB)","Chỉ thấy sỏi cản quang (canxi), không thấy sỏi acid uric — ít dùng để chẩn đoán ban đầu, hữu ích theo dõi sỏi cản quang đã biết"]
      ])}
      <div class="subhead">Yếu tố tiên đoán khả năng tự đào thải sỏi</div>
      <p>Kích thước là yếu tố quan trọng nhất: sỏi &lt;5mm có khả năng tự đào thải &gt;90%; sỏi 5-10mm khoảng 50%; sỏi &gt;10mm khả năng tự đào thải thấp, thường cần can thiệp. Vị trí sỏi ở đoạn niệu quản xa (gần bàng quang) có tỷ lệ tự đào thải cao hơn đoạn gần.</p>`,
    dieu_tri:`
      <div class="subhead">Xử trí cơn đau quặn thận cấp</div>
      <ul>
        <li><b>NSAID</b> (ketorolac TM/tiêm bắp hoặc uống) là thuốc giảm đau đầu tay — hiệu quả tương đương hoặc vượt trội opioid, ít tác dụng phụ buồn nôn/an thần hơn</li>
        <li>Opioid dự phòng/bổ sung nếu NSAID không đủ hiệu quả hoặc chống chỉ định (suy thận, loét tiêu hóa)</li>
        <li>Chống nôn nếu cần</li>
      </ul>
      <div class="subhead">Điều trị tống sỏi bằng thuốc (Medical Expulsive Therapy — MET)</div>
      <p><b>Chẹn alpha-1</b> (tamsulosin) cho sỏi niệu quản 5-10mm giúp giãn cơ trơn niệu quản, tăng tỷ lệ và rút ngắn thời gian tự đào thải — hiệu quả rõ nhất ở sỏi đoạn xa kích thước lớn hơn trong ngưỡng có thể tự đào thải.</p>
      <div class="subhead">Chỉ định can thiệp</div>
      ${rt(["Chỉ định can thiệp"],[
        ["Sỏi lớn không khả năng tự đào thải (&gt;10mm)","Tán sỏi ngoài cơ thể (SWL), nội soi niệu quản tán sỏi laser (URS), hoặc tán sỏi qua da (PCNL) tùy kích thước/vị trí"],
        ["Đau không kiểm soát được dù đã điều trị nội khoa tối ưu","Can thiệp giải áp/lấy sỏi"],
        ["Sốt/nhiễm trùng đường tiết niệu kèm tắc nghẽn (cấp cứu tiết niệu)","Dẫn lưu khẩn cấp (đặt JJ niệu quản hoặc mở thận ra da) NGAY, trì hoãn tán sỏi đến khi hết nhiễm trùng"],
        ["Suy thận cấp do tắc nghẽn hai bên/thận độc nhất","Dẫn lưu khẩn cấp"]
      ])}
      <div class="alert-box alert-danger">Sỏi niệu quản tắc nghẽn kèm sốt/dấu hiệu nhiễm trùng đường tiết niệu trên là <b>cấp cứu tiết niệu</b> — nguy cơ nhiễm trùng huyết đường niệu (urosepsis) nhanh chóng nếu không dẫn lưu kịp thời, cần dẫn lưu khẩn cấp trước, tán sỏi để sau.</div>
      <div class="subhead">Dự phòng tái phát (sau cơn cấp, đánh giá lâu dài)</div>
      <ul>
        <li>Tăng lượng nước uống (đích nước tiểu ≥2.5 lít/ngày) — biện pháp nền tảng cho mọi loại sỏi</li>
        <li>Sỏi canxi oxalat tái phát: hạn chế natri khẩu phần, duy trì lượng canxi khẩu phần bình thường (không hạn chế canxi quá mức — nghịch lý làm tăng hấp thu oxalat ruột), <b>thiazide</b> nếu tăng canxi niệu</li>
        <li>Sỏi acid uric: kiềm hóa nước tiểu (kali citrate), allopurinol nếu tăng acid uric máu/niệu kèm theo</li>
        <li>Phân tích thành phần sỏi (nếu thu được) và xét nghiệm nước tiểu 24h định hướng dự phòng đặc hiệu theo loại sỏi</li>
      </ul>
      <div class="subhead">💊 Liều dùng cụ thể</div>
      ${rt(["Liều dùng","Lưu ý"],[
        ["Ketorolac (giảm đau cơn cấp)","30mg TM/TB hoặc 10mg uống mỗi 6h, tối đa 5 ngày","tránh nếu suy thận/loét tiêu hóa hoạt động"],
        ["Tamsulosin (MET, sỏi 5-10mm)","0.4mg × 1 lần/ngày × đến 4 tuần hoặc đến khi tống sỏi","theo dõi hạ HA tư thế, đặc biệt người cao tuổi"],
        ["Kali citrate (kiềm hóa nước tiểu)","10-20mEq × 2-3 lần/ngày","chỉnh liều theo pH nước tiểu đích 6.5-7.0"],
        ["Allopurinol (sỏi acid uric kèm tăng acid uric máu)","100-300mg/ngày","xem chi tiết chỉnh liều theo thận tại bài Gout"],
        ["Hydrochlorothiazide (tăng canxi niệu)","25-50mg/ngày","theo dõi kali/natri máu"]
      ])}
      <div class="age-tag">Người cao tuổi</div>
      <p>Ngưỡng nghi ngờ nhiễm trùng đường niệu trên kèm tắc nghẽn nên thấp (biểu hiện có thể không điển hình); thận trọng NSAID nếu bệnh thận mạn/suy tim nền — cân nhắc opioid liều thấp thay thế.</p>`,
    khuyen_cao:`
      ${rt(["Mức"],[
        ["CT bụng không cản quang là tiêu chuẩn chẩn đoán hình ảnh học",'<span class="badge badge-I">I</span>'],
        ["NSAID là giảm đau đầu tay cho cơn đau quặn thận cấp",'<span class="badge badge-I">I</span>'],
        ["Dẫn lưu khẩn cấp khi tắc nghẽn kèm sốt/nhiễm trùng đường niệu",'<span class="badge badge-I">I</span>'],
        ["Tamsulosin (MET) cho sỏi niệu quản 5-10mm",'<span class="badge badge-IIa">IIa</span>'],
        ["Hạn chế canxi khẩu phần quá mức để dự phòng sỏi canxi oxalat",'<span class="badge badge-III">III</span>'],
        ["Tán sỏi khi đang có nhiễm trùng đường niệu chưa kiểm soát",'<span class="badge badge-III">III</span>']
      ])}`
  },
  source:"AUA/Endourological Society Guideline on Surgical Management of Stones 2024; EAU Guidelines on Urolithiasis 2023"
},
{
  spec:"than", id:"gn", emoji:"🔬", short:"BCT", title:"Bệnh cầu thận",
  guidelines:["KDIGO 2021"],
  sections:{
    dinh_nghia:`
      <p>Bệnh cầu thận là nhóm bệnh lý tổn thương cầu thận nguyên phát hoặc thứ phát, biểu hiện qua 2 hội chứng lâm sàng chính:</p>
      <div class="subhead">Hội chứng thận hư</div>
      <p>Protein niệu nặng (&gt;3.5g/24h), albumin máu giảm (&lt;3g/dL), phù, tăng lipid máu. Nguyên nhân thường gặp: bệnh cầu thận thay đổi tối thiểu (trẻ em), bệnh thận màng, xơ hóa cầu thận khu trú từng phần (FSGS), bệnh thận đái tháo đường.</p>
      <div class="subhead">Hội chứng viêm thận cấp (nephritic)</div>
      <p>Tiểu máu (thường kèm trụ hồng cầu), protein niệu mức độ trung bình, tăng huyết áp, giảm mức lọc cầu thận cấp. Nguyên nhân: bệnh thận IgA, viêm cầu thận sau nhiễm liên cầu, viêm mạch máu nhỏ (ANCA), lupus ban đỏ hệ thống, hội chứng Goodpasture.</p>`,
    chan_doan:`
      <p>Đánh giá ban đầu: tổng phân tích nước tiểu + cặn lắng, tỷ lệ protein/creatinine niệu hoặc thu nước tiểu 24h, chức năng thận, albumin máu, bổ thể (C3/C4), ANA, ANCA, kháng thể kháng phospholipase A2 receptor (anti-PLA2R — đặc hiệu bệnh thận màng nguyên phát), điện di protein huyết thanh/nước tiểu ở người lớn tuổi (loại trừ bệnh đa u tủy).</p>

let activeSpecialty = specialties[0].id;
let activeDiseaseId = diseases.find(d => d.spec === activeSpecialty).id;

function renderSpecialtyTabs(){
  const wrap = document.getElementById('specialtyTabs');
  wrap.innerHTML = specialties.map(s => `
    <div class="sp-tab ${s.id===activeSpecialty?'active':''}" onclick="selectSpecialty('${s.id}')">
      <span class="emoji">${s.emoji}</span>${s.label}
    </div>`).join('');
}

function selectSpecialty(id){
  activeSpecialty = id;
  const firstInSpec = diseases.find(d => d.spec === id);
  activeDiseaseId = firstInSpec.id;
  renderSpecialtyTabs();
  renderDiseaseTabs();
  renderDiseaseContent();
  document.getElementById('mainContainer').scrollIntoView({behavior:'smooth'});
}

function renderDiseaseTabs(){
  const wrap = document.getElementById('diseaseTabs');
  const list = diseases.filter(d => d.spec === activeSpecialty);
  wrap.innerHTML = list.map(d => `
    <div class="d-tab ${d.id===activeDiseaseId?'active':''}" onclick="selectDisease('${d.id}')">
      <span class="emoji">${d.emoji}</span>${d.short}
    </div>`).join('');
}

function renderSectionNav(){
  const nav = document.getElementById('sectionNav');
  nav.innerHTML = sectionMeta.map((s,i) => `
    <div class="s-pill ${i===0?'active':''}" onclick="scrollToSection('${s.key}', this)">${s.icon} ${s.label}</div>
  `).join('');
}

function scrollToSection(key, elem){
  document.querySelectorAll('.s-pill').forEach(p=>p.classList.remove('active'));
  elem.classList.add('active');
  const card = document.getElementById('card_'+key);
  if(card){
    if(!card.classList.contains('open')) toggleCard(card);
    card.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

function toggleCard(card){
  card.classList.toggle('open');
}

function selectDisease(id){
  activeDiseaseId = id;
  renderDiseaseTabs();
  renderDiseaseContent();
  document.getElementById('mainContainer').scrollIntoView({behavior:'smooth'});
}

function renderDiseaseContent(){
  const d = diseases.find(x=>x.id===activeDiseaseId);
  const container = document.getElementById('mainContainer');

  let html = `
    <div class="disease-header">
      <h2>${d.emoji} ${d.title}</h2>
      <div>${d.guidelines.map(g=>`<span class="guideline-tag">${g}</span>`).join('')}</div>
    </div>
  `;

  sectionMeta.forEach((s, idx) => {
    html += `
      <div class="card ${idx===0?'open':''}" id="card_${s.key}">
        <div class="card-head" onclick="toggleCard(this.parentElement)">
          <div class="card-head-title"><span class="ic">${s.icon}</span>${s.label}</div>
          <div class="chevron">▼</div>
        </div>
        <div class="card-body"><div class="card-body-inner">${d.sections[s.key]}</div></div>
      </div>
    `;
  });

  html += `<div class="source-note">📚 Nguồn: ${d.source}</div>`;

  container.innerHTML = html;
}

function toggleTheme(){
  const html = document.documentElement;
  const cur = html.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  document.getElementById('themeIcon').innerText = next === 'dark' ? '🌙' : '☀️';
  document.getElementById('themeText').innerText = next === 'dark' ? 'Tối' : 'Sáng';
}

function stripVN(str){
  return (str||'').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/đ/g,'d').replace(/[^a-z0-9\s_+-]/g,' ')
    .replace(/\s+/g,' ').trim();
}

function expandQuery(q){
  const n = stripVN(q);
  if(!n) return '';
  const parts = n.split(/\s+/);
  const extra = [];
  parts.forEach(p => {
    if(SEARCH_ALIASES[p]) extra.push(SEARCH_ALIASES[p]);
    // partial alias keys
    Object.keys(SEARCH_ALIASES).forEach(k => {
      if(k.startsWith(p) && p.length>=2) extra.push(SEARCH_ALIASES[k]);
    });
  });
  return (n + ' ' + extra.join(' ')).trim();
}

function scoreMatch(hayRaw, qRaw){
  const hay = stripVN(hayRaw);
  const q = stripVN(qRaw);
  if(!q) return 0;
  const expanded = expandQuery(q);
  let score = 0;
  // exact id / short boost
  if(hay === q) score += 100;
  if(hay.startsWith(q)) score += 50;
  if(hay.includes(' '+q) || hay.includes(q+' ')) score += 30;
  if(hay.includes(q)) score += 20;
  // token overlap
  const qTokens = expanded.split(/\s+/).filter(t=>t.length>1);
  const hayTokens = new Set(hay.split(/\s+/));
  qTokens.forEach(t => {
    if(hayTokens.has(t)) score += 8;
    else if([...hayTokens].some(h => h.includes(t) || t.includes(h))) score += 3;
  });
  return score;
}

function smartSearch(q){
  const drop = document.getElementById('smartSearchDrop');
  q = (q||'').trim();
  if(!q){
    drop.classList.remove('open');
    drop.innerHTML = '';
    renderDiseaseTabs();
    return;
  }
  // Search diseases
  const dMatches = diseases.map(d => {
    const hay = [d.title, d.short, d.id, (d.guidelines||[]).join(' '), d.spec].join(' ');
    return {type:'disease', item:d, score:scoreMatch(hay, q)};
  }).filter(x => x.score > 0).sort((a,b)=>b.score-a.score);

  // Search scales too
  const sMatches = (typeof scalesData!=='undefined'?scalesData:[]).map(s => {
    const hay = [s.title, s.subtitle, s.id, s.categoryName||'', s.category||''].join(' ');
    return {type:'scale', item:s, score:scoreMatch(hay, q)};
  }).filter(x => x.score > 0).sort((a,b)=>b.score-a.score);

  if(!dMatches.length && !sMatches.length){
    drop.innerHTML = `<div style="padding:16px;text-align:center;color:var(--text-secondary);font-size:13px;">Không thấy kết quả cho “${q}”</div>`;
    drop.classList.add('open');
    return;
  }

  let html = '';
  if(dMatches.length){
    html += `<div class="ss-group">📋 Phác đồ (${Math.min(dMatches.length,8)})</div>`;
    dMatches.slice(0,8).forEach(m => {
      const d = m.item;
      const sp = specialties.find(s=>s.id===d.spec);
      html += `<div class="ss-item" onclick="goSmartDisease('${d.id}')">
        <div class="ss-emoji">${d.emoji||'📄'}</div>
        <div class="ss-body">
          <div class="ss-title">${d.title} <span class="ss-tag">${d.short||''}</span></div>
          <div class="ss-meta">${sp?sp.label:d.spec} · ${(d.guidelines||[]).slice(0,2).join(', ')}</div>
        </div>
      </div>`;
    });
  }
  if(sMatches.length){
    html += `<div class="ss-group">🧮 Thang điểm (${Math.min(sMatches.length,6)})</div>`;
    sMatches.slice(0,6).forEach(m => {
      const s = m.item;
      html += `<div class="ss-item" onclick="goSmartScale('${s.id}')">
        <div class="ss-emoji">🧮</div>
        <div class="ss-body">
          <div class="ss-title">${s.title}</div>
          <div class="ss-meta">${s.categoryName||s.category||''}</div>
        </div>
      </div>`;
    });
  }
  drop.innerHTML = html;
  drop.classList.add('open');

  // Also filter disease tabs for quick pick
  runQuickSearchLegacy(q);
}

function runQuickSearchLegacy(q){
  q = (q||'').trim().toLowerCase();
  const wrap = document.getElementById('diseaseTabs');
  if(!q){ renderDiseaseTabs(); return; }
  const matches = diseases.filter(d => scoreMatch([d.title,d.short,d.id,(d.guidelines||[]).join(' ')].join(' '), q) > 0)
    .sort((a,b)=>scoreMatch([b.title,b.short,b.id].join(' '),q)-scoreMatch([a.title,a.short,a.id].join(' '),q));
  if(!matches.length){
    wrap.innerHTML = `<div style="padding:12px;color:var(--text-secondary);font-size:13px;">Không có bệnh khớp “${q}”</div>`;
    return;
  }
  const bySpec = {};
  matches.forEach(d => { (bySpec[d.spec]=bySpec[d.spec]||[]).push(d); });
  let html = '';
  Object.keys(bySpec).forEach(spec => {
    const sp = specialties.find(s=>s.id===spec);
    html += `<div style="font-size:11px;font-weight:700;color:var(--text-secondary);padding:6px 4px 2px;">${sp?sp.emoji+' '+sp.label:spec}</div>`;
    html += bySpec[spec].map(d=>`<div class="d-tab ${d.id===activeDiseaseId?'active':''}" onclick="goSmartDisease('${d.id}')"><span class="emoji">${d.emoji}</span>${d.short}</div>`).join('');
  });
  wrap.innerHTML = html;
}

function goSmartDisease(id){
  const d = diseases.find(x=>x.id===id);
  if(!d) return;
  document.getElementById('smartSearchDrop')?.classList.remove('open');
  const qs = document.getElementById('quickSearch');
  if(qs) qs.value = '';
  switchMainTab('phacdo');
  selectSpecialty(d.spec);
  selectDisease(id);
}

function goSmartScale(id){
  document.getElementById('smartSearchDrop')?.classList.remove('open');
  const qs = document.getElementById('quickSearch');
  if(qs) qs.value = '';
  switchMainTab('thangdiem');
  setTimeout(()=>openScoreModal(id), 60);
}

function smartSearchScores(q){
  q = (q||'').trim();
  if(!q){
    currentFilteredScales = [...scalesData];
    renderScoreList(currentFilteredScales);
    return;
  }
  currentFilteredScales = scalesData
    .map(s => ({s, score: scoreMatch([s.title,s.subtitle,s.id,s.categoryName||'',s.category||''].join(' '), q)}))
    .filter(x => x.score > 0)
    .sort((a,b)=>b.score-a.score)
    .map(x => x.s);
  renderScoreList(currentFilteredScales);
}

function handleSmartSearchKey(e){
  if(e.key === 'Escape'){
    e.target.value = '';
    smartSearch('');
    document.getElementById('smartSearchDrop')?.classList.remove('open');
  }
  if(e.key === 'Enter'){
    const first = document.querySelector('#smartSearchDrop .ss-item');
    if(first) first.click();
  }
}

// Đóng dropdown khi tap ngoài
document.addEventListener('click', (e) => {
  const drop = document.getElementById('smartSearchDrop');
  const wrap = e.target.closest('.search-wrap');
  if(drop && !wrap) drop.classList.remove('open');
});

// Alias: giữ tên cũ
function runQuickSearch(q){ smartSearch(q); }
function handleScoreSearch(q){ smartSearchScores(q); }



document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  if(e.key === '/' || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')){
    e.preventDefault();
    const td = document.getElementById('viewThangDiem');
    const box = (td && td.style.display !== 'none')
      ? document.getElementById('scoreSearch')
      : document.getElementById('quickSearch');
    if(box){ box.focus(); box.select(); }
  }
});

document.addEventListener('DOMContentLoaded', () => {
  renderSpecialtyTabs();
  renderDiseaseTabs();
  renderSectionNav();
  renderDiseaseContent();
});

    if (document.getElementById('scalesList').children.length === 0) {
      currentFilteredScales = [...scalesData].sort((a,b)=>a.title.localeCompare(b.title));
      renderScoreList(currentFilteredScales);
    }
  }
}

function renderScoreList(data) {
  const box = document.getElementById('scalesList');
  const abcBar = document.getElementById('scoreAbcBar');
  if (!data.length) {
    box.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary);">Không tìm thấy thang điểm phù hợp.</div>';
    if (abcBar) abcBar.innerHTML = '';
    return;
  }
  // Gom nhóm A-Z theo chữ cái đầu tiêu đề
  const sorted = [...data].sort((a,b) => a.title.localeCompare(b.title, 'vi'));
  const grouped = {};
  sorted.forEach(s => {
    let letter = s.title.trim().charAt(0).toUpperCase();
    if (letter >= '0' && letter <= '9') letter = '#';
    if (!grouped[letter]) grouped[letter] = [];
    grouped[letter].push(s);
  });
  const letters = Object.keys(grouped).sort((a,b) => {
    if (a === '#') return -1;
    if (b === '#') return 1;
    return a.localeCompare(b);
  });
  // Thanh ABC
  if (abcBar) {
    abcBar.innerHTML = letters.map(L =>
      `<span class="abc-letter" onclick="scrollToScoreLetter('${L}')">${L}</span>`
    ).join('');
  }
  // Danh sách theo nhóm
  box.innerHTML = letters.map(L => {
    const cards = grouped[L].map(s => `
      <div class="scale-card" onclick="openScoreModal('${s.id}')">
        <div class="scale-title">${s.title}</div>
        <div class="scale-desc">${s.subtitle}</div>
        <span class="scale-badge">${s.categoryName || s.category}</span>
      </div>`).join('');
    return `<div class="abc-group-header" id="scoreSec_${L}">${L}</div>${cards}`;
  }).join('');
}

function scrollToScoreLetter(letter) {
  const el = document.getElementById('scoreSec_' + letter);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.querySelectorAll('#scoreAbcBar .abc-letter').forEach(n => {
    n.classList.toggle('active', n.textContent === letter);
  });
}

function filterScoreCat(cat, el) {
  document.querySelectorAll('.score-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentFilteredScales = cat === 'all' ? [...scalesData] : scalesData.filter(s => s.category === cat || (s.category||'').includes(cat));
  currentFilteredScales.sort((a,b)=>a.title.localeCompare(b.title));
  renderScoreList(currentFilteredScales);
}

function handleScoreSearch(q){ smartSearchScores(q); }


function openScoreModal(id) {
  currentScale = scalesData.find(s => s.id === id);
  if (!currentScale) return;
  document.getElementById('modalScaleTitle').innerText = currentScale.title;
  const body = document.getElementById('modalScaleBody');
  body.innerHTML = currentScale.criteria.map((c,i) => `
    <div class="criterion-group">
      <div class="criterion-title">${c.name}</div>
      <div class="criterion-detail">${c.detail||''}</div>
      <select class="option-select criterion-val" onchange="calcScoreNow()">
        ${c.options.map(o => `<option value="${o.score}">${o.text}</option>`).join('')}
      </select>
    </div>`).join('') + `
    <div style="font-size:11px;color:var(--text-secondary);text-align:center;margin-top:12px;font-style:italic;">Nguồn: ${currentScale.source||''}</div>
    <div style="height:72px;"></div>
    <div style="position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg-card);border-top:1px solid var(--border-color);z-index:60;">
      <button onclick="closeScoreModal()" style="width:100%;padding:14px;border:none;border-radius:12px;background:var(--tiffany-main);color:#fff;font-weight:800;font-size:15px;cursor:pointer;">← Quay lại danh sách thang điểm</button>
    </div>`;
  const modal = document.getElementById('calcModal');
  modal.style.display = 'flex';
  calcScoreNow();
}

function closeScoreModal() {
  document.getElementById('calcModal').style.display = 'none';
}

function calcScoreNow() {
  if (!currentScale) return;
  let total = 0;
  document.querySelectorAll('#modalScaleBody .criterion-val').forEach(sel => {
    total += parseFloat(sel.value) || 0;
  });
  const display = Number.isInteger(total) ? total : total.toFixed(1);
  document.getElementById('stickyScoreNum').innerText = display;
  const ev = currentScale.evaluate(total);
  const el = document.getElementById('stickyScoreEval');
  el.innerText = ev.text;
  el.style.color = ev.color;
}

</script>
</body>
